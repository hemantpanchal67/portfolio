<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%" class="arch-svg">
  <defs>
    <linearGradient id="retailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2C59" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="costcoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <marker id="arrow-blue3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981" />
    </marker>
  </defs>

  <rect width="960" height="460" rx="16" fill="var(--card-bg, #0F172A)" stroke="var(--border-color, #1E293B)" stroke-width="2"/>

  <!-- US & Canada Consumers -->
  <g transform="translate(60, 25)">
    <rect width="840" height="50" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="420" y="24" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">COSTCO WHOLESALE ECOMMERCE (US &amp; CANADA)</text>
    <text x="420" y="40" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Millions of Shoppers • High Concurrency Peak Traffic (Black Friday / Seasonal Promotions) • WCAG/ADA Compliant UI</text>
  </g>

  <!-- Connect to Cloud Edge -->
  <path d="M 480 75 L 480 110" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue3)" />

  <!-- Azure Cloud Edge & CDN -->
  <g transform="translate(120, 110)">
    <rect width="720" height="52" rx="8" fill="url(#retailGrad)" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="360" y="22" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">AZURE CLOUD EDGE &amp; APPLICATION GATEWAY</text>
    <text x="360" y="38" fill="#BAE6FD" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Traffic Routing • SSL Offloading • SonarQube Validated Quality &amp; Security Layer</text>
  </g>

  <!-- Split to Tire Platform & Inventory Subsystem -->
  <path d="M 320 162 L 240 205" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue3)" />
  <path d="M 640 162 L 720 205" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue3)" />

  <!-- Core eCommerce Tire Solution Layer -->
  <g transform="translate(60, 205)">
    <rect width="380" height="100" rx="8" fill="url(#costcoGrad)" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="190" y="24" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ECOMMERCE TIRE SOLUTION</text>
    <text x="190" y="44" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">ASP.NET MVC 5 • C# • Enterprise Integration</text>
    <text x="190" y="62" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Order Checkout • Warehouse Scheduling</text>
    <text x="190" y="80" fill="#10B981" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">BlazeMeter &amp; JMeter Stress Tested</text>
  </g>

  <!-- Tire Inventory & Supabase Engine -->
  <g transform="translate(520, 205)">
    <rect width="380" height="100" rx="8" fill="url(#costcoGrad)" stroke="#10B981" stroke-width="1.5"/>
    <text x="190" y="24" fill="#34D399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIRE INVENTORY MODULE</text>
    <text x="190" y="44" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Supabase (PostgreSQL) + Redis Distributed Caching</text>
    <text x="190" y="62" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Real-time Stock Availability &amp; Multi-Warehouse Sync</text>
    <text x="190" y="80" fill="#34D399" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Sub-Second Catalog &amp; Fitment Search</text>
  </g>

  <!-- Bidirectional sync between eCommerce and Inventory -->
  <path d="M 440 255 L 520 255" stroke="#10B981" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-emerald)" />

  <!-- Down to Persistence & Enterprise Systems -->
  <path d="M 250 305 L 250 350" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue3)" />
  <path d="M 710 305 L 710 350" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-emerald)" />

  <!-- Persistence Tier -->
  <g transform="translate(60, 350)">
    <rect width="380" height="60" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="190" y="24" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">MICROSOFT SQL SERVER &amp; ENTERPRISE DB</text>
    <text x="190" y="42" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Orders, Customer Data, Transaction History, Enterprise Sync</text>
  </g>

  <g transform="translate(520, 350)">
    <rect width="380" height="60" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <text x="190" y="24" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">SUPABASE / POSTGRESQL + REDIS TIER</text>
    <text x="190" y="42" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Fast Key-Value Inventory Cache, Multi-Tier Indexing, Partitioned Tables</text>
  </g>
</svg>
