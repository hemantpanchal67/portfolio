<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" class="arch-svg">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2C59" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981" />
    </marker>
  </defs>

  <rect width="960" height="520" rx="16" fill="var(--card-bg, #0F172A)" stroke="var(--border-color, #1E293B)" stroke-width="2"/>

  <!-- Section 1: User / Visual Configurator Layer -->
  <g transform="translate(40, 30)">
    <rect width="880" height="70" rx="10" fill="url(#primaryGrad)" opacity="0.95" />
    <text x="440" y="26" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">VISUAL BUILDER &amp; DESIGN-TIME STUDIO (LOW-CODE / NO-CODE)</text>
    <text x="440" y="48" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Form Builder • Workflow Builder • Rule Studio • Report Designer • Doc Template Builder • SLA/Approval Policy Studio</text>
  </g>

  <!-- Connectors Down from Studio to API Gateway -->
  <path d="M 480 100 L 480 140" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)" />

  <!-- Section 2: API Gateway & Semantic Schema Validation Layer -->
  <g transform="translate(180, 140)">
    <rect width="600" height="48" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" />
    <text x="300" y="22" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">API GATEWAY &amp; SCHEMA REGISTRY / VALIDATION MESH</text>
    <text x="300" y="38" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">JSON Schema Registry • Dynamic Attribute Binding • Authentication &amp; RBAC Authorization</text>
  </g>

  <!-- Connectors to Runtime Engines -->
  <path d="M 280 188 L 120 230" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 400 188 L 300 230" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 480 188 L 480 230" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 560 188 L 660 230" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 680 188 L 840 230" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Section 3: High-Performance Runtime Engines Grid -->
  <!-- Engine 1: Form & Attribute Runtime -->
  <g transform="translate(40, 230)">
    <rect width="160" height="90" rx="8" fill="url(#nodeGrad)" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="80" y="24" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">FORM &amp; ATTRIBUTE</text>
    <text x="80" y="40" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Dynamic Schema Parser</text>
    <text x="80" y="56" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Dependency Evaluator</text>
    <text x="80" y="74" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Multi-Tier Validation</text>
  </g>

  <!-- Engine 2: Workflow Orchestration Engine -->
  <g transform="translate(220, 230)">
    <rect width="160" height="90" rx="8" fill="url(#nodeGrad)" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="80" y="24" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">WORKFLOW ENGINE</text>
    <text x="80" y="40" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">State Machine Executor</text>
    <text x="80" y="56" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Parallel Branching</text>
    <text x="80" y="74" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Task Router &amp; Escalation</text>
  </g>

  <!-- Engine 3: Business Rule Engine (BRE) -->
  <g transform="translate(400, 230)">
    <rect width="160" height="90" rx="8" fill="url(#nodeGrad)" stroke="#10B981" stroke-width="1.5"/>
    <text x="80" y="24" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">RULE ENGINE (BRE)</text>
    <text x="80" y="40" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Decision Tree Compiler</text>
    <text x="80" y="56" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Dynamic Policy Resolver</text>
    <text x="80" y="74" fill="#10B981" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Sub-Millisecond Eval</text>
  </g>

  <!-- Engine 4: Document & Report Engine -->
  <g transform="translate(580, 230)">
    <rect width="160" height="90" rx="8" fill="url(#nodeGrad)" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="80" y="24" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">DOC &amp; REPORT ENGINE</text>
    <text x="80" y="40" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Template Merging &amp; QR</text>
    <text x="80" y="56" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Async Data Aggregation</text>
    <text x="80" y="74" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">PDF / Excel / Streaming</text>
  </g>

  <!-- Engine 5: SLA, Approval & Notification Engine -->
  <g transform="translate(760, 230)">
    <rect width="160" height="90" rx="8" fill="url(#nodeGrad)" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="80" y="24" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SLA &amp; NOTIFICATION</text>
    <text x="80" y="40" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Multi-Tier Matrix Resolver</text>
    <text x="80" y="56" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Breach Forecaster</text>
    <text x="80" y="74" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Omnichannel Dispatch</text>
  </g>

  <!-- Connectors Down to Event Bus -->
  <path d="M 120 320 L 120 365 L 480 365" stroke="#3B82F6" stroke-width="1.5" />
  <path d="M 300 320 L 300 365" stroke="#3B82F6" stroke-width="1.5" />
  <path d="M 480 320 L 480 365" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <path d="M 660 320 L 660 365" stroke="#3B82F6" stroke-width="1.5" />
  <path d="M 840 320 L 840 365 L 480 365" stroke="#3B82F6" stroke-width="1.5" />

  <!-- Section 4: Distributed Event Bus & Async Infrastructure -->
  <g transform="translate(80, 370)">
    <rect width="800" height="46" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="400" y="20" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">EVENT STREAMING &amp; ASYNCHRONOUS INTEGRATION BUS (KAFKA / RABBITMQ)</text>
    <text x="400" y="36" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Event Topics • Idempotent Consumers • Dead-Letter Queues • Outbox Pattern • Resilient Retries</text>
  </g>

  <!-- Connectors Down to Persistence -->
  <path d="M 280 416 L 280 445" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 480 416 L 480 445" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 680 416 L 680 445" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Section 5: Persistence & Caching Tier -->
  <g transform="translate(80, 445)">
    <rect width="240" height="50" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1"/>
    <text x="120" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">POSTGRESQL / SUPABASE</text>
    <text x="120" y="38" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Schemas, State, Partitioned Data</text>
  </g>

  <g transform="translate(360, 445)">
    <rect width="240" height="50" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1"/>
    <text x="120" y="22" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">REDIS DISTRIBUTED CACHE</text>
    <text x="120" y="38" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Rule Cache, Token Store, Fast Lookups</text>
  </g>

  <g transform="translate(640, 445)">
    <rect width="240" height="50" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1"/>
    <text x="120" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">AUDIT &amp; DOCUMENT STORE</text>
    <text x="120" y="38" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Immutable Logs, Storage, Blobs</text>
  </g>
</svg>
