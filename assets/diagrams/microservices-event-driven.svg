<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" class="arch-svg">
  <defs>
    <linearGradient id="msGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2C59" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="serviceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#F59E0B" />
    </marker>
  </defs>

  <rect width="960" height="480" rx="16" fill="var(--card-bg, #0F172A)" stroke="var(--border-color, #1E293B)" stroke-width="2"/>

  <!-- Client Applications -->
  <g transform="translate(40, 25)">
    <rect width="880" height="50" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="440" y="24" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">CLIENT CONSUMERS &amp; INTEGRATIONS</text>
    <text x="440" y="40" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Enterprise Banking Portals • SaaS HRMS (900+ Clients) • Costco eCommerce Clients • Real-Time Sports Frontends</text>
  </g>

  <!-- Connect to Gateway -->
  <path d="M 480 75 L 480 110" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)" />

  <!-- API Gateway & Security Perimeter -->
  <g transform="translate(120, 110)">
    <rect width="720" height="55" rx="8" fill="url(#msGrad1)" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="360" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">API GATEWAY &amp; ZERO-TRUST SECURITY PERIMETER</text>
    <text x="360" y="42" fill="#BAE6FD" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">OAuth2 / OIDC • Rate Limiting • Circuit Breakers • Semantic API Routing • Resiliency &amp; Idempotency Mesh</text>
  </g>

  <!-- Connect to Microservices -->
  <path d="M 220 165 L 140 210" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <path d="M 380 165 L 340 210" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <path d="M 580 165 L 620 210" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <path d="M 740 165 L 820 210" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)" />

  <!-- Core Microservices Grid -->
  <g transform="translate(50, 210)">
    <rect width="180" height="85" rx="8" fill="url(#serviceGrad)" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="90" y="22" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">CORE ENGINE SERVICE</text>
    <text x="90" y="40" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">.NET 10 / ASP.NET Core</text>
    <text x="90" y="56" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Form / Workflow / BRE</text>
    <text x="90" y="72" fill="#10B981" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Clean Architecture + DDD</text>
  </g>

  <g transform="translate(250, 210)">
    <rect width="180" height="85" rx="8" fill="url(#serviceGrad)" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="90" y="22" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PAYROLL &amp; HR SERVICE</text>
    <text x="90" y="40" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">.NET 8 Microservice</text>
    <text x="90" y="56" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Multi-Tenant Calculations</text>
    <text x="90" y="72" fill="#10B981" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">High-Throughput Batch</text>
  </g>

  <g transform="translate(530, 210)">
    <rect width="180" height="85" rx="8" fill="url(#serviceGrad)" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="90" y="22" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">INVENTORY &amp; RETAIL</text>
    <text x="90" y="40" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Costco Tire Solution</text>
    <text x="90" y="56" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Sub-second Stock Lookup</text>
    <text x="90" y="72" fill="#10B981" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Fortune 14 Scalability</text>
  </g>

  <g transform="translate(730, 210)">
    <rect width="180" height="85" rx="8" fill="url(#serviceGrad)" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="90" y="22" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">REAL-TIME GAMING &amp; API</text>
    <text x="90" y="40" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">.NET Core / Windows Svc</text>
    <text x="90" y="56" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">UEFA / IPL / Yahoo Cricket</text>
    <text x="90" y="72" fill="#10B981" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Live Match Ingestion</text>
  </g>

  <!-- Connectors to Kafka -->
  <path d="M 140 295 L 140 330 L 480 330" stroke="#F59E0B" stroke-width="1.5" />
  <path d="M 340 295 L 340 330" stroke="#F59E0B" stroke-width="1.5" />
  <path d="M 620 295 L 620 330" stroke="#F59E0B" stroke-width="1.5" />
  <path d="M 820 295 L 820 330 L 480 330" stroke="#F59E0B" stroke-width="1.5" />
  <path d="M 480 330 L 480 345" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow-amber)" />

  <!-- Apache Kafka Event Broker -->
  <g transform="translate(100, 345)">
    <rect width="760" height="42" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="380" y="20" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">APACHE KAFKA &amp; DISTRIBUTED EVENT STREAMING BACKBONE</text>
    <text x="380" y="34" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Decoupled Asynchronous Workflows • Change Data Capture • Audit Logging • Event Sourcing</text>
  </g>

  <!-- Persistence Tier -->
  <g transform="translate(100, 410)">
    <rect width="230" height="46" rx="6" fill="#0F172A" stroke="#3B82F6" stroke-width="1"/>
    <text x="115" y="20" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">SUPABASE / POSTGRESQL</text>
    <text x="115" y="34" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Relational &amp; Multi-Tenant Schemas</text>
  </g>

  <g transform="translate(365, 410)">
    <rect width="230" height="46" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1"/>
    <text x="115" y="20" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">REDIS DISTRIBUTED CACHE</text>
    <text x="115" y="34" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Fast Lookups &amp; Session Store</text>
  </g>

  <g transform="translate(630, 410)">
    <rect width="230" height="46" rx="6" fill="#0F172A" stroke="#3B82F6" stroke-width="1"/>
    <text x="115" y="20" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">SQL SERVER &amp; ORACLE</text>
    <text x="115" y="34" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Transactional Data &amp; Reporting</text>
  </g>
</svg>
