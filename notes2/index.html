bedding. Tip: store model name with vectors.","k":["Embedding model | Converts text to vectors; choose by language, domain, cost and benchmark results on your own data.","Dimensions and cost | More dimensions can improve quality but increase storage and search time.","Query and document prefixes | Some models expect different instructions for queries and passages.","Maximum input length | Chunks must fit within the model's limit.","Re-embedding | Changing models means re-indexing everything."]},{"n":"Vector stores: Azure AI Search, pgvector, OpenSearch, Pinecone","w":"A vector store finds nearest vectors fast.","b":["Azure AI Search, OpenSearch, pgvector, Pinecone, others.","Approximate nearest neighbor (HNSW) trades tiny accuracy for speed.","Store text and metadata with vectors.","Choose by scale, filters and existing stack."],"e":"pgvector inside PostgreSQL keeps things simple for small corpora.","d":null,"h":"Index types: HNSW (graph, fast, high recall), IVF (clusters), flat (exact). Parameters control recall and latency. Supports filters on metadata (department, date), hybrid search and multi-tenancy. Operational concerns: sizing memory, replication, backups, upserts and deletes. For small datasets pgvector in PostgreSQL is simple; for enterprise search Azure AI Search or OpenSearch offer rich features.","y":"Core infrastructure of RAG.","m":"Mistake: no metadata filters, so retrieval returns irrelevant or unauthorized content. Tip: design metadata schema early.","k":["Vector database | Stores vectors with metadata and returns nearest neighbors quickly; examples are Azure AI Search, OpenSearch, pgvector and Pinecone.","HNSW | A graph-based approximate nearest neighbor index with high recall and low latency.","Flat versus approximate search | Flat compares against everything for exact results but is slow at scale; approximate trades a little accuracy for speed.","Metadata filters | Limit search by department, date or permissions at query time.","Updates | Support upserts and deletes as documents change."]},{"n":"Retrieval and prompt assembly","w":"Retrieval feeds the model the right evidence.","b":["Embed the question, fetch top-k chunks.","Build a prompt: instructions, context, question.","Tell the model to answer only from the context and say when unknown.","Limit context size."],"e":"Top 5 chunks plus 'answer from sources only'.","d":{"t":"flow","n":["Question","Embed","Search","Top chunks","LLM answer"]},"h":"Query flow: receive question, optionally rewrite using chat history, embed query, retrieve top-k (k=5-20) with filters, optionally re-rank, build prompt with numbered sources, instruct to answer only from sources and cite, call LLM at low temperature, post-process (citation check, safety filter), return answer and sources. Handle 'no relevant context' explicitly.","y":"This is the heart of grounded answers.","m":"Mistake: stuffing too many chunks, causing distraction and cost. Tip: tune k and rely on re-ranking.","k":["Top-k retrieval | Fetch the k most similar chunks, often 5 to 20.","Prompt assembly | Combine system instructions, retrieved context and the question, with a token budget for each.","Grounding instruction | Tell the model to answer only from the provided sources and say when it cannot.","Query rewriting | Turn a follow-up like what about 2024 into a standalone question before searching.","Low temperature | Keeps factual answers consistent."]},{"n":"Citations and source attribution","w":"Users trust answers they can check.","b":["Return source name, section and link.","Ask the model to cite chunk IDs.","Verify citations exist in the context.","Use citations to debug bad answers."],"e":"Answer ends with [Policy Manual, section 4.2].","d":null,"h":"Include chunk metadata (document name, page, URL) in the prompt and ask the model to reference IDs like [1]. After generation, verify that cited IDs exist and that quoted text appears in sources. Show clickable references in the UI to the exact page or section. Log citations for review. Optionally highlight supporting passages.","y":"Trust and auditability for users and compliance.","m":"Mistake: fabricated or mismatched citations. Tip: automated check that each claim is supported by cited text.","k":["Citations | References from the answer to the specific source passages, such as document name and page.","Chunk identifiers | Give each chunk an ID in the prompt so the model can cite it.","Verification of citations | Check that cited IDs exist and that quoted text appears in the source.","Source links in the UI | Let users open the original document at the right place.","Audit trail | Store answers with their sources for later review."]},{"n":"Security trimming and access control on documents","w":"RAG must not leak data.","b":["Store access control info with each chunk.","Filter by the user's permissions at query time.","Never rely on the prompt to hide data.","Log access."],"e":"HR documents are retrievable only by HR users.","d":null,"h":"Store ACLs (user/group IDs) as metadata on each chunk and apply filters at query time using the caller's identity (token groups). Sync permissions changes regularly. Avoid indexing highly sensitive content together without segmentation. Log queries and retrieved documents. Test with users lacking access to ensure nothing leaks. Never include restricted content in the prompt and rely on instructions to hide it.","y":"Prevents data leakage across departments.","m":"Mistake: indexing everything into one open index. Tip: security trimming and per-tenant indexes for strict separation.","k":["Access control lists | Store which users or groups may see each document with its chunks.","Security trimming | Filter search results by the caller's groups so people never receive content they cannot access.","Permission sync | Keep ACLs updated when source permissions change.","Tenant isolation | Separate indexes or strict filters per customer.","Never rely on the prompt | Telling the model to hide data is not a control; do not retrieve it."]},{"n":"Production architecture and caching","w":"Production RAG is a system, not a script.","b":["Ingestion pipeline, index, API, cache and monitoring.","Rate limits and retries.","Cache frequent questions.","Evaluation and feedback loops."],"e":"A nightly ingestion job updates the index.","d":{"t":"layers","n":["Users and app","RAG API","Retriever + LLM","Index and storage","Ingestion pipeline"]},"h":"Components: ingestion workers and schedulers, vector/search index, retrieval and orchestration API, LLM gateway, cache (semantic cache for repeated questions), observability (traces, token usage, feedback), evaluation pipeline, secrets and identity, and CI/CD. Plan SLAs, scaling, cost controls, failure handling (fallback answer), and data retention. Build admin tools for reindexing.","y":"Moves RAG from demo to dependable service.","m":"Mistake: demo architecture in production. Tip: add evaluation and monitoring before launch.","k":["Semantic cache | Return stored answers to similar questions, reducing cost and latency.","Reindexing | Rebuild the index when parsing or chunking changes, ideally to a new versioned index and then switch.","Fallback behavior | A clear message when retrieval or the model is unavailable.","Observability | Trace what was retrieved and generated for each question to debug quality.","Feedback loop | User ratings and corrections feed evaluation sets."]}]},{"n":"Advanced RAG","d":"Higher-quality retrieval.","s":[{"n":"Hybrid search (keyword plus vector)","w":"Combine meaning search with exact search.","b":["Vector search handles synonyms.","Keyword (BM25) catches codes, names and rare terms.","Merge with reciprocal rank fusion.","Azure AI Search and OpenSearch support hybrid."],"e":"Searching 'CPT 99213' needs keyword matching.","d":{"t":"flow","n":["Query","Vector + keyword","Fuse rankings","Top results"]},"h":"Run BM25/keyword and vector queries in parallel; combine results by Reciprocal Rank Fusion: score = sum of 1/(k + rank). Hybrid helps when queries include exact terms (policy IDs, drug names, acronyms) and when embeddings miss rare words. Azure AI Search, Elasticsearch/OpenSearch, Weaviate, Pinecone sparse-dense support this. Tune weights using evaluation.","y":"Higher recall across query types.","m":"Mistake: relying only on vectors. Tip: always compare against keyword baseline.","k":["BM25 | A classic keyword ranking method that scores documents by how often and how rarely query terms appear.","Hybrid search | Run keyword and vector search together and merge the results, covering both exact terms and meaning.","Reciprocal Rank Fusion | A simple merge method that adds 1 divided by (k plus rank) for each list.","Sparse and dense vectors | Sparse vectors are keyword-like; dense vectors are learned embeddings.","Why it matters | Codes, names and IDs need exact matching while paraphrased questions need semantic matching."]},{"n":"Re-ranking with cross-encoders","w":"Re-rankers sort candidates by true relevance.","b":["Retrieve 50, re-rank to the best 5.","Cross-encoder reads query and chunk together for better accuracy.","Slower, so apply on a small set.","Services: Cohere Rerank, Azure semantic ranker."],"e":"Re-rank improved top-3 accuracy from 62% to 78%.","d":{"t":"flow","n":["Retrieve 50","Re-rank","Keep top 5"]},"h":"Bi-encoders (embeddings) are fast but approximate; cross-encoders read query and passage together to score relevance more precisely but slowly, so use on the top 20-100 candidates. Options: Cohere Rerank, Azure semantic ranker, bge-reranker, LLM-based ranking. Re-ranking also lets you retrieve a wider set first and keep context short.","y":"Boosts precision of the final context.","m":"Mistake: re-ranking too many candidates, adding latency. Tip: balance candidate count with latency targets.","k":["Bi-encoder | Embeds query and passage separately, so search is fast but only approximate.","Cross-encoder | Reads query and passage together and scores relevance more accurately but too slowly for the whole corpus.","Candidate set | Retrieve 20 to 100 candidates quickly, then re-rank them.","Rerankers | Hosted options include Cohere Rerank and Azure semantic ranker.","Latency trade-off | Re-ranking adds time, so limit candidates and measure the gain."]},{"n":"Contextual chunking and contextual retrieval","w":"Give each chunk the context it lost.","b":["Prepend a short description of the document and section.","LLM can generate the context per chunk once at ingestion.","Improves retrieval of ambiguous chunks.","Costs extra at ingestion."],"e":"'The limit is $2M' becomes 'In the 2025 Stop Loss policy for Acme: The limit is $2M'.","d":null,"h":"Anthropic's contextual retrieval: for each chunk, an LLM generates a short context describing where it fits in the whole document, which is prepended before embedding and BM25 indexing. This reduced failed retrievals notably in their tests. Alternatives: include title and heading path, document summary, and neighbor sentences. Use prompt caching to reduce cost at ingestion.","y":"Fixes chunks that are meaningless in isolation.","m":"Mistake: ignoring ingestion cost on large corpora. Tip: apply only where retrieval quality is a problem.","k":["Contextual retrieval | Before indexing, add a short generated description of where each chunk fits in its document.","Why it helps | A chunk saying the limit is $2M is meaningless alone; with context it says which policy and year.","Contextual embeddings and BM25 | Apply the context to both vector and keyword indexes.","Prompt caching | Reduces the cost of generating contexts for many chunks of one document.","Cheaper variants | Prefix chunks with the document title and heading path."]},{"n":"Query rewriting, decomposition, HyDE","w":"Improve weak queries before searching.","b":["Rewrite vague or conversational questions.","Decompose multi-part questions.","HyDE: generate a fake answer and search with it.","Multi-query: search several phrasings and merge."],"e":"Split 'compare plan A and B limits' into two searches.","d":null,"h":"Rewrite: reformulate the user question with chat history into a standalone query. Decompose: split compound questions into sub-queries, retrieve for each, then merge. HyDE: have the LLM write a hypothetical answer and embed it for search. Multi-query: generate paraphrases to increase recall. Step-back prompting asks a more general question. Evaluate each technique; they add LLM calls and latency.","y":"Handles vague, multi-part or conversational queries.","m":"Mistake: applying all techniques by default. Tip: add them based on failure analysis.","k":["Query rewriting | Turns vague or conversational questions into clear search queries.","Decomposition | Splits a complex question into sub-questions, retrieves for each and combines the answers.","HyDE | Generates a hypothetical answer and searches with its embedding, which can match documents better than a short question.","Multi-query | Generates several phrasings and merges their results to increase recall.","Cost and latency | Each technique adds LLM calls, so apply them where evaluation shows a gain."]},{"n":"GraphRAG and knowledge graphs","w":"Graphs capture relationships text search misses.","b":["Extract entities and relations with an LLM.","Build a graph; use community summaries.","Good for 'how are these connected' and global questions.","Costly and complex; use when relationships matter."],"e":"Find providers linked to many high-cost claims.","d":{"t":"hub","c":"Knowledge graph","n":["Member","Claim","Provider","Policy"]},"h":"Pipeline: extract entities and relationships from chunks with an LLM, build a knowledge graph in a graph database or files, detect communities (Leiden), summarize each, and answer global questions from community summaries, or traverse relationships for local questions. Microsoft GraphRAG popularized this. Graphs also support multi-hop reasoning and explainability.","y":"Handles questions needing connections across documents.","m":"Mistake: building a graph for simple lookup tasks. Tip: use it for relationship-heavy, global-theme questions; expect higher indexing cost.","k":["Knowledge graph | A network of entities and relationships extracted from documents.","Entity and relation extraction | An LLM identifies the nodes and edges in each chunk.","Community detection and summaries | Group related nodes and summarize each group so broad questions can be answered.","Local versus global questions | Local questions need specific facts; global ones such as what are the main themes need summaries across documents.","Cost | Building a graph needs many LLM calls, so use it where relationships matter."]},{"n":"Long-context vs retrieval trade-offs","w":"Long-context models change the trade-off.","b":["Entire documents can fit in the prompt.","Cost and latency grow with length.","Accuracy can drop in the middle of long inputs.","RAG still wins for huge corpora, freshness and permissions."],"e":"Pass one 100-page contract whole; use RAG across 10,000 contracts.","d":{"t":"vs","lt":"Long context","l":["Simple","Whole document","Costly per call"],"rt":"RAG","r":["Scales to big data","Cheaper per call","More moving parts"]},"h":"Long-context models handle hundreds of thousands to millions of tokens, but cost and latency rise and recall in the middle of long inputs can degrade. Caching static context can lower cost. RAG offers selective context, freshness, permissions and scales to billions of tokens. Hybrid approach: retrieve broadly, then give larger windows of relevant documents. Measure on your tasks.","y":"Informs architecture choices as models evolve.","m":"Mistake: assuming bigger context removes need for retrieval. Tip: benchmark both.","k":["Context window | The maximum tokens a model can handle, now up to hundreds of thousands or millions.","Lost in the middle | Models may use information in the middle of very long inputs less reliably.","Cost and latency | Long prompts cost more and take longer on every request.","Freshness and permissions | Retrieval can update instantly and enforce access, which long prompts cannot.","Hybrid approach | Retrieve relevant documents, then give the model larger passages."]},{"n":"Multimodal and table-aware RAG","w":"Real documents contain more than paragraphs.","b":["Convert tables to structured text (markdown or JSON).","Use vision models for charts and images.","Keep captions with figures.","Layout-aware parsers help."],"e":"Extract a premium table into rows before indexing.","d":null,"h":"Tables: convert to markdown/CSV/JSON with headers, or index row-level text with column names; keep the caption and surrounding text. Images/charts: generate captions via vision models, or use multimodal embeddings (CLIP, ColPali) for page-level retrieval. Maintain page images for display. Use layout-aware parsers to preserve reading order in multi-column PDFs.","y":"Many enterprise answers live in tables and figures.","m":"Mistake: flattening tables into plain text, losing structure. Tip: test table questions explicitly.","k":["Table extraction | Convert tables into markdown or JSON so rows and columns survive.","Vision-language models | Read charts, diagrams and scanned pages.","Image captioning | Generate text descriptions of figures so they can be searched.","Multimodal embeddings | Vectors that represent both images and text for retrieval.","Layout-aware parsing | Preserve reading order in multi-column documents."]},{"n":"Retrieval evaluation and tuning","w":"Measure retrieval separately from generation.","b":["Recall@k: is the right chunk in the top k?","Precision@k and MRR.","Tune chunk size, k, hybrid weights, re-ranker.","Use a labeled question-to-source set."],"e":"Recall@5 increased from 70% to 88% after hybrid search.","d":null,"h":"Retrieval metrics: Hit rate@k, Recall@k, Precision@k, MRR, nDCG, using labeled question-to-chunk pairs (or synthetic ones validated by humans). Run ablations: chunk size, overlap, embedding model, hybrid weights, top-k, re-ranker. Analyze failures by category (not retrieved, retrieved but ignored, wrong chunk). Keep results in a dashboard.","y":"Allows systematic improvement instead of guesswork.","m":"Mistake: judging only by final answer quality. Tip: evaluate retrieval and generation separately.","k":["Recall at k | Whether a relevant chunk appears in the top k results, the most important retrieval metric.","Precision at k | The share of the top k that is relevant.","MRR and nDCG | Measures of how high the first relevant result ranks and of graded ranking quality.","Ablation | Change one factor at a time (chunk size, hybrid weight) to see its effect.","Failure categories | Not retrieved, retrieved but ignored, or wrong chunk; each needs a different fix."]}]},{"n":"Agents & orchestration","d":"Multi-step LLM workflows.","s":[{"n":"LangChain components: chains, retrievers, tools","w":"LangChain gives building blocks for LLM apps.","b":["Prompt templates, model wrappers, output parsers.","Retrievers and tools.","Chains compose steps (LCEL).","Easy to swap providers."],"e":"prompt | model | parser as a simple chain.","d":{"t":"flow","n":["Prompt","Model","Parser"]},"h":"Core pieces: model wrappers (ChatOpenAI, AzureChatOpenAI), prompt templates, output parsers, retrievers and vector store integrations, tools, memory, callbacks and tracing (LangSmith). LCEL (the pipe syntax) composes runnables with streaming, batching and async. Use structured output (with_structured_output) for reliability. Keep abstractions thin and understand what is happening.","y":"Popular toolkit that speeds up building and swapping components.","m":"Mistake: deep abstraction stacks that are hard to debug. Tip: use tracing and keep prompts visible.","k":["Runnable and LCEL | Every LangChain component implements the same interface (invoke, stream, batch), and the pipe syntax chains them, for example prompt | model | parser, with streaming and async support built in.","Prompt templates | Reusable prompts with variables such as {question} and {context}, so prompt text is versioned separately from code.","Output parsers and structured output | Convert model text into typed objects; with_structured_output asks the model for JSON matching a schema, which is far more reliable than parsing free text.","Retrievers and tools | A retriever returns documents for a query; a tool is a function with a name, description and schema that the model can decide to call.","LangSmith tracing | Records every prompt, model response, tool call and latency so you can debug and evaluate; essential because LLM apps fail in non-obvious ways."]},{"n":"LangGraph: state, nodes, edges, checkpoints","w":"LangGraph builds controllable agent workflows as graphs.","b":["State: shared data across steps.","Nodes: functions or LLM calls.","Edges and conditional edges decide the next step.","Checkpointing lets you pause, resume and add human approval."],"e":"Router node sends to retrieval or calculation node.","d":{"t":"flow","n":["Start","Router","Tool node or LLM node","Check","End"]},"h":"Define a typed State (messages, documents, flags). Nodes read and update state; conditional edges route (for example to retry or end). Checkpointers (SQLite, Postgres, Redis) persist state per thread, enabling resumption, time travel and human-in-the-loop interrupts. Built-in prebuilt agents, subgraphs for multi-agent, streaming of events. Deployment through LangGraph Platform or your own service.","y":"Gives control and durability to agent workflows.","m":"Mistake: letting the LLM decide everything. Tip: encode known workflow steps as graph structure and use LLM for fuzzy decisions.","k":["State | A typed object (messages, retrieved documents, flags) that every step reads and updates; designing it well is the heart of a LangGraph app.","Nodes and edges | Nodes are functions or LLM calls; edges decide what runs next, either fixed or conditional on the state, which lets you encode known workflow steps explicitly.","Checkpointer | Saves state after each step to memory, SQLite or Postgres, so a run can pause, resume after failure or be inspected and rewound.","Threads | An identifier for one conversation or run; checkpoints are stored per thread, giving each user their own continuing session.","Interrupts and human input | The graph can stop and wait for a person to approve or edit before a sensitive step, then resume exactly where it left off."]},{"n":"ReAct pattern","w":"ReAct alternates reasoning and acting.","b":["Thought: what to do next.","Action: call a tool.","Observation: tool result.","Repeat until final answer.","Set maximum steps."],"e":"Search the policy, then compute the deductible, then answer.","d":{"t":"flow","n":["Thought","Action","Observation","...repeat","Answer"]},"h":"Loop: Thought (model reasons about the next step), Action (tool call with input), Observation (tool output) until Final Answer. Works well with tool calling APIs. Risks: loops, wrong tool usage, long contexts. Mitigate with max iterations, clear tool descriptions, error messages that guide recovery, and tracing.","y":"Baseline agent pattern for tool-using tasks.","m":"Mistake: no step limit. Tip: cap iterations and log every step.","k":["Thought | The model writes out what it intends to do next and why, which improves tool selection on multi-step problems.","Action | A structured tool call with arguments, executed by your code, not by the model.","Observation | The tool result returned to the model, which then decides whether to continue or answer.","Scratchpad | The accumulated thoughts, actions and observations passed back each turn; it grows and consumes context, so long runs need summarizing.","Iteration limits and error recovery | Cap the number of steps to prevent loops and return clear error messages so the model can correct bad calls."]},{"n":"Plan-and-Execute pattern","w":"Plan first, then execute.","b":["Planner writes a list of steps.","Executors run each step with tools.","Re-plan if a step fails.","More predictable and cheaper than step-by-step improvisation."],"e":"Plan: 1 find policy, 2 find claims, 3 summarize.","d":{"t":"flow","n":["Planner","Step 1","Step 2","Step 3","Combine"]},"h":"Planner LLM creates a structured plan (steps with dependencies). Executor runs steps, possibly with cheaper models or deterministic code, and results feed a replanner that updates the plan or finishes. Benefits: fewer expensive calls, clearer traces, parallel steps. Good for research, reporting and multi-step data tasks.","y":"Predictable and efficient for complex tasks.","m":"Mistake: rigid plans that cannot adapt. Tip: allow replanning on failure.","k":["Planner | An LLM call that turns a goal into an ordered list of steps, making the approach visible and reviewable before work begins.","Executor | Performs each step, often with a cheaper model or deterministic code, which lowers cost and variability.","Replanner | After each step it checks results and updates the remaining plan when reality differs from expectations.","Parallel steps | Independent steps run at the same time to reduce latency.","Trade-off | Plan-and-execute is more predictable and cheaper than free-form reasoning but less adaptive when surprises are frequent."]},{"n":"Multi-agent supervisor and handoff patterns","w":"Several specialist agents under a coordinator.","b":["Supervisor routes tasks to workers.","Workers have narrow tools and prompts.","Handoffs pass control between agents.","Adds cost and complexity; use if one agent cannot cope."],"e":"Research agent, calculation agent, writer agent.","d":{"t":"hub","c":"Supervisor","n":["Research agent","Data agent","Writer agent"]},"h":"Supervisor agent decides which worker to call next (research, SQL, document drafting), workers return results, supervisor synthesizes. Alternatives: handoffs (agents transfer control), swarms, hierarchical teams. Give each agent a narrow role and limited tools. Shared state or messages enable collaboration. Keep complexity justified; measure against a single agent baseline.","y":"Splits large problems and specializes behavior.","m":"Mistake: many agents chatting with no clear stop condition. Tip: define roles, outputs and termination rules.","k":["Supervisor | A coordinating agent that reads the request, chooses which specialist should act next and combines their outputs.","Worker agents | Specialists with a narrow role, prompt and tool set, such as research, SQL or drafting, which improves accuracy over one generalist.","Handoffs | A mechanism for one agent to transfer control and context to another.","Swarm pattern | Agents hand off to each other without a central controller, flexible but harder to reason about.","Start simple | Add agents only when a single agent with tools fails evaluations, because every extra agent adds cost and failure modes."]},{"n":"Memory and state management","w":"Agents need memory to be useful.","b":["Short-term: conversation messages (trim or summarize).","Long-term: stored facts and preferences in a database or vector store.","State is persisted by checkpoints.","Do not store secrets or unneeded personal data."],"e":"Remember the user's preferred report format.","d":null,"h":"Short-term memory = message list in state (trim, summarize). Long-term memory = store of facts, user preferences or past episodes in a database or vector store, retrieved when relevant (semantic, episodic, procedural memory). Manage consent, PII, expiry and correction. Namespaces per user or tenant prevent leakage.","y":"Makes agents personalized and consistent over time.","m":"Mistake: storing everything without governance. Tip: store only what is useful and allow deletion.","k":["Short-term memory | The message history of the current conversation; trim or summarize it to stay inside the context window.","Long-term memory | Facts and preferences stored between sessions in a database or vector store and retrieved when relevant.","Semantic, episodic and procedural memory | Facts about the world or user, records of past interactions, and learned ways of doing tasks.","Namespaces | Partition memory by user or tenant so one person's data never appears for another.","Privacy and deletion | Let users see, correct and delete stored memories and avoid saving sensitive data unnecessarily."]},{"n":"Human-in-the-loop approvals","w":"Keep people in control of risky actions.","b":["Pause before payments, emails, deletions.","Show what the agent plans and why.","Approve, edit or reject.","LangGraph interrupts support this."],"e":"Agent drafts an email; a person approves sending.","d":{"t":"flow","n":["Agent proposes","Human reviews","Approve","Execute"]},"h":"Use interrupts before sensitive tools (payments, sending emails, modifying records). Present the proposed action, parameters and reasoning in a UI; allow approve, edit or reject; resume the graph with the decision. Log approvals. Define risk tiers: read-only auto, low risk with logging, high risk requires approval.","y":"Keeps accountability with people for consequential actions.","m":"Mistake: approval prompts so frequent users rubber-stamp. Tip: approve only meaningful, risky steps.","k":["Approval gate | The graph pauses before a risky tool such as sending an email or issuing a payment and shows what it intends to do.","Risk tiers | Read-only actions may run automatically, reversible actions may need logging, and irreversible or high-value ones need explicit approval.","Edit and resume | The reviewer can change the proposed arguments before the action runs.","Audit trail | Record who approved which action, when and why.","Timeouts and escalation | Decide what happens if nobody responds, such as cancel the action or escalate."]},{"n":"Agent failure modes and observability","w":"Agents fail in new ways.","b":["Infinite loops, wrong tool use, hallucination, prompt injection.","Trace every step and tool call.","Limit steps, tokens, time and permissions.","Review failed runs and add tests."],"e":"Max 8 steps and a tool allow-list.","d":null,"h":"Failure modes: infinite loops, tool misuse, hallucinated parameters, prompt injection through tool outputs, context overflow, cost blowups, nondeterminism. Controls: iteration/token/time budgets, tool allow-lists and schema validation, sandboxed code execution, structured logging and traces (LangSmith, OpenTelemetry), evaluation suites of tasks, and canary releases. Analyze failed traces regularly.","y":"Agents are harder to test than simple chains.","m":"Mistake: evaluating only final answers. Tip: evaluate trajectories (tool choice, steps) too.","k":["Loops | The agent keeps repeating a failing step; fix with step limits, loop detection and better error messages.","Tool misuse | The model calls the wrong tool or passes invalid arguments; defend with schemas, validation and allow-lists.","Context overflow | History or tool output exceeds the window; summarize and truncate large results.","Trajectory evaluation | Judge the whole sequence of decisions, not only the final answer, because bad paths can still end in lucky answers.","Sandboxing | Run generated code or shell commands in isolated environments with no secrets and limited network."]}]},{"n":"MCP (Model Context Protocol)","d":"Standard way to connect tools and data to models.","s":[{"n":"MCP architecture: hosts, clients, servers","w":"MCP is an open protocol connecting AI apps to tools and data.","b":["Host: the AI application (chat app, IDE).","Client: connection inside the host.","Server: exposes tools and data.","One standard replaces many custom integrations."],"e":"An IDE connects to a database MCP server to query schema.","d":{"t":"flow","n":["Host (AI app)","MCP client","MCP server","Tool / data source"]},"h":"Host application embeds MCP clients, each with a 1:1 connection to a server. Messages use JSON-RPC 2.0. Transports: stdio (local processes) and streamable HTTP (remote). Capabilities are negotiated at initialization. Servers expose tools, resources and prompts; clients may offer sampling and roots. The goal is to avoid N x M custom integrations.","y":"Emerging standard supported by many AI tools and IDEs.","m":"Mistake: treating MCP servers as trusted by default. Tip: apply same review as any integration.","k":["Host, client and server | The host is the AI application a user interacts with; it creates one client per server; the server exposes capabilities such as tools and data.","JSON-RPC | The simple request and response message format MCP uses, so implementations in any language interoperate.","stdio and HTTP transports | stdio runs a local server as a child process and talks over pipes; streamable HTTP supports remote servers and multiple clients.","Capability negotiation | At startup client and server declare what they support, so newer features degrade gracefully.","Sampling | A server can ask the host to run a model completion, letting servers use the user's model without their own keys."]},{"n":"Tools, resources, prompts","w":"Three kinds of things servers expose.","b":["Tools: actions the model can call (create ticket).","Resources: read-only data (files, records).","Prompts: reusable templates.","Clear names and descriptions help the model choose."],"e":"Tool: search_claims(policy_id). Resource: policy handbook.","d":{"t":"hub","c":"MCP server","n":["Tools","Resources","Prompts"]},"h":"Tools have name, description and JSON input schema; they perform actions or computations and return content. Resources are addressable data (file://, db://) the application can read and attach as context. Prompts are server-provided templates users can invoke. Good descriptions and narrow schemas improve model tool selection.","y":"Defines how models and apps interact with external capabilities.","m":"Mistake: huge tool lists causing poor selection and cost. Tip: expose a focused set of tools per server.","k":["Tools | Named actions with a description and input schema; the model decides when to call them and the host executes them.","Resources | Read-only data addressed by URI, such as a file or database record, which the app can attach as context.","Prompts | Server-provided templates that users can invoke, for example a standard claim summary prompt.","Input schema | JSON Schema describing arguments, which lets hosts validate calls and models generate correct ones.","Tool annotations | Hints such as readOnly or destructive that hosts use to decide when to ask for approval."]},{"n":"Building an MCP server","w":"Wrap your service as an MCP server.","b":["Use an official SDK (Python, TypeScript, Java, C#).","Define tools with names, descriptions and JSON schemas.","Handle calls and return results or errors.","Transport: stdio for local, HTTP for remote."],"e":"A server with get_policy and list_claims tools.","d":null,"h":"Steps: choose SDK (TypeScript, Python, Java, C#), register tools with schemas and handlers, return structured results and meaningful errors, add logging, authentication for HTTP transport, tests, and packaging (container). Use MCP Inspector to test. For existing REST APIs, generate wrappers from OpenAPI but curate which operations to expose.","y":"Practical skill for building agent-ready services.","m":"Mistake: exposing raw internal APIs 1:1. Tip: design task-oriented tools (for example 'get claim summary').","k":["SDKs | Official libraries for TypeScript, Python, Java and C# that handle protocol details so you write only tool logic.","Tool handlers | The function behind each tool; return clear results and meaningful errors the model can act on.","MCP Inspector | A testing tool that lists tools, calls them and shows messages, used before connecting to an assistant.","Structured results | Return typed content, not just text, so downstream steps are reliable.","Designing tools | Model tasks users care about, such as get claim summary, rather than exposing every low-level endpoint."]},{"n":"Auth and security for MCP","w":"MCP servers are part of your attack surface.","b":["Authenticate users (OAuth) and authorize per tool.","Least privilege and read-only by default.","Validate inputs; guard against prompt injection in results.","Review and trust only approved servers; log calls."],"e":"Write tools require approval.","d":null,"h":"Remote MCP servers use OAuth 2.1 style authorization with user-delegated tokens; enforce per-tool permissions. Defend against prompt injection and tool poisoning (malicious descriptions or outputs), confused deputy issues, and data exfiltration. Controls: allow-lists of servers, version pinning, sandboxing local servers, human approval for side effects, audit logs, network egress controls.","y":"MCP expands the attack surface of AI applications.","m":"Mistake: installing community servers without review. Tip: treat them like third-party code.","k":["OAuth-based authorization | Remote MCP servers should authenticate users with OAuth so tool calls run with that user's permissions, not a shared service account.","Tool poisoning | A malicious server puts hidden instructions into tool descriptions or results to steer the model; treat all server text as untrusted.","Confused deputy | A server using its own privileges to do something the user could not; avoid by propagating user identity.","Allow-lists and pinning | Only approved servers and fixed versions may be connected.","Approvals and audit | Require confirmation for side effects and log every tool call."]},{"n":"Exposing internal APIs through MCP","w":"Make internal systems usable by agents.","b":["Wrap existing REST APIs as tools.","Start with read-only operations.","Add approvals for writes.","Provide good descriptions and examples."],"e":"MCP tool in front of the policy admin API.","d":null,"h":"Pattern: MCP server fronting an internal API with identity propagation, rate limits and field filtering. Start with read-only tools (search, get), then add write tools with approval and idempotency keys. Provide examples and clear documentation in tool descriptions. Monitor tool usage and errors, and measure which tools agents actually need.","y":"Unlocks agents to use enterprise systems safely.","m":"Mistake: sharing a single powerful service account across users. Tip: propagate user identity for authorization and audit.","k":["Wrapper servers | Expose selected operations of an existing service through MCP instead of rewriting it.","Identity propagation | Pass the user's identity to the backend so existing authorization rules still apply.","Read-only first | Start with search and get operations before enabling writes.","Idempotency keys and rate limits | Let write retries be safe and protect backends from an agent stuck in a loop.","Field filtering | Remove sensitive fields before returning data to the model."]},{"n":"Registry and governance of MCP servers","w":"Control which servers are allowed.","b":["Central catalog with owner, version and review status.","Security review before approval.","Version pinning and update process.","Monitoring and revocation."],"e":"Only catalog servers may be enabled in company tools.","d":null,"h":"Create an internal catalog listing server name, owner, purpose, data classification, tools, auth method, version and status. Approval workflow with security review, scanning and testing. Central gateway can proxy MCP traffic for logging, policy and rate limiting. Define deprecation and incident procedures.","y":"Prevents shadow integrations and supports compliance.","m":"Mistake: no ownership, so abandoned servers remain connected. Tip: require an owner and review dates.","k":["Server catalog | An internal registry of approved servers with owner, purpose, tools, data classification and version.","Security review | Examine code, permissions, dependencies and data exposure before approval.","Version pinning | Prevent silent updates that change behavior.","Central gateway | A proxy providing authentication, policy, rate limits and logging for all MCP traffic.","Incident response | A quick way to disable a server and revoke its access."]},{"n":"MCP in agent golden paths","w":"Give teams a ready path for agents.","b":["Template project with approved models, MCP servers, guardrails, tracing.","Shared libraries and CI/CD.","Documentation and examples.","Teams follow it for speed and safety."],"e":"A cookiecutter repo for new agent projects.","d":null,"h":"Golden path contents: repo template with orchestrator (LangGraph or Semantic Kernel), approved model gateway client, MCP client configuration for approved servers, guardrails and PII filters, tracing and evaluation harness, CI/CD with eval gates, IaC for infra, secrets handling, and documentation. Provide a sample app and support channel. Measure adoption and time to first deployment.","y":"Speeds delivery and embeds safety by default.","m":"Mistake: templates that become outdated. Tip: version them and automate upgrades.","k":["Golden path | A prebuilt route for teams to create agents with approved choices already made.","Reference application | A working sample that follows all standards, easy to copy.","Governed model client | A library that sends model calls through the central gateway with logging and limits.","Shared guardrails and evaluations | Reusable safety checks and test harnesses.","Adoption measures | Time to first deployment and number of teams using the path show whether it works."]}]},{"n":"Responsible AI & guardrails","d":"Safety and trust.","s":[{"n":"Microsoft Responsible AI principles","w":"Principles guide design reviews.","b":["Fairness, reliability and safety, privacy and security, inclusiveness, transparency, accountability.","Turn each into questions and checks.","Assess impact on people, not only accuracy.","Document decisions."],"e":"Check whether a model performs equally across age groups.","d":{"t":"hub","c":"Responsible AI","n":["Fairness","Safety","Privacy","Inclusiveness","Transparency","Accountability"]},"h":"Six principles: fairness, reliability and safety, privacy and security, inclusiveness, transparency, accountability. Practice: impact assessments, fairness testing across groups, documentation (model cards, transparency notes), human oversight design, red teaming, and monitoring. Microsoft's Responsible AI Standard and tools (Responsible AI dashboard, Fairlearn) support this. Involve diverse stakeholders.","y":"Reduces harm and legal risk, builds trust.","m":"Mistake: treating it as a final review step. Tip: integrate into design and development stages.","k":["Fairness | The system should not systematically disadvantage groups; test performance across segments such as age or region.","Reliability and safety | The system performs consistently and fails in safe ways, with testing for edge cases and abuse.","Privacy and security | Protect personal data and resist attacks, including prompt injection and data leakage.","Inclusiveness | Designed for people with different abilities, languages and backgrounds.","Transparency and accountability | Users know they are dealing with AI and its limits, and named humans remain responsible for outcomes."]},{"n":"Content filtering and prompt-shield techniques","w":"Filters keep harmful content out and in.","b":["Categories: hate, violence, sexual, self-harm.","Set severity thresholds per use case.","Prompt shields detect jailbreaks and injected instructions.","Filter both input and output."],"e":"Medical chatbot uses stricter self-harm filter.","d":{"t":"flow","n":["User input","Input filter","Model","Output filter","User"]},"h":"Azure AI Content Safety/Azure OpenAI filters classify text and images by category (hate, sexual, violence, self-harm) and severity (safe to high); thresholds are configurable. Prompt Shields detect jailbreak and indirect injection attacks. Protected material detection flags copyrighted text/code. Apply on both prompt and completion, and log filtered events. Tune for domain, such as medical content.","y":"First-line defense against harmful inputs and outputs.","m":"Mistake: relying only on provider filters. Tip: add application-specific rules and tests.","k":["Content categories | Filters classify text and images as hate, sexual, violence or self-harm, each with severity levels from safe to high.","Severity thresholds | Choose which severities to block for your audience; a children's app is stricter than an internal tool.","Jailbreaks | Attempts to bypass the model's rules, for example by role-playing; detectors flag these patterns.","Prompt Shields | Services that detect direct attacks in user input and indirect attacks hidden in documents.","False blocks | Valid requests can be filtered; review samples and tune thresholds."]},{"n":"Grounding checks and hallucination detection","w":"Do not let the model invent facts.","b":["Check that claims are supported by retrieved sources.","Citations, groundedness evaluators, second-model verification.","Refuse or say 'not found' when evidence is weak.","Show sources to users."],"e":"If no policy section matches, answer 'I can't find this in the documents'.","d":null,"h":"Techniques: instruct the model to answer only from provided sources; require citations; use groundedness evaluators (Azure AI Content Safety groundedness detection, Bedrock contextual grounding checks, NLI models) to compare claims with sources; have a second LLM verify; set confidence thresholds and allow 'I don't know'. For high-stakes use, add human review.","y":"Hallucinations erode trust and can cause harm.","m":"Mistake: assuming RAG eliminates hallucination. Tip: verify and measure groundedness continuously.","k":["Groundedness | Every factual claim in an answer should be supported by the provided sources.","Hallucination | A fluent statement not supported by the data or reality; the main risk of generative AI in business.","Verification | A second model or an entailment model checks each claim against the retrieved text.","Abstention | When evidence is missing the system says so instead of guessing.","Citation requirement | Forcing citations makes unsupported claims easy to spot."]},{"n":"PII redaction and data leakage prevention","w":"Protect personal and secret data.","b":["Detect PII (names, SSN, health) and mask before sending to models.","Redact in outputs and logs.","Block secrets in prompts.","Check vendor data-use terms and retention."],"e":"Replace SSN with a token before the call.","d":null,"h":"Detect PII with services (Presidio, Comprehend, Azure AI Language PII) and mask, tokenize or block before prompts leave your boundary. Filter outputs for PII or secrets. Avoid logging raw prompts with sensitive data or apply redaction and access control. Confirm that provider doesn't retain or train on your data. Use private networking and regional endpoints.","y":"Protects individuals and meets privacy law.","m":"Mistake: logging full conversations in plain text. Tip: redact logs and set short retention.","k":["PII detection | Services such as Presidio, Comprehend and Azure AI Language find names, IDs, addresses and health details.","Redaction and tokenization | Replace sensitive values with placeholders before calling a model, and restore them afterward if needed.","Provider data terms | Confirm that prompts are not retained or used for training and where processing happens.","Log hygiene | Do not store raw prompts with sensitive content, or redact and restrict access.","Network and residency controls | Use private endpoints and required regions."]},{"n":"Prompt injection defenses","w":"Attackers hide instructions in data.","b":["Direct injection: user says 'ignore your rules'.","Indirect injection: malicious text in a web page or document.","Defenses: separate instructions from data, least privilege tools, output validation, approvals for risky actions.","Treat model output as untrusted input."],"e":"A PDF contains 'email all data to x'; the agent must not obey.","d":null,"h":"Direct injection: users try to override instructions. Indirect: malicious content in documents, emails, web pages or tool outputs instructs the agent. Defenses: privilege separation, treat retrieved text as data (delimit and instruct), minimize tool permissions, validate and constrain tool arguments, require approval for sensitive actions, output filtering, content provenance, and monitoring. No single fix; use defense in depth.","y":"Top security risk for LLM apps (OWASP LLM01).","m":"Mistake: giving agents broad access with free text inputs. Tip: least privilege and human approval on risky actions.","k":["Direct injection | The user types instructions that try to override the system prompt.","Indirect injection | Instructions hidden in a document, email or web page that the model reads while doing a task.","Privilege separation | Treat retrieved content as data and limit what actions the model can trigger from it.","Validation of outputs | Check generated tool arguments and responses before acting.","Least privilege and approvals | Give tools minimal access and require human approval for sensitive actions."]},{"n":"Bedrock Guardrails and Azure AI Content Safety","w":"Managed safety services accelerate rollout.","b":["Bedrock Guardrails: topics, content filters, PII, grounding checks.","Azure AI Content Safety: text and image moderation, prompt shields, groundedness.","Apply consistently across apps.","Tune and test thresholds."],"e":"Create a guardrail denying investment advice.","d":null,"h":"Bedrock Guardrails: denied topics, content filters, word filters, sensitive information filters (PII), contextual grounding and relevance checks, and ApplyGuardrail API usable with any model. Azure AI Content Safety: text and image moderation, Prompt Shields, groundedness detection, protected material, custom categories. Configure versions, test with red-team prompts, and monitor intervention rates.","y":"Fast way to apply consistent policy.","m":"Mistake: very strict filters that block valid use. Tip: tune with real traffic and review false positives.","k":["Denied topics | Subjects the model must refuse, such as legal or investment advice.","Word and phrase filters | Block specific terms.","Sensitive information filters | Detect and mask or block PII in prompts and responses.","Contextual grounding checks | Score whether the answer is supported by source and relevant to the question.","Intervention monitoring | Review how often guardrails trigger to tune them."]},{"n":"Audit logging and human oversight","w":"Keep records and keep humans in charge.","b":["Log prompts, outputs, tool calls and decisions with privacy controls.","Allow review and override.","Kill switch for AI features.","Retention per policy."],"e":"Auditors can trace why an agent approved a refund.","d":null,"h":"Log: request ID, user (pseudonymous), model and version, prompt template version, retrieved sources, tool calls, outputs, filter results and decisions. Provide dashboards for reviewers, sampling for QA, and escalation to humans. Access control and retention aligned with privacy rules. Offer user feedback and appeal paths. Include a documented process to disable the feature quickly.","y":"Needed for investigations, compliance and improvement.","m":"Mistake: no traceability for decisions that affect people. Tip: store enough to reconstruct what the AI saw and did.","k":["Audit trail | A record of inputs, outputs, tool calls and decisions, with access control and retention.","Pseudonymization | Replace identities with IDs in logs.","Human review | Sample outputs regularly and review all high-impact decisions.","Appeals | Give people a way to contest decisions influenced by AI.","Kill switch | A fast, tested way to turn the feature off."]},{"n":"AI governance and risk assessment","w":"Treat AI as a risk-managed capability.","b":["Classify use cases by risk.","Document purpose, data, owner, limits and tests.","Review and approve before launch.","Align with NIST AI RMF and local regulations such as the EU AI Act."],"e":"High-risk use cases need legal and security sign-off.","d":{"t":"flow","n":["Propose use case","Risk classification","Review","Approve","Monitor"]},"h":"Process: intake form describing use case, data, users and impact; classify risk tier; required controls by tier (testing, human oversight, documentation, approvals); governance board review; periodic reassessment. Align with NIST AI RMF (govern, map, measure, manage), ISO 42001, and regulations like the EU AI Act risk categories. Maintain an AI system inventory.","y":"Gives organization-wide consistency and accountability.","m":"Mistake: governance that blocks all innovation. Tip: make low-risk paths quick and lightweight.","k":["AI inventory | A register of every AI system with owner, purpose, data and risk level.","Risk tiers | Higher-risk uses such as eligibility decisions get more testing, review and oversight.","NIST AI RMF | Govern, Map, Measure and Manage functions for AI risk.","ISO/IEC 42001 | A certifiable management system standard for AI.","EU AI Act | Regulation with prohibited, high-risk and limited-risk categories and duties for each."]}]},{"n":"AI evaluation","d":"Measure quality before and after launch.","s":[{"n":"Golden datasets and test set creation","w":"A golden dataset is your yardstick.","b":["Real questions with expected answers or source documents.","Include easy, hard and edge cases.","Created with domain experts.","Grow it from production failures."],"e":"200 questions on policy rules with reference answers.","d":null,"h":"Build 100-500 realistic cases: question, reference answer, expected sources, category and difficulty. Source from real user questions, SME input and failure logs; cover edge cases (ambiguous, out of scope, adversarial). Version the dataset and keep a held-out set. Synthetic generation can scale but must be reviewed by humans.","y":"The basis for trustworthy measurement.","m":"Mistake: tiny or unrealistic test sets. Tip: continually add production failures.","k":["Golden dataset | A curated set of 100 to 500 realistic questions with reference answers or expected sources, built with domain experts and used for every evaluation.","Coverage | Include typical, rare, ambiguous and out-of-scope questions so scores reflect real use.","Adversarial cases | Inputs designed to break the system, such as injection attempts or contradictory documents.","Held-out portion | Questions never used while tuning prompts, to avoid fooling yourself.","Versioning | Keep the dataset in version control so scores remain comparable over time."]},{"n":"Ragas metrics: faithfulness, relevance, context precision/recall","w":"Ragas offers standard RAG metrics.","b":["Faithfulness: is the answer supported by the context.","Answer relevancy: does it address the question.","Context precision and recall: did retrieval find the right chunks.","Use scores to find where the system fails."],"e":"Low context recall means fix retrieval, not the prompt.","d":{"t":"hub","c":"RAG quality","n":["Faithfulness","Answer relevancy","Context precision","Context recall"]},"h":"Metrics: Faithfulness (claims in answer supported by context), Answer Relevancy (addresses the question), Context Precision (relevant chunks ranked high), Context Recall (needed info retrieved), Answer Correctness vs reference, plus others. Each uses an LLM judge or embeddings. Interpret patterns: low context recall indicates retrieval issues; low faithfulness indicates generation issues.","y":"Gives diagnostic insight into where the pipeline fails.","m":"Mistake: treating the numbers as absolute truth. Tip: calibrate against human labels.","k":["Faithfulness | The fraction of claims in the answer that can be inferred from the retrieved context; low faithfulness means the model is inventing.","Answer relevancy | Whether the answer directly addresses the question, even if it is faithful.","Context precision | Whether the most relevant chunks are ranked highest in retrieval.","Context recall | Whether the retrieved context contains everything needed for the correct answer.","Using the metrics | Low context recall points to retrieval problems; low faithfulness to prompt or model problems."]},{"n":"LLM-as-judge design and bias","w":"A strong model grades answers with a rubric.","b":["Write clear criteria and scoring scale.","Use pairwise comparison to reduce bias.","Check against human labels.","Beware position and length bias."],"e":"Judge scores 1-5 on correctness and completeness.","d":null,"h":"Design: clear rubric with criteria and scale, examples of each score, structured JSON output with rationale, temperature 0, and a strong judge model. Reduce bias via pairwise comparisons with randomized order, multiple judges, and checks for length or self-preference bias. Validate agreement with humans (Cohen's kappa) on a sample.","y":"Scalable evaluation of open-ended outputs.","m":"Mistake: using the same model as generator and sole judge. Tip: use a different or stronger judge and spot-check manually.","k":["Rubric | A written scale such as 1 to 5 with examples that tells the judge model exactly what good looks like.","Pairwise comparison | Asking which of two answers is better is more reliable than asking for absolute scores.","Known biases | Judges favor the first position, longer answers and their own style; randomize order and use different judge models.","Calibration | Compare judge scores to human ratings on a sample and adjust the rubric until they agree.","Reproducibility | Use temperature zero and structured output."]},{"n":"Offline evals in CI","w":"Run evals automatically.","b":["Trigger on prompt, model or code changes.","Fail the build below thresholds.","Track scores over time.","Keep runs cheap by sampling."],"e":"Pull request shows faithfulness drop from 0.91 to 0.84.","d":{"t":"flow","n":["Change","Run eval set","Compare scores","Pass or fail"]},"h":"Integrate eval suite in CI: on pull requests that change prompts, retrieval or models, run the golden set (or a sampled subset), compute metrics and compare with the baseline. Fail on regressions beyond tolerance, and publish a report. Cache LLM calls where possible and set budgets. Nightly full runs complement fast PR runs.","y":"Prevents silent quality regressions.","m":"Mistake: noisy evals causing flaky builds. Tip: use confidence intervals and enough samples.","k":["Offline evaluation | Run the golden set automatically whenever prompts, models, chunking or retrieval settings change.","CI gate | Fail the build when scores drop below thresholds or regress against the baseline.","Tolerance | Allow for run-to-run noise so gates are not flaky.","Sampling | Run a subset on every pull request and the full set nightly to control cost.","Reports | Store results and traces so regressions can be investigated."]},{"n":"Online monitoring: feedback, drift, cost","w":"Production is the real test.","b":["Collect thumbs up/down and comments.","Track refusal rate, latency, cost and fallback rate.","Sample conversations for review.","Alert on drops; add failures to the golden set."],"e":"Dashboard of satisfaction by topic.","d":{"t":"flow","n":["Users","Feedback and logs","Review","Improve","Add to test set"]},"h":"Collect explicit feedback (thumbs, comments) and implicit signals (reformulation, abandonment, escalation). Monitor latency, cost per query, token use, refusal and fallback rates, guardrail hits, retrieval hit rate, and groundedness scores via sampled online evals. Use tracing platforms (Langfuse, LangSmith, Azure AI Foundry tracing) and alerting. Review a sample of conversations weekly.","y":"Real behavior differs from test sets.","m":"Mistake: no feedback loop. Tip: route low-rated cases into the golden set.","k":["Online monitoring | Track real conversations after launch, because production questions differ from test sets.","Explicit feedback | Thumbs up or down and comments.","Implicit feedback | Rephrased questions, abandoned sessions and escalations to humans.","Operational metrics | Latency, cost per query, refusal rate and fallback rate.","Closing the loop | Add failed production questions to the golden dataset."]},{"n":"A/B testing prompts and models","w":"Compare variants with real users.","b":["Split traffic between prompt A and B.","Measure task success, satisfaction and cost.","Run long enough for significance.","Roll back losing variants."],"e":"New prompt reduced escalations by 12%.","d":null,"h":"Experiment design: randomize users, define primary metric (resolution rate, satisfaction, cost), guardrail metrics (safety, latency), minimum sample size and duration. Use canary rollouts with automatic stop if guardrails fail. Analyze segments. Document results and decisions. For prompts, use shadow evaluation before exposing users.","y":"Prove improvements with real users.","m":"Mistake: changing several things at once. Tip: test one change per experiment when possible.","k":["A/B test | Randomly split users between two variants and compare outcomes.","Primary metric | The main business measure, such as resolution rate or time saved.","Guardrail metrics | Safety, latency and cost that must not worsen.","Sample size and duration | Enough traffic and time to see a real difference.","Canary and shadow | Expose few users first, or score a variant without showing it to users."]},{"n":"Regression gates for prompt changes","w":"Treat prompts like code.","b":["Version prompts in Git.","Require evals before release.","Review changes.","Roll back quickly."],"e":"Prompt change merged only after eval pass.","d":null,"h":"Practices: store prompts in repo or prompt registry with semantic versions, code review, linked eval results, change log, and environment-specific configs. Release via pipeline with approval, canary and rollback. Track which prompt version produced each response. Treat model upgrades the same way, re-running evals before switching.","y":"Prompt changes can break behavior silently.","m":"Mistake: editing prompts directly in production consoles. Tip: only deploy through the pipeline.","k":["Prompt registry | A versioned store of prompts with owner and history, so every answer can be traced to a version.","Change review | Prompts are changed through pull requests and reviewed like code.","Evaluation gate | A prompt change is released only if evaluations pass.","Model upgrades | Re-run evaluations before switching models, since behavior changes.","Rollback | Restore the previous prompt or model quickly if production quality drops."]}]}]},{"p":"Phase 8 - AI-Assisted Development & Contact Center (Weeks 31-32)","why":"Why: tooling that speeds up your own delivery.","t":[{"n":"AI development life cycle","d":"AI across every stage of delivery.","s":[{"n":"Spec-driven development workflow","w":"Specs make AI coding predictable.","b":["Write requirements, design and tasks first.","AI generates code against the spec.","Humans review spec and results.","Traceability from requirement to code to test."],"e":"Acceptance criteria written first, then agent implements.","d":{"t":"flow","n":["Requirements","Design","Tasks","AI implements","Review and test"]},"h":"Flow: capture the goal, write requirements with acceptance criteria, design the solution, break into small tasks, let the AI agent implement each task with tests, review diffs, run CI, and update the spec. The spec becomes the living source of truth and context for AI. Specs reduce misunderstanding that comes from open-ended prompts.","y":"Gives AI work structure, traceability and quality.","m":"Mistake: skipping review of the generated spec. Tip: review the spec before any code is written.","k":["Spec | A written description of what to build, in requirements, design and task form, stored in the repo; AI agents use it as precise context, which prevents the drift of long chat prompts.","Acceptance criteria | Testable statements of done, for example given a valid claim, when it is submitted, then its status is Received and a confirmation is sent.","Task list | The spec broken into small steps an agent can implement and a human can review one by one.","Traceability | Each requirement links to the design, code and tests that satisfy it, which supports audits.","Review gate | A person approves the spec before any code is generated, because wrong specs produce wrong software quickly."]},{"n":"AI for requirements and design","w":"AI can help before any code exists.","b":["Draft user stories and acceptance criteria.","Find gaps and conflicts.","Compare design options and trade-offs.","Generate diagrams and API drafts.","Validate with business stakeholders."],"e":"Ask AI for risks of a design, then verify them.","d":null,"h":"AI helps by drafting user stories, extracting requirements from documents and meetings, identifying ambiguities and edge cases, proposing architectures and trade-offs, generating diagrams (Mermaid, C4) and API contracts. Architects validate with domain experts, record decisions in ADRs, and use AI as a thinking partner rather than an oracle.","y":"Speeds early stages and improves completeness.","m":"Mistake: accepting confident but wrong design claims. Tip: ask the AI to list assumptions and risks, then verify.","k":["User stories | AI can draft stories from notes or transcripts, which people then correct and prioritize.","Ambiguity detection | Ask the AI to list missing, conflicting or untestable requirements and resolve them with stakeholders.","Trade-off analysis | AI helps list options and compare cost, risk, performance and complexity; the architect decides.","Diagram drafts | Generate Mermaid or C4 diagrams to review, always checking against reality.","Expert validation | Domain experts confirm that generated text matches how the business really works."]},{"n":"AI for coding, refactoring and test generation","w":"AI speeds up routine engineering tasks.","b":["Boilerplate, refactoring and migrations.","Generating unit tests and test data.","Explaining legacy code.","Keep tasks small and review all output."],"e":"Generate tests for an untested class, then review them.","d":null,"h":"Effective uses: scaffolding, repetitive transformations, adding tests, explaining unfamiliar code, upgrading APIs, and writing documentation. Provide context (files, conventions, examples), request small changes, run tests after each step, and commit frequently. Larger autonomous tasks need clear acceptance tests. Review for security, performance and maintainability.","y":"Largest productivity benefits for routine engineering work.","m":"Mistake: large unreviewed changes. Tip: keep diffs small and run the pipeline on each.","k":["Scaffolding | Quickly generate project structure, configuration and boilerplate that follows your standards.","Refactoring | Improve structure with the safety net of tests, in small steps.","Test generation | AI can draft unit tests, but review whether they check behavior or only mirror the implementation.","Code explanation | Summarize unfamiliar legacy code to speed up understanding.","Small diffs | Smaller changes are easier to review and revert."]},{"n":"AI-assisted code review and security scanning","w":"AI reviewers add a first pass.","b":["Spot bugs, style and missing tests.","Combine with SAST and dependency scans.","Humans decide on design and risk.","Track false positives."],"e":"AI comment: 'null not handled on line 42'.","d":null,"h":"AI review tools comment on pull requests (bugs, missing tests, naming, security smells). Combine with static analysis, secret scanning and dependency checks for coverage. Humans focus on architecture, requirements fit and risk. Configure review instructions with your standards and tune out noise. Track acceptance rate of suggestions.","y":"Adds a fast first line of review.","m":"Mistake: replacing human review entirely. Tip: use AI to prepare reviewers, not to replace them.","k":["AI-assisted review | Tools comment on pull requests about likely bugs, missing tests and style, giving a quick first pass.","Complementary security checks | SAST, dependency scanning and secret scanning still run because AI review can miss issues.","Human focus | Reviewers concentrate on design, requirements fit and risk.","Acceptance rate | The share of AI suggestions accepted indicates usefulness.","Branch protection | A human approval remains mandatory before merge."]},{"n":"Governance, IP and licensing of generated code","w":"Policy is needed before wide use.","b":["Approved tools and models.","Rules on sharing code and data.","License and IP considerations for generated code.","Mandatory review and testing.","Audit and training."],"e":"Do not paste customer data into unapproved tools.","d":null,"h":"Policy topics: approved tools and models; allowed data (no secrets or customer data in unapproved tools); code ownership and IP indemnity; open-source license matching and filters for public code; attribution; auditability of AI-assisted changes; training and acceptable use; incident reporting. Enterprise plans provide data protection, SSO and logs. Review legal terms.","y":"Reduces legal, security and quality risks.","m":"Mistake: banning tools without offering approved options, causing shadow use. Tip: provide sanctioned tools quickly.","k":["Approved tools | A list of assistants and models that comply with security and legal review.","Data rules | Never paste secrets, customer data or restricted code into unapproved tools.","IP and licensing | Vendors may offer indemnity and filters for suggestions matching public code.","Audit logging | Usage records support investigations and compliance.","Shadow AI | Staff secretly using unapproved tools; the best defense is providing good sanctioned options."]},{"n":"Measuring productivity impact","w":"Measure real outcomes.","b":["Cycle time, review time, defect rate, rework.","Developer satisfaction.","Avoid counting lines of code.","Compare before and after on the same teams."],"e":"PR lead time fell 20% while defects stayed flat.","d":null,"h":"Metrics: PR cycle time, time to first review, deployment frequency, change failure rate, defect escape rate, test coverage, developer satisfaction and cognitive load; also adoption and acceptance rates. Run before/after or controlled comparisons. Beware of vanity metrics like lines generated. Include maintenance cost of AI-written code.","y":"Shows real value and risks.","m":"Mistake: measuring only speed. Tip: pair speed metrics with quality metrics.","k":["Cycle time | Time from starting a task to release, a direct measure of delivery speed.","Defect escape rate | Bugs found in production, to ensure speed does not reduce quality.","Rework | Changes that must be redone, which can reveal poor-quality generated code.","Developer experience | Surveys on satisfaction and cognitive load.","Fair comparison | Compare similar teams or periods with and without the tools."]},{"n":"Team adoption playbook","w":"Adoption needs planning.","b":["Pilot with enthusiastic teams.","Share prompts and good examples.","Train on reviewing AI output.","Collect feedback and adjust policy."],"e":"Weekly 'AI tips' session in the guild.","d":{"t":"flow","n":["Pilot","Learn","Standards","Scale"]},"h":"Rollout: select pilot teams, set goals, provide training on prompting, context, review and security; create shared prompt libraries and project instruction files; hold regular office hours and showcase wins; update guidelines from lessons; scale by team. Appoint champions. Revisit policies as tools evolve quickly.","y":"Adoption succeeds through enablement, not mandates.","m":"Mistake: expecting uniform results without training. Tip: share concrete examples of good workflows.","k":["Pilot | A small trial with willing teams and success measures defined in advance.","Champions | Enthusiastic engineers who share what works.","Shared prompts and instructions | Libraries and project instruction files that spread good practice.","Training | Teach prompting, reviewing AI output and safe data handling.","Gradual scaling | Expand based on measured results."]}]},{"n":"AWS Kiro","d":"Agentic IDE with specs.","s":[{"n":"Specs: requirements, design, tasks","w":"Kiro structures work into three documents.","b":["requirements.md: user stories with acceptance criteria.","design.md: architecture, interfaces, data models.","tasks.md: ordered implementation tasks.","Review each stage before the next."],"e":"Idea becomes spec, design then tasks.","d":{"t":"flow","n":["Requirements","Design","Tasks","Implementation"]},"h":"Kiro generates requirements in EARS notation (WHEN condition THE SYSTEM SHALL response), then a design document with architecture, components, data models, error handling and testing strategy, then a task list linked to requirements. You can edit each stage, and run tasks one by one or in sequence. Specs live in the repository (.kiro/specs).","y":"Strong traceability from idea to code.","m":"Mistake: approving vague requirements. Tip: refine acceptance criteria until testable.","k":["Requirements document | Kiro turns an idea into user stories with acceptance criteria that you review and edit before any design starts.","EARS notation | WHEN a condition occurs THE SYSTEM SHALL do something; this structure keeps requirements precise, testable and unambiguous.","Design document | Architecture, components, interfaces, data models, error handling and test strategy derived from the approved requirements.","Tasks document | An ordered checklist linked to requirements that the agent runs one task at a time with review between tasks.","Spec files in the repository | Stored under .kiro/specs so they are versioned, reviewed and shared with the team."]},{"n":"Steering files for project context","w":"Steering gives the agent lasting context.","b":["Files in .kiro/steering describe stack, conventions, structure.","Always included or conditional on file patterns.","Saves repeating instructions.","Keep them short and current."],"e":"Steering: 'Use TypeScript strict, Jest tests, layered folders'.","d":null,"h":"Steering files in .kiro/steering describe product, tech stack, structure and conventions; inclusion modes include always, conditional by file match, or manual. Kiro can generate foundational steering files by analyzing your project. Keep them short, specific and updated, and avoid secrets.","y":"Gives consistent context to every interaction.","m":"Mistake: long vague instructions. Tip: give concrete examples and commands.","k":["Steering files | Markdown files in .kiro/steering that give Kiro lasting knowledge of your product, stack and conventions so you do not repeat them in every chat.","Inclusion modes | Always included, included only when matching files are in context, or included on request.","Typical content | Product purpose, technology stack, folder structure, coding and testing standards, and how to build and run.","Generated steering | Kiro can create starter files by analyzing your project, which you then refine.","Keep it concise | Specific, current guidance works better than long documents."]},{"n":"Agent hooks","w":"Hooks automate actions on events.","b":["Triggers: file save, create, delete, commit.","Actions: run an agent prompt or command.","Examples: update tests, lint docs, security check.","Keep hooks fast and deterministic."],"e":"On save of a service file, update its unit tests.","d":null,"h":"Hooks are event-driven automations: for example on file save, new file, delete or manual trigger, run an agent instruction like 'update unit tests' or 'check for OWASP issues'. File patterns scope them. Use hooks for documentation sync, test generation, linting and security checks. Keep them quick to avoid slowing development.","y":"Embeds team standards into the workflow.","m":"Mistake: noisy hooks firing constantly. Tip: scope to relevant files.","k":["Hooks | Automations that run an agent instruction when an event occurs in the IDE.","Trigger events | File saved, created or deleted, or a manual trigger, limited by file patterns.","Common uses | Update tests when source changes, scan for vulnerabilities, refresh documentation or enforce conventions.","Prompt action | The instruction the agent executes, written like a short task.","Performance | Hooks must be fast and focused or developers will turn them off."]},{"n":"MCP integration in Kiro","w":"Kiro can use external tools.","b":["Configure MCP servers in settings.","Agent can read docs, query databases, call APIs.","Apply least privilege.","Review tool actions."],"e":"MCP server for AWS documentation.","d":null,"h":"Configure MCP servers in user or workspace settings (mcp.json) to give the agent tools such as AWS documentation, GitHub, databases or internal APIs. Auto-approve lists for trusted read-only tools; require approval for others. Review server sources and keep credentials in environment or secret stores.","y":"Extends the agent's capabilities safely when governed.","m":"Mistake: enabling unknown servers. Tip: pin versions and review permissions.","k":["MCP servers | Tool providers such as documentation, databases, cloud APIs or internal systems that extend the agent.","Configuration scope | User-level servers apply everywhere; workspace-level servers apply to one project.","Auto-approve | Mark trusted read-only tools to run without prompts to reduce interruptions.","Credentials | Pass through environment variables or secret stores, never in the file.","Vetting | Review a server's source, permissions and maintainers before enabling it."]},{"n":"Vibe vs spec modes","w":"Two ways to work.","b":["Vibe: chat-driven, quick exploration.","Spec: structured, for larger features needing traceability.","Switch based on risk and size.","Use specs for team work."],"e":"Prototype in vibe mode, productionize in spec mode.","d":{"t":"vs","lt":"Vibe","l":["Fast","Exploratory"],"rt":"Spec","r":["Structured","Traceable"]},"h":"Vibe mode: conversational, immediate code changes, good for prototypes, debugging and small edits. Spec mode: structured planning for features that need design and tests. Many teams prototype in vibe mode to explore, then write a spec for the production version. Choose by risk and complexity.","y":"Match the process to the task.","m":"Mistake: building large features purely in vibe mode. Tip: switch to specs when scope grows.","k":["Vibe mode | Conversational coding where the agent changes code immediately; good for exploration, debugging and small edits.","Spec mode | Structured planning with requirements, design and tasks; best for substantial features that need traceability.","Choosing between them | Use specs when risk, size or team coordination is high.","From prototype to spec | Prototype quickly, then write a spec for the production version using lessons learned.","Team convention | Agree when each mode is expected."]},{"n":"Reviewing and validating agent output","w":"Agents can be confidently wrong.","b":["Read diffs, run tests, check security.","Compare to acceptance criteria.","Ask the agent to explain.","Keep commits small."],"e":"Reject changes that skip error handling.","d":null,"h":"Check: each task's diff against design and requirements; run tests and linters; try edge cases; verify security (input validation, authorization); confirm dependencies and licenses; ensure no secrets. Ask the agent to explain decisions and list risks. Commit per task for easy rollback. Update specs if reality diverges.","y":"Agent output is a draft until verified.","m":"Mistake: assuming passing tests means correct, when tests were generated to match the code. Tip: review test quality too.","k":["Diff review | Read every change against the design; agents can be confidently wrong.","Tests and linters | Run them after each task to verify behavior and style.","Security review | Check input validation, authorization and secrets handling.","Dependency check | Confirm new packages are needed, maintained and acceptably licensed.","Commit per task | Keeps history
