","State store | Keeps running aggregates between events, adding complexity and recovery needs.","Exactly-once sink | A destination that writes each result once even after retries.","Lambda vs Kappa architecture | Lambda keeps separate batch and stream paths; Kappa uses only streaming."]},{"n":"Orchestration patterns, retries, backfills","w":"Reliable pipelines can be rerun safely.","b":["Idempotent loads: same input gives same output.","Retries for transient errors, alerts for persistent ones.","Backfills reprocess history by date.","Monitor freshness and row counts."],"e":"Overwrite a daily partition instead of appending duplicates.","d":null,"h":"Design pipelines so each run processes a defined partition (date) and overwrites it. Use upserts (MERGE) keyed by business keys. Record run metadata (rows in, rows out). Retries with backoff; alert after N failures. Backfill by parameterized date range and capacity control. Data quality checks block bad data from propagating. Keep orchestration separate from transformations.","y":"Production data pipelines break; robust design limits damage.","m":"Mistake: appending without dedup so reruns duplicate data. Tip: make every task safely rerunnable.","k":["Idempotency | Running a step again gives the same final result, so retries and backfills are safe.","Partition overwrite | Replacing a whole date partition on each run instead of appending.","MERGE or upsert | Insert new rows and update existing ones by key.","Retry with backoff | Automatic reruns with growing delay for transient errors.","Quarantine | A place to put bad records for review without stopping the pipeline.","Data freshness | How recent the latest data is; an SLA for consumers.","Row count check | Compare input and output counts to detect loss or duplication.","Run metadata | Stored information about each run: time, rows, status."]}]},{"n":"Azure data stack","d":"Synapse, lake and ingestion.","s":[{"n":"Azure Data Lake Storage Gen2 layout and zones (bronze, silver, gold)","w":"Organize the lake in quality zones.","b":["Bronze: raw data as received.","Silver: cleaned, validated, conformed.","Gold: business-ready aggregates.","ADLS Gen2 gives hierarchical folders and fine-grained access."],"e":"/bronze/claims/2025/06/ then /silver/claims then /gold/claims_monthly.","d":{"t":"flow","n":["Bronze (raw)","Silver (clean)","Gold (business)"]},"h":"Typical layout: container per zone (raw/bronze, curated/silver, gold), folders by source system and date partition (year=2025/month=06/day=01). Hierarchical namespace gives real directories and POSIX-like ACLs. Use RBAC for broad access and ACLs for fine-grained access, with managed identities. Lifecycle policies tier older data. Name consistently and document.","y":"Good lake layout supports governance, cost and performance.","m":"Mistake: one flat dump area. Tip: define zones, naming and ownership at the start.","k":["Medallion architecture | A layered way of organizing a lake as bronze, silver and gold, improving quality at each step.","Bronze layer | Raw data exactly as received, kept so you can reprocess when logic changes or for audits.","Silver layer | Cleaned, validated, deduplicated and conformed data with consistent types and keys.","Gold layer | Aggregated, business-ready tables shaped for reporting, dashboards and machine learning.","Folder and partition layout | Names such as /bronze/claims/year=2025/month=06 let engines skip data they do not need and make permissions simple."]},{"n":"Synapse dedicated and serverless SQL pools","w":"Synapse offers SQL pools and Spark.","b":["Dedicated SQL pool: provisioned warehouse for heavy repeated workloads.","Serverless SQL pool: query files in the lake, pay per data scanned.","Spark pools for big data processing.","Choose by workload pattern and cost."],"e":"Ad hoc exploration uses serverless; nightly marts use dedicated.","d":null,"h":"Dedicated SQL pool (MPP warehouse) distributes data across 60 distributions using hash, round-robin or replicated tables, with columnstore indexes; pause when unused. Serverless SQL queries Parquet/Delta/CSV directly in the lake with OPENROWSET and external tables, billed by TB scanned. Synapse Spark handles heavy transformations. Many new projects consider Fabric or Databricks instead.","y":"Understand options to advise on migration and design.","m":"Mistake: poor distribution key causing data movement. Tip: choose hash keys with high cardinality used in joins.","k":["MPP architecture | Massively parallel processing splits a query across many compute nodes, which is how large warehouses scan billions of rows quickly.","Table distribution | In a dedicated pool, rows are spread by hash of a column, round-robin or replicated to all nodes; the right choice reduces data movement during joins.","Dedicated SQL pool | Provisioned warehouse capacity billed while running, for steady heavy workloads.","Serverless SQL pool | Queries files in the lake on demand and bills per terabyte scanned, great for exploration and light reporting.","Pause and scale | Dedicated pools can be paused when idle or scaled for peaks to control cost."]},{"n":"Azure Data Factory pipelines and integration runtimes","w":"Data Factory moves and orchestrates data.","b":["Pipelines contain activities (copy, data flow, notebook).","Linked services define connections.","Integration runtimes: Azure, self-hosted for on-premises.","Triggers: schedule, tumbling window, event."],"e":"Copy nightly from on-premises SQL Server to the lake.","d":{"t":"flow","n":["Source","Copy activity","Lake","Transform","Warehouse"]},"h":"Factory components: pipelines, activities, datasets, linked services, triggers, integration runtimes. Copy activity moves data at scale with connectors. Mapping data flows do visual Spark transformations. Self-hosted IR reaches on-premises; Azure-SSIS IR runs SSIS packages. Parameterize pipelines and use metadata-driven patterns; source control with Git; CI/CD via ARM or Bicep.","y":"Core Azure integration service.","m":"Mistake: building one pipeline per table by hand. Tip: use metadata-driven frameworks.","k":["Pipeline and activities | A pipeline groups activities such as copy data, run a notebook or call a stored procedure, with dependencies and error handling.","Linked services and datasets | A linked service stores a connection; a dataset points to a table or file inside it.","Integration runtime | The compute that moves data. Azure IR is managed; self-hosted IR runs inside a network to reach on-premises systems.","Triggers | Start pipelines by schedule, tumbling window or event such as a file arriving.","Metadata-driven design | One generic pipeline reads a configuration table to process hundreds of tables, avoiding duplicated pipelines."]},{"n":"Microsoft Fabric overview","w":"Fabric unifies Microsoft's analytics services.","b":["One SaaS platform with lakehouse, warehouse, pipelines, real-time and Power BI.","OneLake: single logical lake for the whole organization.","Capacity-based billing.","Newer; compare with Synapse for your case."],"e":"Shortcuts expose data in other lakes without copying.","d":null,"h":"Fabric combines Data Factory, Synapse-like engines, Real-Time Intelligence, Data Science and Power BI over OneLake, using Delta Parquet as the common format. Items: Lakehouse, Warehouse, Notebooks, Pipelines, Semantic models. Direct Lake mode lets Power BI read Delta files directly. Capacities (F SKUs) are shared by workloads; governance via Purview integration.","y":"Microsoft's strategic analytics direction.","m":"Mistake: ignoring capacity planning leading to throttling. Tip: monitor capacity metrics and separate workloads if needed.","k":["OneLake | A single logical data lake for the whole organization in Fabric, stored as open Delta Parquet files.","Lakehouse and warehouse | A lakehouse combines files and tables with a SQL endpoint; a warehouse offers a full T-SQL experience.","Direct Lake | Power BI reads Delta files from OneLake directly, giving near-import speed without copying data.","Capacity | The pool of compute units that all Fabric workloads share and that you pay for; monitor it to avoid throttling.","Shortcuts | Pointers to data in other locations that appear local, avoiding copies."]},{"n":"Delta Lake and lakehouse architecture","w":"Delta Lake adds database reliability to files.","b":["ACID transactions on Parquet files.","Schema enforcement and evolution.","Time travel for audits and rollback.","Lakehouse: one copy of data for BI and ML."],"e":"Query the table as of yesterday.","d":null,"h":"Delta stores data in Parquet plus a transaction log. Supports MERGE, UPDATE, DELETE, schema evolution, time travel (VERSION AS OF), OPTIMIZE (compaction), ZORDER and VACUUM. Table features like change data feed enable incremental downstream loads. Lakehouse serves BI, data science and streaming from the same tables, with medallion architecture.","y":"Reliable tables on cheap storage.","m":"Mistake: VACUUM too aggressively, breaking time travel. Tip: set retention to match recovery needs.","k":["Delta transaction log | An ordered log of every change to a table that gives ACID guarantees on object storage.","Time travel | Query a table as it was at an earlier version or timestamp, useful for audits and recovering from mistakes.","OPTIMIZE and ZORDER | OPTIMIZE compacts many small files into larger ones; ZORDER clusters data by columns so filters skip more files.","VACUUM | Deletes files no longer referenced by the table; its retention period also limits how far back time travel works.","Change data feed | Exposes row-level inserts, updates and deletes so downstream tables update incrementally."]},{"n":"Event Hubs and Stream Analytics","w":"Handle real-time streams in Azure.","b":["Event Hubs ingests events at scale (Kafka-compatible).","Stream Analytics runs SQL-like queries over streams.","Output to Power BI, storage or databases.","Consider Spark Structured Streaming for complex jobs."],"e":"Alert when claims per minute exceed a limit.","d":{"t":"flow","n":["Producers","Event Hubs","Stream Analytics","Dashboard or store"]},"h":"Event Hubs partitions and ingests events, supports Kafka protocol and Capture to the lake. Stream Analytics queries with SQL-like language, windowing functions and joins with reference data, and outputs to storage, SQL, Power BI or Event Hubs. For complex stateful processing use Spark Structured Streaming or Flink. Monitor lag and watermark delay.","y":"Real-time scenarios like alerts and operational dashboards.","m":"Mistake: no plan for late or out-of-order events. Tip: define watermarks and test them.","k":["Event Hubs | A managed service that ingests millions of events per second, partitioned for parallel consumers, with a Kafka-compatible endpoint.","Partitions and consumer groups | Partitions give parallelism; each consumer group has its own independent position in the stream.","Capture | Automatically writes events to storage for later batch analysis.","Stream Analytics | Runs SQL-like queries over streams with windowing and joins, and writes to dashboards or stores.","Windows and late events | Tumbling, hopping and sliding windows group events by time; a late-arrival policy decides how long to wait for delayed events."]},{"n":"Cost and performance tuning","w":"Performance and cost need regular attention.","b":["Partition on columns used in filters; avoid too many small files.","Compact and optimize Delta tables.","Auto-pause and right-size compute.","Review expensive queries monthly."],"e":"OPTIMIZE and ZORDER improved query time by 5x.","d":null,"h":"Techniques: partition large tables by common filter columns (date), avoid tiny files by compaction, use column pruning and predicate pushdown with Parquet, cache hot data, choose right compute size and autoscale, pause or auto-stop, optimize joins and statistics, and review query history for expensive patterns. Add budgets and alerts on workspaces.","y":"Data platforms can become the biggest cloud cost.","m":"Mistake: scaling compute up instead of fixing queries. Tip: profile first.","k":["Partitioning for pruning | Organize data by a commonly filtered column such as date so queries read only needed partitions.","Small file problem | Thousands of tiny files slow every engine because of per-file overhead; compact them regularly.","Predicate pushdown and column pruning | Filters and column selection are applied at storage so less data is read.","Auto-pause and right-sizing | Stop idle compute and choose a size that matches the workload.","Cost monitoring | Review expensive queries and set budgets on workspaces."]}]},{"n":"Data governance & quality","d":"Consistency across the enterprise.","s":[{"n":"Data catalog and lineage (Purview, Glue Catalog, Unity Catalog)","w":"Catalogs make data discoverable and trusted.","b":["Purview, Glue Data Catalog, Unity Catalog.","Describe owner, meaning, sensitivity and quality.","Lineage shows source to report and impact of changes.","Search helps analysts find the right dataset."],"e":"See which dashboards break if a column is renamed.","d":{"t":"flow","n":["Source","Pipeline","Table","Report"]},"h":"A catalog scans sources, harvests metadata, classifies sensitive columns (SSN, health) with built-in patterns, links glossary terms, assigns owners and stewards, and captures lineage from tools like Data Factory, Spark and Power BI. Search and tagging help discovery. Policies can drive access and masking. Keep catalog quality by ownership and reviews.","y":"Enables trust, compliance and self-service.","m":"Mistake: catalog nobody maintains. Tip: tie ownership into workflows and report completeness.","k":["Data catalog | A searchable inventory of data assets with descriptions, owners and sensitivity, so people can find and trust data.","Lineage | A map of how data flows from source to report, down to column level, used for impact analysis and audits.","Automatic classification | Scanners label columns such as SSN or diagnosis code so protection policies can be applied.","Business glossary | Agreed definitions of terms such as active member, linked to the data that implements them.","Owners and stewards | The owner is accountable for a dataset; the steward looks after quality and definitions day to day."]},{"n":"Master data management","w":"Keep one trusted record of key entities.","b":["Match and merge duplicates (fuzzy matching).","Survivorship rules choose the best value.","Golden record shared with all systems.","Needs data stewards and governance."],"e":"One Member ID across enrollment, claims and billing.","d":null,"h":"MDM processes: ingest sources, standardize, match (rules and ML), merge to golden record using survivorship, and distribute back via APIs or events. Governance council defines domains (customer, provider, product). Registry style leaves data in place with cross-reference keys; consolidation style centralizes. Data stewards resolve exceptions.","y":"Without it, the same entity has different attributes in each system.","m":"Mistake: starting too big. Tip: begin with one domain and measurable duplicates reduction.","k":["Master data management | Keeping one authoritative, consistent record for core entities such as member, provider or product across systems.","Match and merge | Identify records that refer to the same real-world entity, using exact and fuzzy rules, and combine them.","Golden record | The best combined version of an entity after merging.","Survivorship rules | Rules that decide which source value wins, such as most recent or most trusted system.","Registry versus consolidation | Registry leaves data in source systems and keeps cross-references; consolidation copies it into a central hub."]},{"n":"Data quality rules, profiling, monitoring (Great Expectations, dbt tests)","w":"Bad data costs decisions and trust.","b":["Rules: not null, unique, valid range, referential integrity, freshness.","Profile data to learn its shape.","Run checks in every pipeline (dbt tests, Great Expectations).","Alert and route issues to owners."],"e":"Fail the pipeline if more than 1% of claims have no member ID.","d":null,"h":"Dimensions of quality: accuracy, completeness, validity, uniqueness, consistency, timeliness. Implement checks as code (dbt tests, Great Expectations, Deequ, DLT expectations) at ingestion and transformation. Fail or quarantine bad records, publish scorecards, and alert owners. Track incidents like production bugs and fix root causes at the source.","y":"Poor data quality destroys trust in analytics and AI.","m":"Mistake: fixing data only downstream. Tip: push validation to producers with contracts.","k":["Data quality dimensions | Completeness, validity, uniqueness, consistency, timeliness and accuracy are the standard ways to describe good data.","Profiling | Measuring nulls, patterns and distributions to learn what data looks like before writing rules.","Quality rules as code | Tests such as not null, unique or accepted values run in every pipeline using tools like dbt tests or Great Expectations.","Quarantine | Records that fail checks are set aside for review so good data continues to flow.","Fix at the source | Quality problems are cheapest to solve where data is created."]},{"n":"Data contracts and ownership (data mesh basics)","w":"Treat data as a product with an owner and a promise.","b":["Data contract: schema, meaning, quality and freshness agreed between producer and consumer.","Domain teams own their data products.","Central platform provides tools and standards (data mesh).","Version contracts like APIs."],"e":"Claims domain publishes 'claims_daily' with a freshness SLA of 6 am.","d":null,"h":"A contract includes schema, semantics, SLAs (freshness, availability), quality rules, ownership, and change policy; stored as YAML next to code and validated in CI. Data mesh principles: domain ownership, data as a product, self-serve platform, federated governance. Not every company needs full mesh, but contracts and ownership help any size.","y":"Reduces downstream breaks and finger-pointing.","m":"Mistake: central team owning all data quality. Tip: assign domain owners and measure data product usage.","k":["Data contract | A formal agreement between a data producer and its consumers on schema, meaning, quality and freshness.","Data product | A dataset treated like a product, with an owner, documentation, service levels and support.","Data mesh | An operating model where domain teams own their data products and a shared platform and governance make them interoperable.","Service levels for data | Promises such as available by 6 a.m. daily with fewer than 0.5 percent null IDs.","Schema versioning | Managed changes so consumers are not broken by surprise."]},{"n":"Access control, row and column security, masking","w":"Control who sees which data.","b":["Role-based access to datasets.","Row-level security limits rows by user.","Column-level security and dynamic masking hide fields.","Audit access."],"e":"Analysts see masked SSNs; auditors see full values.","d":null,"h":"Methods: RBAC/ABAC on tables, views for filtered access, row access policies, column masking policies (hash, partial, null), tag-based policies, and dynamic data masking in SQL. Encrypt data and manage keys. Audit queries and exports. Use separate zones for sensitive data and approval workflows for access requests. Test policies with sample users.","y":"Protects sensitive health and financial data.","m":"Mistake: copying sensitive tables into unprotected marts. Tip: propagate classification tags through lineage.","k":["Role-based access to data | Permissions granted by role to databases, tables and views.","Row-level security | A policy that filters rows per user, such as only their region or their tenant.","Column-level security and masking | Restrict sensitive columns or show masked values like the last four digits to users without rights.","Tag-based policies | Protection driven by classification tags, so tagging a column as PII applies masking everywhere.","Access auditing | Logs show who queried or exported what, supporting investigations."]},{"n":"Regulatory requirements (GDPR, HIPAA, CCPA)","w":"Know which laws apply.","b":["GDPR/CCPA: personal data rights (access, delete), consent, breach notice.","HIPAA: protects US health information; business associate agreements.","Data minimization and retention limits.","Design for deletion requests and audit."],"e":"Delete a member's data across systems on request.","d":null,"h":"GDPR: lawful basis, consent, access/erasure rights, DPO, breach notification within 72 hours, data transfers. CCPA/CPRA: consumer rights to know, delete, opt out. HIPAA: Privacy and Security Rules for PHI, minimum necessary, BAAs, audit controls, breach notification. Build processes for subject requests, data maps and retention schedules, and keep legal teams involved.","y":"Non-compliance brings heavy fines and loss of trust.","m":"Mistake: no inventory of where personal data lives. Tip: classify and map data flows early.","k":["GDPR and CCPA | Privacy laws giving people rights to access, correct and delete their data and requiring consent and breach notification.","HIPAA | US law protecting health information with rules for access, encryption, auditing and vendor agreements.","Data subject requests | A person asks to see or delete their data; you must be able to find it across all systems.","Consent and purpose limitation | Use data only for purposes the person agreed to.","Retention and deletion | Delete data when the legal or business need ends."]},{"n":"Metadata standards and glossary","w":"Shared language prevents misreports.","b":["Business glossary defines terms in plain words.","Standard metadata: owner, steward, sensitivity, refresh.","Link terms to physical columns.","Review terms regularly."],"e":"'Active member' is defined once and used everywhere.","d":null,"h":"Glossary entries: term, definition, owner, synonyms, related terms, linked assets. Metadata standards: technical (schema), business (owner, purpose), operational (refresh, quality), and security (classification). Use controlled vocabularies and reviews. Integrate with catalog and BI tools so definitions show where data is used.","y":"Shared meaning prevents conflicting reports.","m":"Mistake: glossary in a spreadsheet nobody sees. Tip: surface definitions inside tools users already use.","k":["Technical, business and operational metadata | Technical describes schema; business describes owner and purpose; operational describes refresh time and quality.","Controlled vocabulary | A fixed list of approved terms to avoid synonyms such as client and customer meaning different things.","Term-to-column mapping | Links glossary terms to physical columns so definitions appear where people work.","Certification | A badge marking datasets that have been reviewed and are trusted.","Metadata APIs | Let tools share and update metadata automatically."]}]},{"n":"BI & visualization","d":"Reporting and decision intelligence.","s":[{"n":"Power BI: semantic models, DAX, Direct Lake, row-level security","w":"Power BI is Microsoft's BI platform.","b":["Semantic model: tables, relationships, measures.","DAX is the formula language for measures.","Import vs DirectQuery vs Direct Lake modes.","Row-level security restricts data per user."],"e":"Total Claims = SUM(Claims[Amount]).","d":{"t":"flow","n":["Data sources","Semantic model","Reports","Dashboards"]},"h":"A Power BI report uses a star-schema semantic model with relationships, measures in DAX (CALCULATE, filter context, time intelligence) and hierarchies. Storage modes: Import (fast, scheduled refresh), DirectQuery (live, slower), Dual, and Direct Lake (Fabric). Row-level security uses DAX filters by user. Deploy via workspaces and pipelines; govern with sensitivity labels and certification.","y":"Dominant BI tool in Microsoft environments.","m":"Mistake: flat wide tables and many bi-directional relationships. Tip: build a clean star schema.","k":["Semantic model | The business layer of tables, relationships and calculations that reports read, defined once and reused.","Measures and DAX | A measure is a calculation evaluated in context; DAX is the formula language, and CALCULATE modifies filter context.","Import mode | Data is copied into the model; very fast but needs scheduled refresh.","DirectQuery | Queries the source at view time; always current but slower and loads the source.","Row-level security | DAX rules filter which rows each user can see."]},{"n":"Tableau: data sources, calculations, dashboards","w":"Tableau is strong for visual analysis.","b":["Connect live or with extracts.","Calculated fields and level-of-detail expressions.","Dashboards with filters and actions.","Server/Cloud for sharing and permissions."],"e":"Interactive claims dashboard with region filter.","d":null,"h":"Tableau separates data source, worksheets, dashboards and stories. Calculations include table calcs and LOD expressions (FIXED, INCLUDE, EXCLUDE). Extracts (Hyper) improve performance. Publish to Server/Cloud with projects, permissions, data sources and subscriptions. Use parameters and actions for interactivity.","y":"Strong for exploratory analytics and visualization.","m":"Mistake: dashboards with too many filters and marks. Tip: design for the main question.","k":["Data source and extract | Tableau can connect live or use an extract, a compressed local copy that is much faster.","Calculated fields | New fields defined by formulas, such as profit ratio.","Level-of-detail expressions | FIXED, INCLUDE and EXCLUDE compute at a chosen granularity regardless of the view.","Dashboards and stories | Dashboards combine sheets; stories sequence them into a narrative.","Parameters and actions | User inputs and interactions such as filtering one chart by clicking another."]},{"n":"QuickSight: SPICE, embedded analytics","w":"QuickSight is AWS's BI service.","b":["SPICE in-memory engine for speed.","Connects to Athena, Redshift, RDS, S3.","Embeddable dashboards for customers.","Pay-per-session pricing for readers."],"e":"Embed a dashboard in a customer portal.","d":null,"h":"QuickSight datasets can be SPICE (in-memory) or direct query. Features: ML insights, Q natural language, calculated fields, row-level security with rules datasets, embedding with registered users or anonymous (capacity pricing), and SPICE refresh schedules. Authors, Readers and Admins roles with session pricing.","y":"Cost-effective AWS-native BI.","m":"Mistake: exceeding SPICE capacity unexpectedly. Tip: monitor usage and prune datasets.","k":["SPICE | QuickSight's in-memory engine that makes dashboards fast and offloads the source.","Datasets | Prepared data with calculated fields, either imported to SPICE or queried directly.","Analysis and dashboard | An analysis is the authoring workspace; a dashboard is the published read-only version.","Author and reader roles | Authors build; readers view and are often billed per session.","Embedding and row-level rules | Show dashboards in your app and restrict rows by user."]},{"n":"Dimensional modeling for BI","w":"Good reporting needs good data models.","b":["Facts and dimensions with a clear grain.","Conformed dimensions shared across facts.","Avoid many-to-many where possible.","Pre-aggregate heavy measures."],"e":"A shared Date dimension across all fact tables.","d":null,"h":"Design: declare grain, identify facts (additive measures) and dimensions, use surrogate keys, conformed dimensions across subject areas, role-playing dimensions (order date, ship date), and type 2 history where needed. Create aggregate tables for performance. Document definitions and business rules. Test numbers against source of truth.","y":"Consistent definitions across reports.","m":"Mistake: many-to-many relationships unmanaged. Tip: use bridge tables carefully.","k":["Star schema | A central fact table surrounded by dimension tables; simple, fast and what BI tools expect.","Conformed dimensions | A shared dimension such as Date or Member used by several facts so numbers line up across reports.","Role-playing dimensions | One dimension used in several roles, such as order date and ship date.","Surrogate keys | Artificial identifiers independent of source system keys.","Aggregate tables | Pre-summarized data used to speed up common queries."]},{"n":"Dashboard design and self-service governance","w":"Dashboards should answer questions quickly.","b":["Start from the question, not the data.","Show key numbers first, details on demand.","Consistent colors and labels.","Govern: certified datasets, owners, naming, workspaces."],"e":"One-page executive scorecard with five KPIs.","d":null,"h":"Dashboard principles: audience and decision first, KPIs at top, trend and comparison context, minimal chart types, consistent colors, readable labels, filters that matter, mobile layouts. Governance: certified vs personal content, naming conventions, workspace roles, lifecycle and deprecation, usage monitoring, and training.","y":"Self-service without governance produces many conflicting numbers.","m":"Mistake: 40 visuals on one page. Tip: one page per question.","k":["KPI | A key performance indicator tied to a goal, shown with target and trend.","Drill-through | Navigating from a summary to the detailed records behind it.","Certified datasets | Reviewed and trusted datasets that people are told to reuse.","Self-service governance | Freedom to build within guardrails such as naming, ownership and workspace roles.","Usage metrics | Show which reports are used so unused content can be retired."]},{"n":"Embedding analytics in applications","w":"Analytics inside products need extra care.","b":["Authenticate users and isolate tenants.","Use row-level security with tenant ID.","Check performance with many users.","Match styling to your product."],"e":"Each customer sees only their own claims.","d":null,"h":"Embedding options: 'app owns data' for customers using service principals and embed tokens; 'user owns data' for internal users. Multi-tenant approaches: separate workspaces, shared model with RLS keyed by tenant. Consider capacity sizing, caching, theming, and monitoring performance. For simple charts, libraries like ECharts are an alternative.","y":"Analytics inside products adds value to customers.","m":"Mistake: weak tenant isolation. Tip: test RLS thoroughly with automated tests.","k":["App-owns-data embedding | External customers view embedded content using a service principal and embed tokens, with no individual licenses.","User-owns-data embedding | Internal users sign in with their own accounts to see embedded content.","Embed tokens | Short-lived tokens granting access to specific content.","Tenant isolation | Each customer must see only their own data, enforced with row-level security keyed by tenant ID.","Capacity sizing | Plan compute for peak concurrent users."]},{"n":"Performance optimization","w":"Slow reports lose users.","b":["Reduce rows and columns; filter early.","Aggregate in the warehouse.","Use incremental refresh.","Avoid too many visuals per page.","Test with production volumes."],"e":"Moving a calculation to SQL cut load from 30 s to 3 s.","d":null,"h":"Diagnostics: Performance Analyzer (Power BI), query logs, execution plans. Fixes: reduce cardinality, remove unused columns, aggregate, push logic to the source, use incremental refresh, optimize DAX (avoid iterators on large tables), limit visuals and use bookmarks or drill-through. Test with production-scale data and concurrency.","y":"User adoption depends on speed.","m":"Mistake: loading raw detail when summary is enough. Tip: design aggregations for most views.","k":["Performance Analyzer | Times each visual and query so you can find what makes a page slow.","Incremental refresh | Refreshes only new or changed partitions of large tables.","Aggregations | Summary tables the engine uses automatically for common queries.","Query folding | Pushing data transformations back to the source database.","Reducing visuals and cardinality | Fewer visuals per page and fewer unique values improve speed."]}]},{"n":"ML data architecture","d":"Pipelines and serving for ML.","s":[{"n":"Feature engineering and feature stores (Feast, Databricks, SageMaker)","w":"Features are the model's inputs. Managing them well avoids mismatch.","b":["Feature store: central, versioned features.","Offline store for training, online store for low-latency serving.","Same definitions in training and serving.","Examples: Feast, Databricks, SageMaker Feature Store."],"e":"avg_claim_amount_12m is computed once and reused.","d":{"t":"flow","n":["Raw data","Feature pipelines","Feature store","Training and serving"]},"h":"Feature store provides feature definitions as code, offline store (data lake/warehouse) for training with point-in-time correct joins, online store (Redis/DynamoDB) for low-latency serving, and a registry. Prevents training-serving skew by sharing logic. Features have owners, documentation and monitoring. Materialization jobs keep online store fresh.","y":"Reuse across models and consistent predictions.","m":"Mistake: data leakage by using future data in training features. Tip: use point-in-time joins.","k":["Feature | A measurable input to a model, such as average claim amount in the last 12 months.","Feature store | A central, versioned catalog of feature definitions with offline storage for training and online storage for serving.","Training-serving skew | Features computed differently in training and production, which silently reduces accuracy.","Point-in-time correctness | Training data must use feature values as they were at each event time, not later values.","Data leakage | Using information that would not be available at prediction time, which makes tests look better than reality."]},{"n":"Training vs inference pipelines","w":"Training learns; inference predicts.","b":["Training: batch, heavy compute, historical data.","Inference: uses a fixed model on new data.","Keep preprocessing identical in both.","Version data, code and parameters for reproducibility."],"e":"Nightly training job, real-time inference API.","d":{"t":"flow","n":["Data","Train","Model","Deploy","Predict"]},"h":"Training: reads historical data, splits train/validation/test, tunes hyperparameters, tracks experiments, saves artifacts. Inference: loads model, applies the same preprocessing, returns predictions. Packaging as containers or model formats (ONNX). Reproducibility needs fixed versions of data, code, libraries and seeds. Keep separate environments and access control.","y":"Clear separation helps scale and govern ML.","m":"Mistake: different preprocessing code in training and serving. Tip: package preprocessing with the model.","k":["Training, validation and test data | Learn from training data, tune choices on validation data and estimate final performance on test data kept untouched.","Hyperparameters | Settings chosen before training, such as tree depth or learning rate.","Experiment tracking | Record data version, code, parameters and results for every run so results can be reproduced.","Inference | Using a trained model to make predictions.","Reproducibility | The ability to rebuild the same model from the same data, code and settings."]},{"n":"Model registry and versioning (MLflow)","w":"A registry tracks models like software releases.","b":["Stores model, version, metrics, data and code reference.","Stages: staging, production, archived.","Supports approval and rollback.","MLflow, SageMaker and Azure ML provide registries."],"e":"Promote model v7 after validation, roll back to v6 if needed.","d":null,"h":"Registry entries have model name, version, run link, metrics, signature (input/output schema), tags and stage/alias. Approvals require validation tests (performance, bias, security scan). CI/CD deploys from registry. Rollback by promoting the earlier version. Link to model cards documenting intended use and limitations.","y":"Auditability and safe releases for ML.","m":"Mistake: models stored on laptops or buckets with no metadata. Tip: always register and tag.","k":["Model registry | A catalog of model versions with metrics, lineage and stage so teams know what is deployed.","Stages and aliases | Labels such as staging, production or champion that point to versions.","Model signature | The expected input and output schema, used to validate calls.","Model card | Documentation of intended use, training data, performance and limitations.","Approval and rollback | Models are reviewed before promotion, and the previous version can be restored quickly."]},{"n":"Batch vs online serving","w":"Choose how predictions are delivered.","b":["Batch: score many records on schedule (nightly risk scores).","Online: API answers in milliseconds.","Streaming: score events as they arrive.","Online needs scaling, caching and fallbacks."],"e":"Score claims daily in batch, but fraud checks on submission online.","d":{"t":"vs","lt":"Batch","l":["Scheduled","Cheap","Latency hours"],"rt":"Online","r":["Per request","Needs scaling","Milliseconds"]},"h":"Batch scoring writes predictions to tables for BI or downstream systems; cheap and simple. Real-time endpoints serve with autoscaling, low latency, caching of features and fallbacks; use A/B or shadow deployments. Streaming scoring processes events as they come. Consider cost per prediction, latency SLOs and traffic patterns.","y":"Matches business needs and cost.","m":"Mistake: building real-time serving when nightly batch suffices. Tip: ask how quickly someone acts on the prediction.","k":["Batch inference | Scores large datasets on a schedule and stores results; cheap and simple, suited to nightly risk scores.","Real-time endpoint | An API returning predictions in milliseconds, needing autoscaling and low-latency features.","Streaming inference | Scores events as they flow through a stream.","Latency SLO | The maximum response time promised for online predictions.","Shadow and canary deployment | Run a new model on live traffic without affecting users, or on a small share, before full rollout."]},{"n":"Data drift and model monitoring","w":"Models degrade as the world changes.","b":["Data drift: inputs change.","Concept drift: relationships change.","Monitor input stats, prediction distribution and accuracy.","Alert and retrain on thresholds."],"e":"Cost trends change after a policy change, so the forecast model is retrained.","d":null,"h":"Monitor: input feature distribution (PSI, KS test), missing values, prediction distribution, outcomes when available (accuracy, calibration), fairness metrics across groups, latency and errors. Define thresholds and alerting, trigger retraining pipelines or fallbacks. Keep a champion/challenger setup.","y":"Models silently degrade; monitoring protects decisions.","m":"Mistake: monitoring only system health, not model quality. Tip: capture ground truth for feedback.","k":["Data drift | The distribution of input features shifts away from what the model was trained on.","Concept drift | The relationship between inputs and outcome changes, for example after a policy change.","Drift statistics | PSI and the KS test quantify how much a distribution has changed.","Ground truth lag | Actual outcomes may arrive weeks later, so quality monitoring is delayed.","Retraining triggers | Rules such as drift above a threshold or accuracy below target start retraining."]},{"n":"Classification and forecasting use cases","w":"Start with the business decision.","b":["Classification: put items into categories (fraud or not).","Forecasting: predict numbers over time (claims next month).","Define success metric and cost of errors.","Keep a simple baseline to beat."],"e":"Forecast monthly claim cost to set reserves.","d":null,"h":"Classification examples: fraud detection, claim triage, churn. Metrics: precision/recall, AUC. Forecasting examples: claims volume, cost trends, demand; methods: ARIMA/ETS, Prophet, gradient boosting, deep learning; evaluate with backtesting and MAPE. Always compare to a simple baseline and quantify business value, then plan how predictions change a decision.","y":"Models must change decisions to create value.","m":"Mistake: optimizing accuracy when error costs are asymmetric. Tip: choose metrics from business costs.","k":["Classification | Predicts a category, such as fraud or not fraud.","Forecasting | Predicts a number over time, such as next month's claim volume.","Baseline model | A simple method that any new model must beat to be worth deploying.","Precision and recall | Precision is correctness among positive predictions; recall is how many real positives were found.","Decision value | The measurable benefit of acting on a prediction, the real measure of success."]},{"n":"MLOps CI/CD for models","w":"Apply DevOps ideas to ML.","b":["Automated tests for data and code.","Reproducible training pipelines.","Controlled promotion with approvals.","Monitoring and automated retraining where safe."],"e":"Pipeline retrains weekly and promotes only if metrics improve.","d":{"t":"flow","n":["Commit","Test","Train","Evaluate","Register","Deploy","Monitor"]},"h":"MLOps stages: data validation, feature pipelines, training pipeline in orchestrator, evaluation gates, registry, deployment (canary/shadow), monitoring, retraining triggers. Infrastructure as code for environments, automated tests (data tests, unit tests, model tests), and approvals. Tools: Azure ML pipelines, SageMaker Pipelines, Kubeflow, MLflow, GitHub Actions.","y":"Makes ML repeatable and safe at scale.","m":"Mistake: manual notebooks run by one person. Tip: move successful experiments to pipelines early.","k":["MLOps | Applying DevOps practices to machine learning: automation, testing, versioning and monitoring.","ML pipeline | Automated steps from data validation and feature creation to training, evaluation and registration.","Evaluation gates | Metrics must meet thresholds before a model can be promoted.","CI/CD for models | Tests and automated deployment for code, data pipelines and models.","Production monitoring | Track input quality, prediction quality, latency and cost."]}]}]},{"p":"Phase 7 - AI/ML & Generative AI (Weeks 23-30)","why":"Why: the most differentiating skill set across these descriptions.","t":[{"n":"AI/ML platforms","d":"Managed AI services.","s":[{"n":"Amazon Bedrock: models, knowledge bases, agents, guardrails","w":"Bedrock is AWS's managed gateway to foundation models.","b":["One API for models from several providers.","Knowledge Bases: managed RAG over your documents.","Agents: models that plan and call tools.","Guardrails: filters for topics, PII and harmful content.","Your prompts and data are not used to train the base models."],"e":"Ask a Claude model on Bedrock to answer from a knowledge base of policy documents.","d":{"t":"hub","c":"Bedrock","n":["Models","Knowledge Bases","Agents","Guardrails"]},"h":"With Bedrock you call InvokeModel or the Converse API with a model ID, so you can swap models easily. Knowledge Bases ingest documents from S3, chunk, embed and store in a vector store (OpenSearch Serverless, Aurora pgvector), then retrieve for RAG. Agents use action groups (Lambda or APIs) and a knowledge base to complete tasks. Guardrails add content filters, denied topics, word filters, PII redaction and contextual grounding checks. Model access is enabled per account and region.","y":"Gives quick, governed access to generative AI within AWS security boundaries.","m":"Mistake: forgetting to request model access or regional availability. Tip: pilot with Converse API and Guardrails from the start.","k":["Foundation model | A very large pretrained model for text, images or code that is adapted to many tasks by prompting, instead of training a model from scratch for each task.","Converse API | Bedrock's single chat interface; because every model uses the same request shape, switching models needs little code change.","Knowledge Bases | Managed retrieval-augmented generation: Bedrock reads documents from S3, splits and embeds them, stores vectors and retrieves relevant text for each question.","Agents | A model that plans steps, decides which tool to call and uses knowledge bases to complete a task; tools are defined as action groups backed by Lambda or APIs.","Guardrails and model access | Guardrails filter topics, harmful content and PII on inputs and outputs; models must be enabled per account and region before use."]},{"n":"SageMaker: training, endpoints, pipelines, Studio","w":"SageMaker covers the full ML lifecycle on AWS.","b":["Studio: workspace and notebooks.","Training jobs on managed compute; spot instances cut cost.","Pipelines for repeatable workflows.","Endpoints: real-time, serverless or batch inference.","Model registry and monitoring."],"e":"Train a forecast model nightly and deploy to a serverless endpoint.","d":{"t":"flow","n":["Data in S3","Training job","Model registry","Endpoint","Monitor"]},"h":"Main pieces: Studio/Unified Studio, Processing jobs, Training jobs (built-in algorithms, frameworks, distributed training, managed spot), Experiments, Model Registry, Pipelines, Endpoints (real-time, serverless, async, batch transform), Model Monitor and Clarify (bias and explainability), JumpStart for pretrained models. Use IAM roles and VPC configuration to isolate.","y":"Broad platform for custom ML on AWS.","m":"Mistake: leaving endpoints running idle. Tip: use serverless or async endpoints for spiky traffic and set autoscaling.","k":["Studio and notebooks | The web workspace for exploring data, writing code and tracking experiments.","Training jobs | Managed runs that provision compute, train a model and save the artifact; managed spot training can cut cost by up to about 90 percent with checkpoints.","Endpoints | Real-time endpoints serve low-latency traffic, serverless endpoints scale to zero for spiky use, and asynchronous endpoints queue long requests.","Pipelines and registry | Pipelines orchestrate processing, training and evaluation; the model registry versions and approves models.","Model Monitor and Clarify | Monitor detects data and quality drift in deployed models; Clarify measures bias and explains predictions."]},{"n":"Azure Machine Learning: workspaces, pipelines, endpoints","w":"Azure ML is Microsoft's ML platform.","b":["Workspace holds data, compute, models and endpoints.","Designer, notebooks and SDK/CLI for building.","Pipelines and components for repeatability.","Managed online and batch endpoints.","Integrates with Entra ID and Key Vault."],"e":"Deploy a model to a managed online endpoint with blue/green traffic.","d":null,"h":"Workspace is the top-level resource with associated storage, Key Vault, container registry and Application Insights. Compute: instances, clusters, serverless. Assets: data, environments, models, components. Jobs run training with MLflow tracking; pipelines chain components; managed online endpoints support blue/green traffic split. Responsible AI dashboard offers explainability and fairness.","y":"Azure's main platform for custom ML.","m":"Mistake: sharing one workspace for all environments. Tip: separate dev, test and prod with proper RBAC and private networking.","k":["Workspace | The top-level Azure ML resource that ties together storage, container registry, Key Vault and monitoring for a team.","Compute | Compute instances are personal dev machines; compute clusters autoscale for training, including to zero.","Jobs and components | A job is a tracked run; components are reusable steps with typed inputs and outputs for building pipelines.","Managed online endpoints | Deploy models for real-time scoring with blue/green traffic splitting and autoscaling.","Batch endpoints | Score large datasets asynchronously and write results to storage."]},{"n":"Azure AI Services (language, vision, speech, document intelligence)","w":"Prebuilt AI APIs solve common problems without training models.","b":["Language: sentiment, entities, summarization.","Vision: image analysis, OCR.","Speech: transcription, synthesis.","Document Intelligence: extract fields from forms and PDFs.","Customize with your labeled data when needed."],"e":"Extract claim amount and dates from scanned forms with Document Intelligence.","d":null,"h":"Azure AI Language (sentiment, NER, PII detection, summarization, custom classification), Vision (image analysis, OCR), Speech (speech to text, text to speech, translation), Document Intelligence (prebuilt invoice/ID/receipt and custom models, layout extraction), Translator, and AI Search. Access with keys or Entra ID; deploy in containers for disconnected needs. Use private endpoints.","y":"Fast path to value without training models.","m":"Mistake: sending sensitive documents without checking data handling terms. Tip: review data residency and retention settings.","k":["Language service | Sentiment, key phrase and entity extraction, PII detection, summarization and custom text classification as simple API calls.","Vision | Image analysis, object detection and OCR for reading text in images.","Speech | Speech-to-text, text-to-speech and real-time translation.","Document Intelligence | Extracts text, tables and named fields from invoices, forms and IDs, with prebuilt and custom models.","Private access | Use private endpoints or containers when data must stay in your network."]},{"n":"Azure AI Foundry and prompt flow","w":"Foundry is the hub for building generative AI apps on Azure.","b":["Model catalog: OpenAI, open-weight and partner models.","Playground for quick tests.","Prompt flow: build and evaluate LLM workflows.","Evaluations, safety tools and deployment."],"e":"Compare two models on your test questions in Foundry.","d":null,"h":"Foundry (formerly AI Studio) offers a project workspace, model catalog with deployment types (serverless API, managed compute), playground, agent service, evaluation tools (groundedness, relevance, safety), tracing, content safety and prompt flow for orchestration. Connect AI Search and data sources for RAG. Use hubs to share connections and governance across projects.","y":"One place to build, evaluate and operate generative AI solutions.","m":"Mistake: building directly in playgrounds without versioning. Tip: move flows to code repos with CI/CD.","k":["Foundry project | A workspace for an AI application bringing together models, data connections, prompts and evaluations.","Model catalog | A directory of OpenAI, Meta, Mistral and other models that you can deploy from one place.","Deployment types | Serverless per-token billing, managed compute you size yourself, or provisioned throughput for predictable latency.","Prompt flow | A tool to design, test and evaluate multi-step LLM workflows visually and as code.","Evaluation and tracing | Built-in metrics such as groundedness and relevance, and traces of each model call for debugging."]},{"n":"AI-102 exam objectives","w":"AI-102 certifies building Azure AI solutions.","b":["Plan and manage AI solutions.","Computer vision and NLP.","Document intelligence and knowledge mining (AI Search).","Generative AI with Azure OpenAI and agents.","Study the Learn path and do labs."],"e":"Build a small RAG app with Azure OpenAI and AI Search as practice.","d":null,"h":"Skills measured: plan and manage Azure AI solutions (security, monitoring, deployment, responsible AI), implement generative AI solutions, agents, computer vision, natural language processing, knowledge mining and information extraction. Exam includes case studies and code snippets (C#/Python). Use Microsoft Learn labs, official practice assessment and build small apps.","y":"Validates practical skill with Azure AI.","m":"Mistake: memorizing without building. Tip: complete at least two end-to-end labs (RAG with AI Search; Document Intelligence pipeline).","k":["Skills measured | Microsoft's official list of exam topics with percentage weights; check it before you start studying because it changes.","Case studies | Scenario questions where you choose designs and trade-offs, not just recall facts.","Labs | Hands-on work such as creating a search index; build your own apps to practice.","RAG | Retrieval-augmented generation grounds a model's answers in your data; a core exam theme.","Responsible AI | Content safety, fairness and transparency tasks are tested, not only features."]},{"n":"Cost, quota and region considerations","w":"AI services have unique limits and bills.","b":["Billing by tokens, calls or hours.","Quotas per model, region and subscription; request early.","Not every model is in every region.","Track cost per feature; set budgets."],"e":"Choose a region that has your model and meets data rules.","d":null,"h":"Check: model availability by region, quotas (TPM/RPM), provisioned throughput vs pay-as-you-go, costs of embeddings, storage and search tiers, network egress, and content safety usage. Plan quota requests early and implement retries on 429. Track cost per request and set budgets and alerts. Consider data residency rules for region choice.","y":"Surprises here delay launches or exceed budgets.","m":"Mistake: designing without checking quota for expected load. Tip: do a capacity estimate in tokens per minute before launch.","k":["TPM and RPM | Tokens per minute and requests per minute are the quota limits of a model deployment; exceed them and you get HTTP 429 errors.","Pay-as-you-go versus provisioned | Shared capacity billed per token versus reserved capacity with predictable latency and a fixed cost.","Regional availability | Not every model is offered in every region, which affects design and data residency.","Retries and backoff | Handle throttling with exponential backoff, and consider multiple deployments or regions for scale.","Cost tracking | Monitor tokens per feature and set budgets and alerts."]}]},{"n":"Classical NLP","d":"Text understanding fundamentals.","s":[{"n":"Tokenization and text preprocessing","w":"Models need text as units they can process.","b":["Tokenization splits text into tokens (words or word pieces).","Classic cleaning: lowercase, remove noise, stemming.","LLMs need little cleaning but have token limits.","Token count affects cost and context."],"e":"'Underwriting' may be split into 'under' + 'writing'.","d":null,"h":"Tokenizers split text into tokens: words, sub-words (BPE, WordPiece) or characters. Classic NLP cleaned text with lowercasing, stop-word removal, stemming or lemmatization. Modern transformer models use their own tokenizers and need minimal cleaning, but handling whitespace, encodings and special characters matters. Token counts determine cost and context limits (roughly 1 token = 4 characters in English).","y":"Foundation for all text work and cost estimation.","m":"Mistake: ignoring token limits when passing long text. Tip: count tokens with the model's tokenizer and chunk accordingly.","k":["Token | The unit of text a model processes: a word, part of a word or punctuation. In English one token is about four characters, so 1,000 tokens is roughly 750 words.","Subword tokenization | Methods such as BPE and WordPiece split rare words into pieces so any word can be represented.","Stemming and lemmatization | Classic ways to reduce words to a base form (running to run); lemmatization uses vocabulary and is more accurate.","Context window | The maximum number of tokens a model can read and write in one request.","Normalization | Cleaning text, such as fixing unicode and whitespace, before processing."]},{"n":"Named entity recognition (spaCy, Comprehend, Azure Language)","w":"NER finds important items in text.","b":["Types: person, organization, location, date, amount; custom types too.","Tools: spaCy, Amazon Comprehend, Azure Language.","Use prebuilt models first, custom when needed.","Output: spans with labels and confidence."],"e":"Find policy number, diagnosis and provider in a claim note.","d":{"t":"flow","n":["Text","NER model","Entities with labels"]},"h":"NER labels spans (PERSON, ORG, DATE, MONEY, custom). Approaches: rules/dictionaries, statistical models (CRF), transformers (BERT-based), or LLM prompts with JSON output. Services: Comprehend, Azure AI Language, spaCy models. Evaluate with entity-level precision/recall and handle overlaps, abbreviations and context. Post-process with validation (regex for IDs, checksum).","y":"Turns unstructured documents into structured data.","m":"Mistake: relying on generic models for domain terms. Tip: pilot, label errors, and consider custom models.","k":["Entity and span | An entity is a named item in text such as a person, organization, date or amount; a span records where it starts and ends.","Label set | The entity types a model can recognize, either built-in or custom for your domain.","Confidence score | How sure the model is about each entity; low scores can be routed to a person.","Custom entities | Domain types such as policy number, diagnosis code or attachment point, trained from labeled examples.","Post-processing | Validate and standardize extracted values, for example check a policy number format."]},{"n":"Text classification and sentiment","w":"Classification and sentiment tag text.","b":["Classification: assign categories (claim type, urgency).","Sentiment: positive, neutral, negative.","Start with a labeled sample and baseline.","LLMs can classify with a good prompt and examples."],"e":"Route emails to billing, claims or enrollment.","d":null,"h":"Pipelines: label data, split train/test, extract features (TF-IDF or embeddings), train classifier (logistic regression, gradient boosting, fine-tuned transformer) or use zero/few-shot LLM prompting with a label set. Multi-label vs multi-class; handle imbalance. Sentiment can be rule-based, ML or LLM-based. Monitor drift and review low-confidence cases with humans.","y":"Triage and routing of documents and messages.","m":"Mistake: no human review path. Tip: threshold on confidence and route uncertain items to people.","k":["Multi-class versus multi-label | One label per item (claim type) versus several labels allowed (topics in an email).","Zero-shot and few-shot classification | The model classifies with only label descriptions, or with a few examples provided in the prompt.","Class imbalance | Some classes are rare, so accuracy is misleading; use class weights, resampling and recall or F1.","Confidence thresholds and humans in the loop | Low-confidence items go to reviewers, whose corrections improve the model.","Sentiment | Classifies tone as positive, neutral or negative, sometimes with a score."]},{"n":"Embeddings and semantic similarity","w":"Embeddings capture meaning as numbers.","b":["Text becomes a vector (for example 1536 numbers).","Similar meaning gives nearby vectors.","Cosine similarity compares them.","Foundation of semantic search, clustering and RAG."],"e":"'car crash' and 'vehicle accident' are close in embedding space.","d":{"t":"flow","n":["Text","Embedding model","Vector","Nearest neighbors"]},"h":"Embedding models map text into dense vectors (for example 1536 dimensions). Cosine similarity or dot product measure closeness. Used for semantic search, deduplication, clustering, recommendations, classification features and RAG. Different models vary in language coverage, context length and quality; evaluate on your data. Normalize vectors if required by the index.","y":"Enables meaning-based search beyond keywords.","m":"Mistake: mixing embeddings from different models in the same index. Tip: version embeddings and re-index fully when changing models.","k":["Embedding | A vector of numbers representing meaning, so texts about the same thing end up close together.","Dimensions | The length of the vector, such as 768 or 1536; larger can capture more nuance but costs storage and time.","Cosine similarity | A measure of how close two vectors are by angle, used to rank results.","Semantic search | Finds results by meaning even when words differ, such as car crash versus vehicle accident.","Re-embedding on model change | Vectors from different models are not comparable, so a model change means embedding everything again."]},{"n":"Summarization and extraction","w":"Turn long text into short or structured form.","b":["Summarization: abstractive (new words) or extractive (selected sentences).","Extraction: pull fields into JSON.","Ask for a strict format and validate the result.","Check for omissions and invented facts."],"e":"Summarize a 20-page claim file into 5 bullet points with fields.","d":null,"h":"Extractive summaries select key sentences; abstractive generate new text. Use map-reduce or hierarchical summarization for long documents. For extraction, specify schema with JSON Schema/function calling, include field definitions and examples, and set temperature low. Validate output against schema and business rules; request evidence quotes to reduce hallucination.","y":"Automates reading of long documents and forms.","m":"Mistake: trusting extracted numbers without validation. Tip: cross-check totals and flag low-confidence fields.","k":["Extractive versus abstractive summaries | Extractive picks important existing sentences; abstractive writes new sentences that capture meaning.","Map-reduce summarization | Summarize each chunk, then summarize the summaries, for documents longer than the context window.","Structured output | Ask for JSON matching a schema so code can use the result reliably.","Function calling | The model returns function arguments in a defined structure, a robust way to extract fields.","Evidence quotes | Ask the model to quote the source text for each extracted field so you can verify it."]},{"n":"Evaluating NLP models (precision, recall, F1)","w":"Measure model quality with the right metric.","b":["Precision: of predicted positives, how many were right.","Recall: of real positives, how many were found.","F1 balances both.","Use a confusion matrix; pick metric by cost of errors."],"e":"Missing a fraud case (low recall) is worse than a false alarm.","d":null,"h":"Confusion matrix: TP, FP, FN, TN. Precision = TP/(TP+FP); recall = TP/(TP+FN); F1 = harmonic mean. For NER use entity-level metrics. For summaries use ROUGE or LLM-based judges plus human review. Evaluate on a representative test set separate from training, and slice by document type to find weak spots. Track metrics over time.","y":"Without measurement you cannot improve or prove value.","m":"Mistake: reporting accuracy on imbalanced data. Tip: choose metrics aligned with business risk.","k":["Confusion matrix | A table of true positives, false positives, false negatives and true negatives that all metrics come from.","Precision | Of the items the model flagged, how many were right; important when false alarms are costly.","Recall | Of all real positives, how many were found; important when missing cases is costly, such as fraud.","F1 score | A single number balancing precision and recall.","Held-out test set | Data never used for training or tuning, giving an honest estimate."]},{"n":"Custom entity models for insurance and claims documents","w":"Domain terms need domain training.","b":["Collect representative documents.","Label entities (policy IDs, attachment points, CPT codes).","Train or fine-tune and measure on held-out data.","Protect PII during labeling."],"e":"Custom entity: 'ATTACHMENT_POINT' extracted from contracts.","d":null,"h":"Steps: sample documents, define entity types and guidelines, label with a tool (Label Studio, Azure Language Studio) with at least two annotators for quality, train/fine-tune, evaluate, deploy, and set up feedback loops. Mask or protect PII/PHI during labeling. Domain examples: policy number, attachment point, effective date, diagnosis code.","y":"Domain-specific accuracy needs domain data.","m":"Mistake: too little or inconsistent labeled data. Tip: write labeling guidelines and measure inter-annotator agreement.","k":["Annotation guidelines | Written rules so every labeler decides the same way on edge cases.","Inter-annotator agreement | How often independent labelers agree; low agreement means unclear rules or a hard task.","Active learning | Prioritize labeling the examples the model is least sure about for faster improvement.","Fine-tuning | Adapting a pretrained model with your labeled data to learn domain language.","PII handling | Mask or restrict sensitive data while labeling."]}]},{"n":"LLM providers","d":"Model selection and access.","s":[{"n":"Azure OpenAI deployments, quotas, content filters","w":"Azure OpenAI offers OpenAI models inside Azure.","b":["Create a resource, then deployments per model.","Quota is in tokens per minute per deployment.","Built-in content filters.","Private networking, managed identity and regional control."],"e":"Deployment gpt-4o with 100K TPM in one region.","d":null,"h":"Create an Azure OpenAI resource, deploy models (chat, embeddings, image) with deployment names and capacity type (standard, provisioned throughput units, batch). Content filters apply by default with configurable severities. Use Entra ID auth and private endpoints; enable abuse monitoring settings per policy. Quota is per region per model; use multiple deployments or regions with a gateway for scale.","y":"Enterprise-ready access to OpenAI models.","m":"Mistake: hardcoding API keys. Tip: use managed identity and Key Vault.","k":["Deployment | In Azure OpenAI you create a named deployment of a model; your code calls the deployment, not the model name.","TPM quota | The tokens per minute allocated to a deployment, which sets throughput; exceeding it returns 429 errors.","Deployment types | Standard shares capacity and bills per token, provisioned reserves capacity for predictable latency, batch gives discounted asynchronous processing.","Content filters | Built-in classifiers that block harmful input and output, with configurable severity.","Entra ID and private endpoints | Keyless authentication and private network access for enterprise security."]},{"n":"Google Gemini and Vertex AI","w":"Gemini is Google's model family on Vertex AI.","b":["Strong multimodal input (text, image, audio, video).","Very long context windows.","Access via Vertex AI with Google Cloud IAM.","Compare quality, cost and latency for your task."],"e":"Analyze a long PDF plus images in one request.","d":null,"h":"Gemini models support text, image, audio and video input and very long context windows. Access through Vertex AI (enterprise controls, IAM, VPC Service Controls) or the Gemini API. Features include grounding with Google Search, function calling, context caching and batch. Evaluate for tasks involving long documents or multimedia.","y":"Alternative provider and multi-cloud option.","m":"Mistake: sending data without checking regional processing. Tip: confirm data residency and terms.","k":["Gemini | Google's multimodal model family that accepts text, images, audio and video and supports very long inputs.","Vertex AI | Google Cloud's managed AI platform with IAM, logging and enterprise controls.","Context caching | Store a large repeated prompt prefix at lower cost for repeated questions over the same documents.","Grounding | Tie answers to Google Search or your own data to reduce invented facts.","Data boundaries | VPC Service Controls and regional endpoints help keep data inside agreed limits."]},{"n":"Open-weight models (Llama, Mistral, Phi) in Azure AI Foundry","w":"Open-weight models can be hosted by you.","b":["Examples: Llama, Mistral, Phi.","Pros: control, privacy, no per-token fees at scale, fine-tuning.","Cons: you run infrastructure; quality may trail top models.","Foundry catalog offers managed hosting options."],"e":"Use a small model for classification to cut cost.","d":{"t":"vs","lt":"Proprietary API","l":["Best quality","No hosting","Per token cost"],"rt":"Open-weight","r":["Control + privacy","You host it","Lower unit cost at scale"]},"h":"Open-weight models can run on your GPUs, managed endpoints or serverless APIs. Options: Llama, Mistral, Phi, Qwen, DeepSeek. Considerations: license terms, size (7B to 70B+), quantization to reduce memory, serving frameworks (vLLM, TGI), fine-tuning (LoRA), safety tooling, and performance benchmarks on your tasks. Smaller models often suffice for classification and extraction.","y":"Control, privacy and cost advantages for some workloads.","m":"Mistake: underestimating the operations cost of self-hosting. Tip: start with managed hosting.","k":["Open-weight model | A model whose trained weights can be downloaded and run by you, such as Llama, Mistral or Phi.","Open source versus open weight | Open source includes code and data under an open license; open weight shares weights, often with usage restrictions, so read the license.","Quantization | Storing weights with fewer bits (for example 4-bit) to save memory and cost with a small quality loss.","LoRA | Fine-tunes small adapter layers instead of all weights, making customization cheap.","Hosting options | Run yourself with vLLM or TGI, or use managed hosting so you avoid GPU operations."]},{"n":"Prompt engineering and structured outputs","w":"Prompts are the instructions for the model.","b":["Include role, task, context, format and examples.","Ask for structured JSON via schema.","Use system prompts for rules and user prompts for input.","Test on many cases, not one."],"e":"Return {\"category\":..., \"confidence\":...} for each email.","d":null,"h":"Prompt anatomy: system message (role, rules, tone), context (documents), examples (few-shot), user task, and output format. Techniques: clear instructions, delimiters, step-by-step reasoning when helpful, constraints, and negative examples. Use structured outputs with JSON Schema so responses parse reliably. Store prompts as versioned assets and test with an evaluation set.","y":"Prompt quality drives results and cost.","m":"Mistake: vague prompts and testing on few examples. Tip: build a regression test set.","k":["System prompt | Standing instructions that set the model's role, rules and tone for the whole conversation.","Few-shot examples | Sample inputs and outputs in the prompt that teach the format and style you want.","Chain of thought | Asking the model to reason step by step can improve complex answers.","Structured outputs | Forcing JSON that matches a schema makes responses reliable for code.","Temperature | Controls randomness; use low values for factual or extraction tasks."]},{"n":"Function and tool calling","w":"Tool calling lets the model use your systems.","b":["You describe functions with names and JSON schemas.","The model returns which function to call and arguments.","Your code runs it and returns the result.","Validate arguments and permissions."],"e":"get_policy(policy_id) called by the assistant.","d":{"t":"flow","n":["User question","Model picks tool","Your code runs it","Model answers with result"]},"h":"Define tools with JSON schema; send them to the model with the user message. The model returns a tool call with arguments; your code validates and executes it, then sends the result back for the model to produce the final answer. Handle parallel calls, errors and timeouts. Apply authorization in your function, not in the prompt. Limit tools to those needed.","y":"Lets LLMs act on real systems safely.","m":"Mistake: giving a tool broad powers like 'run any SQL'. Tip: expose narrow, validated operations.","k":["Tool definition | The name, description and JSON schema of a function the model may call; good descriptions improve tool choice.","Tool call | The model returns which function to run and with what arguments; your code runs it.","Argument validation | Never trust arguments blindly; validate types, ranges and permissions before executing.","Authorization in code | Enforce who may do what inside the tool; a prompt instruction is not security.","Loop limits | Cap the number of tool rounds to prevent runaway cost."]},{"n":"Token, latency and cost trade-offs","w":"LLM cost and speed depend on tokens and model size.","b":["Price is per input and output token.","Larger models are slower and costlier.","Trim prompts, cache repeated parts, limit output length.","Stream responses for better perceived speed."],"e":"Switch easy tasks to a small model to cut cost.","d":null,"h":"Estimate cost = (input tokens x input price) + (output tokens x output price). Reduce by shorter prompts, caching static prefixes (prompt caching), smaller models for simple steps, limiting max output, batching offline jobs at discount, and summarizing history. Latency depends on model size, input length and streaming; use streaming for responsiveness and parallelize independent calls.","y":"Production viability depends on unit economics and speed.","m":"Mistake: sending entire chat history every time. Tip: summarize or window the history.","k":["Input and output tokens | Billed separately, and output tokens usually cost several times more than input tokens.","Prompt caching | A discount when the beginning of the prompt repeats, useful for long system prompts and documents.","Streaming | Sends tokens as they are produced so users see the answer sooner.","Time to first token | The delay before the first output; it depends on model size and prompt length.","Batch API | Cheaper asynchronous processing for work that can wait."]},{"n":"Model routing and fallback strategies","w":"A router chooses which model to call.","b":["Route simple tasks to cheap models, hard to strong ones.","Fallback to another model or region on failure or throttling.","Gateways (APIM, LiteLLM) centralize keys, logging and limits.","Track quality per route."],"e":"Try model A, if it errors use model B.","d":{"t":"flow","n":["Request","Router","Cheap model or strong model","Fallback if error"]},"h":"Implement a model gateway layer: central authentication, quotas per team, logging, caching, prompt templates, routing rules (by task, language, sensitivity or cost) and fallback chain with retries on 429/5xx. Azure API Management AI gateway, LiteLLM and custom services are common. Keep provider-specific details out of application code.","y":"Avoids lock-in and improves resilience.","m":"Mistake: each team integrating with providers directly. Tip: provide one governed interface.","k":["Model gateway | A central service that all LLM calls pass through, adding authentication, logging, quotas, caching and routing.","Routing | Choose a model per request: small and cheap for simple tasks, stronger models for hard ones.","Fallback | Switch to another model or region when one is down or throttled.","Semantic cache | Return stored answers for questions similar to earlier ones.","Provider abstraction | A common interface so applications are not tied to one vendor."]},{"n":"Fine-tuning vs RAG vs prompting","w":"Choose the lightest technique that works.","b":["Prompting: fastest and cheapest.","RAG: adds current private knowledge.","Fine-tuning: changes style or skill using examples.","Order: prompt, then RAG, then fine-tune if needed."],"e":"Policy Q&A needs RAG; tone of replies might need fine-tuning.","d":{"t":"layers","n":["Fine-tuning (behavior)","RAG (knowledge)","Prompting (instructions)"]},"h":"Order of attempts: improve prompt and few-shot examples; add retrieval for private or fresh knowledge; use fine-tuning when you need consistent style, format or domain behavior at lower latency/cost, with hundreds to thousands of high-quality examples. Fine-tuning is poor at adding new facts. Evaluate at each step to justify added complexity.","y":"Prevents expensive overengineering.","m":"Mistake: fine-tuning to inject knowledge that changes often. Tip: use RAG for knowledge, fine-tuning for behavior.","k":["Prompting | The fastest, cheapest first step: better instructions and examples.","RAG | Adds private or current knowledge at query time without changing the model.","Fine-tuning | Updates model weights to change style, format or specialized skill; it does not reliably add new facts.","Distillation | Train a small model to imitate a large one for cost and speed.","Evaluate at each step | Measure improvement before adding complexity."]}]},{"n":"RAG fundamentals","d":"Grounding LLMs in your data.","s":[{"n":"Document ingestion and parsing pipelines","w":"Good RAG starts with clean text.","b":["Extract text from PDF, Word, HTML; use OCR for scans.","Keep tables and headings as structure.","Attach metadata: source, date, permissions.","Re-ingest when documents change."],"e":"Parse policy PDFs with layout-aware extraction.","d":{"t":"flow","n":["Documents","Parse + clean","Metadata","Ready to chunk"]},"h":"Ingestion pipeline: connectors collect files (SharePoint, S3, wikis), parsers extract text (Document Intelligence/Textract/Unstructured for PDFs, tables and scans), cleaners remove headers and footers, and enrichers add metadata (title, section, date, department, access groups). Change detection updates only modified documents and deletes removed ones. Track failures.","y":"Garbage in, garbage out: parsing quality limits answer quality.","m":"Mistake: ignoring tables and scanned pages. Tip: test parsing on your hardest documents first.","k":["Connectors | Components that pull content from SharePoint, S3, wikis, databases and ticket systems on a schedule.","Parsing and OCR | Extract text and structure from PDFs and scans; poor parsing is the most common cause of poor RAG answers.","Metadata | Store source, date, department and access groups with each chunk for filtering and citations.","Incremental ingestion | Process only changed documents and remove deleted ones so the index stays current.","Failure handling | Track documents that fail parsing and retry or review them."]},{"n":"Chunking strategies","w":"Chunking splits documents into searchable pieces.","b":["Too small loses context; too large adds noise.","Split by headings or paragraphs; 200-800 tokens is common.","Overlap 10-20% to keep context.","Keep titles with each chunk."],"e":"Chunk by section heading with the document title prefixed.","d":null,"h":"Strategies: fixed size with overlap, recursive by separators (paragraph, sentence), structure-aware (headings, sections, clauses), semantic (split by embedding shifts), and parent-child (retrieve small chunk, supply larger parent). Typical 200-800 tokens with 10-20% overlap. Include document title and heading path in each chunk. Evaluate chunk settings using retrieval metrics.","y":"Chunking strongly influences retrieval accuracy.","m":"Mistake: splitting mid-sentence or table. Tip: respect natural boundaries.","k":["Chunk | A piece of a document that is embedded and retrieved, typically 200 to 800 tokens.","Overlap | Repeating 10 to 20 percent of text between chunks so ideas split across a boundary are not lost.","Recursive and semantic splitting | Split by paragraphs then sentences, or at points where meaning changes.","Parent-child chunks | Search small chunks for precision, then return the larger parent for context.","Heading path | Add section titles to each chunk so it carries its context."]},{"n":"Embedding models and dimensionality","w":"Embedding models convert chunks to vectors.","b":["Pick a model suited to your language and domain.","Dimensions (for example 768-3072) affect storage and speed.","Use the same model for documents and queries.","Re-embed when you change models."],"e":"text-embedding-3-large for English contracts.","d":null,"h":"Select by language, domain, context length, dimensions, cost and hosting (OpenAI text-embedding-3, Cohere, Titan, open-source BGE, E5). Dimension reduction (Matryoshka) trades accuracy for storage. Benchmarks like MTEB help but test on your data. Use the same model for queries and documents, and sometimes instruction prefixes (query: / passage:).","y":"Embeddings determine what 'similar' means.","m":"Mistake: switching models without re-em
