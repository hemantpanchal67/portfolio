 istiod issues short-lived X.509 certificates; proxies rotate them automatically. PeerAuthentication modes: DISABLE, PERMISSIVE (accept plain and mTLS) and STRICT (mTLS only), at mesh, namespace or workload level. Combine with AuthorizationPolicy using identities.","y":"Encrypts and authenticates traffic between services by default.","m":"Mistake: switching to STRICT before all clients have sidecars, causing outages. Tip: observe with telemetry first.","k":["SPIFFE identity | A standard workload identity such as spiffe://cluster.local/ns/claims/sa/api, derived from namespace and service account. Policies refer to these identities, not IP addresses.","Mutual TLS | Both client and server present certificates and verify each other, giving encryption and strong service identity in one step.","PeerAuthentication | The Istio resource that sets mTLS mode for a workload, namespace or the whole mesh.","PERMISSIVE versus STRICT | PERMISSIVE accepts both plain text and mTLS, making migration safe; STRICT accepts only mTLS and rejects unmeshed callers.","Certificate rotation | Workload certificates are short-lived (about 24 hours) and renewed automatically by istiod, so no manual certificate work and little exposure if one leaks."]},{"n":"VirtualService, DestinationRule, Gateway","w":"These resources define routing.","b":["Gateway: opens ports at the mesh edge.","VirtualService: routing rules (path, header, weight).","DestinationRule: subsets, load balancing, connection pool, outlier detection.","Kubernetes Gateway API is the emerging alternative."],"e":"Route 90% to v1 and 10% to v2 using subsets.","d":{"t":"flow","n":["Gateway","VirtualService","DestinationRule","Pods"]},"h":"Gateway configures ingress/egress proxies (ports, hosts, TLS). VirtualService defines routes for hosts: match on URI, headers; route to destination subsets with weights; apply timeouts, retries, fault injection, mirroring. DestinationRule defines subsets by labels, load balancing algorithm, connection pools and outlier detection (ejecting failing endpoints). Kubernetes Gateway API resources are increasingly supported.","y":"These are the core objects you configure daily.","m":"Mistake: conflicting routes in multiple VirtualServices. Tip: keep one owner per host and validate with istioctl analyze.","k":["Gateway | Configures the mesh edge: which ports, hosts and TLS settings the ingress proxy accepts. It says nothing about routing by itself.","VirtualService | Defines how requests for a host are routed: match on path, header or method and send to destinations with weights, retries and timeouts.","DestinationRule | Defines policy applied after routing: subsets by label, load balancing algorithm, connection pool limits and outlier detection.","Subset | A named group of pods (for example version v1) selected by labels, used to split traffic between versions.","Conflicting rules | Several VirtualServices for the same host merge unpredictably, so keep one owner per host and run istioctl analyze."]},{"n":"Traffic shifting, retries, timeouts, circuit breaking","w":"Resilience features live in the mesh.","b":["Traffic shifting for canaries.","Timeouts and retries per route; avoid retry storms.","Circuit breaking via connection limits and outlier detection.","Fault injection to test resilience."],"e":"Retry GET requests 2 times with a 2 s timeout.","d":null,"h":"Canary: weight 95/5 between subsets. Retries: attempts, perTryTimeout and retryOn conditions (5xx, connect-failure) only for idempotent calls. Timeouts at the route level. Circuit breaking: connectionPool limits and outlierDetection (consecutive5xx, baseEjectionTime). Fault injection delays or aborts requests to test resilience. Mirroring sends a copy of traffic to a new version.","y":"Provides resilience tools without code.","m":"Mistake: retries at several layers multiplying load. Tip: set retries at one layer with limits.","k":["Weighted routing | Splits traffic by percentage between subsets, for example 95 percent v1 and 5 percent v2, to run a canary release.","Timeouts | Sets how long the proxy waits for a response before failing, protecting callers from slow dependencies.","Retry policy | Defines attempts, per-try timeout and which failures to retry; only retry idempotent calls and avoid retries at several layers.","Outlier detection | Temporarily ejects endpoints that return consecutive 5xx errors, which is Istio's passive circuit breaker.","Fault injection | Adds artificial delays or errors for a percentage of requests so you can test how callers behave under failure."]},{"n":"AuthorizationPolicy","w":"Control who may call whom.","b":["Rules by source identity, namespace, method and path.","Start with deny-all, then allow explicitly.","Combine with JWT validation (RequestAuthentication).","Test with dry-run annotations."],"e":"Only the 'orders' identity may POST to payments.","d":null,"h":"AuthorizationPolicy actions: ALLOW, DENY, CUSTOM, AUDIT. Rules match source principals, namespaces, IP blocks, request principals (JWT claims), operations (methods, paths, hosts) and conditions. No policy means allow all; once an ALLOW policy exists, only matches are allowed. RequestAuthentication validates JWTs. Use deny-by-default per namespace.","y":"Implements zero-trust access between services.","m":"Mistake: path matching bypass due to normalization. Tip: test policies with negative cases.","k":["AuthorizationPolicy | Rules that ALLOW, DENY or AUDIT requests based on source identity, namespace, method, path and JWT claims.","Principal | The workload identity of the caller, as proven by mTLS, used to say who may call whom.","RequestAuthentication | Validates JWTs on incoming requests; it must be combined with an AuthorizationPolicy to require a valid token.","Deny by default | Once any ALLOW policy applies to a workload, anything not matched is denied, so start with an empty allow policy and add specific rules.","Testing policies | Use dry-run annotations and negative tests to confirm blocked requests are actually blocked."]},{"n":"Multi-cluster and multi-network setups","w":"One mesh across several clusters is possible but complex.","b":["Shared root of trust for certificates.","Service discovery across clusters.","East-west gateways when networks are separate.","Plan failover and locality-based routing."],"e":"Fail over from cluster A to B when A is unhealthy.","d":{"t":"hub","c":"Mesh","n":["Cluster 1","Cluster 2","East-west gateway"]},"h":"Models: primary-remote or multi-primary, on same or different networks. Requires shared root CA or intermediate CAs, remote secrets so istiod can read other clusters' endpoints, east-west gateways for cross-network traffic, and locality load balancing and failover settings. Test failure of a cluster and DNS. Keep versions aligned within supported skew.","y":"Enables regional resilience and migration between clusters.","m":"Mistake: unplanned certificate trust differences. Tip: design the CA hierarchy before installing.","k":["Multi-primary | Each cluster runs its own istiod and they share endpoint discovery. Highly resilient but more to operate.","Primary-remote | One cluster runs the control plane and remote clusters use it; simpler but the primary is a dependency.","East-west gateway | A gateway that carries service-to-service traffic between clusters on different networks.","Shared root of trust | All clusters trust a common root CA so certificates issued in one cluster are accepted by others.","Locality failover | Prefer endpoints in the same zone or region and fail over to other clusters when local ones are unhealthy."]},{"n":"Debugging with istioctl and Envoy proxy logs","w":"Know the tools for mesh problems.","b":["istioctl analyze finds config errors.","istioctl proxy-status shows sync state.","Envoy access logs have response flags (UF upstream failure, NR no route, URX retry limit).","Check certificates, DNS, policies and sidecar injection."],"e":"503 with flag UF means no healthy upstream; check endpoints.","d":{"t":"flow","n":["Symptom","analyze + proxy-status","Envoy logs and flags","Fix config"]},"h":"Commands: istioctl analyze, proxy-status (sync state), proxy-config (listeners, routes, clusters, endpoints), x describe pod, and envoy admin /stats and /config_dump. Access log flags: UF (upstream connection failure), UH (no healthy upstream), NR (no route), UT (upstream timeout), URX (retry limit exceeded), DC (downstream closed). Verify mTLS mode, sidecar presence, ports named properly (protocol detection) and DNS.","y":"Speeds root cause analysis in production incidents.","m":"Mistake: only looking at application logs. Tip: compare the client proxy and server proxy logs.","k":["istioctl analyze | Checks the live configuration for mistakes such as conflicting routes, missing destinations or unused policies.","proxy-status | Shows whether each proxy has received the latest configuration from istiod; STALE means a sync problem.","proxy-config | Dumps what a proxy actually knows (listeners, routes, clusters, endpoints), which is the ground truth when routing misbehaves.","Envoy response flags | Short codes in access logs: UF upstream connection failure, UH no healthy upstream, NR no route, UT upstream timeout, URX retry limit exceeded.","Protocol detection | Port names such as http or grpc tell Istio the protocol; misnamed ports cause strange behavior."]},{"n":"Migration plan across business units","w":"Rolling out a mesh is a program, not a switch.","b":["Pilot with a friendly team.","Permissive mTLS, then observability, then strict policies.","Named champion per business unit with a schedule.","Documented rollback and support channel."],"e":"Wave 1: three services; wave 2: one business unit.","d":{"t":"flow","n":["Pilot","Permissive mTLS","Observe","Strict + policies","Next unit"]},"h":"A migration playbook: inventory services and protocols; install the mesh with a revision-based canary upgrade model; onboard one low-risk namespace; enable telemetry; set PERMISSIVE mTLS; fix issues; move to STRICT; add AuthorizationPolicies; gradually onboard more namespaces; measure latency and resource cost. Each business unit names an engineering champion and agreed schedule; create documentation, office hours and rollback steps (remove injection label and restart).","y":"Cross-org rollouts fail on coordination more than technology.","m":"Mistake: central team doing all work. Tip: enable self-service onboarding with templates and clear checklists.","k":["Pilot namespace | Start with one low-risk team to find problems cheaply and build a working pattern.","Waves | Onboard services in groups, ordered by dependency and risk, with checks between waves.","Business unit champions | A named engineer in each unit coordinates local work, which is essential in a cross-organization rollout.","Rollback plan | Remove the injection label and restart pods to leave the mesh; practice it.","Observability first | Turn on telemetry before enforcing policies so you can see impact before changing behavior."]}]},{"n":"Reliability & scalability","d":"Resilience and performance engineering.","s":[{"n":"SLIs, SLOs, error budgets","w":"Set measurable reliability goals.","b":["SLI: a measurement (successful requests / all requests).","SLO: target for the SLI (99.9% over 30 days).","Error budget: allowed failure (0.1%).","When the budget is used up, pause features and fix reliability."],"e":"99.9% allows about 43 minutes of downtime per month.","d":null,"h":"Example SLI: proportion of HTTP requests that return non-5xx within 300 ms. SLO: 99.9% over 30 days. Error budget = 100% minus SLO (43 minutes of full outage). Burn-rate alerts notify when the budget is consumed too quickly (for example 2% in 1 hour). Share dashboards with product owners; adjust SLOs with business input.","y":"Aligns engineering and business on reliability level and trade-offs.","m":"Mistake: 100% targets or too many SLOs. Tip: pick 2-4 SLIs per user journey.","k":["SLI | A service level indicator is a measurement of user experience, for example the percentage of requests that succeed in under 300 ms.","SLO | A service level objective is the target for that measurement, for example 99.9 percent over 30 days, agreed between engineering and the business.","SLA | A contractual promise with financial penalties, kept looser than the internal SLO so you have margin.","Error budget | The allowed failure: 100 percent minus the SLO. At 99.9 percent that is about 43 minutes of downtime per month.","Burn-rate alerting | Alerts when the budget is being consumed too quickly, for example 2 percent in an hour, so you act before it is gone."]},{"n":"Circuit breaker, bulkhead, retry, timeout patterns","w":"Handle failures gracefully.","b":["Timeouts: never wait forever.","Retry with backoff and jitter; only for idempotent calls.","Circuit breaker: stop calling a failing dependency for a while.","Bulkhead: separate pools so one failure cannot use all resources."],"e":"After 5 failures, open the circuit for 30 seconds and serve a fallback.","d":{"t":"flow","n":["Closed (normal)","Failures exceed limit","Open (fail fast)","Half-open (test)","Closed"]},"h":"Timeouts must be set for every remote call and be shorter than the caller's timeout. Retries use backoff and jitter, cap attempts and apply only to safe operations. Circuit breakers (Polly, Resilience4j) track failures and short-circuit calls, returning fallbacks or cached data. Bulkheads limit concurrency or separate thread pools per dependency. Load shedding rejects excess traffic early.","y":"Prevents one slow dependency from taking down the whole system.","m":"Mistake: unlimited retries or no timeouts. Tip: test with fault injection.","k":["Timeouts | Limit how long you wait for another service. Without them one slow dependency can hold all your threads; the callee's timeout should be shorter than the caller's.","Retries with backoff and jitter | Repeat failed calls after growing, randomized delays. Without jitter many clients retry together and cause a storm.","Circuit breaker | After a number of failures the breaker opens and calls fail immediately for a while, giving the dependency time to recover; it then lets a few test calls through (half-open).","Bulkhead | Separate resource pools (threads, connections) per dependency so one failing dependency cannot consume everything.","Fallback and load shedding | Return cached or reduced results when a dependency fails, and reject low-priority requests when overloaded."]},{"n":"Caching layers (Redis, CDN, application cache)","w":"Caching trades freshness for speed.","b":["CDN for static content; Redis for shared data; local cache for hot items.","Patterns: cache-aside, write-through.","TTL and explicit invalidation control staleness.","Beware cache stampedes."],"e":"Cache plan details for 5 minutes in Redis.","d":{"t":"flow","n":["Request","Check cache","Hit: return","Miss: query DB then store"]},"h":"Cache-aside: read cache, on miss load from source and store with TTL. Write-through and write-behind update cache with writes. Eviction policies (LRU). Avoid stampedes using locking or request coalescing and staggered TTLs. HTTP caching uses Cache-Control and ETag. CDN caching reduces origin load. Measure hit ratio.","y":"Dramatic performance and cost benefits.","m":"Mistake: caching without invalidation plan or caching personalized data publicly. Tip: define keys carefully and TTLs by data volatility.","k":["Cache-aside | The application checks the cache first; on a miss it loads from the database and stores the result. The most common pattern.","Write-through | Writes go to cache and store together, keeping the cache fresh at the cost of slower writes.","TTL and eviction | A time to live expires entries; eviction policies such as least-recently-used remove entries when memory is full.","Cache stampede | When a popular entry expires, many requests hit the database at once; prevent with locking, request coalescing or staggered TTLs.","Invalidation | The hard part: removing or updating entries when the source changes, using events or short TTLs."]},{"n":"Horizontal scaling and partitioning/sharding","w":"Scale out instead of up when you can.","b":["Stateless services scale easily behind a load balancer.","Partition or shard data by a key.","Choose keys that spread load evenly.","Autoscale on metrics."],"e":"Shard claims by member ID hash.","d":null,"h":"Stateless services keep session state in cookies/tokens or shared stores so any instance can serve any request. Databases scale reads with replicas and writes by sharding (hash, range, directory). A good shard key distributes load and avoids cross-shard queries. Distributed SQL and NoSQL options auto-shard (Cosmos DB, DynamoDB, Cassandra). Use autoscaling with sensible cooldowns.","y":"Scale limits are a main source of redesign.","m":"Mistake: hot partitions from poor keys. Tip: test with realistic distribution.","k":["Stateless services | Keep no per-user state in the instance; store sessions in a shared store or token so any instance can handle any request and scaling is easy.","Horizontal versus vertical scaling | Adding more instances is resilient and nearly unlimited; a bigger instance is simple but has a ceiling and a single point of failure.","Sharding | Splitting data across nodes by a key so each node holds part of the data and handles part of the load.","Good shard keys | High cardinality and evenly used, for example customer ID; poor keys create hot partitions.","Autoscaling cooldown | A waiting period after scaling so the system does not oscillate between sizes."]},{"n":"Multi-region active-active and disaster recovery (RTO/RPO)","w":"Plan how you will survive big failures.","b":["RPO: acceptable data loss; RTO: acceptable downtime.","Backup/restore, pilot light, warm standby, active-active (increasing cost and speed).","Test failover regularly.","Remove single points of failure."],"e":"RPO 5 minutes and RTO 1 hour means async replication and warm standby.","d":{"t":"layers","n":["Active-active (fastest, costliest)","Warm standby","Pilot light","Backup and restore (slowest, cheapest)"]},"h":"RPO and RTO per workload tier drive strategy. Backup and restore: cheapest, hours. Pilot light: minimal core running in DR region. Warm standby: scaled-down copy. Active-active: serves traffic from multiple regions with data replication (conflict handling needed). Automate failover runbooks, test twice a year, and include DNS, data, identity and dependencies. Document who declares a disaster.","y":"Real incidents (region outages, ransomware) test this.","m":"Mistake: DR plan that was never executed. Tip: schedule game days.","k":["RPO and RTO | RPO is how much data you can lose; RTO is how long recovery may take. Each workload gets its own targets based on business impact.","Backup and restore | Cheapest strategy with recovery in hours; suitable for non-critical systems.","Pilot light and warm standby | Pilot light keeps only the core (such as the database) running in the recovery region; warm standby keeps a scaled-down full copy that can grow quickly.","Active-active | Several regions serve traffic at once for near-zero downtime, but data conflicts and cost make it the hardest option.","DR testing | A plan that was never exercised usually fails; schedule drills and measure real recovery time."]},{"n":"Capacity planning and load testing","w":"Know your limits before users find them.","b":["Estimate demand and growth.","Load test to find breaking points.","Keep 30-50% headroom.","Plan for seasonal peaks such as open enrollment."],"e":"Test at 3x last year's peak before enrollment season.","d":null,"h":"Use production metrics to model load (requests per second, peak hour, growth). Run load tests to find the saturation point of each tier. Compute headroom for failure of one zone (N+1). Plan quota requests with cloud providers and database scaling lead times. Schedule scaling before known events. Review monthly using utilization dashboards.","y":"Prevents outages from success and seasonality.","m":"Mistake: relying only on autoscaling that has limits or startup delays. Tip: pre-scale for known peaks.","k":["Capacity planning | Estimating future demand from trends and events, then provisioning resources and quotas ahead of time.","Headroom | Spare capacity, often 30 to 50 percent, to absorb spikes and the loss of a zone.","N+1 and zone loss | Design so the system still meets targets after losing one instance or one zone.","Cloud quotas | Providers limit resources per region and subscription; quota increases can take days, so request early.","Pre-scaling for events | Scale up before known peaks such as open enrollment because autoscaling takes time."]},{"n":"Performance profiling and bottleneck analysis","w":"Measure, don't guess.","b":["Use profilers and distributed tracing.","Look at CPU, memory, I/O, locks, network and database time.","Fix the biggest bottleneck first.","Measure again after each change."],"e":"Tracing shows 70% of latency in one slow query.","d":{"t":"flow","n":["Measure","Find bottleneck","Fix","Measure again"]},"h":"Method: define the problem (latency or throughput), measure with metrics and traces, find the biggest contributor (database, network, CPU, lock, GC), form a hypothesis, change one thing, re-measure. Tools: APM, profilers (async-profiler, py-spy, pprof), database EXPLAIN, flame graphs. Look at percentiles not averages.","y":"Guessing wastes time and can make things worse.","m":"Mistake: optimizing without data. Tip: save the baseline and compare.","k":["Profiling | Sampling where CPU time and memory are spent in code, often shown as a flame graph.","Distributed tracing | Shows time spent in each service and database call for a request, revealing the slow hop.","Percentile latency | p95 and p99 show what the slowest users experience; averages hide problems.","Bottleneck | The single resource limiting throughput; improving anything else will not help.","Measure, change one thing, measure again | The only reliable way to know an optimization worked."]}]},{"n":"Modernization of legacy apps","d":"Portfolio-level migration strategies.","s":[{"n":"The 6 Rs: rehost, replatform, refactor, repurchase, retire, retain","w":"Each application gets a migration strategy.","b":["Rehost: move as is (fast, low benefit).","Replatform: small changes, like managed DB.","Refactor: redesign for cloud (most benefit and effort).","Repurchase: replace with SaaS; Retire: switch off; Retain: keep for now."],"e":"Retire 20% of applications found to be unused.","d":{"t":"hub","c":"6 Rs","n":["Rehost","Replatform","Refactor","Repurchase","Retire","Retain"]},"h":"Rehost: lift-and-shift quickly with minimal change. Replatform: tweaks like managed database or containers. Refactor/re-architect: rewrite parts to be cloud-native for agility and scale. Repurchase: move to SaaS. Retire: decommission unused apps. Retain: leave on-premises (latency, regulation, end-of-life plans). Choose per app using business value, technical fit, cost and risk.","y":"One strategy for all apps wastes money or time.","m":"Mistake: refactoring everything. Tip: reserve deep changes for apps with high business value.","k":["Rehost (lift and shift) | Move servers as they are to cloud virtual machines. Fast and low risk, but you keep old operational costs and gain little cloud benefit.","Replatform | Make small changes during the move, such as using a managed database or containers, for moderate benefit and effort.","Refactor | Redesign the application for cloud-native features such as microservices or serverless; highest effort and highest long-term gain.","Repurchase and retire | Replace with a SaaS product, or switch off applications nobody needs; often the biggest savings.","Retain | Keep on-premises for regulation, latency or planned end of life."]},{"n":"Strangler fig and anti-corruption layer","w":"Replace a legacy system step by step.","b":["Put a facade (proxy) in front of the old system.","Move one feature at a time to new code and route traffic there.","Anti-corruption layer translates old and new models.","Switch off the old system when empty."],"e":"Move quoting to a new service first; billing later.","d":{"t":"flow","n":["Facade","Route feature A to new","Route feature B to new","Retire legacy"]},"h":"Place a routing layer (API gateway or proxy) in front of the legacy app. Build new functionality as separate services and redirect specific routes to them. Use an anti-corruption layer to translate between the legacy model and the new one so the new design stays clean. Migrate data gradually (sync or dual-run). Remove legacy pieces once traffic is zero.","y":"Reduces risk compared to big-bang rewrites.","m":"Mistake: starting with the hardest, most coupled module. Tip: start with a well-bounded, high-value slice.","k":["Facade | A routing layer such as an API gateway placed in front of the legacy system so traffic can be redirected piece by piece.","Strangler fig pattern | New services take over functions one at a time until the legacy system no longer receives traffic and can be retired.","Anti-corruption layer | A translation boundary that stops the old data model and terms from leaking into the new design.","Seam | A point in legacy code where behavior can be changed without editing the surrounding code, used to start splitting.","Dual running | Old and new run side by side so results can be compared before switching."]},{"n":"Application portfolio assessment and scoring","w":"Decide what to move first with data.","b":["Inventory apps with owner, tech, dependencies and users.","Score business value, technical health, risk, cost.","Plot on a 2x2 and choose strategy.","Revisit the plan every quarter."],"e":"High value, low health apps are refactor candidates.","d":null,"h":"Collect data: owner, business criticality, users, technology stack and versions, dependencies, data sensitivity, cost, support status. Score on business value versus technical health and migration complexity. Decide wave plan with dependencies (databases, shared services). Keep the inventory updated in a CMDB or spreadsheet.","y":"Evidence-based roadmap and funding.","m":"Mistake: incomplete discovery causing surprises. Tip: use agent-based discovery with runtime dependency mapping.","k":["Application inventory | A catalog of every application with owner, technology, users, data sensitivity, cost and dependencies; the base of any plan.","Business criticality and technical health | How important the app is and how supportable it is; together they decide migrate, modernize or retire.","Dependency mapping | Discover which systems talk to each other so related applications move in the same wave.","Scoring and quadrants | Plot business value against migration complexity to choose a strategy for each application.","Wave planning | Group applications into ordered migration waves respecting dependencies and team capacity."]},{"n":"Azure Migrate, AWS Migration Hub, App Service Migration Assistant","w":"Use the provider's tools for discovery and assessment.","b":["Azure Migrate: discovery, readiness, cost estimate and migration.","AWS Migration Hub and Application Discovery Service.","App Service Migration Assistant checks web apps.","Tools give data for the business case."],"e":"Run discovery for 4 weeks to capture peak usage.","d":null,"h":"Azure Migrate discovers servers, performs dependency analysis, right-sizing and cost estimates, and migrates VMs. AWS Application Discovery Service and Migration Hub track apps; AWS MGN rehosts servers. App Service Migration Assistant checks .NET and Java web apps. Database Migration Services move data with minimal downtime.","y":"Accelerate and de-risk migrations.","m":"Mistake: relying on one week of discovery. Tip: capture full business cycles such as month end.","k":["Azure Migrate | Microsoft's hub for discovering servers, assessing readiness and cost, and migrating servers, databases and web apps.","AWS Migration Hub and Application Migration Service | Track migration progress and replicate servers continuously for rehosting.","Agentless discovery | Collects configuration and performance data without installing software on servers.","Right-sizing recommendations | Suggested target sizes based on real utilization, avoiding paying for oversized VMs.","Capture full business cycles | Discovery should cover month-end and peak periods, or sizing will be too small."]},{"n":"Modernizing .NET Framework to .NET, Java upgrades","w":"Upgrade the platform under the app.","b":["Move .NET Framework to modern .NET using upgrade assistants.","Keep Java on supported LTS versions (17, 21).","Replace unsupported libraries first.","Test heavily; behavior can change."],"e":"Port a WCF service to gRPC or REST on .NET 8.","d":null,"h":"Use the .NET Upgrade Assistant to move to .NET 8+, replace WCF/Web Forms with modern equivalents, and containerize. For Java, upgrade to 17/21 LTS and Jakarta namespace, replace deprecated libraries, and consider Spring Boot. Add tests first as a safety net. Staged upgrade approach reduces risk. Check licensing changes (Oracle Java).","y":"Unsupported runtimes are security and talent risks.","m":"Mistake: attempting the upgrade without tests. Tip: build characterization tests before changing code.","k":["Upgrade Assistant | A Microsoft tool that helps move .NET Framework projects to modern .NET by analyzing and applying changes.","LTS versions | Long-term support releases such as Java 17 and 21 and .NET 8 receive security fixes for years; upgrade to them.","Jakarta namespace | Java enterprise APIs moved from javax to jakarta, which breaks old libraries until they are upgraded.","Characterization tests | Tests written to record how the application currently behaves, so upgrades can be checked for unwanted changes.","Dependency replacement | Replace unsupported libraries first because they block everything else."]},{"n":"Database modernization and data migration","w":"Data is usually the riskiest part.","b":["Tools: AWS DMS, Azure DMS, native replication.","Convert schema and code objects.","Continuous sync during cutover to minimize downtime.","Validate row counts and checksums."],"e":"Oracle to PostgreSQL with schema conversion and sync.","d":{"t":"flow","n":["Assess","Convert schema","Initial load","Continuous sync","Cutover"]},"h":"Plan: choose target engine, assess compatibility (AWS SCT, Azure Database Migration Service), convert schema, procedures and types, migrate data (full load plus CDC), validate counts and checksums, performance test, then cutover with a short freeze. Consider licensing and feature gaps (Oracle PL/SQL). Keep rollback by reverse replication if possible.","y":"Data migration problems cause the longest outages.","m":"Mistake: underestimating stored procedure conversion. Tip: pilot early with the hardest procedures.","k":["Database Migration Service | A managed service that copies data between database engines and keeps them in sync until cutover.","Schema conversion | Translating tables, indexes, procedures and data types when changing engines, such as Oracle to PostgreSQL.","Full load plus change data capture | Copy all data first then stream ongoing changes, so cutover needs only a short pause.","Validation | Compare row counts, checksums and key queries between source and target before switching.","Reverse replication | Keep the old database updated after cutover so you can roll back without data loss."]},{"n":"Cutover and rollback planning","w":"Make the move boring through preparation.","b":["Runbook with owners, times and checks.","Go/no-go criteria agreed ahead.","Rollback plan tested.","Dry-run in a rehearsal environment.","Communicate to users."],"e":"Cutover weekend with a 2-hour rollback decision point.","d":{"t":"flow","n":["Freeze","Final sync","Switch","Validate","Go or rollback"]},"h":"A cutover runbook lists steps with owner, duration, verification and rollback triggers; includes freeze windows, final data sync, DNS or routing switch, smoke tests and communication. Rehearse at least twice with timing. Decide go/no-go with agreed criteria (error rate, data match). Keep the old environment ready until stable.","y":"Prepared cutovers are calm cutovers.","m":"Mistake: rollback that was never tested. Tip: define the point of no return clearly.","k":["Cutover runbook | A timed, step-by-step plan with owners, checks and decision points for switching to the new system.","Go or no-go criteria | Agreed conditions that must be true to proceed, decided before the night.","Freeze window | A period with no changes to source systems, so data does not move during cutover.","Rollback trigger and point of no return | The condition that causes reverting, and the step after which reverting is impractical.","Hypercare | Extra support in the days after go-live to fix issues quickly."]}]}]},{"p":"Phase 5 - Observability & Operations (Weeks 16-17)","why":"Why: production ownership and incident handling.","t":[{"n":"Observability tools","d":"Logs, metrics, traces, alerts.","s":[{"n":"Three pillars and OpenTelemetry instrumentation","w":"Observability lets you understand a system from its outputs.","b":["Logs: what happened (events).","Metrics: numbers over time (CPU, error rate, latency).","Traces: the path of one request across services.","OpenTelemetry is the open standard to create all three, so tools can change without code changes."],"e":"A trace shows a slow checkout call spent 2 s in the payments service.","d":{"t":"hub","c":"Observability","n":["Logs","Metrics","Traces"]},"h":"Instrument code with the OpenTelemetry SDK or auto-instrumentation agents. Logs are structured events (JSON) with fields like time, level, service, trace ID. Metrics are numeric time series (counters, gauges, histograms). Traces consist of spans linked by trace and span IDs across services using W3C trace context headers. The OTel Collector receives, processes and exports data to your backend of choice.","y":"Without all three signals, distributed problems are guesswork.","m":"Mistake: logs with no correlation IDs. Tip: propagate trace IDs and include them in every log line.","k":["Log | A timestamped record of an event. Prefer structured JSON with fields such as time, level, service and trace ID so logs can be searched and joined with traces.","Metric | A number sampled over time, such as CPU percent or requests per second. Cheap to store and ideal for dashboards and alerts.","Trace | The path of one request across services, shown as a tree of timed steps. It answers where the time went.","Span | One timed operation inside a trace, with a name, start, duration, attributes and a link to its parent span.","OpenTelemetry (OTel) | Open standard and SDKs for generating logs, metrics and traces, so you can switch backends without changing application code.","OTel Collector | A service that receives telemetry, processes it (filter, sample, enrich) and exports it to one or more backends.","Trace context | Headers such as traceparent that carry the trace ID between services so spans join into one trace.","Cardinality | The number of unique values of a label. High-cardinality labels (user ID, request ID) on metrics explode storage and cost."]},{"n":"Elasticsearch and Kibana: indexing, queries, dashboards","w":"Elastic Stack stores and searches logs at scale.","b":["Elasticsearch: index and search engine.","Kibana: search, dashboards and alerts.","Beats/Logstash/Elastic Agent ship data in.","Use index lifecycle policies (hot, warm, cold, delete) to control cost."],"e":"Search 'status:500 AND service:claims' over the last hour in Kibana.","d":{"t":"flow","n":["Apps","Agents","Elasticsearch","Kibana"]},"h":"Data is stored in indices split into shards; mappings define field types. Queries use KQL or Lucene syntax and aggregations. Kibana provides Discover, dashboards, Lens, alerting and APM. Lifecycle policies move indices from hot to warm, cold and frozen and delete them. Good practice: keep fields consistent (ECS), avoid too many shards, and set retention per index.","y":"Popular for log search and security analytics.","m":"Mistake: unbounded index growth and mapping explosions. Tip: use index templates and lifecycle policies.","k":["Index | The unit where Elasticsearch stores searchable documents, comparable to a table, split into shards.","Shard and replica | A shard is a slice of an index spread across nodes for scale; a replica is a copy for safety and read throughput.","Mapping | Defines each field's type (keyword, text, date, number). Wrong mappings cause poor search or mapping explosions.","KQL and Lucene | Two query syntaxes in Kibana. KQL is simpler (status:500 and service:claims); Lucene supports advanced patterns.","Hot-warm-cold-frozen tiers | Data moves to cheaper, slower storage as it ages: hot is fast SSD for recent data, frozen is searchable snapshots on object storage.","Index lifecycle management | Policies that roll over, move, shrink and delete indices automatically, controlling cost.","Elastic Common Schema (ECS) | Standard field names so logs from different sources can be searched and correlated consistently.","Aggregation | Grouping and calculating over documents, such as errors per service per minute; powers dashboards."]},{"n":"Splunk: SPL, dashboards, alerts","w":"Splunk is a widely used log and security analytics platform.","b":["Forwarders send data; indexers store it.","SPL query language: search, filter, stats, timechart.","Dashboards and alerts for operations and security.","Licensing is based on data volume, so filter noise."],"e":"index=app error | stats count by service","d":null,"h":"Universal forwarders collect logs, heavy forwarders parse, indexers store and search, and the search head runs queries and dashboards. SPL pipes commands: search, where, stats count by, timechart, eval, rex. Data models and CIM normalize fields for correlation. Alerts trigger on schedules or real time; Enterprise Security adds SIEM use cases.","y":"Common in large enterprises and government security operations.","m":"Mistake: ingesting everything and exceeding license. Tip: filter noisy sources at the forwarder.","k":["Forwarder | An agent on servers that sends logs to Splunk. Universal forwarders are lightweight; heavy forwarders can parse and filter.","Indexer | The Splunk component that stores data in indexes and answers searches.","Search head | The component users log in to for searches, dashboards and alerts.","SPL | Search Processing Language: commands chained with pipes, for example search error | stats count by service | sort -count.","Sourcetype | Tells Splunk how to parse a data stream (timestamp, fields). Correct sourcetypes avoid broken events.","CIM | Common Information Model, a standard set of field names that lets searches work across different data sources.","Alert | A saved search that runs on a schedule or in real time and triggers actions such as email, ticket or webhook.","Ingest-based licensing | Cost is driven by GB per day. Filter noisy logs at the forwarder and keep verbose logs in cheaper storage."]},{"n":"New Relic APM and distributed tracing","w":"New Relic is an all-in-one observability service.","b":["APM agents show response times, errors and database calls.","Distributed tracing links services.","Dashboards and alerts using NRQL.","Good for quick setup with less infrastructure."],"e":"Find the slowest transactions in the last 24 hours.","d":null,"h":"Agents instrument runtimes (Java, .NET, Node, Python) and report transactions, errors and external calls. Service maps show dependencies. Distributed tracing shows request waterfalls. Browser and mobile monitoring measure real user experience. NRQL queries data and powers dashboards and alert conditions, including SLO tracking.","y":"Fast time to value for application teams.","m":"Mistake: leaving default alert policies noisy. Tip: tailor conditions to SLOs.","k":["APM | Application performance monitoring: measures response times, throughput, errors and slow dependencies from inside the app.","Agent | A library loaded into the application runtime that instruments code automatically with little code change.","Transaction | A monitored unit of work, usually one web request, broken into segments such as database and external calls.","Apdex | A satisfaction score from 0 to 1 based on how many responses are faster than a target threshold.","NRQL | New Relic Query Language, SQL-like, used for dashboards and alert conditions.","Service map | Automatically drawn graph of which services call which, with health indicators.","Real user monitoring | Measures actual page load and interaction timings in users' browsers and mobile apps.","Alert condition and policy | The rule that opens an incident when a metric passes a threshold for a duration, and the grouping that routes it to people."]},{"n":"Prometheus and Grafana","w":"The open-source standard for metrics.","b":["Prometheus scrapes /metrics endpoints and stores time series.","PromQL queries them.","Grafana builds dashboards and alerts.","Kubernetes exposes many metrics by default."],"e":"rate(http_requests_total{code=\"500\"}[5m])","d":{"t":"flow","n":["Service /metrics","Prometheus","Grafana dashboards","Alertmanager"]},"h":"Prometheus uses a pull model: services expose /metrics; it scrapes at intervals and stores time series with labels. PromQL computes rates, quantiles and aggregates. Alertmanager deduplicates and routes alerts. Grafana visualizes many data sources and supports alerts and annotations. In Kubernetes, use kube-state-metrics, node exporter and ServiceMonitors (Prometheus Operator). Long-term storage via Thanos, Mimir or managed Prometheus.","y":"The de facto standard for cloud-native metrics.","m":"Mistake: high-cardinality labels (user IDs) that blow up memory. Tip: label only by bounded values.","k":["Scrape | Prometheus pulls metrics by calling each target's /metrics endpoint at a fixed interval, such as every 30 seconds.","Time series | A series of values over time identified by a metric name and labels.","Counter, gauge, histogram | A counter only goes up (requests), a gauge goes up and down (memory), a histogram buckets values to calculate percentiles.","PromQL | The query language: rate(http_requests_total[5m]) gives requests per second over five minutes.","Alertmanager | Receives alerts from Prometheus, groups and deduplicates them, silences them and routes to email, Slack or paging tools.","Grafana | Dashboard and alerting tool that reads from Prometheus and many other data sources.","ServiceMonitor | A Kubernetes custom resource that tells the Prometheus Operator which services to scrape.","Thanos and Mimir | Add long-term storage, global query and high availability to Prometheus."]},{"n":"Azure Monitor, Application Insights, CloudWatch, X-Ray","w":"Each cloud has built-in monitoring.","b":["Azure Monitor, Log Analytics and Application Insights (queries in KQL).","AWS CloudWatch (logs, metrics, alarms) and X-Ray (tracing).","Enabled with little setup and good baseline.","Combine with third-party tools if needed."],"e":"Application Insights end-to-end transaction view.","d":null,"h":"Azure Monitor collects metrics and logs into Log Analytics; KQL queries; Application Insights provides APM and distributed tracing; alerts and action groups notify. AWS CloudWatch has metrics, Logs Insights, alarms, dashboards; X-Ray traces; Container Insights. They integrate with IAM and require little setup. Use them as the baseline and export to central tools if needed.","y":"Quick wins and native integration.","m":"Mistake: no cost control, since log ingestion is billed. Tip: set sampling, retention and daily caps.","k":["Azure Monitor | The Azure platform for collecting metrics and logs from resources and applications, with alerts and dashboards.","Log Analytics workspace | The store where logs are queried with KQL. Central workspaces simplify security and cost control.","Application Insights | APM for apps: requests, dependencies, exceptions, traces and live metrics.","CloudWatch | AWS service for metrics, logs, alarms and dashboards; Logs Insights runs queries.","X-Ray | AWS distributed tracing that shows service maps and request timelines.","Action group | In Azure, the list of people and automated actions run when an alert fires.","Metric alarm | In CloudWatch, a rule on a metric that moves between OK, ALARM and INSUFFICIENT_DATA states.","Cost control | Log ingestion is billed, so set sampling, retention and daily caps."]},{"n":"Alert design: symptoms over causes, reducing noise","w":"Good alerts wake people only for real problems.","b":["Alert on user-visible symptoms (errors, latency, saturation).","Every alert must be actionable and have a runbook link.","Use severity levels and avoid duplicate alerts.","Review noisy alerts monthly."],"e":"Alert when error rate over 2% for 5 minutes, not on a single CPU spike.","d":null,"h":"Alert on symptoms tied to SLOs (error rate, latency, saturation, traffic) using multi-window burn-rate. Each alert has an owner, severity, clear title, dashboards and runbook link. Use grouping and dedup. Page only for urgent, actionable items; tickets for the rest. Track alert quality (noise ratio) and delete or tune weak alerts.","y":"Alert fatigue causes missed real incidents.","m":"Mistake: alerts on every metric threshold. Tip: ask 'what action would I take?' before creating one.","k":["Symptom-based alert | Fires on what users feel, such as error rate or latency. Preferred because it catches real impact whatever the cause.","Cause-based alert | Fires on an internal signal such as high CPU. Often noisy because high CPU is not always a problem.","Golden signals | Latency, traffic, errors and saturation; four measurements that describe the health of most services.","Burn-rate alert | Fires when the error budget is being consumed too fast, for example 2 percent of the monthly budget in one hour.","Severity | Urgency classification: page now, ticket for working hours, or information only.","Runbook link | Every alert should link to instructions and a dashboard so the responder knows what to do.","Deduplication and grouping | Combine many related alerts into one notification.","Alert fatigue | When too many low-value alerts train people to ignore them, so real incidents are missed."]},{"n":"Log retention, cost and sampling","w":"Observability data costs real money.","b":["Decide retention by value (hot 7 days, archive 1 year).","Sample traces; drop debug logs in production.","Control high-cardinality metrics.","Keep audit logs as long as regulations require."],"e":"Sampling 10% of traces cuts cost with little loss.","d":null,"h":"Costs scale with volume and cardinality. Strategies: sampling (head or tail-based for traces), log levels per environment, drop health-check noise, aggregate metrics, tiered storage, compression, and retention aligned to need (security 1 year, debug 7 days). Review top ingest sources monthly and attach cost to teams.","y":"Observability bills can rival compute bills.","m":"Mistake: keeping everything 'just in case'. Tip: define data value tiers.","k":["Sampling | Keeping only a fraction of data. Head sampling decides at the start of a trace; tail sampling decides after the whole trace is seen, keeping errors and slow traces.","Log level | DEBUG, INFO, WARN, ERROR; production usually runs at INFO or above to limit volume.","Retention | How long data is kept. Security logs may need a year or more, debug logs only days.","Tiered storage | Recent data on fast storage and older data on cheaper storage with slower queries.","Cost allocation | Attributing observability spend to the team that produced the data.","Drop and filter rules | Remove noise such as health-check logs before they are stored.","Ingest volume | GB per day, usually the main cost driver.","Metrics aggregation | Pre-aggregating high-volume metrics reduces storage while keeping dashboards useful."]}]},{"n":"Incident debugging","d":"Resolving production issues in distributed systems.","s":[{"n":"Incident response roles and communication","w":"Organized response shortens incidents.","b":["Roles: incident commander, technical lead, communications.","Declare severity, open one channel, keep a timeline.","Mitigate first (rollback, failover), investigate second.","Regular updates to stakeholders."],"e":"Rolled back the release in 10 minutes, root cause found the next day.","d":{"t":"flow","n":["Detect","Declare","Mitigate","Resolve","Post-mortem"]},"h":"Process: detect (alert), triage and declare severity, assign an incident commander, create a channel and ticket, assess impact, mitigate (rollback, failover, scale, disable feature), communicate on a schedule to stakeholders and customers, resolve, then hold a post-incident review. Keep a timeline of actions. The commander coordinates and does not debug.","y":"Clear roles prevent chaos under pressure.","m":"Mistake: everyone debugging in parallel without coordination. Tip: practice with drills.","k":["Severity (SEV1 to SEV4) | A rating of customer and business impact that decides who is paged and how fast. SEV1 is a major outage.","Incident commander | The person who coordinates the response, makes decisions and assigns tasks; does not debug personally.","Communications lead | Writes updates for stakeholders and customers on a fixed schedule.","Mitigation | An action that stops the impact quickly, such as rollback, failover, scaling or disabling a feature, before the root cause is known.","Root cause | The underlying reason the failure happened; usually several contributing factors.","Status page | A public or internal page showing current incident state.","War room | A dedicated call or chat channel for the incident so information stays in one place.","Timeline | A running log of observations and actions with timestamps, used for the post-incident review."]},{"n":"Debugging proxy and sidecar failures","w":"When service calls fail, look at the proxy layer.","b":["Check Envoy response flags and upstream health.","Verify routing rules, DNS and endpoints.","Check certificate expiry and mTLS mode mismatch.","Compare behavior with and without the sidecar."],"e":"503 UF after enabling STRICT mTLS means a client outside the mesh.","d":null,"h":"Steps: confirm which hop fails using traces; check proxy access logs for response flags; examine upstream endpoints and health; inspect route and destination rules; verify mTLS settings and certificate validity; check resource limits (proxy CPU/memory), and connection pool settings; test with and without sidecar bypass. Compare behavior between clusters or namespaces.","y":"Mesh layers hide failures that look like application bugs.","m":"Mistake: blaming the app first. Tip: gather proxy evidence before changes.","k":["Sidecar proxy | The Envoy container next to the service that handles its traffic. Failures can come from the proxy as well as the app.","Response flag | A short code in Envoy access logs explaining why a request failed, for example UF (upstream connection failure) or NR (no route).","Upstream | The service that the proxy is calling.","Outlier ejection | The proxy temporarily removes endpoints that return repeated errors; if all are ejected you get no healthy upstream.","mTLS mismatch | One side requires mutual TLS and the other sends plain text, causing connection resets.","Certificate expiry | A frequent cause of sudden failures; monitor certificate lifetimes.","Connection pool exhaustion | Too many open or pending connections hit configured limits and requests are rejected.","Bypass test | Calling the service without the proxy to see whether the proxy or the app is at fault."]},{"n":"Cross-service authentication and token issues","w":"Identity failures often look like random 401s and 403s.","b":["Check token expiry and clock skew.","Verify issuer, audience and signature keys.","Check scopes, roles and policies.","Trace the request hop by hop to find where identity is lost."],"e":"JWT audience mismatch after a gateway change.","d":{"t":"flow","n":["Client token","Gateway validates","Service validates","Policy allows?"]},"h":"Checklist: token valid and unexpired? clock skew? correct issuer and audience? signing keys rotated (JWKS cache)? required scopes and roles? network path and TLS trust (CA bundle) correct? header stripped or altered by a proxy? service-to-service identity mismatch? Decode JWTs (jwt.io offline), inspect gateway logs and follow correlation IDs.","y":"Auth failures cascade across systems and are easy to misdiagnose.","m":"Mistake: logging full tokens. Tip: log token claims metadata like subject and expiry only.","k":["401 vs 403 | 401 means the caller is not authenticated; 403 means authenticated but not allowed.","JWKS | JSON Web Key Set, the public keys a service downloads to verify token signatures. Cached keys can go stale after rotation.","Clock skew | Differences between clocks make tokens look expired or not yet valid. Keep time synced with NTP.","Audience (aud) | The intended recipient of a token. A token for API A is rejected by API B.","Issuer (iss) | Who issued the token; services must verify it matches the expected authority.","Scope and role claims | Permissions embedded in the token; missing claims cause 403 errors.","Token propagation | Passing the user's identity through downstream calls so each service can authorize correctly.","Trust store | The set of certificate authorities a client trusts; a missing CA causes TLS errors."]},{"n":"Staging vs production configuration drift","w":"Many 'works in staging' bugs are config differences.","b":["Compare environment variables, feature flags, secrets, versions and limits.","Keep configuration in code and diff it automatically.","Make staging resemble production in size and settings.","Avoid manual changes."],"e":"Production had a lower connection pool limit than staging.","d":null,"h":"Compare environment variables, secrets, feature flags, DNS, network rules, instance sizes, database settings, library versions and data volume. Differences in TLS settings or proxy behavior are classic causes. Use IaC and config management to detect and block drift; run the same pipeline artifacts; seed staging with production-like scale.","y":"Prevents 'works in staging' surprises.","m":"Mistake: manual hotfixes in production. Tip: reproduce and fix in code, then redeploy.","k":["Configuration drift | Environments gradually differ because of manual changes or uncoordinated updates.","Feature flag state | A flag on in staging and off in production changes behavior.","Secret mismatch | Different credentials or expired secrets per environment.","Infrastructure parity | Keeping the shape of staging close to production, such as the same proxy and network setup.","Config as code | Settings stored in version control and promoted, not edited by hand.","Diff tooling | Tools that compare environment variables, flags and infrastructure between environments.","Resource limits | Different CPU, memory or connection limits can hide or create failures.","Data volume difference | Production data size reveals slow queries that tiny test data never shows."]},{"n":"Timeouts, retries and cascading failure analysis","w":"Failures amplify when callers retry.","b":["Slow service causes callers to wait and retry.","Retries add load and make it slower.","Fix with timeouts, limited retries with backoff, circuit breakers and load shedding.","Look at traces and queue depth."],"e":"One slow database caused thread pools to fill in five services.","d":{"t":"flow","n":["Slow dependency","Retries pile up","Overload","Cascading failure"]},"h":"Pattern: dependency slows, callers wait, thread pools and connections exhaust, queues grow, health checks fail and orchestrators restart pods, increasing load. Mitigation: timeouts, bulkheads, circuit breakers, backoff, limiting concurrency, shedding load and graceful degradation. In analysis, look for the first service that degraded using traces and resource graphs.","y":"Most large outages are cascading failures.","m":"Mistake: scaling out a failing dependency's callers, which adds pressure. Tip: reduce traffic first.","k":["Cascading failure | A failure in one component overloads others until large parts of the system fail.","Retry storm | Many callers retry a struggling service and make the overload worse.","Thread pool exhaustion | All worker threads wait on a slow dependency, so new requests cannot be served.","Queue backlog | Work arrives faster than it is processed, growing latency.","Backpressure | Slowing or rejecting producers when consumers cannot keep up.","Graceful degradation | Reduce features, such as serving cached data, instead of failing completely.","Load shedding | Drop low-priority requests to protect critical ones.","Dependency map | A diagram of what depends on what, helping find the first component that degraded."]},{"n":"Blameless post-mortems and action tracking","w":"Learning from incidents prevents repeats.","b":["Blameless: focus on system and process.","Timeline, impact, root causes, what went well, actions.","Actions have owners and dates and are tracked.","Share findings widely."],"e":"Action: add alert on certificate expiry 30 days ahead.","d":null,"h":"Blameless review: facts timeline, customer impact, detection and response time, root and contributing causes (five whys), what worked and what did not, action items with owners and due dates, and lessons shared. Categories: prevent, detect, mitigate. Track completion in a backlog and review trends.","y":"Learning prevents recurrence.","m":"Mistake: actions that are vague like 'be more careful'. Tip: choose specific, testable system changes.","k":["Blameless review | A culture that looks for system and process causes, not individuals to blame, so people share facts honestly.","Five whys | Asking why repeatedly to move from symptom to underlying cause.","Contributing factor | A condition that made the incident possible or worse, such as missing alerts.","Action item | A specific, owned, dated follow-up. Vague actions like be more careful do not count.","Detect, mitigate, prevent | Categories of improvements: find problems sooner, reduce impact, stop recurrence.","MTTD | Mean time to detect.","MTTR | Mean time to restore service.","Near miss | A problem that was caught before customer impact; also worth reviewing."]},{"n":"Reproducing issues safely","w":"Reproduce without hurting users.","b":["Use recorded or synthetic requests in a test environment.","Mask production data.","Use feature flags or shadow traffic.","Write a regression test for the bug."],"e":"Replay a captured request against staging.","d":null,"h":"Capture failing requests with correlation IDs, replay them in a safe environment, use traffic mirroring or shadowing, reproduce with debug logging enabled for a sample, and use feature flags to isolate. Mask data when copying. Write an automated regression test that fails before the fix and passes after.","y":"Prevents testing on customers and ensures a real fix.","m":"Mistake: debugging on production with broad access. Tip: use read-only diagnostics and audited break-glass.","k":["Correlation ID | An identifier added to a request and logged by every service, so you can follow one request across systems.","Traffic replay | Re-sending captured production requests to a test environment to reproduce a bug.","Shadowing | Mirroring live traffic to a new version without returning its responses to users.","Data masking | Hiding sensitive values in data copied for debugging.","Regression test | An automated test that fails before the fix and passes after, so the bug cannot return.","Read-only diagnostics | Investigating through logs and metrics without changing production.","Break-glass access | Emergency privileged access that is time-limited and fully audited.","Reproduction steps | A reliable recipe to trigger the issue, the biggest step toward the fix."]}]},{"n":"Operational excellence","d":"Run the platform sustainably.","s":[{"n":"Runbooks and playbooks","w":"Runbooks make responses repeatable.","b":["Short, step-by-step instructions linked from alerts.","Include checks, commands, rollback and escalation.","Test them in drills; update after incidents.","Automate steps that are always the same."],"e":"Runbook: 'Queue backlog high' with 5 steps.","d":null,"h":"A good runbook has: trigger (alert name), impact, quick checks, step-by-step actions, rollback, escalation contacts, and links to dashboards. Keep it in the same repo or wiki as alerts and review after each use. Automate steps into scripts or chatbots (ChatOps) and eventually remove the need (self-healing).","y":"Reduces time to recovery and stress.","m":"Mistake: outdated runbooks. Tip: update immediately after incidents.","k":["Runbook | Step-by-step instructions for handling a known alert or task: how to check, what commands to run, how to roll back and whom to call. A good runbook lets a tired engineer act at 3 a.m. without guessing.","Playbook | A higher-level plan for a type of event, such as a security breach or regional outage, that links to the detailed runbooks.","ChatOps | Running operations through chat commands so actions are visible and shared, improving learning and audit.","Self-healing automation | Scripts that detect a known fault and fix it, for example restarting a hung worker, so humans handle only new problems.","Ownership and review | Each runbook has an owning team and a review date, and is updated after every incident."]},{"n":"On-call rotations and escalation","w":"Sustainable on-call keeps people healthy.","b":["Rotation of 6+ people where possible.","Clear escalation tiers.","Time off after major incidents.","Track alert load per shift."],"e":"Primary and secondary on-call with a manager escalation.","d":null,"h":"Practices: follow-the-sun or small rotas, weekly handover notes, primary and secondary roles, clear severity and paging policy, compensation or time off, and training with shadow shifts. Track pages per shift and aim for fewer than a couple actionable pages per night. Use postmortems to reduce load.","y":"Burnout causes attrition and poor decisions.","m":"Mistake: relying on heroes. Tip: spread knowledge and fix recurring pages.","k":["Primary and secondary on-call | The primary responds first; the secondary is the backup if there is no answer, so no page is missed.","Follow-the-sun rotation | Teams in different time zones hand over duty so nobody works nights routinely.","Paging policy | Page only for urgent, user-impacting and actionable issues; everything else becomes a ticket for working hours.","Handover notes | A short summary of open issues and risks given at each shift change.","Sustainable load | Track pages per shift; more than a couple of actionable pages a night leads to burnout and attrition."]},{"n":"Capacity planning and forecasting","w":"Know when you will run out of room.","b":["Track growth trends of users, data, cost.","Forecast quarterly and add buffer.","Plan for lead times (quota requests, reservations).","Review before peak events."],"e":"Request more regional quota 6 weeks before launch.","d":null,"h":"Gather historical usage (CPU, memory, storage, requests), identify growth rate and seasonal peaks, forecast demand, compare with capacity and quota, and plan purchases (reservations), scaling steps and architecture changes. Include the human capacity (team size) and cost forecasts. Review quarterly and before major launches.","y":"Avoids both outages and overspending.","m":"Mistake: planning only on average usage. Tip: plan on peak plus headroom.","k":["Baseline and trends | Capture normal usage over time so growth and seasonality are visible.","Forecasting | Combine historical trends with business plans such as a marketing campaign to predict future demand.","Lead time for capacity | Quotas, reservations and hardware can take days or weeks, so plan before you need them.","Headroom | Spare capacity, typically 30 to 50 percent, for spikes and component failure.","Planned peaks | Events such as open enrollment or month-end are scheduled and should be tested in advance."]},{"n":"FinOps: tagging, budgets, rightsizing, reservations","w":"FinOps keeps cloud cost under control.","b":["Tag by owner, product and environment.","Budgets and anomaly alerts.","Rightsize idle or oversized resources.","Buy reservations or savings plans for steady use.","Show each team its own cost."],"e":"Cost report per product shows a forgotten test cluster.","d":{"t":"flow","n":["Visibility (tags)","Optimize (rightsize, reserve)","Operate (budgets, review)"]},"h":"FinOps lifecycle: Inform (visibility, allocation, showback), Optimize (rightsizing, deleting idle, commitment discounts, spot, storage tiering, architecture efficiency), Operate (governance, budgets, forecasting). Measure unit costs, for example cost per member per month. Create a cross-functional FinOps team with engineering, finance and product.","y":"Controls cloud spend while supporting growth.","m":"Mistake: central team cutting costs without engineer input. Tip: give teams their own cost dashboards and targets.","k":["FinOps | A cultural practice in which engineering, finance and product share responsibility for cloud cost and treat it as an engineering metric.","Showback and chargeback | Showback reports cost to each team; chargeback actually bills them. Both create accountability.","Rightsizing | Reducing resources that are oversized compared to measured usage.","Commitment discounts | Reservations and savings plans that give large discounts in exchange for 1 to 3 year commitments on steady workloads.","Unit economics | Cost per business unit such as per member or per transaction, which shows efficiency better than total spend."]},{"n":"Change management and release calendars","w":"Safe change reduces incidents.","b":["Record changes and review risk.","Avoid risky changes at peak times.","Automate approvals for standard changes.","Track change failure rate."],"e":"Standard patch window every Tuesday night.","d":null,"h":"Classify changes: standard (pre-approved, automated), normal (reviewed) and emergency. Use CI/CD evidence as approval for low-risk changes. Maintain a shared calendar and freeze periods. Record changes in an ITSM tool via integration. Review failed changes and adjust.","y":"Balances speed with stability.","m":"Mistake: heavy CAB meetings for every change. Tip: automate approvals for routine, well-tested changes.","k":["Standard change | Low-risk, well-understood and pre-approved changes, often automated through pipelines, with no meeting needed.","Normal change | A change that is reviewed and approved before it is done.","Emergency change | An urgent fix applied first and reviewed afterward.","Change advisory board | A group that reviews higher-risk changes; keep it small and fast.","Change failure rate | The share of changes that cause incidents; the key measure of whether the process works."]},{"n":"Operational readiness reviews","w":"Check a service before it goes live.","b":["Monitoring and alerts in place.","Runbooks and on-call ready.","Backups, DR and scaling tested.","Security and compliance reviewed.","Support team trained."],"e":"A 30-item readiness checklist signed by owners.","d":null,"h":"Checklist includes: SLOs and dashboards exist, alerts tested, runbooks and on-call, logging and tracing, backup and restore tested, DR plan, capacity and load test, security and compliance review, dependencies and contacts, rollback plan, support training and customer communication. A readiness review meeting signs off or lists risks.","y":"Reduces first-week production surprises.","m":"Mistake: treating launch readiness as optional. Tip: make it part of definition of done.","k":["Operational readiness review | A structured check, before launch, that the service can be run safely.","Monitoring, alerts and runbooks | Dashboards and alerts exist, are tested and link to runbooks.","Backup, DR and capacity tests | Recovery and load handling have been proven, not assumed.","Security and compliance sign-off | Required risks are reviewed and accepted.","Support handover | Support staff are trained and have documentation and escalation paths."]},{"n":"Toil reduction and automation","w":"Toil is manual, repetitive, automatable work.","b":["Measure time spent on toil.","Automate the biggest items first.","Aim for under 50% of team time on toil.","Celebrate removed work."],"e":"Automating user onboarding saved 10 hours a week.","d":null,"h":"Toil is manual, repetitive, automatable, tactical and growing linearly. Measure via surveys or ticket types. Prioritize by time saved and frequency. Automate with scripts, runbook automation (Azure Automation, SSM), self-service portals and fixing root causes. Report toil reduction like features.","y":"Frees engineers for improvement work.","m":"Mistake: automating without maintaining the automation. Tip: treat automation as code with tests and owners.","k":["Toil | Operational work that is manual, repetitive, automatable and grows as the service grows; it provides no lasting value.","Measuring toil | Track time spent on repetitive tasks through tickets and surveys to prioritize automation.","Automation as code | Automation scripts need owners, tests and review like any software, or they rot.","Self-service | Let users do routine requests themselves through portals or pipelines.","Fifty percent guideline | Keep toil below half of an engineer's time so improvement work can happen."]}]}]},{"p":"Phase 6 - Data Platforms & Analytics (Weeks 18-22)","why":"Why: data and AI strategy is a major part of the Azure role.","t":[{"n":"Data processing & orchestration","d":"Engines and pipeline tooling.","s":[{"n":"Spark architecture, DataFrames, partitioning, tuning","w":"Spark processes big data in parallel.","b":["Driver plans the job; executors do the work on partitions.","DataFrames give a table-like API in Python, Scala or SQL.","Shuffles (joins, group by) are expensive; reduce them.","Watch skew (one huge partition) and small files."],"e":"Join two large tables on a key after repartitioning by that key.","d":{"t":"flow","n":["Driver","Splits into tasks","Executors process partitions","Result"]},"h":"A Spark job is split into stages separated by shuffles; each stage into tasks, one per partition. Narrow transformations (map, filter) stay within a partition; wide ones (join, groupBy) shuffle. Optimization: broadcast small tables in joins, partition on keys, avoid skew with salting, use columnar formats (Parquet), cache wisely, and tune executors and shuffle partitions. Adaptive Query Execution helps automatically.","y":"Core engine for big data at scale.","m":"Mistake: collecting big data to the driver. Tip: keep processing distributed and look at the Spark UI.","k":["Driver and executor | The driver plans the job; executors on worker nodes run tasks on partitions of data.","DataFrame | A distributed table abstraction with named columns, optimized by Spark's engine.","Partition | A chunk of data processed by one task. Too few partitions waste cores; too many create overhead.","Shuffle | Redistributing data across nodes for joins and group-bys; the most expensive operation.","Broadcast join | Sending a small table to every node so the large table needs no shuffle.","Data skew | A few keys hold most of the data, so some tasks run far longer than others.","Parquet | Columnar file format with compression, ideal for analytics because only needed columns are read.","Spark UI | Web interface showing stages, tasks, skew and memory, essential for tuning."]},{"n":"Databricks workspaces, clusters, Unity Catalog, Delta Live Tables","w":"Databricks is managed Spark with a lakehouse platform.","b":["Workspace: notebooks, jobs, repos.","Clusters: compute; use job clusters and autoscaling.","Unity Catalog: central governance of data and AI assets.","Delta Live Tables: declarative pipelines with quality checks."],"e":"A DLT pipeline moves bronze to silver with expectations on data quality.","d":null,"h":"Databricks features: notebooks, jobs and workflows, repos, Delta Lake, Photon engine, auto-scaling clusters, SQL warehouses, MLflow, Unity Catalog with three-level namespace (catalog.schema.table), lineage, fine-grained permissions. Delta Live Tables define pipelines with expectations (quality rules). Use job clusters and cluster policies to control cost.","y":"Popular unified platform for data engineering and ML.","m":"Mistake: long-running all-purpose clusters left on. Tip: use jobs compute and auto-termination.","k":["Workspace | The Databricks environment holding notebooks, jobs and data access.","All-purpose vs job cluster | Interactive cluster for development vs a cluster created for one scheduled job and terminated, which is cheaper.","Delta Lake | A storage layer adding ACID transactions, schema enforcement and time travel to data lake files.","Unity Catalog | Central governance for data and AI assets: permissions, lineage and auditing across workspaces.","Delta Live Tables | Declarative pipelines with built-in data quality expectations and automatic orchestration.","Photon | A faster vectorized query engine for SQL and DataFrame workloads.","Cluster policy | Admin rules that limit cluster size and settings to control cost.","Auto-termination | Shuts down idle clusters automatically."]},{"n":"Airflow DAGs, operators, scheduling, sensors","w":"Airflow schedules and tracks workflows.","b":["DAG: tasks and dependencies written in Python.","Operators do work; sensors wait for conditions.","Retries, SLAs and alerts per task.","Keep tasks small, idempotent and avoid heavy logic in the scheduler."],"e":"Extract, transform, load, then notify as four tasks.","d":{"t":"flow","n":["Extract","Transform","Load","Notify"]},"h":"A DAG file defines tasks with operators (Bash, Python, Kubernetes pod, cloud operators), dependencies and schedule. The scheduler queues tasks, executors (Celery, Kubernetes) run them. XCom passes small data between tasks; large data goes to storage. Sensors wait on files or external events (prefer deferrable). Use retries, SLAs, pools for concurrency limits, and idempotent tasks with logical dates.","y":"Standard for batch workflow orchestration.","m":"Mistake: heavy compute inside Airflow workers. Tip: Airflow orchestrates; heavy work runs in Spark/warehouse.","k":["DAG | A directed acyclic graph: tasks with dependencies and no cycles.","Operator | A template for a unit of work, such as running SQL, a Spark job or a Kubernetes pod.","Sensor | A task that waits for a condition, such as a file arriving.","XCom | A mechanism to pass small pieces of data between tasks; large data belongs in storage.","Scheduler and executor | The scheduler decides what runs when; executors (Celery, Kubernetes) run the tasks.","Backfill | Running a DAG for past dates to fill history or reprocess after a fix.","Idempotent task | A task that produces the same result when rerun, so retries are safe.","Deferrable operator | Waits without holding a worker slot, saving resources."]},{"n":"dbt models, tests, snapshots, documentation","w":"dbt brings software practice to SQL transformations.","b":["Models are SELECT statements in files.","Tests check unique, not null, relationships.","Docs and lineage graph are generated.","Snapshots capture history of changing rows."],"e":"stg_claims to fct_claims with not_null tests on claim_id.","d":{"t":"flow","n":["Sources","Staging models","Marts","BI"]},"h":"dbt compiles Jinja-templated SQL models into a dependency graph and runs them in the warehouse as views, tables or incremental models. Tests (unique, not_null, accepted_values, relationships) validate data. Sources and freshness checks, seeds, snapshots (SCD type 2), macros and packages. dbt docs generate a catalog and lineage site. Run in CI with slim builds on changed models.","y":"Brings version control, testing and documentation to analytics engineering.","m":"Mistake: giant models. Tip: layer models into staging, intermediate and marts.","k":["Model | A SELECT statement saved in a file that dbt turns into a view or table.","Materialization | How a model is built: view, table, incremental (only new rows) or ephemeral.","ref() | Function that references another model, letting dbt build the dependency graph.","Test | An assertion such as unique, not_null, accepted_values or relationships that validates data.","Source freshness | Checks that raw data arrived on time.","Snapshot | Tracks changes to a table over time, implementing slowly changing dimensions.","Macro | Reusable Jinja code to avoid repeating SQL.","Lineage graph | Generated diagram showing how models depend on each other."]},{"n":"AWS Glue jobs, crawlers, catalog","w":"Glue is AWS's serverless data integration.","b":["Crawlers infer schema; Data Catalog stores table definitions.","ETL jobs in Spark or Python shell.","Works with S3, Redshift and Athena.","Workflows and triggers orchestrate jobs."],"e":"Crawl S3 files and query them in Athena.","d":null,"h":"Glue Data Catalog stores table metadata used by Athena, EMR and Redshift Spectrum. Crawlers detect schema and partitions. ETL jobs run Spark (or Python shell, Ray) with job bookmarks for incremental loads and DynamicFrames for schema flexibility. Glue workflows and triggers chain jobs; Glue Data Quality adds rules. Costs depend on DPU-hours; tune worker types.","y":"Serverless ETL for S3-based lakes.","m":"Mistake: crawlers creating messy schemas. Tip: define tables explicitly for critical data.","k":["Glue Data Catalog | A central metadata store of databases and tables used by Athena, EMR, Redshift Spectrum and Glue.","Crawler | Scans data in S3 to infer schemas and partitions and update the catalog.","Glue job | A Spark or Python script that transforms data, run serverlessly.","Job bookmark | Remembers which data was already processed so reruns handle only new data.","DynamicFrame | Glue's flexible data structure that handles inconsistent schemas.","DPU | Data processing unit, the compute measure that Glue bills by.","Workflow and trigger | Chain jobs and crawlers by schedule or events.","Athena | Serverless SQL over S3 using the Glue catalog; pay per data scanned."]},{"n":"Batch vs streaming (Structured Streaming, Kafka)","w":"Choose how fresh the data must be.","b":["Batch: periodic, simpler and cheaper.","Streaming: continuous with seconds of latency; handles late data and state.","Micro-batch is a middle option.","Use streaming only when the business needs it."],"e":"Fraud alerts need streaming; monthly reports do not.","d":{"t":"vs","lt":"Batch","l":["Hourly or daily","Simple","Cheaper"],"rt":"Streaming","r":["Seconds","Complex state","Higher cost"]},"h":"Batch handles large volumes with simple retry semantics; latency minutes to hours. Streaming processes events continuously with windowing (tumbling, sliding, session), watermarks for late data, state stores and exactly-once sinks. Kafka plus Spark Structured Streaming or Flink are common. Lambda and Kappa architectures combine or unify both. Choose latency requirement, complexity budget and team skills.","y":"Streaming adds big complexity; use it only when value is clear.","m":"Mistake: building streaming for dashboards refreshed daily. Tip: ask for the real freshness requirement.","k":["Batch processing | Processes accumulated data on a schedule. Simpler and cheaper; latency of minutes to hours.","Streaming | Processes events continuously with seconds of latency.","Micro-batch | Processes small batches every few seconds; the model of Spark Structured Streaming.","Window | A time bucket (tumbling, sliding, session) used to aggregate streaming data.","Watermark | How long the system waits for late events before closing a window.
