n & Certifications (parallel / Weeks 39+)","why":"Why: proof of knowledge and domain context.","t":[{"n":"Stop Loss platform domain","d":"Insurance domain context.","s":[{"n":"Stop loss insurance basics: specific and aggregate","w":"Stop loss protects self-funded employers.","b":["The employer pays employee health claims itself.","Specific stop loss: pays when one person's claims exceed a limit.","Aggregate stop loss: pays when total claims exceed a limit.","Premium paid to the carrier."],"e":"Specific limit 250K per person per year.","d":{"t":"vs","lt":"Specific","l":["Per individual","Protects against big single claims"],"rt":"Aggregate","r":["Whole group","Protects against high total"]},"h":"Self-funded (self-insured) employers pay claims from their own funds and buy stop loss for protection. Specific stop loss covers claims above a per-person limit (for example 250,000) within a contract period. Aggregate stop loss covers when total plan claims exceed an aggregate attachment point, typically 125% of expected claims. Policies define covered benefits, contract basis (12/12, 12/15, 24/12) and terminal liability options.","y":"Core product concept for the platform.","m":"Mistake: confusing stop loss with fully insured health plans. Tip: draw the payment flow with all parties.","k":["Self-funded plan | The employer pays employee health claims from its own funds instead of buying full insurance.","Specific stop loss | Reimburses the employer for claims above a deductible for any one person in the period.","Aggregate stop loss | Reimburses when total claims for the whole group exceed an annual limit.","Contract basis | Defines which claims count, such as incurred and paid 12/12 or 12/15, which affects who pays for late claims.","Premium | The price of the coverage, set by underwriting."]},{"n":"Attachment points, deductibles, corridors","w":"Limits define who pays what.","b":["Attachment point or deductible: amount employer pays first.","Corridor: extra amount before aggregate pays.","Contract basis (incurred vs paid, run-in, run-out).","Lasers: higher limit for named individuals."],"e":"Employer pays first 250K; carrier reimburses above.","d":{"t":"layers","n":["Claims above limit: carrier pays","Attachment point 250K","Claims below: employer pays"]},"h":"Specific deductible (attachment point) is what employer pays per individual before reimbursement. Aggregate attachment point equals expected claims times a factor. Corridor is a gap above expected claims before aggregate kicks in. Lasers set higher deductibles for known high-cost individuals. Reimbursement is claims paid in excess of limits subject to policy terms, coinsurance and maximums.","y":"Determines system calculations and reports.","m":"Mistake: hardcoding rules in many places. Tip: model terms as configurable data.","k":["Attachment point | The amount the employer pays before reimbursement begins.","Specific deductible | The attachment point per person.","Aggregate attachment | The group threshold, often about 125 percent of expected claims.","Corridor | An extra amount the employer bears before aggregate coverage pays.","Laser | A higher deductible applied to a named high-risk individual."]},{"n":"Claims lifecycle and reimbursement","w":"Claims flow from TPA to carrier.","b":["TPA pays claims and reports them.","Employer submits reimbursement requests.","Carrier reviews against contract and issues payment.","Watch filing deadlines and dispute processes."],"e":"A large transplant claim exceeds the specific limit and is reimbursed.","d":{"t":"flow","n":["Member claim","TPA pays","Submit to carrier","Review","Reimburse"]},"h":"Flow: member receives care, TPA adjudicates and pays claim (employer funds), TPA reports large claims, employer or TPA submits reimbursement request with documentation, carrier claims team reviews eligibility, medical necessity, exclusions and limits, pays or denies, and tracks payments and recoveries. Monitor timely filing limits and disputes. Notice of large claimant helps underwriting.","y":"Key business workflow to automate.","m":"Mistake: poor audit trails. Tip: record every decision and document for compliance.","k":["TPA | Third-party administrator that processes claims on behalf of the employer.","Claim adjudication | Deciding whether and how much to pay under plan rules.","Reimbursement request | The employer or TPA submits documents to the carrier for claims above limits.","Exclusions and eligibility | Checks that the claim is covered and the person was eligible.","Timely filing | Deadlines for submission that cause denials if missed."]},{"n":"Reinsurance and underwriting concepts","w":"Pricing needs data.","b":["Underwriters price using claims history, demographics and large claimants.","Reinsurers share the carrier's risk.","Data quality affects price.","Models assist but need explainability."],"e":"Large claimant history drives the renewal rate.","d":null,"h":"Underwriters use census data, claims experience, large claimant reports, plan design and trend assumptions to price premiums and set terms. Reinsurers take a portion of carrier risk (quota share or excess of loss), requiring reporting. Data quality and timely submissions affect pricing. Predictive models may support pricing and risk selection with governance.","y":"Data platform and analytics requirements arise here.","m":"Mistake: unreliable data pipelines for underwriting. Tip: implement validation and lineage.","k":["Underwriting | Assessing risk to set price and terms.","Census | A list of employees and dependents with demographics.","Large claimants | Members with very high claims whose costs shape price.","Experience rating | Pricing based on past claims.","Reinsurance | Insurance purchased by the insurer to spread risk."]},{"n":"Premium, billing and policy administration","w":"Core insurance capabilities.","b":["Quote, bind and issue policies.","Calculate and bill premiums; endorsements; renewals.","Manage producers and commissions.","Documents and notifications."],"e":"Capability map: Quote, Policy, Billing, Claims, Reporting.","d":null,"h":"Capabilities: quoting and rating, application and underwriting workflow, policy issuance and endorsements, premium billing and collections, producer/broker management and commissions, claims, reinsurance reporting, document management, customer portals, and regulatory reporting. Map capabilities to bounded contexts and services.","y":"Foundation for domain-driven architecture.","m":"Mistake: designing around current systems instead of capabilities. Tip: start from business events and capabilities.","k":["Quote and bind | Offer a price, then accept coverage.","Issuance | Create the policy documents.","Endorsement | A change during the term.","Renewal | A new term with updated price and terms.","Billing | Premium invoices, payments and collections."]},{"n":"Regulatory and data privacy requirements (HIPAA)","w":"Health data is protected.","b":["HIPAA covers protected health information.","Minimum necessary access; encryption; audit logs.","Business associate agreements with vendors.","Breach notification."],"e":"Mask diagnosis in non-production.","d":null,"h":"HIPAA applies to PHI handled by covered entities and business associates. Requirements: administrative, physical and technical safeguards, minimum necessary use, access control, encryption, audit logging, BAAs with vendors, risk analysis, breach notification, and employee training. State insurance regulations and filing rules also apply.","y":"Violations carry heavy penalties.","m":"Mistake: using production PHI in lower environments. Tip: de-identify and restrict access.","k":["HIPAA | US law protecting health information.","PHI | Protected health information such as diagnoses and claims.","Business associate | A vendor handling PHI for a covered entity, bound by agreement.","Minimum necessary | Limit access to what each role needs.","Breach notification | Report incidents within required time."]},{"n":"Integration with TPAs and claims systems","w":"Integrations are a major part of the platform.","b":["TPAs send claims and eligibility data (files, APIs, EDI).","Validate and map to your model.","Reconcile counts and amounts.","Handle corrections and late data."],"e":"Nightly claims file with an acknowledgment and error report.","d":null,"h":"Integrations: TPAs send eligibility, claims and large claim reports through SFTP, APIs or EDI (X12 834, 837, 835); employers send enrollment; brokers use portals; payments with banks; reinsurers need bordereaux. Standardize with canonical models, validation and reconciliation. Provide status tracking and error resolution workflows.","y":"Integration quality drives platform reliability.","m":"Mistake: point-to-point custom mappings for every partner. Tip: use canonical model and configurable mappings.","k":["Eligibility and claims files | Who is covered and what was paid.","EDI formats | X12 834 enrollment, 837 claims and 835 payments.","Canonical model | A common internal format that partner formats map to.","Reconciliation | Compare totals to the source to catch loss.","Error resolution | A process to fix rejected records."]}]},{"n":"Federal government context","d":"Working with agency clients.","s":[{"n":"Agency delivery models and contracts","w":"Federal work has its own rules.","b":["Contract types and vehicles; formal deliverables.","Reviews and approvals.","Security and compliance requirements in the contract.","Reporting cadence."],"e":"Monthly status report and milestone reviews.","d":null,"h":"Federal contracting includes types such as firm fixed price, time and materials, and cost-plus; vehicles (GSA schedules, IDIQ, BPAs); and formal deliverables (CDRLs), milestones and reviews. Understand statements of work, contract data requirements, security clauses, personnel requirements and reporting. Work closely with contracts staff.","y":"Understanding the contract shapes delivery and risk.","m":"Mistake: ignoring contractual constraints in design. Tip: map requirements to contract clauses early.","k":["Contract types | Firm fixed price puts cost risk on the contractor; time and materials on the customer; cost-plus reimburses costs plus a fee.","Vehicles | IDIQ, BPA and GSA schedules are ways agencies buy services.","SOW or PWS | The description of the work and deliverables.","Deliverables and milestones | Formal documents and reviews agreed in the contract.","Contracting officer and COR | The person with contractual authority and the technical representative."]},{"n":"Security authorization (ATO, FedRAMP, FISMA)","w":"ATO is permission to operate a system.","b":["Based on NIST RMF: categorize, select controls, implement, assess, authorize, monitor.","Artifacts: System Security Plan, assessment report, POA&M.","FedRAMP for cloud services.","Plan time and staff for documentation."],"e":"ATO package prepared in parallel with development.","d":{"t":"flow","n":["Categorize","Select controls","Implement","Assess","Authorize","Monitor"]},"h":"Under the NIST Risk Management Framework: Prepare, Categorize (FIPS 199), Select controls, Implement, Assess, Authorize (ATO), Monitor. Artifacts: SSP, SAR, POA&M, ISCP, privacy impact assessment. Continuous ATO uses automation and ongoing evidence. Inherit controls from authorized cloud platforms. Work with the Authorizing Official and ISSO.","y":"ATO gates go-live for federal systems.","m":"Mistake: starting ATO paperwork at the end. Tip: integrate security engineers from the start.","k":["RMF | The NIST Risk Management Framework: categorize, select controls, implement, assess, authorize and monitor.","SSP and SAR | The system security plan and security assessment report.","POA&M | Plan of action and milestones for remaining weaknesses.","ATO | Authority to Operate, the formal approval to run a system.","Continuous ATO | Ongoing authorization using automation instead of periodic paperwork."]},{"n":"Section 508 accessibility","w":"Accessibility is mandatory.","b":["Follow WCAG 2.1 AA.","Test with screen readers and keyboard.","Include in definition of done.","Provide accessibility conformance reports."],"e":"All form fields have labels and focus order.","d":null,"h":"Section 508 requires ICT accessibility; standard is WCAG 2.0/2.1 AA via Revised 508. Use semantic HTML, alt text, keyboard navigation, color contrast, captions, accessible PDFs. Test with automated tools (axe) and manual checks with screen readers (JAWS, NVDA), and document in an Accessibility Conformance Report (VPAT).","y":"Legal requirement and good practice.","m":"Mistake: relying only on automated scans. Tip: include manual testing and users with disabilities.","k":["Section 508 | The law requiring federal technology to be accessible to people with disabilities.","WCAG 2.1 AA | The technical standard used to meet it.","Assistive technology testing | Test with screen readers and keyboard-only use.","Accessibility conformance report | Documents how the product meets requirements.","Automated plus manual testing | Tools find only part of the issues."]},{"n":"Data sovereignty and GovCloud / Azure Government","w":"Some data must stay in specific clouds.","b":["AWS GovCloud and Azure Government are isolated regions.","US persons and screening requirements.","Check service availability.","Plan networking and identity."],"e":"Deploy to Azure Government for CUI workloads.","d":null,"h":"GovCloud and Azure Government are physically and logically isolated, operated by screened US persons, supporting FedRAMP High, DoD IL4/IL5, ITAR, CJIS. Service availability and feature parity can lag commercial clouds. Separate accounts, networking and identity. Plan for data transfer approvals and tooling differences.","y":"Required for sensitive workloads.","m":"Mistake: assuming all commercial services exist. Tip: check service availability early.","k":["GovCloud and Azure Government | Isolated clouds for US government workloads.","FedRAMP High | The highest baseline for sensitive data.","DoD impact levels | IL4 and IL5 cover controlled and national security data.","ITAR and CJIS | Export control and criminal justice data rules.","Service parity | Some services arrive later than in commercial clouds."]},{"n":"Procurement and compliance terms","w":"Contract clauses affect design.","b":["FAR and DFARS clauses.","Data rights, reporting and supply chain rules.","Involve contracts and legal early.","Document compliance."],"e":"Cloud service must be US-based and FedRAMP authorized.","d":null,"h":"Clauses to know: FAR 52.204 (safeguarding), DFARS 252.204-7012 (cyber incident reporting, CUI), 52.227 (data rights), Buy American/TAA compliance, supply chain risk (Section 889), OCI rules, and subcontracting. Implications: incident reporting timelines, US-based data and personnel, allowed components. Involve legal and contracts teams.","y":"Design and operations must meet contractual obligations.","m":"Mistake: choosing technology that violates clauses. Tip: include a compliance review in design.","k":["FAR and DFARS | Federal and defense acquisition regulations whose clauses become contract requirements.","CUI | Controlled Unclassified Information that must be protected.","Incident reporting | DFARS requires reporting cyber incidents within 72 hours.","Data rights | Who owns data and code produced.","Section 889 | A ban on certain telecommunications vendors."]},{"n":"Working with vendor partners","w":"Delivery spans multiple companies.","b":["Define interfaces and responsibilities.","Shared plan and risk log.","Joint standards and reviews.","Regular alignment."],"e":"Common API contracts with a subcontractor.","d":null,"h":"Partner collaboration: define roles in a RACI, interface contracts (APIs, SLAs), shared repositories and tools with access control, joint planning and risk reviews, integrated CI/CD or hand-off points, common coding and security standards, and escalation paths. Align contractual responsibilities with technical boundaries.","y":"Complex programs involve many vendors.","m":"Mistake: unclear ownership at integration points. Tip: document interfaces and test them jointly.","k":["Prime and subcontractor | The main contractor and its partners.","Interface agreements | Define APIs and responsibilities.","Shared repositories | Common code locations with access control.","Joint risk reviews | Combined planning and escalation.","Integration testing | Validate interfaces together."]}]},{"n":"Certification order","d":"Suggested path.","s":[{"n":"AZ-900 Azure Fundamentals","w":"Start with fundamentals.","b":["Cloud concepts, services, security, pricing.","Free Learn path and practice assessment.","1-2 weeks.","Builds vocabulary."],"e":"Pass AZ-900 first.","d":null,"h":"Exam content: cloud concepts (benefits, models), core Azure architecture (regions, resource groups, compute, networking, storage, identity), management and governance (cost management, Policy, Blueprints/Landing zones, Monitor, Service Health). Study plan: Learn path (about 10 hours), flashcards, practice assessment, schedule exam.","y":"Fast credential that confirms foundational knowledge.","m":"Mistake: overstudying. Tip: aim to pass within two weeks and move on.","k":["AZ-900 | Azure Fundamentals, an entry-level exam on cloud concepts, core services, security, governance and pricing.","Format | About 40 to 60 questions; pass score is 700 out of 1000.","Preparation | Microsoft Learn path, sandbox labs and practice assessment.","Study time | About one to two weeks.","Purpose | Builds the vocabulary needed for later exams."]},{"n":"AZ-104 Azure Administrator","w":"Core Azure admin skills.","b":["Identity, governance, storage, compute, networking, monitoring.","Hands-on labs essential.","4-6 weeks.","Foundation for AZ-305."],"e":"Deploy VMs, VNets, policies in a free subscription.","d":null,"h":"Skills: manage Entra ID users and groups and RBAC, subscriptions and governance, storage accounts, VMs, containers (ACI, ACA, AKS basics), App Service, virtual networking (VNet, NSG, peering, DNS, load balancing), backup and monitoring. Labs on Microsoft Learn plus own practice with free credits. Exam has labs/case studies.","y":"Core operational skill set for Azure architects.","m":"Mistake: only reading, no hands-on. Tip: build a small environment end to end.","k":["AZ-104 | Azure Administrator associate, focused on running Azure environments.","Identity and governance | Entra ID, RBAC, policy and subscriptions.","Storage, compute and networking | Accounts, VMs, containers, VNets and DNS.","Monitoring and backup | Operations skills.","Study time | Four to six weeks with hands-on labs."]},{"n":"AI-102 Azure AI Engineer","w":"AI engineering on Azure.","b":["Vision, language, document intelligence, search, generative AI.","Build small projects.","4-6 weeks.","Matches RAG and agent topics."],"e":"Build a document Q&A app.","d":null,"h":"Skills: Azure OpenAI and generative AI apps, Azure AI Search and knowledge mining, Document Intelligence, vision, language, speech, agents, responsible AI, monitoring, security and deployment (containers, private endpoints). Practice by building a RAG app, a document pipeline and a language app with SDKs.","y":"Directly relevant to AI architect roles.","m":"Mistake: not practicing with SDK code. Tip: build and test each service from code.","k":["AI-102 | Azure AI Engineer associate, on building AI solutions.","Azure OpenAI and AI Search | Generative AI and retrieval.","Document Intelligence, vision and language | Core AI services.","Agents and responsible AI | Tool use and safety.","Study time | Four to six weeks building small projects."]},{"n":"AZ-305 Azure Solutions Architect Expert","w":"Architect-level exam.","b":["Design identity, data, business continuity, infrastructure.","Case-study questions.","Needs AZ-104 level knowledge.","6-8 weeks."],"e":"Design a multi-region landing zone on paper.","d":null,"h":"Skills: design identity, governance and monitoring solutions; design data storage; design business continuity and migration; design infrastructure (compute, network, application architecture). Use Well-Architected Framework, Cloud Adoption Framework and architecture center references. Prepare for case studies with trade-offs. Prerequisite knowledge from AZ-104 is assumed.","y":"Expert-level credential commonly required for architects.","m":"Mistake: memorizing services only. Tip: practice reasoning about requirements and trade-offs.","k":["AZ-305 | Azure Solutions Architect Expert, on designing solutions.","Design domains | Identity and governance, data storage, business continuity and infrastructure.","Case studies | Scenario questions about trade-offs.","Prerequisite knowledge | AZ-104 level.","Study time | Six to eight weeks."]},{"n":"Optional: AWS Solutions Architect Associate, CKA, Terraform Associate","w":"Extras by job target.","b":["AWS Solutions Architect Associate for AWS roles.","CKA for Kubernetes depth.","Terraform Associate for IaC.","Pick only what the role needs."],"e":"Add CKA if the job is platform-focused.","d":null,"h":"Optional: AWS Solutions Architect Associate for multi-cloud credibility; Certified Kubernetes Administrator (practical command-line exam); HashiCorp Terraform Associate; Databricks or Azure Data Engineer for data focus; Security certifications if the role requires (AZ-500, CISSP). Choose based on job descriptions.","y":"Complements the core Azure path.","m":"Mistake: collecting certificates without applying them. Tip: pick those that fill real gaps.","k":["AWS Solutions Architect Associate | A design certification for AWS roles.","CKA | A hands-on Kubernetes administrator exam.","Terraform Associate | An infrastructure as code credential.","Security options | AZ-500 or CISSP.","Choosing | Match certifications to the jobs you want."]},{"n":"Schedule exams and use official Microsoft Learn paths","w":"Make studying a habit.","b":["Book exam date.","Follow Learn paths and labs.","Practice tests.","Renew yearly through free assessments."],"e":"Daily 45 minutes for 6 weeks.","d":null,"h":"Plan: set weekly study hours, use official Learn paths, practice assessments, hands-on labs, and community resources; schedule the exam 4-8 weeks ahead; take a timed practice test; review weak areas; on exam day use time management and flag hard questions. Renew role-based certifications annually via free renewal assessments.","y":"Consistency beats cramming.","m":"Mistake: delaying booking the exam. Tip: put a date on the calendar to stay motivated.","k":["Exam date | A booked date creates a deadline.","Weekly plan | Fixed study hours.","Practice tests | Timed mock exams and weak area review.","Exam technique | Time management and flagging questions.","Renewal | Free yearly Microsoft renewal assessments."]}]}]}];
var KEY="arch-roadmap3-done",TK="arch-roadmap-theme",done={},T=[];
try{done=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
var total=0;
DATA.forEach(function(p,pi){var m=p.p.match(/^Phase (\d+) - (.*?) \((.*)\)$/);p.no=m[1];p.name=m[2];p.when=m[3];p.tIdx=[];
  p.t.forEach(function(t){t.pi=pi;t.ti=T.length;t.s.forEach(function(s,si){s.id=t.ti+"-"+si;total++});p.tIdx.push(t.ti);T.push(t)})});
var sel={t:0,s:0},open={0:true},view="menu",q="";
var app=document.getElementById("app"),menu=document.getElementById("menu");
var CH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
function doneIn(t){var k=0;t.s.forEach(function(s){if(done[s.id])k++});return k}
function cnt(k,n){return '<span class="cnt'+(k===n?' full':'')+'">'+k+'/'+n+'</span>'}
function matches(t){if(!q)return true;if((t.n+" "+t.d).toLowerCase().indexOf(q)>-1)return true;
  return t.s.some(function(s){return (s.n+" "+s.w+" "+s.h+" "+s.b.join(" ")+" "+s.k.join(" ")).toLowerCase().indexOf(q)>-1})}
function renderMenu(){
  var h="",any=false;
  DATA.forEach(function(p,pi){
    var list=p.tIdx.map(function(i){return T[i]}).filter(matches);if(!list.length)return;any=true;
    var isOpen=q?true:!!open[pi],k=0,n=0;p.tIdx.forEach(function(i){k+=doneIn(T[i]);n+=T[i].s.length});
    h+='<div class="grp"><button type="button" class="gh" data-ph="'+pi+'" aria-expanded="'+isOpen+'">'+CH+'<span class="nm">Phase '+p.no+' \u00b7 '+esc(p.name)+'</span>'+cnt(k,n)+'</button>';
    h+='<ul class="tl"'+(isOpen?'':' hidden')+'>';
    list.forEach(function(t){h+='<li><button type="button" class="ti" data-t="'+t.ti+'"'+(t.ti===sel.t?' aria-current="true"':'')+'><span class="n">'+esc(t.n)+'</span>'+cnt(doneIn(t),t.s.length)+'</button></li>'});
    h+='</ul></div>';
  });
  menu.innerHTML=h||'<div class="empty">No topics match your search.</div>';
}
function renderSubs(){
  var t=T[sel.t];
  document.getElementById("t2").textContent=t.n;document.getElementById("d2").textContent=t.d;
  var h="";
  t.s.forEach(function(s,si){var on=!!done[s.id];
    h+='<div class="sr'+(on?' done':'')+'" data-s="'+si+'"'+(si===sel.s?' aria-current="true"':'')+'><button type="button" class="ck" role="checkbox" aria-checked="'+on+'" aria-label="Mark learned: '+esc(s.n)+'" data-ck="'+s.id+'"></button><button type="button" class="t">'+esc(s.n)+'</button></div>'});
  document.getElementById("subs").innerHTML=h;
}
function pos(){var t=T[sel.t];return t.s[sel.s]}
function dgm(d){
  if(!d)return "";var h="";
  if(d.t==="flow"){h='<div class="dg fl">'+d.n.map(function(x){return '<span class="nd">'+esc(x)+'</span>'}).join('<span class="ar">\u2192</span>')+'</div>'}
  else if(d.t==="layers"){h='<div class="dg ly">'+d.n.map(function(x,i){return '<div class="nd" style="background:color-mix(in srgb,var(--accent) '+(8+i*(24/Math.max(1,d.n.length-1)))+'%,var(--surface))">'+esc(x)+'</div>'}).join("")+'</div>'}
  else if(d.t==="hub"){h='<div class="dg hub"><div class="c">'+esc(d.c)+'</div><div class="sat">'+d.n.map(function(x){return '<span class="nd">'+esc(x)+'</span>'}).join("")+'</div></div>'}
  else if(d.t==="vs"){var col=function(t,l){return '<div class="col"><b>'+esc(t)+'</b>'+l.map(function(x){return '<div>'+esc(x)+'</div>'}).join("")+'</div>'};
    h='<div class="dg vs">'+col(d.lt,d.l)+'<span class="v">VS</span>'+col(d.rt,d.r)+'</div>'}
  return '<div class="sec"><div class="lbl">Diagram</div>'+h+'</div>'}
function renderNote(){
  var t=T[sel.t],s=t.s[sel.s],p=DATA[t.pi],on=!!done[s.id];
  var prev=nav(-1),next=nav(1);
  document.getElementById("note").innerHTML='<div class="note"><div class="crumb">Phase '+p.no+' \u00b7 '+esc(t.n)+'</div><h2>'+esc(s.n)+'</h2>'+
    '<div class="lbl">In simple words</div><div class="box"><p>'+esc(s.w)+'</p></div>'+
    '<div class="sec"><div class="lbl">How it works</div><p class="how">'+esc(s.h)+'</p></div>'+
    '<div class="sec"><div class="lbl">Key terms and concepts</div><div class="kt">'+s.k.map(function(x){var i=x.indexOf(" | ");return '<div><b>'+esc(x.slice(0,i))+'</b>'+esc(x.slice(i+3))+'</div>'}).join("")+'</div></div>'+
    '<div class="sec"><div class="lbl">Important points</div><ul class="bl">'+s.b.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul></div>'+
    dgm(s.d)+
    '<div class="sec"><div class="lbl">Why it matters</div><div class="why">'+esc(s.y)+'</div></div>'+
    '<div class="sec"><div class="lbl">Common mistake and tip</div><div class="mis">'+esc(s.m)+'</div></div>'+
    '<div class="sec"><div class="lbl">Example</div><div class="ex">'+esc(s.e)+'</div></div>'+
    '<p class="ctx"><b>Part of:</b> '+esc(t.n)+'. '+esc(t.d)+'</p>'+
    '<div class="acts"><button type="button" class="btn '+(on?'ok':'pri')+'" id="mk">'+(on?'Learned \u2713 (tap to undo)':'Mark as learned')+'</button>'+
    (prev?'<button type="button" class="btn" id="pv">\u2039 Previous</button>':'')+(next?'<button type="button" class="btn" id="nx">Next \u203a</button>':'')+'</div></div>';
}
function nav(d){var t=T[sel.t],si=sel.s+d,ti=sel.t;
  if(si<0){ti--;if(ti<0)return null;si=T[ti].s.length-1}else if(si>=t.s.length){ti++;if(ti>=T.length)return null;si=0}
  return {t:ti,s:si}}
function paint(){
  var k=0;for(var id in done)if(done[id])k++;
  var pc=Math.round(k/total*100);
  document.getElementById("pct").textContent=pc+"%";
  document.getElementById("count").textContent=k+" of "+total+" sub-topics learned";
  document.getElementById("ring").style.strokeDashoffset=113.1*(1-k/total);
}
function setView(v){view=v;app.setAttribute("data-v",v)}
function select(t,s,v){sel.t=t;sel.s=s;open[T[t].pi]=true;
  renderMenu();renderSubs();renderNote();if(v)setView(v);
  try{history.replaceState(null,"","#t"+t+"-s"+s)}catch(e){}
  var cur=document.querySelector("#subs .sr[aria-current=true]");if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:"nearest"});}
function refresh(){renderMenu();renderSubs();renderNote();paint();save()}
menu.addEventListener("click",function(e){
  var g=e.target.closest(".gh");if(g){var pi=g.getAttribute("data-ph");open[pi]=!open[pi];renderMenu();return}
  var b=e.target.closest(".ti");if(b){var ti=+b.getAttribute("data-t");select(ti,0,"subs");document.getElementById("subs").scrollTop=0}});
document.getElementById("subs").addEventListener("click",function(e){
  var c=e.target.closest(".ck");
  if(c){var id=c.getAttribute("data-ck");if(done[id])delete done[id];else done[id]=1;refresh();return}
  var r=e.target.closest(".sr");if(r){select(sel.t,+r.getAttribute("data-s"),"note");document.getElementById("note").scrollTop=0}});
document.getElementById("note").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.id==="mk"){var id=pos().id;if(done[id])delete done[id];else done[id]=1;refresh();return}
  var d=b.id==="pv"?-1:b.id==="nx"?1:0;if(!d)return;var n=nav(d);if(n){select(n.t,n.s,"note");document.getElementById("note").scrollTop=0}});
document.getElementById("b2").addEventListener("click",function(){setView("menu")});
document.getElementById("b3").addEventListener("click",function(){setView("subs")});
document.getElementById("ex").addEventListener("click",function(){DATA.forEach(function(p,i){open[i]=true});renderMenu()});
document.getElementById("co").addEventListener("click",function(){open={};renderMenu()});
document.getElementById("q").addEventListener("input",function(){q=this.value.trim().toLowerCase();renderMenu()});
function applyTheme(t){var r=document.documentElement;if(t==="light"||t==="dark")r.setAttribute("data-theme",t);else r.removeAttribute("data-theme");
  document.querySelectorAll(".seg button").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-th")===t)})}
var th="system";try{th=localStorage.getItem(TK)||"system"}catch(e){}
applyTheme(th);
document.querySelector(".seg").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
  th=b.getAttribute("data-th");applyTheme(th);try{localStorage.setItem(TK,th)}catch(x){}});
function fromHash(){var m=location.hash.match(/^#t(\d+)-s(\d+)$/);
  if(m&&T[+m[1]]&&T[+m[1]].s[+m[2]]){select(+m[1],+m[2],"note");return true}return false}
window.addEventListener("hashchange",function(){var m=location.hash.match(/^#t(\d+)-s(\d+)$/);
  if(m&&T[+m[1]]&&T[+m[1]].s[+m[2]]&&(+m[1]!==sel.t||+m[2]!==sel.s))select(+m[1],+m[2],"note")});
renderMenu();renderSubs();renderNote();paint();
fromHash();
</script>
