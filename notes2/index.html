y cache | Stores downloaded packages between runs and often saves minutes per build.","Docker layer cache | Reuses unchanged image layers between builds.","Matrix builds | Run the same job across several runtime versions or operating systems in parallel.","Version pinning | Pin actions and tasks to a version or commit SHA so a compromised update cannot silently enter your pipeline.","Self-hosted runners | Your own build machines; isolate and patch them because they can reach internal networks."]},{"n":"Artifact management (registries, packages, SBOMs)","w":"Build outputs should be stored once and promoted, not rebuilt.","b":["Registry for images and packages (ACR, ECR, Artifactory, GitHub Packages).","Promote the same artifact through dev, test, prod.","SBOM lists everything in the build for vulnerability response.","Retention rules clean up old artifacts."],"e":"Image 1.4.2 is tested in staging and then released unchanged to prod.","d":{"t":"flow","n":["Build once","Store artifact","Deploy to test","Promote to prod"]},"h":"Build once, deploy many: create an immutable artifact (container image, package) with a version and digest, store it in a registry, and deploy the same artifact to each environment, changing only configuration. Generate SBOMs (SPDX/CycloneDX) and attach provenance. Retention policies prune old versions, keeping released ones.","y":"Guarantees that what you tested is what you ship.","m":"Mistake: rebuilding per environment. Tip: promote artifacts, not code.","k":["Immutable artifact | Built once and never changed, so what you tested is exactly what you deploy.","Container registry and package feed | Stores images (ACR, ECR, GHCR) and libraries (npm, NuGet, Maven, PyPI).","SBOM | A software bill of materials listing every component in a build, in SPDX or CycloneDX format, used to find affected systems when a new vulnerability appears.","Provenance | A signed record of where, when and from which source the artifact was built.","Digest | The sha256 hash identifying an image's exact content.","Retention | Keep released versions and delete old build output to control storage."]},{"n":"Deployment strategies: blue/green, canary, rolling, feature flags","w":"Release strategies reduce the risk of each deployment.","b":["Rolling: replace instances gradually.","Blue/green: new version runs beside old, switch traffic at once, easy rollback.","Canary: send 5% of traffic first, watch metrics, then increase.","Feature flags: ship code off, turn on for chosen users."],"e":"Canary 5% then 25% then 100% with automatic rollback on errors.","d":{"t":"flow","n":["Release v2","5% of users","Check errors and latency","25%","100%"]},"h":"Rolling updates replace pods gradually with maxSurge/maxUnavailable. Blue/green keeps two full environments and flips the router, enabling instant rollback but doubling cost during the switch. Canary routes a small percentage and compares metrics (error rate, latency) using tools like Argo Rollouts, Flagger or service mesh. Feature flags control exposure per user or cohort and allow kill switches.","y":"Reduces blast radius of bad releases.","m":"Mistake: canary without automated metric checks. Tip: define success metrics and automatic rollback.","k":["Rolling update | Replaces instances gradually; no extra environment is needed but old and new versions run together briefly.","Blue/green | Two full environments with traffic switched at once, giving instant rollback at the cost of double capacity during the switch.","Canary | Sends 1 to 5 percent of users to the new version and compares error rate and latency before widening.","Feature toggle | Enables a feature for chosen users or percentages after deployment.","Progressive delivery | Automated staged rollout with metric checks and automatic rollback, using tools such as Argo Rollouts or Flagger.","Database compatibility | Schema changes must work with both old and new code during a rollout."]},{"n":"GitOps with Argo CD or Flux","w":"GitOps uses Git as the single source of truth for what runs in the cluster.","b":["Manifests are stored in a repo.","Argo CD or Flux watches the repo and syncs the cluster.","Changes happen by pull request; rollback is a git revert.","Drift is detected and corrected automatically."],"e":"Merge a PR changing replicas to 5; Argo CD applies it.","d":{"t":"flow","n":["Pull request","Git repo","Argo CD / Flux","Cluster"]},"h":"Cluster state lives in Git (manifests, Helm, Kustomize). An in-cluster controller (Argo CD, Flux) pulls and applies changes, continuously comparing live state to Git and correcting drift. Benefits: audit trail, easy rollback (revert), no cluster credentials in CI. Separate application and environment repositories; use image updaters or CI PRs to bump versions.","y":"Safer, more transparent operations.","m":"Mistake: mixing manual kubectl changes with GitOps. Tip: restrict write access and use sync alerts.","k":["GitOps | Git holds the desired state of the system and a controller applies it, so every change is reviewed, versioned and reversible.","Argo CD and Flux | Controllers inside the cluster that continuously compare Git with live state and sync it.","Drift correction | Manual changes in the cluster are detected and reverted.","Pull-based deployment | The cluster pulls from Git, so the CI system needs no cluster credentials.","App of apps | A root application that defines many applications, used to bootstrap clusters.","Rollback by revert | Undoing a change is a git revert."]},{"n":"Environment promotion and approvals","w":"Promotion moves one build through environments with gates.","b":["Dev, test, staging, production with increasing checks.","Automated gates: tests, security scan, performance checks.","Manual approval for production where required.","Same configuration method in every environment."],"e":"Production deploy needs a green staging run and one approver.","d":{"t":"flow","n":["Dev","Test","Staging","Approval","Production"]},"h":"Environments progress: dev for fast feedback, test/QA for integration, staging that mirrors production, then production. Gates include automated checks (unit, integration, security, performance), change approval where required, maintenance windows, and post-deploy verification (smoke tests, health checks). Configuration differs per environment but follows the same process.","y":"Controls risk without manual bottlenecks.","m":"Mistake: staging that differs greatly from production. Tip: use IaC to keep environments similar.","k":["Environment | A deployment target such as dev, test, staging or production, each more like production than the last.","Promotion | Moving the same build to the next environment after checks pass.","Quality gate | An automated pass or fail rule such as tests green and no critical vulnerabilities.","Manual approval | A human sign-off, typically before production when regulation or risk requires it.","Smoke test | A handful of quick checks that the deployed app basically works.","Environment parity | Keeping staging similar to production in configuration and scale so tests mean something."]},{"n":"DORA metrics","w":"DORA metrics show the health of your delivery.","b":["Deployment frequency: how often you release.","Lead time for changes: commit to production.","Change failure rate: percent of releases that cause problems.","Time to restore service: how fast you recover."],"e":"Elite teams deploy many times a day with low failure rates.","d":{"t":"hub","c":"DORA","n":["Deploy frequency","Lead time","Change failure rate","Time to restore"]},"h":"Deployment frequency (how often you ship), lead time for changes (commit to production), change failure rate (percent of deployments causing failures) and time to restore service (MTTR). Elite performers deploy on demand with lead time under a day and fail under 15%. Collect from Git, CI and incident tools; use trends and team-level improvement, not individual ranking.","y":"Gives objective evidence on the health of engineering practices.","m":"Mistake: using metrics to compare teams or as targets. Tip: use them to find bottlenecks.","k":["Deployment frequency | How often you deploy to production; high performers deploy on demand, many times a day.","Lead time for changes | Time from commit to running in production.","Change failure rate | The percentage of deployments that cause an incident or need a fix or rollback.","Time to restore service | How quickly you recover after a failure.","Elite performance | Roughly lead time under a day, failure rate under 15 percent and restoration within an hour.","Using the metrics | Use them to find bottlenecks, never to rank individuals."]}]},{"n":"Automated testing strategy","d":"Confidence gates before production.","s":[{"n":"Test pyramid: unit, integration, contract, end-to-end","w":"The test pyramid guides how many tests of each kind to write.","b":["Many unit tests: fast, cheap, precise.","Fewer integration tests: check real interactions.","Few end-to-end tests: prove key journeys but slow and fragile.","An upside-down pyramid gives slow, flaky pipelines."],"e":"500 unit tests, 60 integration tests, 10 UI tests.","d":{"t":"layers","n":["End-to-end (few)","Integration (some)","Unit (many)"]},"h":"Unit tests check small pieces quickly and run on every commit. Integration tests verify a few components working together with real databases or queues (often in containers). End-to-end tests drive the UI or full flows and are slowest and flakiest. Keep ratios healthy, delete flaky tests or fix them, and use test doubles for external systems you do not control.","y":"Right test mix keeps pipelines fast and confidence high.","m":"Mistake: relying only on UI tests. Tip: push checks down to the cheapest level that can catch the problem.","k":["Unit test | Tests one unit of logic in isolation; runs in milliseconds and gives precise failure messages.","Integration test | Tests real interactions such as code with a database or message broker; slower but catches wiring problems.","End-to-end test | Drives the full system through the UI or public API; proves critical journeys but is slow and fragile.","Test pyramid | Many unit tests, fewer integration tests and very few end-to-end tests keep feedback fast and reliable.","Ice-cream cone anti-pattern | Mostly manual and UI tests with few unit tests, which makes pipelines slow and flaky.","Test doubles | Stubs, mocks, fakes and spies that replace dependencies you do not control."]},{"n":"Contract testing (Pact)","w":"Contract tests protect integrations between teams.","b":["Consumer states what it needs from the API (the contract).","Provider runs the contract in its build and fails if it breaks it.","No need to run both services together.","Pact is a common tool."],"e":"Provider team cannot remove the 'policyId' field without failing the consumer's contract.","d":{"t":"flow","n":["Consumer contract","Broker","Provider verifies","Safe to deploy"]},"h":"Consumer-driven contracts: the consumer records expected requests and responses in a pact file; the broker stores it; the provider's build verifies it. can-i-deploy checks compatibility before release. Schema-based alternatives use OpenAPI diff tools. This lets teams deploy independently without large integrated test environments.","y":"Prevents integration breaks in microservices.","m":"Mistake: contracts that over-specify details. Tip: assert only on fields the consumer uses.","k":["Consumer and provider | The consumer calls an API; the provider offers it. Contract tests protect the boundary between them.","Pact file | A recording of the requests the consumer makes and the responses it expects.","Pact Broker | Stores contracts and verification results and shows who is compatible with whom.","can-i-deploy | A check that tells you whether a version is safe to release given what runs in each environment.","Consumer-driven contract | Consumers state what they actually need, so providers know what they can change safely.","Minimal contracts | Assert only fields the consumer uses, so harmless provider changes do not break tests."]},{"n":"Test data management and ephemeral environments","w":"Tests need realistic data and clean environments.","b":["Generate or mask data; never use raw production PII.","Ephemeral environments are created per pull request and destroyed after.","Reset data between runs for repeatability.","Use containers and IaC to build environments quickly."],"e":"Each PR gets its own namespace with seeded test data.","d":null,"h":"Test data options: synthetic generation, masked copies, small seeded datasets via scripts, or snapshots. Ephemeral environments (namespaces or full stacks from IaC) are created per PR, tested and destroyed to control cost. Use containers (Testcontainers) for databases and queues in integration tests. Reset or isolate data for repeatability.","y":"Reliable tests need reliable data.","m":"Mistake: shared test environments with conflicting data. Tip: isolate per run and automate cleanup.","k":["Synthetic data | Generated records containing no real people, safe for any environment.","Masked data | Production-shaped data with sensitive values hidden or scrambled.","Seed data | A baseline dataset loaded before tests run.","Ephemeral environment | A full or partial environment created for one pull request and destroyed after testing.","Testcontainers | A library that starts real databases or brokers in containers for integration tests.","Test isolation | Tests must not depend on each other's data or order."]},{"n":"Performance and load testing (k6, JMeter)","w":"Load tests show how the system behaves under stress.","b":["Load test: expected traffic; stress test: beyond limits; spike test: sudden jumps; soak: long duration.","Tools: k6, JMeter, Gatling, Locust.","Measure latency percentiles (p95, p99), error rate and resource use.","Run a small version in CI to catch regressions."],"e":"p95 latency must stay under 500 ms at 200 requests per second.","d":null,"h":"Define goals (throughput, latency percentiles, error rate) from real traffic models. Build scenarios (login, search, submit). Run load, stress (to failure), spike and soak (hours) tests with realistic data and production-like infrastructure. Observe CPU, memory, database, queues and downstream effects. Compare results across builds to catch regressions.","y":"Capacity problems found in test are cheap; in production they are outages.","m":"Mistake: testing with unrealistic data or a tiny environment. Tip: test early and automate a baseline performance check.","k":["Load test | Applies the expected traffic to verify the system meets targets.","Stress test | Pushes beyond capacity to find the breaking point and see how the system fails.","Spike test | A sudden jump in traffic, such as open enrollment starting.","Soak test | Runs for hours to expose memory leaks and slow degradation.","Percentile latency | p95 and p99 show the experience of the slowest requests; averages hide them.","Realistic scenarios | Model actual user behavior, think time and data, not just one endpoint."]},{"n":"Chaos and resilience testing","w":"Chaos testing checks that failure handling really works.","b":["Form a hypothesis: if one pod dies, users see no errors.","Inject failure in a controlled way (kill pod, add latency, block a dependency).","Watch metrics and compare with the hypothesis.","Start in test with small blast radius and a stop button."],"e":"Terminate one database replica and confirm automatic failover.","d":{"t":"flow","n":["Hypothesis","Inject failure","Observe","Fix weaknesses"]},"h":"Chaos engineering steps: define steady state, form hypothesis, run experiment with limited scope (kill instances, inject latency, drop packets, fail a zone), observe, fix. Tools: Chaos Mesh, Litmus, Azure Chaos Studio, AWS FIS. Game days practice the human response too. Always have an abort condition and notify teams.","y":"Builds confidence that redundancy and fallbacks really work.","m":"Mistake: running first experiments in production without safeguards. Tip: start in staging, then small production experiments.","k":["Steady state | A measurable normal behavior such as success rate or latency.","Hypothesis | A prediction, for example that killing one instance will not affect user success rate.","Blast radius | The scope an experiment can affect; start small.","Fault injection | Deliberately causing failures: killing processes, adding latency, dropping packets or failing a zone.","Game day | A planned exercise where teams practice responding to failures.","Abort condition | A threshold at which the experiment stops immediately."]},{"n":"Pre-production confidence gates and quality metrics","w":"Gates make release decisions objective.","b":["Examples: all tests pass, coverage on new code over 80%, no critical vulnerabilities, performance within limit.","Gates run automatically in the pipeline.","Fewer arguments and fewer risky releases.","Review gate rules regularly."],"e":"Build fails when new code has no tests.","d":null,"h":"Gate examples: all tests green, new code coverage above target, zero critical or high vulnerabilities, no new lint errors, performance budget respected, accessibility checks pass, migration scripts validated. Gates are automated policies in pipelines; failures block promotion. Display quality trends on a dashboard.","y":"Makes release decisions consistent and fast.","m":"Mistake: gates that fail often for flaky reasons. Tip: keep gates reliable or people will bypass them.","k":["Quality gate | An automated rule that must pass before promotion, such as tests green and no critical vulnerabilities.","Coverage on new code | The percentage of changed lines covered by tests; focuses effort where risk is introduced.","Performance budget | A maximum allowed latency or size that fails the build when exceeded.","Security gate | Blocks promotion when high-severity vulnerabilities are found.","Waivers | Approved, time-limited exceptions recorded with a reason.","Gate reliability | Flaky gates teach teams to bypass them, so keep them trustworthy."]},{"n":"Multi-service validation for cross-service changes","w":"A change in one service can break others.","b":["Contract tests catch API changes.","Shared integration environment or temporary multi-service environments test flows.","Deploy related services in the right order.","Use feature flags and backward-compatible changes."],"e":"Deploy API v2 alongside v1 before moving callers.","d":null,"h":"For changes that span services: use contract tests per boundary; run a small set of cross-service smoke tests in a shared environment; deploy changes in a compatible order (provider first, then consumer) with backward compatibility; use feature flags and canaries; use distributed tracing in test to verify flows. Consider ephemeral environments with only the required services plus mocks for others.","y":"Most production incidents involve interactions between services.","m":"Mistake: big-bang multi-service releases. Tip: make each change independently deployable.","k":["Backward compatibility | The new version works with existing clients, which lets services deploy independently.","Deployment order | Add new fields in providers first, then update consumers, then remove old behavior.","Contract tests | Verify each service boundary without running every service together.","Feature flags | Keep cross-service changes hidden until all parts are ready.","Shared integration environment | A stable stack for cross-service checks; keep it small and healthy.","Distributed tracing in tests | Follow a request through all services to verify flows."]}]},{"n":"Application security tooling","d":"SAST, DAST, SCA, container security.","s":[{"n":"SonarQube: quality gates, rules, coverage","w":"SonarQube measures code quality and basic security.","b":["Finds bugs, code smells and security hotspots.","Quality gate: pass/fail rule on new code (coverage, duplication, issues).","Shows technical debt and trends.","Fail the pull request when the gate fails."],"e":"New code needs 80% coverage and zero blocker issues.","d":{"t":"flow","n":["Code push","Sonar analysis","Quality gate","Merge allowed or blocked"]},"h":"SonarQube analyzes code for bugs, vulnerabilities, security hotspots and code smells, and measures coverage and duplication. Quality profiles define rules; quality gates apply pass/fail conditions to new code (the 'clean as you code' approach). Integrates with PRs for decoration. Technical debt is shown as estimated fix time.","y":"Gives developers immediate, objective feedback.","m":"Mistake: gate on overall legacy code, blocking everyone. Tip: gate on new code only.","k":["Quality gate | A pass or fail rule on code metrics such as no new blocker issues and 80 percent coverage on new code.","Clean as you code | Apply strict rules only to new and changed code so legacy debt does not block progress.","Code smell | A maintainability problem that is not yet a bug, such as a very long method.","Security hotspot | Code that needs human review to decide whether it is safe.","Technical debt estimate | The time Sonar estimates it would take to fix all issues.","Pull request decoration | Results shown inside the pull request so developers see them where they work."]},{"n":"Checkmarx SAST and SCA","w":"Checkmarx scans code and libraries.","b":["SAST: analyzes source code for flaws like injection.","SCA: checks open-source libraries for known vulnerabilities and licenses.","Results map to OWASP and CWE categories.","Tune rules to reduce noise."],"e":"Finds SQL built from user input in a controller.","d":null,"h":"SAST scans source code or binaries without running them, finding patterns like injection, hardcoded credentials and weak crypto, with data-flow analysis. SCA identifies open-source components, known CVEs and licenses, and builds an SBOM. Results link to CWE/OWASP and provide remediation guidance. Tune query sets for languages in use and suppress false positives with justification.","y":"Finds issues early when they are cheapest to fix.","m":"Mistake: overwhelming developers with thousands of findings. Tip: start with high severity and new code, then tighten.","k":["SAST | Static application security testing analyzes source code or binaries without running them to find flaws such as injection and hardcoded secrets.","SCA | Software composition analysis identifies open-source components and flags known vulnerabilities and license risks.","Taint analysis | Follows untrusted input through the code to a dangerous use, such as a SQL query.","CWE mapping | Each finding maps to a weakness category, making triage and reporting consistent.","False positives | Reported issues that are not real; suppress with a documented reason.","Incremental scans | Scan only changed files on pull requests for speed, with full scans on a schedule."]},{"n":"OWASP ZAP and DAST in pipelines","w":"DAST tests the running app from the outside like an attacker.","b":["OWASP ZAP is a free scanner.","Baseline scan: passive checks, quick.","Full scan: active attacks on a test environment only.","Run in the pipeline against a deployed test instance."],"e":"ZAP finds missing security headers and reflected XSS.","d":{"t":"flow","n":["Deploy test app","ZAP scan","Report","Fix findings"]},"h":"DAST sends crafted requests to a running application, observing responses, so it finds issues SAST cannot (misconfiguration, missing headers, auth flaws). ZAP supports baseline (passive) scans, full active scans, API scans using OpenAPI definitions, and authentication scripts. Run against test environments only and review results; integrate with CI using Docker.","y":"Adds an outside-in view of security.","m":"Mistake: running active scans against production. Tip: authenticate scans and tune scope to avoid noise.","k":["DAST | Dynamic application security testing probes a running application from outside, like an attacker, finding issues such as missing headers and injection.","Passive scan | Observes traffic without attacking; safe for any environment.","Active scan | Sends attack payloads; run only against test environments.","Crawling | Discovers pages and endpoints to test.","Authenticated scans | Log in so protected areas are tested.","API scanning | Uses an OpenAPI definition to test every endpoint."]},{"n":"Prisma Cloud/Twistlock container and runtime scanning","w":"Cloud and container security platform.","b":["Scans images and registries for vulnerabilities and malware.","Runtime defense learns normal behavior and flags anomalies.","Checks cloud settings for misconfigurations.","Can block deployments that violate policy."],"e":"Blocks a container that tries to open a reverse shell.","d":null,"h":"Prisma Cloud includes cloud security posture management, workload protection (host, container, serverless), code scanning and IaC checks. Twistlock heritage provides image vulnerability scanning, compliance checks (CIS) and runtime defense with behavioral models, firewalling and file integrity monitoring. Policies can block builds or admissions.","y":"Covers both build-time and runtime container risks.","m":"Mistake: alert-only mode forever. Tip: move to enforce for high-risk policies once tuned.","k":["Prisma Cloud | A suite covering cloud posture, workload protection, code and IaC scanning.","Twistlock | The container security product now inside Prisma Cloud, covering images, hosts and runtime.","Image scanning | Finds vulnerable packages and malware in images and registries.","Runtime defense | Learns normal container behavior and alerts on unexpected processes, network calls or file changes.","Compliance checks | Tests against benchmarks such as CIS.","Admission control | Blocks non-compliant workloads at deploy time."]},{"n":"Dependency scanning and license compliance","w":"Most of your app is other people's libraries.","b":["Scan dependencies for CVEs and license problems.","GPL-type licenses may conflict with your product.","Bots (Dependabot, Renovate) open update pull requests.","Prioritize fixes by severity and whether the vulnerable code is used."],"e":"Update a vulnerable logging library across 30 repos.","d":null,"h":"Software composition analysis maps direct and transitive dependencies, flags CVEs by severity and exploitability (EPSS, reachability), and checks license compatibility. Automated update PRs keep versions fresh. Pin and verify (lockfiles, checksums). Consider internal mirrors and block known malicious packages.","y":"Most application code is open source; supply-chain attacks are rising.","m":"Mistake: ignoring transitive dependencies. Tip: automate updates with good test coverage.","k":["Direct and transitive dependencies | Direct are the libraries you declare; transitive are pulled in by them and hold most of the risk.","CVE and CVSS | Vulnerability ID and its severity score.","EPSS | An estimate of how likely a vulnerability is to be exploited, helping prioritization.","Reachability analysis | Checks whether your code actually calls the vulnerable function.","License risk | Licenses such as GPL may restrict how you can distribute software.","Update bots | Renovate and Dependabot open pull requests for new versions."]},{"n":"Secret scanning and pre-commit hooks","w":"Leaked secrets are easy to exploit.","b":["Pre-commit hooks stop secrets before commit.","Server-side scanning catches pushes.","If a secret leaks, rotate immediately; deleting from Git history is not enough.","Educate teams on using vaults."],"e":"gitleaks blocks a commit containing an AWS key.","d":null,"h":"Use a pre-commit hook (gitleaks, detect-secrets) to block before commit and server-side push protection (GitHub secret scanning) as a backstop. On detection: revoke and rotate immediately, then clean history if needed and investigate use. Add allow-lists for test strings. Educate developers on vault usage.","y":"A leaked key can be exploited within minutes.","m":"Mistake: only deleting the secret from Git history. Tip: assume it is compromised and rotate.","k":["Pre-commit hook | A check on the developer's machine that blocks commits containing secrets.","Push protection | The server rejects pushes that contain detected secrets.","Scanners | gitleaks, detect-secrets and platform secret scanning.","Rotation | When a secret leaks, revoke and replace it immediately.","History rewriting | Removing a secret from Git history does not make it safe because copies may exist.","Honeytokens | Fake credentials that raise an alert if used."]},{"n":"Triage workflow and vulnerability SLAs","w":"Tools produce findings; process turns them into fixes.","b":["Rank by severity and exploitability.","Assign an owner and a due date (for example critical in 7 days).","Mark false positives with a reason.","Report trends to leadership."],"e":"A critical SCA finding is fixed in 3 days and tracked to closure.","d":{"t":"flow","n":["Finding","Triage","Assign owner","Fix","Verify"]},"h":"Define SLAs by severity (critical 7 days, high 30, medium 90). Triage: validate, assess exploitability and exposure, assign owner, track in a backlog or ticketing integration. Use dashboards for aging and trend. Document risk acceptance with expiry. Review false positives to tune tools.","y":"Turns scan results into actual risk reduction.","m":"Mistake: findings with no owner. Tip: automatically create tickets for the owning team.","k":["Severity | Critical, high, medium or low rating.","Remediation SLA | Target fix times by severity, such as critical in 7 days and high in 30.","Triage | Validate the finding, check exposure and exploitability, then assign an owner.","Risk acceptance | A documented decision to leave an issue open, with owner and expiry.","Suppression | Hide a confirmed false positive with a reason.","Metrics | Open findings, aging and mean time to fix by team."]},{"n":"SBOM and supply chain security (SLSA, Sigstore)","w":"Protect the path from source to production.","b":["SBOM lists components in a build.","SLSA levels grade build integrity.","Sigstore/Cosign sign artifacts; verify before deploy.","Pin dependencies and use trusted registries."],"e":"Cluster only runs images signed by the CI pipeline.","d":null,"h":"SBOM formats (SPDX, CycloneDX) list components. SLSA defines build integrity levels (provenance, hermetic builds). Sigstore provides keyless signing (Cosign) with transparency logs. Verify signatures and attestations at deploy using admission controllers. Protect CI with least-privilege tokens, ephemeral runners and branch protection.","y":"Reduces risk from compromised dependencies or build systems.","m":"Mistake: trusting any image from public registries. Tip: pull through a vetted internal registry.","k":["SBOM | An inventory of components in software, in SPDX or CycloneDX format.","SLSA | Supply-chain Levels for Software Artifacts, a framework of build integrity levels.","Sigstore and Cosign | Keyless signing and verification of artifacts with a public transparency log.","Provenance attestation | A signed statement of how an artifact was built.","Dependency pinning | Use exact versions and digests so builds are repeatable and tamper-evident.","Verification at deploy | Admission controllers reject artifacts without valid signatures."]}]},{"n":"Compliance","d":"STIGs, hardening, federal frameworks.","s":[{"n":"DISA STIGs and SCAP scanning","w":"STIGs are DoD configuration guides.","b":["Provide hardening settings per OS and product.","SCAP scanners (OpenSCAP, Nessus) check systems automatically.","Findings are rated CAT I, II, III.","Automate with images and configuration management."],"e":"A RHEL STIG-hardened golden image is used for all servers.","d":null,"h":"STIGs (Security Technical Implementation Guides) from DISA give detailed settings for OSes, databases, browsers and network devices with severity categories. SCAP content can be run with OpenSCAP or tools like Tenable and SCC; results export to checklists (CKL) for audit. Automate hardening with Ansible, DSC or image builders and document exceptions.","y":"Required for many DoD and federal systems.","m":"Mistake: applying settings by hand. Tip: build STIG-compliant images in the pipeline and scan continuously.","k":["STIG | A Security Technical Implementation Guide from DISA with detailed hardening settings for operating systems, databases and applications.","Finding categories | CAT I is the most severe and must be fixed or formally waived first; CAT II and CAT III are lower.","SCAP | A standard that lets tools check configurations automatically.","OpenSCAP and SCC | Scanners that run SCAP content and produce reports.","STIG checklist | The output format auditors review.","Automation | Build STIG settings into images and configuration management instead of applying them by hand."]},{"n":"CIS benchmarks and golden images","w":"Hardened baselines reduce attack surface.","b":["CIS benchmarks are community configuration standards.","Golden image: pre-hardened VM or container base.","Rebuild images regularly with updates.","Block use of unapproved images."],"e":"Pipeline builds a CIS-hardened image weekly.","d":{"t":"flow","n":["Base OS","Harden + patch","Test","Publish golden image"]},"h":"CIS Benchmarks give level 1 (basic) and level 2 (stricter) recommendations. Golden images are built with Packer or EC2 Image Builder/Azure Image Builder, including patches, hardening, agents and logging, then tested and published with versioning. Teams launch only from approved images; old images are retired.","y":"Standardizes security from the first boot.","m":"Mistake: image sprawl with no owner. Tip: automate rebuilds monthly and track image age.","k":["CIS Benchmark | Community-developed hardening recommendations for each platform, with Level 1 as a practical baseline and Level 2 as stricter.","Golden image | An approved, hardened, patched base image that everyone builds from.","Image builders | Packer, EC2 Image Builder and Azure Image Builder automate image creation.","Image pipeline | Build, harden, scan, test and publish a new image version regularly.","Patch cadence | Rebuild monthly or when critical vulnerabilities appear.","Policy enforcement | Allow only approved images to be launched."]},{"n":"NIST 800-53 and 800-171 overview","w":"NIST controls define what federal security must cover.","b":["800-53: large catalog of controls in families (access control, audit, incident response).","800-171: protecting controlled unclassified information for contractors.","Controls are mapped to technical settings and evidence.","Learn the families, not every control."],"e":"AC-2 account management maps to access reviews and automatic disable of stale accounts.","d":null,"h":"800-53 controls are grouped in families (AC access control, AU audit, CM configuration management, IA identification and authentication, IR incident response, SC system and communications protection, SI system and information integrity). Baselines (low, moderate, high) pick controls. Controls map to cloud settings and processes; 800-171 has 110 requirements for protecting CUI in non-federal systems (CMMC aligns).","y":"Federal customers expect systems to be described using these controls.","m":"Mistake: treating it as paperwork after build. Tip: build control mapping into design and pipelines.","k":["NIST 800-53 | A catalog of security and privacy controls for federal systems.","Control families | Groups such as access control, audit, configuration management, identification and authentication, incident response and system protection.","Baseline | The low, moderate or high set of controls selected by system impact.","NIST 800-171 | 110 requirements for protecting controlled unclassified information in contractor systems.","CMMC | The DoD certification model that builds on 800-171.","Control inheritance | Relying on controls implemented by an authorized cloud provider."]},{"n":"FedRAMP authorization process","w":"FedRAMP approves cloud services for federal use.","b":["Impact levels: Low, Moderate, High.","Third-party assessor tests controls.","Authorization package: System Security Plan and evidence.","Continuous monitoring after approval."],"e":"Use FedRAMP-authorized services or plan time for your own authorization.","d":{"t":"flow","n":["Prepare","Assess","Authorize","Continuous monitoring"]},"h":"FedRAMP provides standard authorization for cloud services: readiness, authorization package (SSP, SAP, SAR, POA&M), 3PAO assessment, agency or JAB authorization, and continuous monitoring (monthly scans, annual assessments, significant change requests). Moderate baseline has about 300+ controls. Use already-authorized IaaS to inherit controls.","y":"Without it, many agencies cannot use your service.","m":"Mistake: underestimating documentation and timeline. Tip: start early and automate evidence.","k":["FedRAMP | The US program that authorizes cloud services for federal use through standard assessment.","3PAO | A third-party assessment organization that tests controls independently.","System Security Plan | The core document describing the system and how each control is met.","POA&M | Plan of action and milestones tracking weaknesses and fixes.","Impact levels | Low, Moderate and High, with more controls at higher levels.","Continuous monitoring | Monthly scans, annual assessments and reporting of significant changes."]},{"n":"Continuous compliance and evidence collection","w":"Compliance should be continuous, not an annual scramble.","b":["Automate checks (policy, config scans).","Collect evidence automatically.","Dashboard shows compliance status.","Fix drift quickly."],"e":"A dashboard shows 98% of resources compliant with the policy set.","d":null,"h":"Continuous compliance uses policy-as-code, configuration scanners, vulnerability scans and automated evidence collection (screenshots replaced by API exports). Compliance platforms (Drata, Vanta, Prisma, Defender regulatory compliance) map technical checks to control requirements and show status. Remediation workflows close gaps.","y":"Reduces audit effort and catches drift quickly.","m":"Mistake: point-in-time audits only. Tip: run compliance checks in CI and daily in production.","k":["Continuous compliance | Automated, ongoing checks instead of preparing for annual audits.","Evidence collection | Automatically exporting configuration and logs as proof instead of screenshots.","Configuration drift | Deviation from the required state, detected and corrected.","Control mapping | Linking each requirement to the technical setting and evidence that satisfies it.","Compliance dashboard | Live status by control, resource and team.","Remediation workflow | Tickets and automation that close gaps."]},{"n":"Audit logging requirements","w":"Audit logs prove who did what.","b":["Record identity, action, time, source and result.","Protect from tampering; store in separate account.","Retain for required periods (often 1 year or more).","Make logs searchable and alert on suspicious events."],"e":"Log every access to claim records.","d":null,"h":"Capture authentication events, privilege use, data access, configuration changes and security alerts. Send logs to immutable storage, time-synchronized, with integrity controls and retention (for example 12 months online, 6 years archive depending on rules). Alert on high-risk events and review regularly. Protect logs from containing sensitive data.","y":"Needed for investigation and demonstrates compliance.","m":"Mistake: logs on the same host as the application. Tip: ship logs off-system in real time.","k":["Audit log | A record of who did what, when, from where and with what result.","Immutable storage | Logs that cannot be altered or deleted during retention.","Time synchronization | NTP keeps timestamps accurate so events can be correlated.","Retention | For example 12 months searchable and longer in archive, as required.","Log integrity | Hashing or signing to detect tampering.","Separate account | Store logs where workload administrators cannot change them."]},{"n":"Azure Policy and AWS Config conformance packs","w":"Use cloud policy services for ongoing compliance.","b":["Azure Policy initiatives map to NIST, CIS and others.","AWS Config conformance packs bundle rules.","Show non-compliant resources with remediation steps.","Auto-remediate where safe."],"e":"Assign the NIST 800-53 initiative to production subscriptions.","d":null,"h":"Azure Policy regulatory compliance initiatives (NIST SP 800-53, FedRAMP, CIS) evaluate resources and show control status. AWS Config conformance packs and Security Hub standards do the same. Remediation tasks can deploy missing settings automatically. Exemptions need owners and expiry.","y":"Lets platform teams scale compliance across many subscriptions.","m":"Mistake: ignoring non-compliant findings. Tip: assign owners and track closure.","k":["Azure Policy initiative | A bundle of policies mapped to a standard such as NIST 800-53.","Regulatory compliance dashboard | Shows control status by resource.","AWS Config rule | Evaluates resource settings against a requirement.","Conformance pack | A set of Config rules and remediations deployed together.","Security Hub standards | Aggregated checks for CIS, PCI and other frameworks.","Exemptions | Approved exceptions with owner and expiry."]}]}]},{"p":"Phase 4 - Application Architecture & Integration (Weeks 12-15)","why":"Why: core of the Technical Architect role and the Stop Loss platform work.","t":[{"n":"Architecture styles","d":"Microservices, event-driven, API-first, DDD.","s":[{"n":"Monolith vs modular monolith vs microservices","w":"Choose the simplest structure that works. Distributed systems add real costs.","b":["Monolith: one deployable; simple, can get tangled.","Modular monolith: clear modules in one deployment; often best starting point.","Microservices: independently deployable services; independent scaling and teams but more complexity.","Split when team size, scaling or release independence demands it."],"e":"Start modular; extract billing as a service later if it needs its own scale.","d":{"t":"vs","lt":"Monolith","l":["Simple deploy","Easy debugging","Hard to scale teams"],"rt":"Microservices","r":["Independent deploys","Network complexity","Needs strong DevOps"]},"h":"Monoliths are simpler to build, test and deploy; they suit small teams. A modular monolith enforces module boundaries (no cross-module database access) and can be split later. Microservices bring independent deployment and scaling but add network latency, distributed data, versioning and observability needs. Rule of thumb: you need strong CI/CD, monitoring and team autonomy before microservices pay off.","y":"Wrong granularity is a costly, long-lived mistake.","m":"Mistake: 'distributed monolith' with tight coupling. Tip: split by business capability, not by technical layer.","k":["Monolith | One deployable unit; simple to build, test and run, and often the right start.","Modular monolith | One deployment with strict module boundaries and no cross-module database access; can be split later.","Microservice | A small service deployed and scaled independently and owning its data; brings independence and distributed-system complexity.","Distributed monolith | Services that must change and deploy together; the worst of both worlds.","Conway's law | System design tends to mirror the communication structure of the organization.","Prerequisites for microservices | Strong CI/CD, observability and team autonomy."]},{"n":"Domain-driven design: bounded contexts, aggregates","w":"DDD aligns software with business language.","b":["Ubiquitous language: same words in code and in business talk.","Bounded context: area where a term has one meaning.","Aggregate: group of objects changed together with one root.","Context map shows how contexts relate."],"e":"'Policy' in underwriting differs from 'Policy' in billing, so they are separate contexts.","d":{"t":"hub","c":"Domain","n":["Underwriting","Claims","Billing","Member"]},"h":"Strategic DDD: discover subdomains (core, supporting, generic), define bounded contexts and map relationships (shared kernel, customer-supplier, anti-corruption layer). Tactical DDD: entities, value objects, aggregates (consistency boundary), domain events, repositories. Talk with domain experts (event storming workshops) to find events and rules.","y":"Aligns design to business complexity and clarifies service boundaries.","m":"Mistake: one huge shared model for the company. Tip: embrace different models per context.","k":["Subdomain | A part of the business, classified as core, supporting or generic.","Bounded context | The boundary inside which a model and its terms mean one thing; the same word can differ across contexts.","Ubiquitous language | Vocabulary shared by developers and domain experts and used in code.","Aggregate | A cluster of objects changed together as a unit of consistency, with a root entity.","Domain event | A fact that happened in the business, such as ClaimApproved.","Event storming | A workshop to discover events, commands and context boundaries."]},{"n":"CQRS and event sourcing","w":"CQRS splits reads from writes; event sourcing stores history as events.","b":["Write model enforces rules; read model is shaped for queries.","Event sourcing: store every change (ClaimSubmitted, ClaimApproved) and rebuild state.","Gives audit trail and time travel.","Adds complexity; use where history or scale demand it."],"e":"Claim history is the list of events; a read table shows current status.","d":{"t":"flow","n":["Command","Write model","Event stored","Projection","Read model"]},"h":"CQRS separates commands (change state) from queries (read), allowing different models and stores (write to relational, read from search or cache). Event sourcing stores immutable events (ClaimFiled, ClaimDenied) and derives state by replay; snapshots speed up. Gains: audit, temporal queries, integration events. Costs: eventual consistency, event versioning, steeper learning.","y":"Powerful for audit-heavy or high-scale domains such as claims and finance.","m":"Mistake: applying it everywhere. Tip: use selectively where history or scale justify the complexity.","k":["CQRS | Separate models for writing (commands) and reading (queries), allowing each to be optimized.","Event sourcing | Store the sequence of events and derive current state by replaying them, giving a full audit trail.","Projection | A read-optimized view built from events.","Snapshot | Saved state that avoids replaying all events.","Eventual consistency | Read models catch up shortly after writes.","When to use | Audit-heavy or high-scale domains; avoid for simple CRUD."]},{"n":"Saga and outbox patterns","w":"Distributed transactions are hard; these patterns keep data consistent.","b":["Saga: series of local transactions with compensating actions if a step fails.","Orchestration: a coordinator drives steps; choreography: services react to events.","Outbox: save data and event in one transaction, then publish reliably.","Make steps idempotent."],"e":"Order saga: reserve stock, charge card; if charge fails, release stock.","d":{"t":"flow","n":["Reserve stock","Charge payment","Create shipment","On failure: compensate"]},"h":"A saga coordinates multi-service workflows without distributed transactions. Orchestrated sagas use a coordinator (Step Functions, Durable Functions, Temporal); choreographed sagas react to events. Each step has a compensating action (refund, cancel reservation). The outbox pattern writes events in the same database transaction as the state change; a relay publishes them, avoiding lost or phantom events. Consumers must be idempotent.","y":"Keeps data consistent across services.","m":"Mistake: dual writes to database and broker. Tip: always use outbox or change data capture.","k":["Saga | A series of local transactions with compensating actions when a step fails, replacing distributed transactions.","Orchestration | A central coordinator tells each service what to do, easier to follow and monitor.","Choreography | Services react to each other's events with no coordinator, loosely coupled but harder to trace.","Compensating action | The undo step, such as refunding a payment.","Outbox pattern | Write the event to a table in the same database transaction as the data, then publish it reliably.","Idempotent handlers | Safe to process the same message twice."]},{"n":"Hexagonal and clean architecture","w":"Keep business logic independent of technology.","b":["Core domain at the center.","Ports are interfaces the core needs; adapters implement them (database, HTTP, queue).","Dependencies point inward.","Easy to test and to swap technologies."],"e":"Replace SQL adapter with a mock to test logic.","d":{"t":"layers","n":["Adapters: HTTP, DB, queue","Ports (interfaces)","Application services","Domain model"]},"h":"The domain core has no knowledge of frameworks. Ports define what the core needs (repository interface, notification service) and offers (use cases). Adapters implement ports for specific technology (SQL, REST, queue). Inbound adapters (controllers) call use cases; outbound adapters are called by the core. Tests can run the core with in-memory adapters.","y":"Reduces coupling and makes technology choices reversible.","m":"Mistake: over-layering simple CRUD apps. Tip: apply when business logic is meaningful.","k":["Port | An interface defined by the core for what it needs from or offers to the outside.","Adapter | An implementation of a port for specific technology such as SQL or HTTP.","Domain core | Business rules with no framework or infrastructure knowledge.","Dependency inversion | The core depends on abstractions; infrastructure depends on the core.","Use case | An application service that coordinates domain objects for one task.","Pragmatism | Do not over-layer simple CRUD."]},{"n":"Quality attributes and trade-off analysis (ATAM)","w":"Architecture is choosing among competing qualities.","b":["Qualities: performance, security, availability, modifiability, cost.","Write scenarios: 'when load doubles, p95 stays under 1 s'.","ATAM workshop finds risks and trade-offs.","Document sensitivity points and decisions."],"e":"Strong consistency lowers availability across regions; decide which matters more.","d":null,"h":"Identify key quality attribute scenarios (stimulus, environment, response, measure). Evaluate architecture approaches against them, find sensitivity points (decisions affecting a quality) and trade-offs (affecting several). Output: risks, non-risks and a prioritized utility tree. Lightweight versions can be done in a half-day workshop.","y":"Makes architecture decisions defensible.","m":"Mistake: vague goals like 'scalable'. Tip: quantify (for example 10,000 requests per second, p95 under 300 ms).","k":["Quality attributes | Qualities such as performance, security, availability, modifiability and cost that shape architecture.","Quality attribute scenario | A precise statement: stimulus, environment, response and measure, such as p95 under 300 ms at 1,000 requests per second.","Utility tree | A prioritized breakdown of quality scenarios.","Sensitivity point | A decision that strongly affects one quality.","Trade-off point | A decision that improves one quality and hurts another.","ATAM | The Architecture Tradeoff Analysis Method for evaluating designs against scenarios."]},{"n":"Architecture decision records","w":"ADRs capture why decisions were made.","b":["Title, status, context, options, decision, consequences.","One page, stored in the repo.","Superseded decisions are marked, not deleted.","Prevents re-debating old choices."],"e":"ADR-012: Use Kafka for claim events because of replay and ordering needs.","d":null,"h":"Template: Title, Status (proposed, accepted, superseded), Context, Decision, Consequences, Alternatives. Keep each ADR to one decision and number them. Use lightweight review via pull request. Link ADRs from design docs. Tools: adr-tools, Log4brains, plain Markdown in /docs/adr.","y":"Preserves institutional memory and speeds onboarding.","m":"Mistake: writing ADRs after the fact. Tip: write while deciding.","k":["ADR | A short document capturing one architecture decision, its context and consequences.","Status | Proposed, accepted, deprecated or superseded.","Context | The forces and constraints at the time of decision.","Consequences | The positive and negative results, including debt accepted.","Superseded | Marked as replaced by a newer ADR, never deleted.","Written at decision time | Reasons are fresh and accurate."]},{"n":"C4 model diagrams","w":"C4 shows architecture at four zoom levels.","b":["Level 1: system context (users and other systems).","Level 2: containers (apps, databases, services).","Level 3: components inside a container.","Level 4: code (rarely needed).","Different audiences read different levels."],"e":"Executives see level 1; engineers see level 2 and 3.","d":{"t":"layers","n":["1 System context","2 Containers","3 Components","4 Code"]},"h":"Context (people and external systems), Container (deployable units: web app, API, database), Component (modules inside a container), Code (optional). Also dynamic and deployment diagrams. Keep notation simple: boxes with name, technology and responsibility, and labeled arrows. Tools: Structurizr, draw.io, Mermaid.","y":"Helps communicate to different audiences consistently.","m":"Mistake: one diagram trying to show everything. Tip: one purpose per diagram.","k":["C4 model | Four levels of architecture diagram, from big picture to detail.","System context | Shows the system, its users and other systems.","Container | Shows separately deployable apps, services and databases.","Component | Shows the main modules inside one container.","Deployment diagram | Shows where containers run.","Diagrams as code | Tools like Structurizr and Mermaid keep diagrams in version control."]}]},{"n":"API gateways & proxies","d":"Edge and service-level traffic management.","s":[{"n":"REST, gRPC, GraphQL design and trade-offs","w":"Choose the API style by caller and need.","b":["REST: simple, cacheable, widely understood.","gRPC: binary, fast, strongly typed; good internal service calls.","GraphQL: client asks for exact fields; good for varied front ends; harder to cache and secure.","Use REST by default, gRPC inside, GraphQL when clients vary a lot."],"e":"Mobile app uses GraphQL to fetch only needed fields; services talk via gRPC.","d":{"t":"vs","lt":"REST","l":["Simple","Cacheable"],"rt":"gRPC / GraphQL","r":["gRPC: fast, typed","GraphQL: flexible queries"]},"h":"REST uses resources, HTTP verbs and caching; best for public APIs. gRPC uses Protobuf over HTTP/2, supports streaming and code generation, is efficient for internal service calls but harder for browsers. GraphQL exposes a typed schema and a single endpoint where clients select fields; needs care for query cost limits, caching and authorization per field. Event-driven APIs (AsyncAPI) cover messaging.","y":"The style affects performance, developer experience and security.","m":"Mistake: choosing the trendiest style. Tip: choose by consumers and constraints.","k":["REST | Resource-oriented APIs over HTTP using standard verbs; cacheable, simple and universally supported, the default for public APIs.","gRPC | Binary Protobuf messages over HTTP/2 with streaming and generated clients; fast and strongly typed, best between internal services.","GraphQL | One endpoint where clients choose exact fields; reduces over-fetching but needs query cost limits, caching strategy and field-level authorization.","Over-fetching and under-fetching | Receiving too much or too little data per call, a motivation for GraphQL.","N+1 problem | One query per item in a list, solved with batching or data loaders.","Choosing | REST for public, gRPC for internal high-throughput calls, GraphQL for varied client needs."]},{"n":"OpenAPI and API-first workflow","w":"Design the contract first.","b":["Write the OpenAPI spec and review it.","Generate docs, mocks, SDKs and server stubs.","Front end and back end work in parallel.","Lint the spec against company standards."],"e":"Team agrees on the spec in a pull request before coding.","d":{"t":"flow","n":["Design OpenAPI","Review","Generate mocks and docs","Build in parallel"]},"h":"API-first workflow: gather use cases, design the contract in OpenAPI (paths, schemas, examples, security), lint it (Spectral), mock it, review with consumers, then generate server stubs and client SDKs and publish docs. Keep the spec as the source of truth and test conformance.","y":"Prevents rework and parallelizes work.","m":"Mistake: spec drifting from code. Tip: validate responses against the spec in tests.","k":["OpenAPI | The standard machine-readable description of REST APIs: paths, schemas, security and examples.","Spectral | A linter that checks OpenAPI files against your style rules in CI.","Mock server | A fake API generated from the spec so consumers can start before the backend exists.","SDK generation | Client libraries produced from the spec.","Design-first | Write and review the contract before coding.","Conformance testing | Verify real responses match the spec."]},{"n":"Apigee, Azure API Management, AWS API Gateway","w":"A gateway is the front door for APIs.","b":["Authentication and token validation.","Rate limiting, caching, transformation.","Analytics and developer portal.","Azure API Management, Apigee, AWS API Gateway are the main options."],"e":"Partners get API keys and a portal; the gateway enforces quotas.","d":{"t":"flow","n":["Client","API gateway","Backend services"]},"h":"Gateway functions: authentication (JWT validation, API keys, OAuth), throttling, transformation, routing, caching, request validation, analytics, developer portal with subscriptions. Policies are configured declaratively (APIM policies, Apigee proxies). Deploy gateways per region with private connectivity to backends, and secure the management plane.","y":"Central place to apply consistent policy.","m":"Mistake: putting business logic in gateway policies. Tip: keep the gateway thin.","k":["API gateway | A front door that applies policies to all API traffic before it reaches services.","Policies | Rules such as validate JWT, rate limit, transform, cache or log.","Subscriptions and keys | Identify and meter each consumer application.","Developer portal | Documentation, try-it console and self-service sign-up.","Backend pool | The services behind the gateway.","Keep it thin | Business logic belongs in services, not gateway policies."]},{"n":"Envoy and Nginx configuration","w":"Proxies route and secure traffic.","b":["Nginx: web server and reverse proxy, simple and fast.","Envoy: modern proxy with dynamic config; foundation of Istio.","Features: TLS termination, load balancing, retries, health checks.","Learn config basics: listeners, routes, upstreams."],"e":"Nginx terminates TLS and routes /api to the app pool.","d":null,"h":"Reverse proxy terminates TLS, balances load, caches and routes requests. Nginx uses server and location blocks with upstream pools; Envoy uses listeners, routes, clusters and filters configured statically or dynamically (xDS), with rich observability and retries. Learn timeouts, keepalive, buffer sizes, health checks and header handling (X-Forwarded-For).","y":"Proxies are in every request path; misconfigurations cause hard-to-find problems.","m":"Mistake: default timeouts that cut long requests or hide failures. Tip: set explicit timeouts and monitor 4xx/5xx at the proxy.","k":["Reverse proxy | Receives client requests and forwards them to backend servers, adding TLS, load balancing and caching.","Upstream | The backend pool a proxy sends traffic to.","Envoy listeners and clusters | A listener accepts connections on a port; a cluster is a group of endpoints with load-balancing settings.","xDS | Envoy's dynamic configuration APIs, used by Istio.","Keepalive | Reusing connections to reduce latency.","Timeouts | Set connect, read and idle timeouts explicitly; defaults cause hard-to-find failures."]},{"n":"Rate limiting, quotas, throttling","w":"Protect your system from too many requests.","b":["Rate limit: requests per second per client.","Quota: total per day or month.","Throttle by returning 429 with a Retry-After header.","Use different limits per plan."],"e":"Free plan: 100 calls per hour; paid: 10,000.","d":null,"h":"Algorithms: fixed window, sliding window, token bucket. Apply per API key, user, IP or route. Return HTTP 429 with Retry-After and rate-limit headers. Use distributed counters (Redis) or gateway features. Protect expensive endpoints more tightly. Combine with bot protection and quotas per subscription plan.","y":"Protects availability and enforces business models.","m":"Mistake: only limiting at the edge and not internally. Tip: also limit service-to-service calls to prevent cascades.","k":["Token bucket | Tokens refill at a steady rate and each request spends one; allows bursts up to the bucket size.","Fixed and sliding windows | Count requests per time window; sliding windows avoid spikes at window edges.","429 Too Many Requests | The standard response when a client exceeds limits.","Retry-After | A header telling clients when to try again.","Quota | A total allowance per period such as per month.","Per-key limits | Different limits for different plans or clients."]},{"n":"API authentication and authorization (OAuth scopes, mTLS)","w":"Secure each call.","b":["OAuth 2.0 scopes limit what a token can do.","Validate token signature, issuer, audience and expiry.","mTLS authenticates services with certificates.","Never put secrets in URLs."],"e":"Scope claims:read allows GET but not DELETE.","d":null,"h":"Authentication proves the identity of the caller; authorization checks permission. OAuth scopes and roles are put in access tokens; services verify them. Fine-grained access (object-level) is checked in the service. mTLS (client certificates) authenticates machines. API keys identify applications but are not strong authentication alone. Avoid sending tokens in URLs; log without sensitive data.","y":"Most API breaches are broken authorization.","m":"Mistake: checking only that a user is logged in. Tip: verify access to each object (BOLA prevention).","k":["OAuth scope | A permission string in an access token, such as claims:read, limiting what the token can do.","Audience | The API a token is meant for; always check it.","Client credentials flow | Machine-to-machine token request with no user.","API key | A simple application identifier, not strong authentication on its own.","mTLS | Client and server both present certificates.","BOLA | Broken object-level authorization: access to other users' objects by changing an ID."]},{"n":"Versioning and deprecation strategy","w":"APIs live a long time. Plan changes.","b":["Version in URL (/v2) or header.","Add fields without removing old ones.","Announce deprecation with a date and migration guide.","Monitor usage of old versions before retiring."],"e":"v1 sunsets in 12 months after warnings.","d":null,"h":"Strategies: URL versioning (/v1), header versioning, or evolution without versions through additive changes. Define breaking vs non-breaking changes. Use deprecation headers (Sunset), communication plans, migration guides and usage analytics. Support at most two or three versions.","y":"Allows safe evolution without breaking clients.","m":"Mistake: breaking changes with no notice. Tip: monitor which clients call old versions and contact them.","k":["URL versioning | /v1/claims makes versions visible and simple.","Header versioning | Version in a header keeps URLs stable but is less visible.","Breaking change | Removing a field, changing its meaning or type, or stricter validation.","Additive change | New optional fields or endpoints, usually safe.","Deprecation and Sunset | Announce retirement with a date, using the Sunset header.","Usage analytics | See who still calls old versions."]},{"n":"API lifecycle governance","w":"Consistency across teams makes APIs easier to use.","b":["Standards for naming, errors, pagination and security.","Design review before publishing.","Central catalog of APIs and owners.","Retire unused APIs."],"e":"All errors use the same problem-details JSON format.","d":null,"h":"Governance includes style guide (naming, pagination, error format), security baseline, design review checkpoints, linting in CI, API catalog with owners and lifecycle status (design, active, deprecated, retired), and metrics (usage, errors, latency). Keep it light and automated.","y":"Consistency makes the whole ecosystem easier to use.","m":"Mistake: heavy approval boards that slow teams. Tip: automate checks and review only exceptions.","k":["Style guide | Rules for naming, pagination, errors and security so all APIs feel alike.","API catalog | A registry of all APIs, owners and lifecycle status.","Design review | A checkpoint before publishing.","Automated linting | Enforce rules in CI.","API as a product | Each API has an owner, roadmap, support and documentation.","API SLOs | Availability and latency targets per API."]}]},{"n":"Messaging & integration","d":"Asynchronous and enterprise integration.","s":[{"n":"Kafka concepts: topics, partitions, consumer groups","w":"Kafka is a distributed log of events.","b":["Topic: named stream; partitions split it for scale.","Order is guaranteed only within a partition; choose key accordingly.","Consumer groups share partitions; each message goes to one consumer in the group.","Messages stay for a retention period, so you can replay."],"e":"Key by policy ID so all events of one policy stay in order.","d":{"t":"hub","c":"Topic claims","n":["Partition 0","Partition 1","Partition 2"]},"h":"Producers write records to topic partitions; each partition is an ordered log replicated across brokers. Records with the same key go to the same partition. Consumer groups assign each partition to one consumer for parallelism; offsets track progress and are committed after processing. Retention keeps data for a time or size; compaction keeps the latest value per key. Replication factor 3 and min in-sync replicas 2 give durability.","y":"Kafka is the backbone for many event-driven platforms.","m":"Mistake: too few partitions limiting scale, or too many causing overhead. Tip: plan partitions per throughput and consumer parallelism.","k":["Topic | A named stream of records.","Partition | An ordered, append-only shard of a topic; the unit of parallelism and ordering.","Offset | The position of a record within a partition, tracked per consumer group.","Consumer group | Consumers that share a topic's partitions so each partition is read by one consumer in the group.","Replication factor | Copies of each partition across brokers; 3 with min in-sync replicas 2 is common for durability.","Retention and compaction | Records are kept for a time or size regardless of reading; compaction keeps only the latest record per key."]},{"n":"Azure Service Bus, Event Hubs, SQS/SNS, EventBridge","w":"Different messaging services fit different patterns.","b":["Queues (SQS, Service Bus queues): one consumer processes each message.","Topics/pub-sub (SNS, Service Bus topics, EventBridge): many subscribers.","Event Hubs and Kinesis: high-volume streams.","Choose by pattern: task, notification or stream."],"e":"Claim submitted event fans out to billing, notifications and analytics.","d":{"t":"vs","lt":"Queue","l":["One consumer per message","Work distribution"],"rt":"Topic","r":["Many subscribers","Fan-out events"]},"h":"Queues (SQS, Service Bus queues) provide competing consumers with visibility timeout/lock and dead-letter support. Topics/subscriptions (SNS, Service Bus topics) fan out to many subscribers, with filters. EventBridge routes events by rules from many sources. Event Hubs/Kinesis stream high volumes with partitioned ordering and replay. Choose by throughput, ordering, retention and fan-out needs.","y":"Wrong choice leads to lost messages or high cost.","m":"Mistake: using a queue for broadcast. Tip: map pattern to service before choosing.","k":["Queue | Competing consumers share work; each message is processed by one worker.","Topic subscription | Each subscriber gets its own copy of every message, with optional filters.","Visibility timeout or lock | A message is hidden while being processed and reappears if not completed.","Dead-letter queue | Holds messages that failed repeatedly for inspection.","Event stream | An ordered, replayable log such as Kafka, Event Hubs or Kinesis.","Event bus | Routes events by rules from many sources to many targets, such as EventBridge."]},{"n":"Enterprise integration patterns","w":"Proven recipes for connecting systems.","b":["Message router, translator, aggregator, splitter.","Request-reply, publish-subscribe, dead-letter channel.","Content-based routing.","Learn the names so teams share vocabulary."],"e":"A translator converts partner XML into your JSON event.","d":null,"h":"Patterns: Point-to-point, Publish-subscribe, Message Router, Content Enricher, Splitter/Aggregator, Claim Check (store large payload elsewhere), Dead Letter Channel, Idempotent Receiver, Competing Consumers, Process Manager. Tools: Camel, MuleSoft, Azure Logic Apps, Step Functions.","y":"Gives proven solutions for common problems.","m":"Mistake: reinventing patterns. Tip: learn the catalog by Hohpe and Woolf.","k":["Message router | Sends messages to different destinations based on content or rules.","Message translator | Converts between data formats.","Splitter and aggregator | Break one message into parts, or combine related messages into one.","Claim check | Store a large payload elsewhere and pass only a reference.","Competing consumers | Several workers read one queue to scale processing.","Request-reply | A response goes to a reply address with a correlation ID."]},{"n":"Idempotency, retries, backoff, dead-letter queues","w":"Messages can be delivered more than once, so design for it.","b":["Idempotent consumer: processing twice gives same result (use message ID).","Retry with exponential backoff and jitter.","Dead-letter queue stores poison messages for review.","Alert when the DLQ grows."],"e":"Store processed message IDs to ignore duplicates.","d":{"t":"flow","n":["Message","Process","Fail","Retry with backoff","Dead-letter queue"]},"h":"Since delivery is at-least-once, consumers deduplicate using message ID or business key stored with the effect. Retries use exponential backoff with jitter and a max attempts count. After max attempts, messages go to DLQ with error info; a runbook or tool reprocesses after fixing. Monitor DLQ depth and age.","y":"Prevents duplicate charges and stuck pipelines.","m":"Mistake: infinite immediate retries causing storms. Tip: always bound retries and alert on DLQ.","k":["At-least-once delivery | Messages are never lost but can arrive more than once.","Idempotent consumer | Detects duplicates, for example by message ID, so the effect happens once.","Exponential backoff | Retry delays that grow, such as 1, 2, 4 seconds.","Jitter | Random variation so many clients do not retry at the same moment.","Poison message | A message that always fails; move it to the DLQ.","Redrive | Move messages from the DLQ back after the fix."]},{"n":"Schema registry and event contracts","w":"Events are contracts between teams.","b":["Schema registry stores Avro, JSON Schema or Protobuf.","Compatibility rules (backward, forward) block breaking changes.","Version events and document fields.","Producer tests prevent accidental breaks."],"e":"Adding an optional field is allowed; removing a field is rejected.","d":null,"h":"Define event schemas with a registry (Confluent, Glue, Azure Schema Registry) using Avro, Protobuf or JSON Schema. Compatibility modes: backward (new schema can read old data), forward, full. Include event type, version, ID, time and correlation ID. Document ownership and meaning. Use consumer-driven tests.","y":"Events are public contracts across teams.","m":"Mistake: changing field meaning silently. Tip: add new fields instead, and deprecate gradually.","k":["Schema registry | A service storing event schemas and enforcing compatibility rules.","Avro, Protobuf and JSON Schema | Formats for defining event structure.","Backward compatible | New schema versions can read old data.","Forward compatible | Old consumers can read new data.","Event envelope | Metadata such as id, type, source, time and version.","Additive evolution | Add optional fields; avoid removing or renaming."]},{"n":"Ordering and exactly-once semantics","w":"Delivery guarantees are a trade-off.","b":["At-most-once: may lose messages.","At-least-once: no loss, possible duplicates (most common).","Exactly-once: limited and costly; often simulated with idempotency.","Preserve order by key when it matters."],"e":"Use at-least-once plus idempotent handlers.","d":null,"h":"Kafka offers idempotent producers and transactions for exactly-once within Kafka processing; end-to-end exactly-once with external systems still requires idempotent writes. Ordering is per partition: choose keys such as policy ID. Re-partitioning breaks order assumptions. For global ordering you give up parallelism.","y":"Misunderstood guarantees create subtle data errors.","m":"Mistake: assuming messages arrive once and in order. Tip: design handlers to be idempotent and order-tolerant where possible.","k":["At-most-once | Messages may be lost but never duplicated.","Exactly-once | The effect happens once; in practice achieved with idempotency, and within Kafka with transactions.","Partition key | Chooses the partition and defines the scope of ordering.","Ordering guarantee | Preserved only within a partition.","Rebalance | Partitions are reassigned when consumers join or leave, briefly pausing processing.","Global ordering | Needs a single partition and limits throughput."]},{"n":"Batch file and legacy system integration","w":"Many enterprises still exchange files.","b":["SFTP drops, CSV, fixed width, EDI.","Validate, reject bad rows to an error file, send acknowledgments.","Reconcile counts and totals.","Wrap with APIs or events where possible."],"e":"Nightly eligibility file from a partner is validated and loaded.","d":{"t":"flow","n":["File arrives","Validate","Load","Reconcile","Ack / error file"]},"h":"Typical steps: receive via SFTP/managed file transfer, verify checksum and format, validate schema and business rules, load to staging, report errors, reconcile control totals, acknowledge. Use file naming conventions, archive originals, and handle duplicates and reprocessing. Convert formats (EDI X12 834/837, HL7, CSV). Consider converting to events or API after ingestion.","y":"Many partners will exchange files for years.","m":"Mistake: no reconciliation, so silent data loss. Tip: compare record counts and totals each run.","k":["SFTP | Secure file transfer used by many partners.","EDI X12 | Standard formats such as 834 enrollment, 837 claims and 835 payments.","Control totals | Record counts and amounts used to reconcile a file.","Acknowledgment file | Confirms receipt and validity.","Error file | Rejected records with reasons.","Managed file transfer | A platform providing audit, encryption and retries."]}]},{"n":"Service mesh (Istio)","d":"Secure and observable service-to-service traffic.","s":[{"n":"Control plane (istiod) and sidecar data plane","w":"Istio adds networking features without changing app code.","b":["Control plane (istiod): holds config and issues certificates.","Data plane: Envoy proxies next to each service.","All service traffic goes through the proxies.","Rules are applied centrally and pushed to proxies."],"e":"Enable mTLS between all services with no code change.","d":{"t":"layers","n":["istiod control plane","Envoy sidecar proxies","Your services"]},"h":"istiod pushes configuration, certificates and service discovery to Envoy proxies. Sidecars are injected by labeling a namespace; traffic is redirected through the proxy via iptables or CNI. The proxy enforces mTLS, routing, retries, policies and emits telemetry (metrics, traces, access logs) without code changes. Cost: extra CPU/memory per pod and added latency of a few milliseconds.","y":"Gives uniform security and observability across all services.","m":"Mistake: enabling mesh everywhere at once. Tip: roll out by namespace with monitoring.","k":["istiod | The Istio control plane. It watches Kubernetes, builds configuration for every proxy, acts as the certificate authority and pushes updates; it is not in the request path, so a brief istiod outage does not stop existing traffic.","Envoy sidecar | A proxy container injected into each pod. All inbound and outbound traffic of the app passes through it, which is how mTLS, retries and metrics work without code changes.","Sidecar injection | When a namespace is labeled istio-injection=enabled, new pods automatically get the proxy. Existing pods must be restarted to receive it.","Data plane | The set of proxies that carry real traffic. Its health directly affects application latency and availability, so proxy resources must be sized.","Overhead | Each sidecar uses CPU and memory and adds roughly a few milliseconds per hop; on thousands of pods this is a real cost and a reason ambient mode exists."]},{"n":"Ambient mode vs sidecar mode","w":"Ambient mode is the sidecar-less design.","b":["ztunnel per node handles mTLS and basic L4 policy.","Optional waypoint proxy handles L7 features per namespace or service.","Fewer resources, easier upgrades, no pod restarts to enroll.","Sidecars still give per-pod control."],"e":"Add a namespace to ambient with a label, no restarts.","d":{"t":"vs","lt":"Sidecar","l":["Proxy per pod","More resource use","Fine control"],"rt":"Ambient","r":["Node proxy + waypoint","Lower overhead","Simpler rollout"]},"h":"Ambient mode splits roles: ztunnel (per node) provides secure L4 transport with mTLS and identity; waypoint proxies (per namespace or service) provide L7 features only where needed. No sidecar injection or restarts to join the mesh; upgrades are simpler and resource overhead is lower. It matured to production readiness in recent releases; verify feature coverage for your needs.","y":"Reduces operational burden of sidecars.","m":"Mistake: assuming parity for every feature. Tip: check supported features and test before migrating.","k":["Ambient mode | Istio without per-pod sidecars. A node-level ztunnel provides secure transport and identity, and optional waypoint proxies add HTTP features only where needed.","ztunnel | A per-node proxy that provides mTLS, identity and L4 telemetry for every pod on the node, using far fewer resources than a sidecar per pod.","Waypoint proxy | An optional shared Envoy for a namespace or service that provides L7 features such as HTTP routing, retries and JWT checks.","L4 versus L7 | Layer 4 deals with connections and ports (encryption, TCP policy); layer 7 understands HTTP (paths, headers, retries). Ambient separates them so you pay for L7 only when needed.","Migration consideration | Pods join by labeling a namespace with no restart, but verify that every feature you rely on is supported in ambient before moving production."]},{"n":"mTLS and PeerAuthentication","w":"mTLS encrypts and authenticates service traffic.","b":["Each workload gets an identity certificate (SPIFFE) from istiod.","Certificates rotate automatically.","PeerAuthentication sets PERMISSIVE (accept both) or STRICT (mTLS only).","Migrate from permissive to strict gradually."],"e":"Namespace claims set to STRICT after all clients are in the mesh.","d":{"t":"flow","n":["Service A proxy","Mutual TLS","Service B proxy"]},"h":"Each workload gets a SPIFFE identity derived from its service account (spiffe://cluster.local/ns/claims/sa/api).
