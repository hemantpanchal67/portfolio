to MCP servers, which expose capabilities. It replaces custom integrations with one common protocol."},{"n":"Tools, resources, prompts","note":"An MCP server offers tools (actions the model can call), resources (data it can read) and prompts (reusable templates). Describing them clearly helps the model use them correctly."},{"n":"Building an MCP server","note":"Wrap your service in an MCP server using an SDK: define tools with names, descriptions and input schemas, handle calls and return results. Keep each tool small and well described."},{"n":"Auth and security for MCP","note":"Treat MCP servers like any API: authenticate users, give least privilege, validate inputs and log calls. Beware prompt injection through tool results and untrusted servers."},{"n":"Exposing internal APIs through MCP","note":"Make existing internal services available to agents by wrapping them as MCP tools. Start with read-only operations, add approvals for writes and keep human-readable descriptions."},{"n":"Registry and governance of MCP servers","note":"Keep a catalog of approved MCP servers with owners, versions and security review. Governance stops shadow integrations and makes agent capabilities auditable."},{"n":"MCP in agent golden paths","note":"A golden path gives teams a ready template: an agent project with approved models, MCP tools, guardrails and monitoring included. It speeds delivery and keeps teams consistent and safe."}]},{"n":"Responsible AI & guardrails","d":"Safety and trust.","s":[{"n":"Microsoft Responsible AI principles","note":"Microsoft's principles are fairness, reliability and safety, privacy and security, inclusiveness, transparency and accountability. Use them as a checklist when designing and reviewing AI features."},{"n":"Content filtering and prompt-shield techniques","note":"Filter harmful input and output (hate, violence, self-harm, sexual content). Prompt shields detect attempts to override instructions. Tune thresholds for your use case and test them."},{"n":"Grounding checks and hallucination detection","note":"Check that the answer is supported by the retrieved sources. Methods include citation checks, a second model verifying claims and refusing when evidence is weak. Reduce hallucination, never assume it is zero."},{"n":"PII redaction and data leakage prevention","note":"Detect and mask personal data before sending it to models and before showing outputs. Block secrets in prompts, restrict logging of content and confirm provider data-use terms."},{"n":"Prompt injection defenses","note":"Attackers hide instructions in user input or documents ('ignore previous rules'). Separate instructions from data, limit tool permissions, validate outputs and require approval for sensitive actions."},{"n":"Bedrock Guardrails and Azure AI Content Safety","note":"Managed services that apply safety rules: blocked topics, content filters, PII handling and grounding checks. They give consistent protection across applications without building everything yourself."},{"n":"Audit logging and human oversight","note":"Log prompts, responses, tool calls and decisions (with privacy controls) so you can investigate issues. Keep humans able to review, override and shut off AI features."},{"n":"AI governance and risk assessment","note":"Classify each AI use case by risk, document purpose, data, owners and limits, and require review before launch. Align with frameworks such as NIST AI RMF and the EU AI Act."}]},{"n":"AI evaluation","d":"Measure quality before and after launch.","s":[{"n":"Golden datasets and test set creation","note":"A golden dataset is a set of realistic questions with known good answers or sources, made with domain experts. It is the yardstick for every change to prompts, models or retrieval."},{"n":"Ragas metrics: faithfulness, relevance, context precision/recall","note":"Ragas scores RAG systems. Faithfulness checks the answer is supported by the context, answer relevance checks it addresses the question, and context precision and recall check retrieval quality."},{"n":"LLM-as-judge design and bias","note":"Use a strong model with a clear rubric to grade answers at scale. Judges can favor longer or their own style answers, so calibrate against human ratings and use pairwise comparison."},{"n":"Offline evals in CI","note":"Run the golden set automatically whenever prompts, models or code change, and fail the build if quality drops below a threshold. This prevents silent regressions."},{"n":"Online monitoring: feedback, drift, cost","note":"In production track user feedback (thumbs up or down), refusal rates, latency, cost and topics that fail. Sample real conversations for review and feed problems back into the test set."},{"n":"A/B testing prompts and models","note":"Serve two variants to different users and compare outcomes such as task success, satisfaction and cost. It proves a change helps with real traffic."},{"n":"Regression gates for prompt changes","note":"Treat prompts like code: version them, review them and require passing evals before release. A small wording change can break behavior elsewhere."}]}]},{"p":"Phase 8 - AI-Assisted Development & Contact Center (Weeks 31-32)","why":"Why: tooling that speeds up your own delivery.","t":[{"n":"AI development life cycle","d":"AI across every stage of delivery.","s":[{"n":"Spec-driven development workflow","note":"Start by writing a clear spec (requirements, design, tasks) and let AI generate code against it. The spec is reviewed by humans, so intent stays clear and results are checkable. It reduces random prompting."},{"n":"AI for requirements and design","note":"Use AI to draft user stories, find gaps, compare design options and produce diagrams. Treat outputs as drafts that people validate with the business."},{"n":"AI for coding, refactoring and test generation","note":"AI is strong at boilerplate, refactoring and generating unit tests. Give it context and small tasks, then read every change. You remain responsible for correctness."},{"n":"AI-assisted code review and security scanning","note":"AI reviewers catch common bugs and style issues before humans look. Pair them with SAST and dependency scanning, and keep humans for design and risk judgments."},{"n":"Governance, IP and licensing of generated code","note":"Set policy on which tools are allowed, what data may be shared, how generated code is reviewed and how license risk is handled. Enterprise plans offer protections and audit logs."},{"n":"Measuring productivity impact","note":"Track cycle time, review time, defects and developer satisfaction before and after adoption. Be careful: more code written is not the same as more value delivered."},{"n":"Team adoption playbook","note":"Start with a pilot team, share good prompts and examples, train on reviewing AI output and collect feedback. Adoption grows when people see real wins."}]},{"n":"AWS Kiro","d":"Agentic IDE with specs.","s":[{"n":"Specs: requirements, design, tasks","note":"Kiro turns an idea into three documents: requirements (often as EARS-style acceptance criteria), a technical design, and a task list. The agent then works through tasks, and you review each step."},{"n":"Steering files for project context","note":"Steering files hold permanent guidance for the agent: tech stack, coding standards, folder layout and rules. They save you repeating context in every prompt."},{"n":"Agent hooks","note":"Hooks run automatically on events, such as updating tests when a file is saved or checking security on commit. They automate routine quality steps."},{"n":"MCP integration in Kiro","note":"Connect Kiro to MCP servers so the agent can read documentation, query systems or use internal tools while it builds."},{"n":"Vibe vs spec modes","note":"Vibe mode is quick, conversational coding for exploration. Spec mode is structured and better for bigger features that need traceability. Choose by the risk and size of the work."},{"n":"Reviewing and validating agent output","note":"Read diffs, run tests, check security and confirm the work meets the acceptance criteria. Agents can be confidently wrong, so review is not optional."}]},{"n":"GitHub Copilot","d":"Assistant, agent mode and reviews.","s":[{"n":"Inline completions and chat","note":"Copilot suggests code as you type and answers questions in chat about your code. Good prompts include context: the goal, constraints and examples of your style."},{"n":"Agent mode and coding agent","note":"Agent mode edits multiple files and runs commands to finish a task in your editor. The coding agent works in the background on issues and opens pull requests for you to review."},{"n":"Custom instructions and prompt files","note":"Add repository instructions (coding rules, build commands) and reusable prompt files so Copilot follows your team's standards automatically."},{"n":"Copilot code review","note":"Copilot can review pull requests and leave suggestions. Use it as a first pass for catching mistakes, with human reviewers making the final call."},{"n":"Enterprise policy, content exclusions, audit","note":"Admins control which models and features are on, exclude sensitive files from AI use and review usage logs. Set these before wide rollout."},{"n":"Prompt techniques for quality results","note":"Be specific, give examples, break work into small steps, state constraints and ask the tool to explain its plan first. Iterate instead of expecting a perfect first answer."}]},{"n":"Amazon Connect","d":"Cloud contact center.","s":[{"n":"Instances, queues, routing profiles","note":"An Amazon Connect instance is your contact center. Queues hold waiting contacts, and routing profiles decide which queues each agent handles and in what priority."},{"n":"Contact flows and flow design","note":"Flows are visual scripts that run when a customer calls or chats: greet, authenticate, offer menu, route or transfer. Keep flows simple, reusable and well tested."},{"n":"Amazon Lex bots and Bedrock integration","note":"Lex handles voice and chat conversations and recognizes intents. Adding Bedrock lets bots answer open questions using a knowledge base while Lex handles structured tasks."},{"n":"Lambda integrations and CRM connectors","note":"Lambda functions look up customer data, update records and make decisions inside flows. Connectors link to CRM systems so agents see the customer's context on screen."},{"n":"Contact Lens analytics","note":"Contact Lens transcribes calls and analyzes sentiment, topics and compliance. Supervisors use it to find issues and coach agents, and it supports real-time alerts."},{"n":"Agent workspace and customer profiles","note":"The agent workspace combines the phone, customer history and guides in one screen. Customer Profiles unify data from different systems to give personalized service."},{"n":"Security, recording and compliance","note":"Encrypt recordings, control who can listen, redact sensitive data such as card numbers and follow rules like PCI and HIPAA. Define retention periods."}]}]},{"p":"Phase 9 - Enterprise Architecture & Technical Leadership (Weeks 33-38)","why":"Why: what separates Architect from Senior Engineer.","t":[{"n":"Enterprise strategy","d":"Governance and cloud adoption at scale.","s":[{"n":"Cloud Adoption Framework stages","note":"Microsoft's stages are strategy, plan, ready, adopt (migrate or innovate), govern and manage. They give a roadmap that links business goals to technical steps."},{"n":"Enterprise-scale landing zones","note":"Landing zones at enterprise scale use management groups, policy, central networking and platform subscriptions so many workload teams can build safely without reinventing the foundation."},{"n":"Hybrid with Azure Arc and Azure Stack","note":"Azure Arc extends Azure management and policy to servers, Kubernetes and databases running elsewhere. Azure Stack runs Azure services on your own hardware for latency or regulation needs."},{"n":"Multi-cloud strategy and portability trade-offs","note":"Multi-cloud can reduce vendor risk and meet client demands but increases skills, cost and complexity. Use open standards (Kubernetes, Terraform) where portability matters and accept lock-in where value is high."},{"n":"Governance, risk and compliance models","note":"Define who decides, what rules apply and how compliance is proven. Combine policy as code, regular reviews and clear escalation for exceptions."},{"n":"Architecture review boards","note":"A review board checks major designs against standards and risks. Make it fast and helpful: short submissions, clear criteria and decisions recorded as ADRs."},{"n":"Technology radar and standards","note":"A radar lists technologies as adopt, trial, assess or hold. It guides teams on approved choices and shows where the organization is heading."}]},{"n":"Roadmaps & business cases","d":"Secure buy-in and funding.","s":[{"n":"Current-state and target-state assessment","note":"Describe where you are (systems, costs, skills, risks) and where you want to be, then identify the gaps. The gaps become the roadmap."},{"n":"TCO and ROI modeling","note":"TCO adds all costs over several years (cloud, licenses, people, migration, downtime). ROI compares benefits to cost. Make assumptions explicit so leaders can challenge them."},{"n":"Cost and risk analysis","note":"List the options with their costs, benefits, risks and mitigations. Show what happens if nothing is done. Clear numbers and risks win funding."},{"n":"Phased proposals with milestones","note":"Break a large program into phases that each deliver value and have a go/no-go point. Leaders find it easier to approve and you can adjust based on results."},{"n":"Capability maps and investment prioritization","note":"A capability map shows what the business does (underwriting, claims, billing). Rate each by importance and maturity to decide where technology investment matters most."},{"n":"Executive summary writing","note":"Lead with the decision needed, the recommendation, the cost and the outcome in one page. Put detail in appendices. Executives read the first page only."},{"n":"Stakeholder mapping","note":"List everyone affected and rate their influence and interest. Plan how to involve each: sponsors, blockers, supporters and teams doing the work."}]},{"n":"Platform engineering","d":"Reusable paths for teams.","s":[{"n":"Internal developer platform concepts","note":"An internal developer platform gives developers self-service access to environments, pipelines and tools so they ship faster without needing deep infrastructure knowledge."},{"n":"Golden paths and templates","note":"A golden path is the recommended, supported way to build something, such as a service template with CI/CD, security and monitoring already set up. It is optional but so easy that teams choose it."},{"n":"Backstage or similar portals","note":"Backstage is an open-source developer portal with a service catalog, templates and docs in one place. It makes ownership and standards visible."},{"n":"Self-service infrastructure","note":"Let teams request databases, clusters or environments through a form or pull request that runs approved automation. It removes ticket queues while keeping guardrails."},{"n":"Platform as a product mindset","note":"Treat the platform like a product: know your users (developers), gather feedback, publish a roadmap and measure adoption. A platform nobody wants is waste."},{"n":"Standards for IaC, CI/CD, observability","note":"Provide shared modules, pipeline templates and logging and tracing defaults. Standards give consistency and security without every team starting from scratch."},{"n":"Shared component libraries","note":"Common libraries for authentication, logging and API clients prevent duplicate work. Version them carefully and keep them small so they do not slow teams down."}]},{"n":"Programs across org boundaries","d":"Influence without authority.","s":[{"n":"Program and dependency management","note":"Map dependencies between teams, track them visibly and review them often. Sequence work to unblock others first and escalate early when a date is at risk."},{"n":"Champions per business unit","note":"Name one engaged person in each business unit to represent the program, coordinate local work and share feedback. Champions turn a central plan into local action."},{"n":"Executive sponsorship and escalation","note":"Get a senior sponsor who removes blockers and confirms priorities. Agree up front when and how issues are escalated."},{"n":"Sequencing and resourcing conflicts","note":"Teams often have competing priorities. Make trade-offs visible, agree sequencing with leaders and secure named capacity so migrations do not stall."},{"n":"Decision records and RACI","note":"RACI shows who is Responsible, Accountable, Consulted and Informed. Write decisions down with owners and dates so people do not reopen them."},{"n":"Negotiation and conflict resolution","note":"Understand each side's real needs, share data, look for options that give both something and escalate only when needed. Stay calm and focus on outcomes."},{"n":"Status reporting that drives action","note":"Report progress, risks and the specific help needed. Use a consistent simple format (green, amber, red with reasons) and highlight decisions required."}]},{"n":"Technical debt & migrations","d":"Large-scale change at scale.","s":[{"n":"Debt inventory and prioritization","note":"List technical debt with its impact and cost to fix. Prioritize by risk and the pain it causes teams, and reserve regular capacity to pay it down."},{"n":"CI/CD platform consolidation","note":"Moving many teams to one pipeline platform lowers cost and improves security. Migrate in waves with templates, tooling and support, and retire old systems on a date."},{"n":"Artifact registry modernization","note":"Centralize packages and images in a modern registry with scanning, access control and caching. Plan the migration of repositories and update build configurations."},{"n":"Automated dependency upgrades (Renovate, Dependabot)","note":"Bots open pull requests when libraries have new versions. Combined with good tests they keep dependencies current and reduce security risk with little effort."},{"n":"Large-scale code changes across many repos","note":"Use scripts and tools that apply the same change to hundreds of repositories and open pull requests automatically. Roll out in batches and track completion."},{"n":"Rollout discipline and rollback","note":"Pilot first, expand in waves, monitor and keep a tested rollback. Communicate dates clearly to everyone affected."},{"n":"Cost modeling for migrations","note":"Include one-time effort, parallel running, licensing and savings after. Show payback time and the cost of delay."}]},{"n":"Platform metrics","d":"Prove the investment works.","s":[{"n":"Adoption rate","note":"Track how many teams use the platform or golden path compared with how many could. Low adoption signals usability or trust problems."},{"n":"Incident trends and MTTR","note":"Count incidents and measure mean time to restore. Falling numbers show platform work is making production safer."},{"n":"Cost trajectory and unit economics","note":"Watch total spend and cost per unit (per user, per transaction). Good platform work lowers unit cost even when volume grows."},{"n":"Developer sentiment and surveys","note":"Ask developers regularly about friction, tools and satisfaction. Surveys reveal problems that metrics miss."},{"n":"DORA and SPACE frameworks","note":"DORA measures delivery performance. SPACE adds satisfaction, activity, communication and efficiency. Use both so you do not optimize speed at the cost of people."},{"n":"Dashboards for leadership","note":"Show a few clear indicators with trends and targets, not dozens of numbers. Link each to a business outcome and explain what actions follow."},{"n":"Linking metrics to business outcomes","note":"Translate technical gains into business language: faster releases mean quicker features, fewer incidents mean fewer client escalations, lower cost means more budget for new work."}]},{"n":"Documentation","d":"Decisions and designs that last.","s":[{"n":"Architecture decision records","note":"One short document per significant decision: context, options, decision and consequences. Stored with the code, ADRs preserve reasoning for new team members and auditors."},{"n":"Design document template","note":"A good template covers goals, non-goals, context, proposed design, alternatives, risks, security, testing and rollout. Using one template makes reviews faster."},{"n":"Implementation plans and runbooks","note":"An implementation plan lists steps, owners, dependencies and timing. A runbook covers how to operate the result. Write both before go-live."},{"n":"Diagrams as code (C4, Mermaid, PlantUML)","note":"Describe diagrams in text so they live in Git, get reviewed and stay current. Mermaid works in many tools and renders automatically."},{"n":"Documentation review cadence","note":"Schedule regular reviews of key documents and assign owners. Outdated documentation is worse than none because people trust it."},{"n":"Keeping docs next to code","note":"Store docs in the same repository as the code, update them in the same pull request and publish them automatically. This keeps them accurate."}]},{"n":"Mentoring & communication","d":"Grow others and tell the story.","s":[{"n":"Coaching senior engineers and architects","note":"Ask questions rather than give answers, share your reasoning, give stretch work with support and give specific feedback. Your goal is to make others independent."},{"n":"Design review facilitation","note":"Share the document ahead, set the goal of the meeting, invite the right people, capture decisions and actions. Keep it about improving the design, not defending it."},{"n":"Executive briefings and client workshops","note":"Know the audience's goals, start with the outcome, use plain language and visuals and leave time for questions. Prepare the three points you want them to remember."},{"n":"Presales: solution shaping, estimates, proposals","note":"Understand the client's problem, propose a clear solution and approach, estimate with stated assumptions and risks and show similar past successes. Work closely with sales and delivery."},{"n":"Translating technical concepts to business impact","note":"Replace jargon with what it means for cost, risk, speed or customer experience. Use analogies and one concrete example."},{"n":"Thought leadership: talks, articles, internal assets","note":"Share lessons through talks, blog posts and reusable internal assets. It builds credibility and brings opportunities. Start with a real problem you solved."},{"n":"Reusable frameworks and patterns","note":"Capture what works as templates, reference architectures and checklists so other teams can reuse them. Maintain them and measure their use."}]}]},{"p":"Phase 10 - Domain & Certifications (parallel / Weeks 39+)","why":"Why: proof of knowledge and domain context.","t":[{"n":"Stop Loss platform domain","d":"Insurance domain context.","s":[{"n":"Stop loss insurance basics: specific and aggregate","note":"Stop loss insurance protects employers who pay their own employees' health claims. Specific stop loss pays when one person's claims exceed a limit. Aggregate pays when total claims for the group exceed a limit for the year."},{"n":"Attachment points, deductibles, corridors","note":"The attachment point is the amount of claims the employer pays before insurance starts. Deductible is the same idea for specific coverage. A corridor is an extra amount the employer absorbs before aggregate coverage begins."},{"n":"Claims lifecycle and reimbursement","note":"Claims are submitted by the plan's administrator, reviewed against the policy terms, and reimbursed when they exceed the limits. Watch for lasers (higher limits for specific individuals), run-in and run-out periods and filing deadlines."},{"n":"Reinsurance and underwriting concepts","note":"Underwriting prices risk using medical and claims history. Insurers pass part of their risk to reinsurers. Know how these affect pricing, data needs and reporting."},{"n":"Premium, billing and policy administration","note":"The platform must handle quoting, issuing policies, calculating and billing premiums, endorsements and renewals. These are the core business capabilities to map to services."},{"n":"Regulatory and data privacy requirements (HIPAA)","note":"Health claims data is protected by HIPAA: limit access, encrypt data, keep audit logs, sign business associate agreements and report breaches. Design the platform with these from the start."},{"n":"Integration with TPAs and claims systems","note":"Third-party administrators send claims data in files and APIs, often in formats such as EDI. Plan for validation, mapping, reconciliation and handling late or corrected data."}]},{"n":"Federal government context","d":"Working with agency clients.","s":[{"n":"Agency delivery models and contracts","note":"Federal work follows contract types, deliverable schedules and formal reviews. Understand the vehicles (for example firm-fixed-price and time-and-materials) and how they affect scope and change control."},{"n":"Security authorization (ATO, FedRAMP, FISMA)","note":"An Authority to Operate (ATO) is formal approval to run a system, based on security documentation and testing under FISMA and NIST. Plan time and artifacts such as the System Security Plan."},{"n":"Section 508 accessibility","note":"Federal systems must be usable by people with disabilities. Follow WCAG guidelines, test with screen readers and keyboard only and include accessibility in the definition of done."},{"n":"Data sovereignty and GovCloud / Azure Government","note":"Some data must stay in the US and be handled by cleared personnel. AWS GovCloud and Azure Government are separate regions built for this. Check which services are available there."},{"n":"Procurement and compliance terms","note":"Know basics like FAR and DFARS clauses, data rights and reporting duties. Involve contracts and legal specialists early when design touches these terms."},{"n":"Working with vendor partners","note":"Define interfaces, responsibilities and communication clearly. Hold joint reviews, share standards and use a single source of truth for plans and issues."}]},{"n":"Certification order","d":"Suggested path.","s":[{"n":"AZ-900 Azure Fundamentals","note":"Entry-level exam on cloud concepts, Azure services, security, pricing and governance. About 40-60 questions. Needs about 1-2 weeks of study."},{"n":"AZ-104 Azure Administrator","note":"Covers identity, governance, storage, compute, virtual networking and monitoring. It is hands-on, so practice in a free Azure subscription. Plan 4-6 weeks."},{"n":"AI-102 Azure AI Engineer","note":"Covers designing and implementing AI solutions: vision, language, document intelligence, search and generative AI with Azure OpenAI. Build small projects while studying. Plan 4-6 weeks."},{"n":"AZ-305 Azure Solutions Architect Expert","note":"Designs identity, governance, data, business continuity and infrastructure solutions. It requires AZ-104 or equivalent knowledge, and uses case-study questions about trade-offs. Plan 6-8 weeks."},{"n":"Optional: AWS Solutions Architect Associate, CKA, Terraform Associate","note":"Useful extras: AWS Solutions Architect Associate for AWS roles, Certified Kubernetes Administrator (hands-on exam) and HashiCorp Terraform Associate for IaC. Pick based on the job you are targeting."},{"n":"Schedule exams and use official Microsoft Learn paths","note":"Book exams to create a deadline, follow the free Microsoft Learn paths, use the practice assessments and do the labs. Renew associate and expert certifications yearly through free assessments."}]}]}];
var KEY="arch-roadmap3-done",TK="arch-roadmap-theme",done={},T=[];
try{done=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
var total=0;
DATA.forEach(function(p,pi){var m=p.p.match(/^Phase (\d+) - (.*?) \((.*)\)$/);p.no=m[1];p.name=m[2];p.when=m[3];p.tIdx=[];
  p.t.forEach(function(t){t.pi=pi;t.ti=T.length;t.s.forEach(function(s,si){s.id=t.ti+"-"+si;total++});p.tIdx.push(t.ti);T.push(t)})});
var sel={t:0,s:0},open={0:true},view="menu",q="";
var app=document.getElementById("app"),menu=document.getElementById("menu");
var CH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
function doneIn(t){var k=0;t.s.forEach(function(s){if(done[s.id])k++});return k}
function cnt(k,n){return '<span class="cnt'+(k===n?' full':'')+'">'+k+'/'+n+'</span>'}
function matches(t){if(!q)return true;if((t.n+" "+t.d).toLowerCase().indexOf(q)>-1)return true;
  return t.s.some(function(s){return (s.n+" "+s.note).toLowerCase().indexOf(q)>-1})}
function renderMenu(){
  var h="",any=false;
  DATA.forEach(function(p,pi){
    var list=p.tIdx.map(function(i){return T[i]}).filter(matches);if(!list.length)return;any=true;
    var isOpen=q?true:!!open[pi],k=0,n=0;p.tIdx.forEach(function(i){k+=doneIn(T[i]);n+=T[i].s.length});
    h+='<div class="grp"><button type="button" class="gh" data-ph="'+pi+'" aria-expanded="'+isOpen+'">'+CH+'<span class="nm">Phase '+p.no+' · '+esc(p.name)+'</span>'+cnt(k,n)+'</button>';
    h+='<ul class="tl"'+(isOpen?'':' hidden')+'>';
    list.forEach(function(t){h+='<li><button type="button" class="ti" data-t="'+t.ti+'"'+(t.ti===sel.t?' aria-current="true"':'')+'><span class="n">'+esc(t.n)+'</span>'+cnt(doneIn(t),t.s.length)+'</button></li>'});
    h+='</ul></div>';
  });
  menu.innerHTML=h||'<div class="empty">No topics match your search.</div>';
}
function renderSubs(){
  var t=T[sel.t];
  document.getElementById("t2").textContent=t.n;document.getElementById("d2").textContent=t.d;
  var h="";
  t.s.forEach(function(s,si){var on=!!done[s.id];
    h+='<div class="sr'+(on?' done':'')+'" data-s="'+si+'"'+(si===sel.s?' aria-current="true"':'')+'><button type="button" class="ck" role="checkbox" aria-checked="'+on+'" aria-label="Mark learned: '+esc(s.n)+'" data-ck="'+s.id+'"></button><button type="button" class="t">'+esc(s.n)+'</button></div>'});
  document.getElementById("subs").innerHTML=h;
}
function pos(){var t=T[sel.t];return t.s[sel.s]}
function renderNote(){
  var t=T[sel.t],s=t.s[sel.s],p=DATA[t.pi],on=!!done[s.id];
  var prev=nav(-1),next=nav(1);
  document.getElementById("note").innerHTML='<div class="note"><div class="crumb">Phase '+p.no+' · '+esc(t.n)+'</div><h2>'+esc(s.n)+'</h2>'+
    '<div class="lbl">In simple words</div><div class="box"><p>'+esc(s.note)+'</p></div>'+
    '<p class="ctx"><b>Part of:</b> '+esc(t.n)+'. '+esc(t.d)+'</p>'+
    '<div class="acts"><button type="button" class="btn '+(on?'ok':'pri')+'" id="mk">'+(on?'Learned ✓ (tap to undo)':'Mark as learned')+'</button>'+
    (prev?'<button type="button" class="btn" id="pv">‹ Previous</button>':'')+(next?'<button type="button" class="btn" id="nx">Next ›</button>':'')+'</div></div>';
}
function nav(d){var t=T[sel.t],si=sel.s+d,ti=sel.t;
  if(si<0){ti--;if(ti<0)return null;si=T[ti].s.length-1}else if(si>=t.s.length){ti++;if(ti>=T.length)return null;si=0}
  return {t:ti,s:si}}
function paint(){
  var k=0;for(var id in done)if(done[id])k++;
  var pc=Math.round(k/total*100);
  document.getElementById("pct").textContent=pc+"%";
  document.getElementById("count").textContent=k+" of "+total+" sub-topics learned";
  document.getElementById("ring").style.strokeDashoffset=113.1*(1-k/total);
}
function setView(v){view=v;app.setAttribute("data-v",v)}
function select(t,s,v){sel.t=t;sel.s=s;open[T[t].pi]=true;
  renderMenu();renderSubs();renderNote();if(v)setView(v);
  try{history.replaceState(null,"","#t"+t+"-s"+s)}catch(e){}
  var cur=document.querySelector("#subs .sr[aria-current=true]");if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:"nearest"});}
function refresh(){renderMenu();renderSubs();renderNote();paint();save()}
menu.addEventListener("click",function(e){
  var g=e.target.closest(".gh");if(g){var pi=g.getAttribute("data-ph");open[pi]=!open[pi];renderMenu();return}
  var b=e.target.closest(".ti");if(b){var ti=+b.getAttribute("data-t");select(ti,0,"subs");document.getElementById("subs").scrollTop=0}});
document.getElementById("subs").addEventListener("click",function(e){
  var c=e.target.closest(".ck");
  if(c){var id=c.getAttribute("data-ck");if(done[id])delete done[id];else done[id]=1;refresh();return}
  var r=e.target.closest(".sr");if(r){select(sel.t,+r.getAttribute("data-s"),"note");document.getElementById("note").scrollTop=0}});
document.getElementById("note").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.id==="mk"){var id=pos().id;if(done[id])delete done[id];else done[id]=1;refresh();return}
  var d=b.id==="pv"?-1:b.id==="nx"?1:0;if(!d)return;var n=nav(d);if(n){select(n.t,n.s,"note");document.getElementById("note").scrollTop=0}});
document.getElementById("b2").addEventListener("click",function(){setView("menu")});
document.getElementById("b3").addEventListener("click",function(){setView("subs")});
document.getElementById("ex").addEventListener("click",function(){DATA.forEach(function(p,i){open[i]=true});renderMenu()});
document.getElementById("co").addEventListener("click",function(){open={};renderMenu()});
document.getElementById("q").addEventListener("input",function(){q=this.value.trim().toLowerCase();renderMenu()});
function applyTheme(t){var r=document.documentElement;if(t==="light"||t==="dark")r.setAttribute("data-theme",t);else r.removeAttribute("data-theme");
  document.querySelectorAll(".seg button").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-th")===t)})}
var th="system";try{th=localStorage.getItem(TK)||"system"}catch(e){}
applyTheme(th);
document.querySelector(".seg").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
  th=b.getAttribute("data-th");applyTheme(th);try{localStorage.setItem(TK,th)}catch(x){}});
function fromHash(){var m=location.hash.match(/^#t(\d+)-s(\d+)$/);
  if(m&&T[+m[1]]&&T[+m[1]].s[+m[2]]){select(+m[1],+m[2],"note");return true}return false}
window.addEventListener("hashchange",function(){var m=location.hash.match(/^#t(\d+)-s(\d+)$/);
  if(m&&T[+m[1]]&&T[+m[1]].s[+m[2]]&&(+m[1]!==sel.t||+m[2]!==sel.s))select(+m[1],+m[2],"note")});
renderMenu();renderSubs();renderNote();paint();
fromHash();
</script>
