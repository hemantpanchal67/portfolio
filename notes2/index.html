ckers within minutes.","m":"Mistake: committing .env files. Tip: add secret scanning, and rotate any secret that was ever exposed.","k":["Secrets vault | An encrypted service (Key Vault, Secrets Manager, HashiCorp Vault) that stores secrets, controls access by identity and logs every read.","Dynamic secret | A credential created on demand with a short life, for example a database user valid for one hour, so leaks expire fast.","Secret rotation | Replacing passwords and keys regularly, ideally automatically, so old values stop working.","Managed identity | Lets an application authenticate to the vault without any stored password.","Secret scanning | Automated detection of keys committed to repositories or present in history.","Least privilege on secrets | Each application can read only its own secrets, limiting damage if one is compromised."]},{"n":"Encryption at rest and in transit, TLS, key management","w":"Encryption protects data when stored and when moving.","b":["At rest: disks, databases and storage encrypted with keys (AES-256).","In transit: TLS 1.2 or higher for all connections, including internal ones.","Keys live in a key service (KMS, Key Vault); control who can use them.","Rotate keys; consider customer-managed keys when regulation requires.","Never invent your own cryptography."],"e":"Storage encrypted with a customer-managed key you can revoke.","d":null,"h":"Encryption at rest uses AES-256 with a data key encrypted by a master key stored in KMS or Key Vault (envelope encryption). In transit uses TLS 1.2+ with strong ciphers and valid certificates; internal traffic should be encrypted too (mTLS in service meshes). Key policies control who can encrypt, decrypt and manage keys; separate duties. Rotation and revocation limit exposure. Customer-managed keys let you cut off access by disabling the key.","y":"Encryption turns many breaches into non-events and meets regulatory demands.","m":"Mistake: storing keys beside the data or disabling certificate checks 'temporarily'. Tip: automate certificate renewal and monitor expiry.","k":["AES-256 | The widely used strong symmetric cipher for encrypting stored data.","TLS 1.2 and 1.3 | Protocols that encrypt data in transit and authenticate servers with certificates; older versions should be disabled.","Envelope encryption | A data key encrypts the data and a master key held in KMS encrypts the data key, so master keys never leave the key service.","KMS, Key Vault and HSM | Services, often backed by tamper-resistant hardware, that create and use keys and record every use.","Customer-managed key | A key you control, so you can rotate it or disable it to cut off access; platform-managed keys are simpler but less controllable.","Key rotation | Creating new key versions on a schedule; data may be re-encrypted or protected by the key hierarchy."]},{"n":"Threat modeling (STRIDE)","w":"Threat modeling finds design flaws before code exists.","b":["Draw the system: users, services, data stores, trust boundaries.","STRIDE: Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege.","For each component and data flow, ask which threats apply.","Record mitigations and owners; revisit when design changes."],"e":"A file upload endpoint: tampering and denial of service risks lead to size limits and virus scanning.","d":{"t":"hub","c":"STRIDE","n":["Spoofing","Tampering","Repudiation","Info disclosure","Denial of service","Elevation"]},"h":"Steps: define scope, draw a data flow diagram with trust boundaries, identify threats per element with STRIDE, rate risk (likelihood and impact), choose mitigations and verify them. Mitigations might be authentication, input validation, encryption, logging, rate limits or redesign. Keep the model with the design docs and update it when architecture changes.","y":"Fixing a design flaw early is far cheaper than after release.","m":"Mistake: doing it once as a paperwork exercise. Tip: run short sessions at design time with developers and security together.","k":["Trust boundary | A line where data moves between different levels of trust, such as from the internet into your API, where checks are required.","Data flow diagram | A simple diagram of actors, processes, data stores and the flows between them, the starting point for threat modeling.","STRIDE | A checklist of threat types: Spoofing, Tampering, Repudiation, Information disclosure, Denial of service and Elevation of privilege.","Risk rating | Prioritize threats by likelihood and impact so the most serious are fixed first.","Mitigation | A control that reduces a threat: authentication, validation, encryption, logging, rate limiting or design change.","Abuse case | A story from an attacker's view, such as uploading a huge file to exhaust disk, used to design defenses."]},{"n":"Data classification, masking, PII handling, retention","w":"Not all data needs the same protection. Classify first, then apply controls.","b":["Typical levels: public, internal, confidential, restricted.","PII and health data need strict access, encryption and logging.","Mask or tokenize data in test environments; never copy raw production data.","Keep data only as long as required, then delete it."],"e":"A test database shows masked names and the last four digits only.","d":null,"h":"Create a classification scheme with handling rules per level: where it can be stored, who can access, encryption, logging and retention. Discover data with scanners and tags. Use masking, tokenization or synthetic data in non-production. Define retention schedules and automated deletion, and honor legal holds.","y":"Knowing what data you hold decides what controls and laws apply.","m":"Mistake: copying production data to test. Tip: build masked refresh pipelines and restrict who can read real data.","k":["Classification levels | Typically public, internal, confidential and restricted, each with rules for storage, sharing and access.","PII | Personally identifiable information such as name, address, SSN or email that identifies a person.","PHI | Protected health information covered by HIPAA, which requires stricter safeguards.","Masking and tokenization | Masking hides part of a value (***-**-1234); tokenization replaces it with a random token and stores the real value securely elsewhere.","Retention schedule | How long each data type is kept before secure deletion, based on legal and business needs.","Data minimization | Collect and keep only what you need, because data you do not hold cannot be breached."]},{"n":"Secure code review checklist","w":"A short checklist keeps reviews consistent.","b":["Is access control checked for every action?","Is all input validated and are queries parameterized?","Are secrets absent from code and logs?","Are errors safe (no stack traces to users)?","Are dependencies current and are security events logged?"],"e":"Review checklist in the pull request template.","d":null,"h":"A practical checklist: authorization on every endpoint (including object-level checks), validation and encoding, parameterized queries, no secrets or tokens in code or logs, safe error handling, secure defaults (deny by default), dependency and license checks, logging of security events, and tests for abuse cases. Use a PR template to prompt reviewers.","y":"Consistent review catches issues before attackers do.","m":"Mistake: reviewing only for functionality. Tip: add a security reviewer for sensitive changes and automate what you can with SAST.","k":["Object-level authorization | Checking permission for each specific record, not just that the user is logged in; missing checks cause IDOR and BOLA flaws.","Secure by default | Default configuration is the safe one, so teams do not need extra steps to be secure.","Fail closed | When a security check errors, deny access rather than allow.","Safe error handling | Show generic messages to users and keep details in logs, so errors do not reveal internals.","Dependency review | Check new libraries for known vulnerabilities, maintenance status and licenses.","Security logging | Record logins, access denials and admin actions without logging passwords or tokens, to support investigations."]}]},{"n":"Programming baseline","d":"One of Go, Python, TypeScript, Java; know when to code vs. delegate.","s":[{"n":"Pick a primary language and reach production-level fluency","w":"Depth in one language beats shallow knowledge of many.","b":["Choose from Go, Python, TypeScript or Java based on the roles you target.","Learn the standard library, error handling, tooling and idioms.","Be able to build, test, debug and deploy a service alone.","Read well-known open source projects in that language."],"e":"Build a small API with tests and containerize it.","d":null,"h":"Pick the language that fits the job market and your team: Java and Go for backend platforms, Python for data and AI, TypeScript for web and Node. Learn the toolchain (build, test, lint, debug), common libraries, concurrency model, error handling style and packaging. Build a real project end to end rather than only tutorials.","y":"Architects are trusted when they can write and read production code.","m":"Mistake: collecting languages without depth. Tip: ship one real service with tests, CI and monitoring.","k":["Standard library | The packages shipped with a language. Knowing them well avoids unnecessary dependencies and gives idiomatic solutions.","Toolchain | The compiler or runtime, build tool, test runner, linter, formatter and debugger you use every day.","Idiomatic code | Written the way the language community expects, which makes it readable and maintainable by others.","Error handling model | Java and Python use exceptions; Go and Rust return error values. Understand the model so failures are handled and not ignored.","Static versus dynamic typing | Static types (Java, Go, TypeScript) catch many errors at compile time; dynamic types (Python) check at run time and rely more on tests.","Production readiness | Logging, configuration, metrics, health checks, graceful shutdown and tests that make code operable, not just working."]},{"n":"Data structures, concurrency, async patterns","w":"These basics decide whether your code is correct and fast.","b":["Choose structures by use: list, map, set, queue, tree.","Concurrency overlaps work; async lets one thread wait without blocking.","Common bugs: race conditions, deadlocks, shared mutable state.","Prefer message passing or immutable data to reduce locking."],"e":"A map lookup is much faster than scanning a list for each item.","d":null,"h":"Structures: arrays/lists (ordered), hash maps (fast lookup), sets (uniqueness), queues/stacks, trees and heaps. Choose by access pattern and complexity (O(1), O(log n), O(n)). Concurrency models: threads and locks, async/await event loops, goroutines and channels. Race conditions occur when threads share mutable state; prefer immutability, message passing or locks with clear ordering.","y":"Correctness and performance in distributed systems start here.","m":"Mistake: blocking calls inside async code. Tip: learn your runtime's concurrency model and test with load.","k":["Big-O notation | Describes how running time or memory grows with input size: O(1) constant, O(log n), O(n), O(n log n) and O(n squared). It helps you spot designs that will not scale.","Hash map | A key-value structure with about constant-time lookup; the right tool for lookups and counting.","Race condition | A bug where the outcome depends on timing between threads accessing shared data, often intermittent and hard to reproduce.","Locks and mutexes | Allow only one thread into a critical section; misuse causes deadlocks or slow code.","Async and await | Lets a program wait for I/O without blocking a thread by using an event loop; calling blocking code inside async code stalls everything.","Immutability and message passing | Sharing unchangeable data or sending messages avoids many concurrency bugs."]},{"n":"Testing frameworks and mocking","w":"Tests let you change code with confidence.","b":["Unit tests: fast, test one piece of logic.","Mocks and fakes replace databases and APIs in tests.","Integration tests check real connections on a smaller scale.","Test names should describe behavior; each test should fail for one reason."],"e":"Mock the payment API to test what happens when it times out.","d":null,"h":"Unit tests run quickly without external systems. Frameworks: JUnit, pytest, Jest, Go testing. Use arrange, act, assert and test behavior not implementation. Mocks and fakes isolate dependencies; contract and integration tests verify the real interactions. Measure coverage but do not chase 100%; focus on risk.","y":"Tests make refactoring and fast delivery safe.","m":"Mistake: brittle tests tied to internals. Tip: test public behavior and keep test data small and readable.","k":["Unit test | Tests one function or class in isolation, runs in milliseconds and is deterministic; the base of the test pyramid.","Mock, stub and fake | Test doubles replacing real dependencies: a stub returns fixed data, a mock also verifies calls, a fake is a lightweight working version.","Arrange-Act-Assert | A structure for clear tests: set up data, perform the action, check the result.","Integration test | Verifies that real components work together, such as code and a database started in a container.","Code coverage | The share of code executed by tests; useful to find untested areas but not proof that behavior is verified.","Flaky test | A test that sometimes fails without code changes, which erodes trust and must be fixed or removed."]},{"n":"Package management and project structure","w":"Good structure helps teams find and change code quickly.","b":["Package managers: npm, pip, Maven/Gradle, NuGet, Go modules.","Commit lock files so builds are repeatable.","Separate domain logic from infrastructure and entry points.","Keep dependencies few and updated."],"e":"Folders: domain/, services/, adapters/, api/.","d":null,"h":"Dependencies are declared in files (package.json, pom.xml, requirements.txt, go.mod) and locked to exact versions. Structure code in layers or modules with clear boundaries: API, domain, persistence, integrations. Use consistent naming, configuration management and a README with how to build, test and run.","y":"Good structure reduces onboarding time and bugs.","m":"Mistake: circular dependencies and global state. Tip: keep modules small and dependencies pointing inward.","k":["Dependency manifest and lock file | The manifest (package.json, pom.xml, go.mod) lists what you need; the lock file pins exact versions of everything so builds are repeatable.","Semantic versioning | MAJOR.MINOR.PATCH numbering where a major bump signals breaking changes, helping you judge upgrade risk.","Layered architecture | Separating API, domain logic and data access so dependencies point inward and each layer can be tested alone.","Transitive dependency | A library your dependency uses; most vulnerabilities and conflicts come from here.","Monorepo versus polyrepo | One repository for many services (easier cross-changes) versus one per service (clearer ownership).","Twelve-factor principles | Practices for cloud apps such as configuration in the environment, stateless processes and logs to stdout."]},{"n":"REST API implementation in your primary language","w":"Building one real API teaches most of what architects need to judge APIs.","b":["Routes with proper verbs and status codes (200, 201, 400, 401, 404, 500).","Validation, authentication and consistent error format.","Pagination, filtering and versioning.","Logging with correlation IDs and automated tests."],"e":"GET /claims?page=2 returns 20 items and a next link.","d":{"t":"flow","n":["Request","Auth","Validate","Business logic","Database","Response"]},"h":"A solid API has resource-based URLs, correct methods and status codes, consistent JSON, input validation, authentication, authorization, pagination, filtering, idempotency for unsafe retries (Idempotency-Key header), rate limiting, versioning and good error bodies (problem details). Add structured logging with correlation IDs, metrics and health endpoints.","y":"APIs are the main integration surface, and quality here pays back in every consumer.","m":"Mistake: returning 200 for errors or leaking internal details. Tip: document with OpenAPI and test with contract tests.","k":["HTTP verbs and status codes | GET reads, POST creates, PUT replaces, PATCH updates, DELETE removes; 2xx means success, 4xx client error, 5xx server error, with 401 not authenticated and 403 not allowed.","Idempotency | Repeating a call gives the same result; PUT and DELETE are idempotent, POST is not unless you add an idempotency key.","Pagination | Return large lists in pages using offset or cursor so responses stay small and fast.","Problem details | A standard JSON error format (RFC 7807) with type, title, status and detail for consistent errors.","Correlation ID | An identifier added to each request and logged by every service so one request can be traced across systems.","Health endpoints | /health and /ready let orchestrators know whether to restart or route traffic."]},{"n":"Reading code in the other languages (.NET, Java, Node.js, Python)","w":"You will review code in languages you do not write daily.","b":["Understand project files (pom.xml, package.json, csproj, requirements.txt).","Recognize frameworks: Spring, ASP.NET Core, Express, FastAPI.","Spot common smells: huge classes, missing tests, hardcoded secrets.","Ask questions; you need judgment, not syntax mastery."],"e":"Reading a Spring controller to confirm validation and security annotations.","d":null,"h":"Look at build and dependency files first, then entry points, configuration and tests. Know framework conventions (Spring Boot controllers and beans, ASP.NET middleware, Express routes, Django/FastAPI views). Recognize anti-patterns: god classes, missing error handling, SQL string concatenation, secrets in code. Ask the team for context.","y":"As architect you evaluate many codebases and guide teams in stacks you do not use daily.","m":"Mistake: judging by style preferences. Tip: focus on structure, risks, tests and operability.","k":["Build and dependency files | The first place to look in a new codebase: they show languages, versions, libraries and how to build.","Framework conventions | Standard folder layouts and annotations of Spring, ASP.NET, Express or Django let you find controllers, services and configuration quickly.","Dependency injection | Objects receive their collaborators instead of creating them, which makes code testable and configurable.","ORM | Maps objects to tables (Hibernate, Entity Framework, SQLAlchemy); powerful but can hide slow queries.","Code smell | A hint of deeper design problems, such as huge classes or duplicated logic.","Static analysis | Tools that read code without running it to find bugs, vulnerabilities and style issues."]},{"n":"Code review skills and style standards","w":"Reviews raise quality and spread knowledge.","b":["Check correctness, readability, tests and risk, not only style.","Automate formatting and linting so humans focus on design.","Be specific and kind; suggest, explain why.","Keep changes small and reviews fast."],"e":"A 200-line PR reviewed in a day beats a 3000-line PR reviewed in a week.","d":null,"h":"Review for correctness, security, readability, performance and test quality. Keep PRs small (under about 400 lines), give feedback as questions or suggestions, separate must-fix from nice-to-have. Automate formatting and linting. Document standards in a short guide and agree on review SLAs.","y":"Reviews are the main way teams share knowledge and keep quality.","m":"Mistake: slow reviews or nitpicking style. Tip: review within a day and use automation for style.","k":["Pull request | A proposed change reviewed by teammates before merging, the main place knowledge is shared.","Linter and formatter | Automated tools for style and likely bugs so humans can focus on design and logic.","Definition of done | A shared checklist (tests, docs, security checks) every change must satisfy.","Review SLA | An agreed response time, such as one working day, so reviews do not block delivery.","Small pull requests | Changes under about 400 lines get better reviews and break less often.","CODEOWNERS | A file mapping paths to required reviewers so the right experts approve."]},{"n":"Decision framework: build, buy, delegate","w":"Architects must choose between making, buying and handing off work.","b":["Build when it is a core differentiator.","Buy when a product solves it well and is not your edge.","Delegate when someone else can do it as well and your time is needed elsewhere.","Consider total cost, risk, lock-in and maintenance, then write the decision down."],"e":"Buy an identity provider; build the claims rules engine that is unique to you.","d":{"t":"vs","lt":"Build","l":["Core to business","Unique needs"],"rt":"Buy","r":["Commodity feature","Faster to value"]},"h":"Build when it gives competitive advantage or no product fits. Buy when it is a commodity (identity, email, payments) and total cost is lower. Delegate when work does not need your skills and capable people exist. Compare options on cost over 3-5 years, risk, integration effort, vendor lock-in and exit plan. Record the decision as an ADR.","y":"Time and attention are the scarcest resources for architects.","m":"Mistake: building everything 'because we can' or buying without checking fit. Tip: score options against clear criteria.","k":["Core versus commodity | Core capabilities differentiate your business and justify building; commodity capabilities such as email or identity are the same everywhere and are best bought.","TCO | Total cost of ownership over several years, including people, operations and upgrades, not just license price.","Vendor lock-in | The cost and effort of leaving a provider later; weigh it against the speed gained now.","Exit plan | How you would migrate away if the vendor fails or raises prices.","Build-versus-buy matrix | Score options on fit, cost, risk, time to market and strategic value.","Delegation | Assigning work with a clear outcome, authority and review point so you stay focused on architecture."]}]}]},{"p":"Phase 2 - Containers & Infrastructure as Code (Weeks 5-8)","why":"Why: the platform layer for all modern delivery.","t":[{"n":"Docker","d":"Images, layers, builds, registries.","s":[{"n":"Dockerfile best practices and layer caching","w":"Each Dockerfile line creates a layer and unchanged layers are cached. Good ordering makes builds fast and images small.","b":["Put things that change rarely first (base image, dependencies) and code last.","Combine commands and clean up in the same layer.","Use a .dockerignore file to keep junk out.","Pin base image versions; avoid 'latest'.","Run as a non-root user."],"e":"COPY package.json then npm install, then COPY the source, so dependencies stay cached.","d":{"t":"layers","n":["Base image","Install dependencies","Copy source code","Run command"]},"h":"Docker builds layers from each instruction; layers are cached if the instruction and its inputs have not changed. If an early layer changes, all later layers rebuild. Therefore copy dependency manifests and install dependencies before copying source code. Combine commands to reduce layers and delete package caches in the same step. Use .dockerignore to avoid copying .git, node_modules and secrets.","y":"Faster builds mean faster feedback; smaller images mean faster deploys and fewer vulnerabilities.","m":"Mistake: COPY . . at the top, so every code change reinstalls dependencies. Tip: order from least to most frequently changed.","k":["Image | A read-only template made of layers that a container starts from.","Layer and build cache | Each Dockerfile instruction creates a layer; unchanged layers are reused, but a change invalidates every layer after it, so order matters.","Base image | The FROM image you build on; choose small, maintained ones and pin the version.",".dockerignore | Lists files excluded from the build context, keeping secrets, .git and node_modules out of images and speeding builds.","ENTRYPOINT versus CMD | ENTRYPOINT is the fixed executable; CMD supplies default arguments that can be overridden at run time.","Tag versus digest | A tag like 1.4.2 can be moved to different content; a sha256 digest identifies exact content and is safer for deployment."]},{"n":"Multi-stage builds and small base images","w":"Multi-stage builds separate building from running.","b":["Stage 1 has compilers and tools and produces the build output.","Stage 2 starts from a small image and copies only the output.","Final image is smaller, faster to pull and has fewer vulnerabilities.","Distroless or alpine bases shrink it further."],"e":"A Java build in a JDK image, final image with only the JRE and the jar.","d":{"t":"flow","n":["Build stage (SDK)","Copy artifact","Runtime stage (small)"]},"h":"A multi-stage Dockerfile has several FROM lines. The builder stage contains compilers and test tools; the final stage starts from a minimal runtime (alpine, slim, distroless) and copies only the built output with COPY --from=builder. Result: no compilers, shells or source in production, so a smaller attack surface. You can also target stages for tests.","y":"Cuts image size sometimes from 1 GB to 100 MB and reduces vulnerabilities.","m":"Mistake: leaving build tools or secrets in the final image. Tip: pass secrets with build secrets, never ARG or ENV.","k":["Multi-stage build | Several FROM stages in one Dockerfile where only the final stage becomes the image, so build tools are left behind.","Builder stage | The stage with compilers and SDKs that produces the application output.","Distroless image | An image containing only the app and runtime, with no shell or package manager, which shrinks the attack surface.","Alpine and slim images | Small base images; Alpine uses musl libc and can cause compatibility surprises with some software.","Build secrets | Secrets mounted only during build (--mount=type=secret) so they never end up in a layer or history.","COPY --from | Copies built files from an earlier stage into the final image."]},{"n":"Docker Compose for local environments","w":"Compose describes several containers in one file for local work.","b":["Define app, database and cache as services in docker-compose.yml.","One command starts everything: docker compose up.","Volumes keep database data; networks let services call each other by name.","For development and tests only, not production orchestration."],"e":"App plus PostgreSQL plus Redis start together on a laptop.","d":{"t":"hub","c":"docker compose","n":["App","Database","Cache"]},"h":"A compose file defines services, images or builds, ports, environment, volumes and networks. Services reach each other by service name through an automatic network. depends_on with health checks controls start order. Profiles and override files adapt for dev and test. It is great for integration testing in CI.","y":"Gives every developer a consistent environment with one command.","m":"Mistake: using Compose for production scale and HA. Tip: use it for local and CI; use Kubernetes or managed services in production.","k":["Compose service | One container definition (image, ports, environment, volumes) inside a docker-compose.yml file.","Compose network | Compose creates a network where services reach each other by service name, such as db:5432.","Volumes | Named storage that survives container removal, used for database files.","depends_on with health checks | Controls start order and waits until a dependency is healthy, not just started.","Profiles and override files | Start optional services on demand and customize settings for local work.","Use in CI | Start databases and queues for integration tests with one command."]},{"n":"Registries: ECR, ACR, Docker Hub","w":"A registry stores and serves images.","b":["ECR (AWS), ACR (Azure), Docker Hub, GitHub Container Registry.","Private registries integrate with cloud identity and scanning.","Tag images with version or commit SHA; do not deploy 'latest'.","Set retention rules to delete old images."],"e":"CI pushes myapp:1.4.2 to ACR, Kubernetes pulls it.","d":{"t":"flow","n":["CI build","Push to registry","Cluster pulls image"]},"h":"Images are pushed to a registry by repository and tag, and identified uniquely by digest (sha256). Private registries authenticate through cloud identity. Features: vulnerability scanning, geo-replication, retention policies, immutable tags, signing. In CI, tag with the commit SHA and promote the same digest through environments.","y":"The registry is a core piece of the software supply chain.","m":"Mistake: deploying 'latest', which makes rollbacks and audits unreliable. Tip: deploy by digest or immutable version tags.","k":["Registry | A server that stores and distributes images, such as ECR, ACR, Docker Hub or GHCR.","Repository | A named collection of tagged versions of one image.","Pull-through cache | A private registry that mirrors a public one to avoid rate limits and outages.","Immutable tags | A setting that prevents overwriting a tag so a version always means the same content.","Retention policy | Rules that delete old or untagged images to control storage cost.","Geo-replication | Copies of images in several regions so clusters pull quickly and survive a regional outage."]},{"n":"Image scanning and signing","w":"Images can contain vulnerable libraries or be tampered with.","b":["Scan images for known CVEs in the pipeline and in the registry.","Sign images (Cosign, Notation) in CI.","Admission policy in the cluster rejects unsigned or vulnerable images.","Rebuild regularly to pick up patched base images."],"e":"Pipeline fails when a critical CVE is found.","d":{"t":"flow","n":["Build","Scan","Sign","Deploy only if verified"]},"h":"Scanners (Trivy, Defender for Containers, ECR scanning, Prisma) compare image packages with CVE databases. Set policies, for example fail on critical with a fix available. Signing (Cosign/Notation) creates a signature stored beside the image; admission controllers (Kyverno, Gatekeeper, Ratify) verify it before pods start. Rescan images regularly because new CVEs appear daily.","y":"Prevents known-vulnerable or unauthorized images from running.","m":"Mistake: scanning once at build and never again. Tip: scan in the registry continuously and rebuild base images weekly.","k":["CVE and CVSS | A CVE is a public ID for a known vulnerability; CVSS scores severity from 0 to 10 (critical, high, medium, low).","Image scanners | Tools such as Trivy, Grype, ECR scanning and Defender compare packages in an image with vulnerability databases.","Fixable findings | Only some vulnerabilities have a patched version; policies often fail builds on fixable critical issues first.","Image signing | Tools such as Cosign and Notation attach a signature proving the image came from your pipeline.","Admission controller | A cluster component (Kyverno, Gatekeeper, Ratify) that rejects unsigned or non-compliant images at deploy time.","Continuous rescanning | New vulnerabilities appear after the build, so registries rescan images regularly."]},{"n":"Runtime security: non-root, read-only filesystems, seccomp","w":"A container shares the host kernel, so hardening matters.","b":["Run as non-root; drop Linux capabilities you do not need.","Read-only root filesystem with a small writable temp directory.","Apply seccomp and AppArmor profiles.","Never run privileged containers or mount the Docker socket."],"e":"securityContext: runAsNonRoot true, readOnlyRootFilesystem true.","d":null,"h":"Containers share the host kernel, so isolation is weaker than VMs. Reduce risk: run as non-root (USER), read-only root filesystem, drop all Linux capabilities and add only needed ones, no privileged mode, seccomp default profile, resource limits, no host mounts, and keep images minimal. Use runtime tools (Falco) to detect suspicious behavior.","y":"A container escape or compromised container affects the whole node.","m":"Mistake: running as root because 'it just works'. Tip: set securityContext in Kubernetes and enforce with Pod Security Standards.","k":["Non-root user | The container process runs as an ordinary user, so a compromise does not give root inside the container.","Read-only root filesystem | Prevents writing to the container's disk; temporary files go to a tmpfs.","Linux capabilities | Slices of root power; drop all and add back only those the app needs.","seccomp and AppArmor | Profiles that block dangerous system calls and file access.","Privileged mode and Docker socket | Privileged containers and mounting the Docker socket give host-level control and should never be used for apps.","Resource limits | CPU and memory caps stop one container from starving others."]},{"n":"Container networking and volumes","w":"Containers need ways to talk and to keep data.","b":["Bridge network is the default; containers talk by name in Compose.","Publish ports to expose a service on the host.","Volumes store data outside the container so it survives restarts.","In Kubernetes, use PersistentVolumes for stateful workloads."],"e":"Database data is on a volume, so removing the container does not delete data.","d":null,"h":"Each container has its own network namespace. The default bridge network lets containers talk by IP; user-defined bridges add DNS by name. Port mapping publishes a container port on the host. Volumes and bind mounts store data outside the writable container layer; named volumes are managed by Docker. In Kubernetes these become Services and PersistentVolumeClaims.","y":"Misunderstanding networking and storage leads to lost data and unreachable services.","m":"Mistake: storing database files in the container layer. Tip: always use volumes for state and back them up.","k":["Bridge network | The default private network of a Docker host where containers get internal addresses.","Port publishing | Maps a container port to a host port (-p 8080:80) so outside clients can connect.","Named volume versus bind mount | A named volume is managed by Docker; a bind mount maps a host folder, handy for development.","tmpfs mount | In-memory storage that disappears when the container stops, used for temporary files.","Writable layer | Data written inside a container is lost when it is removed, so persistent data needs a volume.","PersistentVolumeClaim | The Kubernetes request for durable storage that outlives pods."]}]},{"n":"Kubernetes","d":"Core objects, EKS, AKS, Container Apps.","s":[{"n":"Architecture: control plane, nodes, kubelet, etcd","w":"Kubernetes keeps your desired state true. Understanding its parts explains most of its behavior.","b":["Control plane: API server (front door), etcd (database), scheduler (picks nodes), controllers (fix drift).","Nodes: worker machines; kubelet starts containers, kube-proxy handles networking.","You declare what you want in YAML; controllers keep reconciling.","Managed services (EKS, AKS) run the control plane for you."],"e":"Tell it 3 replicas; if a node dies, it starts another pod.","d":{"t":"layers","n":["kubectl / CI","API server + etcd + scheduler","Worker nodes (kubelet)","Pods and containers"]},"h":"The API server is the single entry point and stores state in etcd. The scheduler assigns pods to nodes using resources, affinity and taints. Controllers watch the desired state and take actions (the ReplicaSet controller creates pods until the count matches). Each node runs kubelet (starts containers via the container runtime), kube-proxy or CNI (networking). Everything is declarative: you apply YAML, controllers reconcile.","y":"Understanding this loop helps you debug why something is not running.","m":"Mistake: editing resources by hand in production. Tip: change through Git and pipelines.","k":["API server | The front door of the cluster; every component and user talks to it, and it validates and stores objects.","etcd | The distributed key-value store holding all cluster state; losing it without backup loses the cluster.","Scheduler | Picks a node for each new pod based on resource requests, affinity, taints and topology.","Controller manager | Runs control loops that compare desired and actual state and take action, such as creating missing pods.","kubelet and container runtime | The node agent that starts containers through containerd or CRI-O and reports their health.","Desired-state model | You declare what you want in YAML and Kubernetes keeps reconciling reality toward it."]},{"n":"Pods, ReplicaSets, Deployments, StatefulSets, DaemonSets, Jobs","w":"These are the main workload objects.","b":["Pod: smallest unit, one or more containers sharing network.","Deployment: keeps N identical pods and does rolling updates.","StatefulSet: stable names and storage for databases.","DaemonSet: one pod per node (log agents).","Job and CronJob: run tasks to completion or on schedule."],"e":"A Deployment of 3 web pods; a CronJob for nightly reports.","d":{"t":"hub","c":"Workloads","n":["Deployment","StatefulSet","DaemonSet","Job / CronJob"]},"h":"Pods share network and storage and are ephemeral. Deployments manage ReplicaSets, allow rolling updates and rollbacks. StatefulSets give pods stable names (db-0, db-1) and volumes. DaemonSets run agents on every node. Jobs run until completion; CronJobs schedule them. Choose by workload type: stateless web uses Deployment; databases use StatefulSet or managed services.","y":"Right workload type gives correct restarts, scaling and updates.","m":"Mistake: running bare pods in production or databases on Deployments. Tip: use controllers and prefer managed databases.","k":["Pod | The smallest deployable unit: one or more containers sharing network and storage; pods are ephemeral and replaced, not repaired.","ReplicaSet and Deployment | A ReplicaSet keeps N identical pods; a Deployment manages ReplicaSets to give rolling updates and rollbacks for stateless apps.","StatefulSet | Gives pods stable names and stable storage, for databases and other stateful systems.","DaemonSet | Runs one pod on every node, used for log collectors and monitoring agents.","Job and CronJob | Run a task to completion once or on a schedule.","Namespace | A logical partition for teams, quotas and policies within a cluster."]},{"n":"Services, Ingress, Gateway API","w":"Pods change IP addresses, so you need stable entry points.","b":["Service: stable virtual IP and DNS name that balances across pods (ClusterIP, NodePort, LoadBalancer).","Ingress: HTTP routing rules (host and path) and TLS to services.","Gateway API: newer, more expressive replacement for Ingress.","An ingress controller (NGINX, Istio, cloud) does the actual routing."],"e":"api.example.com/orders goes to the orders Service.","d":{"t":"flow","n":["Internet","Ingress / Gateway","Service","Pods"]},"h":"A Service selects pods by labels and exposes a stable cluster IP and DNS name (my-svc.namespace.svc). Types: ClusterIP (internal), NodePort, LoadBalancer (cloud LB). Ingress maps hostnames and paths to Services and terminates TLS via an ingress controller (NGINX, AGIC, ALB). Gateway API splits roles: platform team manages Gateways, app teams manage Routes.","y":"Provides stable, secure entry to workloads that change IPs constantly.","m":"Mistake: exposing every service with a LoadBalancer. Tip: use one ingress or gateway and internal ClusterIP for the rest.","k":["ClusterIP | A stable internal virtual IP and DNS name that load balances across the pods of a Service.","NodePort and LoadBalancer | NodePort opens a port on every node; LoadBalancer asks the cloud to create an external load balancer.","Ingress | HTTP routing rules (host, path, TLS) to Services, implemented by an ingress controller such as NGINX or AGIC.","Gateway API | The newer, role-oriented replacement for Ingress with clearer separation between platform and app teams.","Endpoints | The live list of pod IPs behind a Service, updated as pods come and go.","Headless service | No virtual IP; DNS returns pod addresses directly, used with StatefulSets."]},{"n":"ConfigMaps, Secrets, external secrets operators","w":"Configuration and secrets should not be baked into images.","b":["ConfigMap holds non-sensitive settings.","Secret holds sensitive values but is only base64 by default; enable encryption at rest.","External Secrets Operator or CSI driver pulls secrets from a vault.","Mount as environment variables or files; roll pods when they change."],"e":"Database password lives in Key Vault, synced to the cluster by External Secrets.","d":{"t":"flow","n":["Key Vault","External Secrets","Kubernetes Secret","Pod"]},"h":"ConfigMaps provide key-value config as environment variables or files. Secrets are similar but meant for sensitive data; they are only base64 encoded in etcd unless you enable encryption at rest. The Secrets Store CSI driver or External Secrets Operator syncs values from Key Vault or Secrets Manager, so Git never holds secrets. Restart pods or use reloaders when values change.","y":"Separating config from code allows the same image in every environment.","m":"Mistake: committing Secret manifests to Git. Tip: reference external vaults and use workload identity.","k":["ConfigMap | Non-secret configuration delivered as environment variables or files.","Secret | An object for sensitive values that is only base64-encoded by default and must be protected with RBAC and encryption.","Encryption at rest for Secrets | Enable etcd encryption, ideally with a cloud KMS key, so Secrets are not stored in plain text.","External Secrets Operator | Syncs values from Key Vault or Secrets Manager into Kubernetes Secrets so Git never holds them.","Secrets Store CSI driver | Mounts secrets from a vault directly as files in the pod.","No secrets in Git | Never commit Secret manifests; store references to a vault instead."]},{"n":"Probes, resource requests and limits, HPA/VPA, KEDA","w":"These settings keep apps healthy and right-sized.","b":["Readiness probe: only send traffic when ready; liveness probe: restart if stuck.","Requests reserve resources for scheduling; limits cap usage.","HPA scales pods on CPU, memory or custom metrics; VPA suggests sizes.","KEDA scales on events like queue length, down to zero."],"e":"Scale workers from 0 to 20 when the queue has 1000 messages.","d":null,"h":"Readiness probes remove pods from Services until ready; liveness probes restart stuck containers; startup probes protect slow starters. Requests reserve CPU and memory and drive scheduling; limits cap use (exceeding memory limit kills the pod). HPA scales replicas based on metrics with min/max; cluster autoscaler or Karpenter adds nodes. KEDA scales on queue length, Kafka lag or HTTP rate, including to zero.","y":"Right-sizing and probes decide stability and cost.","m":"Mistake: no requests, causing noisy neighbors, or a liveness probe that checks dependencies and restarts all pods. Tip: keep liveness simple; use readiness for dependencies.","k":["Liveness probe | Restarts a container that is stuck; keep it simple so a slow dependency does not cause restart loops.","Readiness probe | Removes a pod from Service endpoints until it is ready to serve; use it to reflect dependencies.","Startup probe | Gives slow-starting apps time before liveness checks begin.","Requests and limits | A request reserves resources and drives scheduling; a limit is the cap, where exceeding the memory limit kills the pod (OOMKilled) and exceeding CPU throttles it.","HPA and VPA | The Horizontal Pod Autoscaler adds or removes replicas on metrics; the Vertical Pod Autoscaler recommends or sets resource sizes.","KEDA | Scales on events such as queue length or Kafka lag, including down to zero."]},{"n":"RBAC, network policies, Pod Security Standards","w":"Cluster security is layered.","b":["RBAC: who can do what in the cluster; use least privilege.","Network policies: by default all pods can talk to all; add rules to restrict.","Pod Security Standards: baseline and restricted profiles block privileged pods.","Use separate namespaces and service accounts per app."],"e":"Only the orders pods may reach the payments pods.","d":null,"h":"RBAC uses Roles (namespaced) and ClusterRoles bound to users, groups or service accounts. Network policies (with a CNI that enforces them) select pods and allow specified ingress and egress; start with default deny. Pod Security Standards (privileged, baseline, restricted) enforced via Pod Security Admission. Add namespaces for isolation, resource quotas and admission policies.","y":"Default Kubernetes is open inside the cluster; one compromised pod can reach everything.","m":"Mistake: cluster-admin for CI or apps. Tip: least-privilege service accounts and policy as code.","k":["RBAC | Roles and bindings that decide who can do what in the cluster; avoid cluster-admin for apps and CI.","ServiceAccount | The identity a pod uses to call the Kubernetes API; use a dedicated account with minimal permissions.","NetworkPolicy | Rules limiting pod-to-pod traffic; by default every pod can reach every pod, so start with default deny.","Pod Security Standards | Privileged, baseline and restricted profiles enforced by admission to block risky pod settings.","Admission policy engines | Kyverno and OPA Gatekeeper validate or modify objects, for example requiring resource limits.","Namespace isolation | Combine namespaces with quotas, RBAC and policies for team separation."]},{"n":"Helm and Kustomize","w":"These tools package and customize Kubernetes manifests.","b":["Helm: charts with templates and values; great for third-party apps and versioned releases.","Kustomize: patches plain YAML with overlays per environment, no templating.","Both work with GitOps tools.","Keep environment differences small and visible."],"e":"Base manifests plus overlays for dev, test, prod.","d":{"t":"vs","lt":"Helm","l":["Templates + values","Release history"],"rt":"Kustomize","r":["Overlays and patches","Plain YAML"]},"h":"Helm packages manifests as charts with templates and values.yaml; releases are versioned and can be rolled back. Kustomize layers patches on a base without templates; overlays per environment. Many teams combine them (render Helm to YAML, then patch). Store values in Git and deploy via GitOps. Keep charts simple and avoid deep templating logic.","y":"Repeatable, reviewable deployments across environments.","m":"Mistake: copy-pasting YAML per environment. Tip: one base, small overlays, and linting plus schema validation in CI.","k":["Helm chart | A package of templated manifests with default values.","values.yaml | Settings that fill the templates; override per environment.","Release and rollback | Each install creates a release with a revision history, and helm rollback returns to an earlier revision.","Kustomize base and overlay | A base holds common manifests; overlays patch them for dev, test and production without templates.","Validation in CI | Tools such as helm lint and kubeconform catch mistakes before deployment.","Render then patch | Many teams render Helm to YAML and patch with Kustomize for the best of both."]},{"n":"EKS vs AKS vs Azure Container Apps trade-offs","w":"Choosing the platform changes your operating burden.","b":["EKS and AKS: managed Kubernetes with full API and ecosystem; you manage nodes, upgrades and add-ons.","Azure Container Apps: serverless containers with scale to zero, built on Kubernetes without exposing it.","Pick Kubernetes for custom networking, operators and portability.","Pick Container Apps for simpler microservices and event workloads."],"e":"Event-driven API on Container Apps; large multi-team platform on AKS.","d":{"t":"vs","lt":"AKS / EKS","l":["Maximum control","More to operate"],"rt":"Container Apps","r":["Simple, scale to zero","Less flexibility"]},"h":"EKS and AKS manage the control plane and integrate with cloud identity, load balancers and storage; you manage node pools, upgrades, add-ons and policies. Container Apps (built on Kubernetes and KEDA/Dapr) abstracts clusters: revisions, ingress, autoscaling to zero and simple secrets. Consider team skills, workloads (operators, custom networking, GPUs), compliance, cost and desired portability.","y":"Choosing too much platform adds cost; too little blocks needs later.","m":"Mistake: Kubernetes for a handful of simple services. Tip: start with the simplest platform that meets requirements and move up when constraints appear.","k":["Managed control plane | In EKS and AKS the provider runs the API server and etcd; you manage nodes and add-ons.","Node pool | A group of nodes with the same VM size, such as system, user, GPU or spot pools.","Azure Container Apps | Serverless containers with revisions, ingress and scale-to-zero built on Kubernetes, without managing a cluster.","Scale to zero | No instances and no compute cost while idle; the first request has a cold start.","Operators and custom resources | Software that automates complex applications on Kubernetes; needs a real cluster.","Decision rule | Choose Kubernetes for custom networking, operators and portability, and Container Apps for simpler microservices."]},{"n":"Cluster upgrades and node pool strategy","w":"Upgrades are routine work. Plan them or fall behind.","b":["Kubernetes releases about every 4 months and supports only the last few versions.","Upgrade control plane first, then node pools, one at a time.","Use separate node pools for system, general, GPU and spot workloads.","PodDisruptionBudgets keep enough replicas up during node drains.","Test upgrades in a lower environment first."],"e":"Surge a new node pool, drain old nodes, delete them.","d":{"t":"flow","n":["Upgrade control plane","Upgrade node pool 1","Verify","Next pool"]},"h":"Supported versions are only the latest few minors, so plan at least two upgrades a year. Process: read release notes and deprecated APIs, upgrade a non-production cluster, update add-ons, upgrade the control plane, then node pools using surge or blue/green pools. PodDisruptionBudgets keep availability while nodes drain. Use node taints, labels and separate pools for system, user, spot and GPU workloads.","y":"Falling out of support exposes you to vulnerabilities and forced upgrades.","m":"Mistake: skipping versions or ignoring deprecated APIs. Tip: use tools like pluto to find deprecated APIs and automate cluster upgrades.","k":["Version skew policy | Defines how far control plane, nodes and kubectl versions may differ; falling too far behind blocks upgrades.","Deprecated API | An API version scheduled for removal; scan manifests with tools like pluto before upgrading.","Surge upgrade | Add extra nodes during a rolling node upgrade so capacity is kept.","Cordon and drain | Cordon marks a node unschedulable; drain evicts its pods safely before maintenance.","PodDisruptionBudget | Guarantees a minimum number of pods stay available during voluntary disruptions.","Taints and tolerations | Keep specific workloads on dedicated nodes such as GPU or system pools."]}]},{"n":"Infrastructure as Code","d":"Terraform, CloudFormation, Bicep, ARM.","s":[{"n":"Terraform: providers, state, backends, locking","w":"Terraform describes infrastructure in code and tracks it in a state file.","b":["Providers are plugins for AWS, Azure and others.","The plan shows changes; apply makes them.","State maps code to real resources; store it remotely (S3, Azure Blob) with locking.","Never edit state by hand and never commit it to Git."],"e":"terraform plan in a pull request shows 2 to add, 1 to change.","d":{"t":"flow","n":["Write code","terraform plan","Review","terraform apply","State updated"]},"h":"Workflow: init downloads providers, plan computes differences between code, state and reality, apply performs them. State stores resource IDs and attributes; remote backends (S3 with DynamoDB lock, Azure Blob with lease) allow team use. Sensitive values can appear in state, so restrict access and encrypt. Use data sources to read existing resources and import to bring unmanaged ones under control.","y":"Terraform is the most widely used multi-cloud IaC tool.","m":"Mistake: local state, or manual state edits. Tip: remote backend, locking, small state files per layer.","k":["Provider | A plugin that talks to a cloud or SaaS API, such as azurerm or aws.","State file | Maps your code to real resource IDs; Terraform uses it to compute changes, so it must be protected and shared safely.","Remote backend and locking | Store state in S3 with DynamoDB, Azure Blob or Terraform Cloud with locks so two people cannot apply at once.","plan and apply | plan shows the difference between code, state and reality; apply executes the changes.","import | Brings an existing resource under Terraform management without recreating it.","Secrets in state | State can contain sensitive values, so encrypt it and restrict access."]},{"n":"Terraform modules, workspaces, versioning","w":"Modules make infrastructure reusable.","b":["A module packages resources behind inputs and outputs.","Version modules and pin versions.","Workspaces or separate state files isolate environments.","Keep modules small and focused; document inputs."],"e":"A 'vnet' module used by all teams creates a standard network.","d":null,"h":"Modules take variables and return outputs, hiding details. Publish them in a registry with semantic versions and pin constraints. Environment separation: separate state per environment (directories or workspaces) with different variable files. Keep module scope focused (network, cluster, database), avoid mega-modules, and write examples and docs.","y":"Reuse gives consistency and speed.","m":"Mistake: unpinned module versions causing surprise changes. Tip: pin versions and upgrade deliberately via PRs.","k":["Module | A reusable group of resources with inputs and outputs, such as a standard network.","Input variables and outputs | Variables customize a module; outputs expose values to callers.","Workspaces versus directories | Workspaces keep several states in one configuration; many teams prefer a directory per environment for clarity.","Version constraints | Pin provider and module versions (for example ~> 3.0) so runs are repeatable.","Layered stacks | Separate state for network, platform and applications limits blast radius and speeds plans.","Remote state data source | Reads outputs of another stack without copying values."]},{"n":"Bicep and ARM templates","w":"Bicep is Azure's friendlier language for ARM.","b":["ARM templates are JSON and verbose; Bicep compiles to ARM.","No state file; Azure Resource Manager tracks deployments.","Supports new Azure features at once.","What-if shows changes before deployment."],"e":"az deployment group what-if before every production deploy.","d":null,"h":"Bicep syntax is concise and typed with modules, parameters and loops; it transpiles to ARM JSON. Deployments are tracked by Azure; use what-if before deploying and deployment stacks to manage lifecycle and prevent deletion. Parameter files (bicepparam) per environment; use Azure Verified Modules for best practices.","y":"Native Azure IaC with day-zero support for new features.","m":"Mistake: writing raw ARM JSON. Tip: use Bicep and verified modules.","k":["Bicep | A concise Azure-native language that compiles to ARM, replacing hand-written JSON templates.","ARM template | The JSON deployment format underlying all Azure deployments.","What-if | Previews the changes a deployment would make before running it.","Deployment scope | Where a template runs: tenant, management group, subscription or resource group.","Modules and parameter files | Reusable Bicep files and per-environment values.","Deployment stacks | Manage a set of resources as a unit, including cleanup of removed resources."]},{"n":"CloudFormation stacks, change sets, StackSets","w":"CloudFormation is AWS's native IaC.","b":["A template defines resources; a stack is the deployed instance.","Change sets preview changes before they run.","StackSets deploy to many accounts and regions.","Drift detection reports manual changes."],"e":"StackSets roll out a logging baseline to 50 accounts.","d":null,"h":"Templates in YAML declare resources. Stacks create, update and delete as a unit; failed updates roll back automatically. Change sets show impact before execution. StackSets deploy a template across accounts and regions using AWS Organizations, perfect for baselines. CDK lets you write CloudFormation in code (TypeScript, Python).","y":"Native AWS service with deep integration and rollback.","m":"Mistake: manual changes to stack resources causing drift. Tip: enable drift detection and use termination protection for critical stacks.","k":["Template and stack | A YAML or JSON template describes resources; a stack is a deployed instance created, updated and deleted as one unit.","Change set | A preview of what an update will do before you execute it.","StackSets | Deploy a stack to many accounts and regions, ideal for security baselines.","Drift detection | Reports resources that were changed outside CloudFormation.","Automatic rollback | A failed update returns the stack to its last good state.","CDK | Write infrastructure in a programming language that generates CloudFormation."]},{"n":"Drift detection and remediation","w":"Drift is when real infrastructure differs from code, usually from manual edits.","b":["Detect with scheduled terraform plan or cloud drift tools.","Fix by applying code or by importing the manual change into code.","Reduce drift by limiting console write access and using pipelines.","Review drift reports as part of operations."],"e":"Someone opened a port in the console; a nightly plan flags it.","d":{"t":"flow","n":["Code","Deploy","Manual change","Drift detected","Reconcile"]},"h":"Drift arises from console changes, emergency fixes or other automation. Detect with terraform plan on a schedule, CloudFormation drift detection or Azure Resource Graph policies. Decide whether code or reality is right, then fix. Prevent by restricting write permissions in production and requiring changes via pipeline, with break-glass accounts audited.","y":"Drift undermines trust in code and causes surprises during the next apply.","m":"Mistake: ignoring drift reports. Tip: treat drift as an incident-lite with an owner and follow-up.","k":["Configuration drift | Real resources differ from code because someone changed them manually or another tool changed them.","Detecting drift | Scheduled terraform plan runs, CloudFormation drift detection or cloud inventory queries show differences.","Reconciling | Either reapply code to restore the intended state or update code to match an approved change.","Emergency changes | Manual fixes during incidents must be captured in code afterward.","Read-only production | Give people read access and force changes through pipelines.","Immutable infrastructure | Replace resources instead of patching them in place."]},{"n":"Policy as code (Sentinel, OPA, Azure Policy, Checkov)","w":"Policy as code enforces rules automatically.","b":["Examples: no public storage, encryption required, tags mandatory.","Tools: OPA/Conftest, Sentinel, Checkov, Azure Policy.","Run checks on the plan in CI to fail early.","Use deny for hard rules and audit for gradual adoption."],"e":"Checkov blocks a plan that creates an unencrypted disk.","d":{"t":"flow","n":["terraform plan","Policy check","Pass or fail","Apply"]},"h":"Policies express rules in code: OPA/Rego, Sentinel, Checkov rules or Azure Policy definitions. Evaluate plans before apply (shift left) and evaluate live resources continuously. Examples: encryption required, no public IPs, mandated tags, allowed regions and SKUs. Start with audit mode, exceptions with expiry, and clear error messages with remediation advice.","y":"Enables self-service with guardrails instead of manual approvals.","m":"Mistake: policies that block with unclear messages. Tip: provide docs and auto-remediation.","k":["Open Policy Agent and Rego | A general policy engine and language used to evaluate infrastructure plans and Kubernetes requests.","Sentinel | HashiCorp's policy framework for Terraform Cloud and Enterprise.","IaC scanners | Checkov, tfsec and Trivy find misconfigurations such as public storage in code.","Azure Policy | Evaluates live Azure resources and can audit, deny, modify or deploy missing settings.","Audit versus deny | Audit reports violations; deny blocks them. Start with audit.","Exemptions | Time-limited approved exceptions with an owner and reason."]},{"n":"Testing IaC (terratest, plan reviews)","w":"Infrastructure code needs testing like application code.","b":["Static checks: fmt, validate, tflint, security scanners.","Plan review in pull requests.","Integration tests (Terratest) create real resources in a sandbox then destroy them.","Test modules with small examples."],"e":"Terratest deploys a module, checks an endpoint, destroys it.","d":null,"h":"Levels: formatting and validation, linting (tflint), security scanning (Checkov, tfsec), unit tests of modules (Terraform test framework), integration tests that create real resources (Terratest) in a sandbox account and destroy them, and plan review in PRs. Keep tests fast and costs low with small examples and cleanup automation.","y":"IaC mistakes can delete production, so tests prevent costly outages.","m":"Mistake: only testing in production. Tip: require plan output in PRs and a successful apply in a non-production environment first.","k":["terraform validate and fmt | Check syntax and formatting automatically in CI.","tflint | A linter for provider-specific mistakes such as invalid instance types.","Terratest | Go tests that deploy real infrastructure, check it and destroy it.","Terraform test | The built-in testing framework for modules.","Sandbox accounts | Isolated accounts with budgets for test deployments.","Cost estimation | Tools such as Infracost show the monthly cost change in the pull request."]},{"n":"Pipeline-driven IaC with approvals","w":"Never deploy infrastructure from laptops.","b":["Pull request runs plan and posts the result.","Approval gate for production.","Merge triggers apply with a pipeline identity.","Logs and approvals give an audit trail."],"e":"Plan on PR, apply on merge to main with two approvers for prod.","d":{"t":"flow","n":["PR + plan","Review","Approve","Merge","Apply"]},"h":"Use a CI system with federated identity (OIDC) to cloud, not stored keys. Run plan on pull request and post it as a comment; require approvals for production; run apply on merge from the main branch with locking. Tools such as Atlantis, Terraform Cloud, GitHub Actions or Azure DevOps support this. Store logs for audit.","y":"Reproducible, secure and auditable infrastructure changes.","m":"Mistake: apply from laptops with personal credentials. Tip: restrict apply permission to the pipeline identity.","k":["OIDC federation | The pipeline exchanges its identity token for short-lived cloud credentials, so no long-lived keys are stored.","Plan on pull request | The pipeline posts the plan as a comment so reviewers see exact changes.","Apply on merge | Changes are applied only from the main branch after approval.","Environment approvals | A manual gate before production changes.","State locking | Ensures only one run changes an environment at a time.","Audit trail | Logs who approved and applied which change and when."]}]},{"n":"Landing zone basics","d":"Governance structure and guardrails.","s":[{"n":"Management groups, subscriptions, AWS Organizations","w":"A hierarchy lets you set policy and billing once and inherit it.","b":["Azure: management groups contain subscriptions; AWS: Organizations contain accounts.","Separate environments and workloads into their own subscriptions or accounts.","Policies and permissions flow down from parents.","Smaller blast radius if something goes wrong."],"e":"Management groups: Platform, Landing Zones (Prod, Non-prod), Sandbox.","d":{"t":"layers","n":["Root management group","Platform | Landing zones | Sandbox","Subscriptions / accounts","Resources"]},"h":"Structure example for Azure: Tenant root group, then Platform (Identity, Management, Connectivity), Landing Zones (Corp, Online), Sandbox, Decommissioned. Policies and RBAC assigned at group level inherit down. AWS Organizations uses organizational units (Security, Infrastructure, Workloads, Sandbox) with SCPs. Separate production from non-production and give teams their own subscription or account.","y":"Right hierarchy makes governance scalable and cost reporting simple.","m":"Mistake: a single subscription for everything. Tip: design the hierarchy around policy and ownership boundaries, not org charts.","k":["Management group | An Azure container above subscriptions; policies and role assignments applied here inherit downward.","Subscription | The Azure billing and access boundary; separate ones per environment and workload limit blast radius.","AWS Organizations and OU | A hierarchy of AWS accounts grouped into organizational units for policy and billing.","Service Control Policy | An AWS policy that sets the maximum permissions any account in a unit can have.","Platform versus workload | Platform subscriptions hold shared services (identity, network, management); workload ones hold applications.","Sandbox and decommissioned groups | A sandbox for experiments with strict limits and a holding group for retired subscriptions."]},{"n":"Hub-and-spoke and virtual WAN networking","w":"Hub-and-spoke centralizes shared network services.","b":["Hub: firewall, VPN/ExpressRoute, DNS, bastion.","Spokes: one network per workload, peered to the hub.","Traffic between spokes or to the internet passes through the hub firewall.","Virtual WAN automates this at large scale."],"e":"All internet egress from spokes goes through one Azure Firewall in the hub.","d":{"t":"hub","c":"Hub (firewall, DNS, VPN)","n":["Spoke: App A","Spoke: App B","Spoke: Data","On-premises"]},"h":"The hub VNet holds shared services: Azure Firewall or NVA, VPN/ExpressRoute gateways, DNS resolvers, Bastion. Spokes peer to the hub; user-defined routes send traffic to the firewall for inspection. This centralizes egress control, logging and on-premises connectivity. Virtual WAN adds managed routing at global scale. Watch firewall costs and throughput.","y":"Gives consistent security and connectivity with minimal duplication.","m":"Mistake: allowing spoke-to-spoke traffic without inspection. Tip: use route tables and network security groups together.","k":["Hub network | A central network holding shared services such as firewall, VPN or ExpressRoute gateway, DNS and bastion.","Spoke network | A workload network peered to the hub, isolated from other spokes.","Central firewall | Azure Firewall or a virtual appliance inspects and logs traffic between spokes and to the internet.","User-defined routes | Custom routes that force spoke traffic through the firewall.","Virtual WAN | A managed global hub with automated routing, suited to large estates and many branches.","Cost awareness | Firewalls, gateways and peering traffic have significant ongoing cost."]},{"n":"Azure Policy, SCPs, guardrails","w":"Guardrails stop mistakes before they happen.","b":["Azure Policy audits or denies non-compliant resources.","AWS Service Control Policies set maximum permissions for accounts.","Typical rules: allowed regions, required tags, no public IPs.","Start in audit mode, then enforce."],"e":"Deny creation of resources outside approved regions.","d":null,"h":"Guardrail types: preventive (deny), detective (audit) and corrective (remediate). Azure Policy initiatives group rules (allowed locations, tag inheritance, require encryption, deny public IPs). SCPs in AWS cap IAM permissions at account level. Roll out with audit first, review non-compliance, then enforce, giving exceptions with owner and expiry.","y":"Stops the same mistake from being repeated by every team.","m":"Mistake: enforcing everything on day one, blocking teams. Tip: communicate, pilot and provide approved templates.","k":["Preventive, detective and corrective guardrails | Block bad actions, report violations, or fix them automatically.","Policy initiative | A set of Azure policies assigned together, such as a security baseline.","Allowed locations | Policy limiting which regions can be used, helping data residency.","Tag policy | Requires or inherits tags such as owner and cost center so cost can be allocated.","Exemption | An approved, time-limited exception to a policy.","Rollout path | Start in audit mode, communicate findings, then enforce."]},{"n":"Identity and access design for platform teams","w":"Platform teams and workload teams need different access.","b":["Platform admins manage network, policy and shared services.","Workload teams get access only to their own subscriptions.","Use groups and just-in-time elevation (PIM).","Keep break-glass accounts secured and monitored."],"e":"App teams are Contributors in their subscription but cannot change the hub network.","d":null,"h":"Separate identities for platform operations, workload teams, security and finance. Use Entra groups and PIM for just-in-time elevation. Workloads use managed identities. Standard role assignments are deployed with subscription creation. Emergency (break-glass) accounts are excluded from conditional access but protected with strong credentials, monitoring and alerts.","y":"Clear boundaries protect shared platform services.","m":"Mistake: app teams owning network and policy resources. Tip: allow self-service within guardrails.","k":["Platform administrator | Manages shared network, policy and identity services.","Workload owner | Owns an application environment, its cost and its security within guardrails.","PIM | Privileged Identity Management grants admin roles temporarily after approval.","Break-glass accounts | Emergency accounts with strong credentials, excluded from normal conditional access and heavily monitored.","Group-based access | Assign roles to groups so access follows team membership.","Managed identity and service principal | Identities for workloads and automation."]},{"n":"Logging, monitoring and security baselines","w":"Every new environment should have observability and security built in.","b":["Send activity and resource logs to a central workspace.","Enable threat detection (Defender for Cloud, GuardDuty).","Apply a baseline: encryption, diagnostic settings, backups.","Alert on policy violations and risky changes."],"e":"All subscriptions stream logs to one Log Analytics workspace.","d":null,"h":"Central Log Analytics or CloudWatch/S3 log archive receives activity logs, diagnostic logs and security alerts from all subscriptions. Enable Defender for Cloud or Security Hub and GuardDuty, configure alerts to a SOC or ticketing. Provide standard dashboards and a baseline of backup and diagnostic settings through policy.","y":"You cannot investigate or prove compliance without centralized evidence.","m":"Mistake: each team deciding logging separately. Tip: policy-enforced diagnostic settings.","k":["Log Analytics workspace | The central store for Azure logs and queries with KQL.","Activity log | Control-plane record of who created or changed what.","Diagnostic settings | Send resource logs and metrics to the central workspace.","Defender for Cloud and Security Hub | Services that assess security posture and raise findings.","GuardDuty | AWS threat detection from logs and network activity.","SIEM | A central system such as Sentinel or Splunk correlating security events."]},{"n":"Cloud Adoption Framework and AWS Control Tower","w":"Use proven blueprints instead of designing from zero.","b":["Microsoft Cloud Adoption Framework: strategy, plan, ready, adopt, govern, manage.","Azure Landing Zone accelerators provide Terraform or Bicep.","AWS Control Tower sets up accounts, guardrails and logging.","Adapt the reference to your needs rather than inventing from scratch."],"e":"Deploy the Azure Landing Zone accelerator, then tailor policies.","d":null,"h":"Azure Landing Zones provide a reference architecture and automation (Bicep, Terraform modules). AWS Control Tower creates a multi-account structure with guardrails and Account Factory. Review each design area: identity, network, resource organization, security, management, governance, platform automation. Adapt rather than copy blindly, then maintain through pipelines.","y":"Proven starting points save months and embed good practice.","m":"Mistake: customizing too early. Tip: start close to reference, track deviations in ADRs.","k":["Cloud Adoption Framework | Microsoft's guidance across strategy, plan, ready, adopt, govern and manage.","Landing zone accelerator | Ready-made Bicep or Terraform that deploys the reference architecture.","AWS Control Tower | Sets up a multi-account environment with guardrails and logging.","Account Factory | Creates new governed AWS accounts on request.","Design areas | Billing, identity, resource organization, networking, security, management, governance and automation.","Deviation records | Document each departure from the reference as an ADR."]},{"n":"Subscription vending and onboarding automation","w":"Subscription vending creates ready-to-use environments on request.","b":["A team submits a request (pull request or form).","Automation creates the account, network, policies, access and budget.","Takes minutes instead of weeks.","Keeps every new environment consistent and compliant."],"e":"A new product team gets a subscription with peering and policies already done.","d":{"t":"flow","n":["Request","Automation","Subscription + network + policy","Team starts building"]},"h":"Flow: request (form or PR) captures owner, cost center, environment and network needs; automation creates the subscription/account, links to the right management group, deploys baseline (network, peering, policies, monitoring, budgets), assigns roles and returns details. Typical time: minutes. Offboarding is automated too (decommission).","y":"Speeds teams up and keeps everything standard.","m":"Mistake: manual tickets taking weeks. Tip: build vending as a product with SLAs and metrics.","k":["Subscription vending | Automated creation of ready-to-use subscriptions or accounts.","Request intake | A form or pull request capturing owner, cost center, environment and network needs.","Baseline deployment | Network peering, policies, monitoring, budgets and role assignments applied automatically.","Decommissioning | Automated cleanup and cost stop when an environment is retired.","Delivery target | A service level such as under one hour to a ready environment.","Self-service | Teams get environments without waiting for tickets."]}]}]},{"p":"Phase 3 - CI/CD, DevSecOps & Security Tooling (Weeks 9-11)","why":"Why: quality and security gates are part of delivery.","t":[{"n":"CI/CD pipelines","d":"Build, test, deploy automation.","s":[{"n":"GitHub Actions, Azure DevOps Pipelines, Jenkins basics","w":"A pipeline runs your build, test and deploy steps automatically on every change.","b":["GitHub Actions and Azure DevOps use YAML files stored in the repo.","Jenkins is self-hosted and flexible but needs more care.","Typical stages: build, unit test, scan, package, deploy.","Keep pipelines fast; fail early on cheap checks."],"e":"A push to main triggers build, tests, image scan and deploy to test.","d":{"t":"flow","n":["Commit","Build","Test","Scan","Package","Deploy"]},"h":"A pipeline is triggered by events (push, pull request, schedule). Jobs run in agents (hosted or self-hosted) in containers or VMs, with steps for checkout, restore dependencies, build, test, scan, package and deploy. Pipelines are defined as code (YAML), versioned with the app. Use environments, approvals, secrets from vaults and OIDC federation for cloud access instead of stored keys.","y":"Automation gives repeatable, fast and auditable delivery.","m":"Mistake: slow pipelines over 20 minutes that people bypass. Tip: parallelize, cache and run heavy checks only where needed.","k":["Pipeline | An automated sequence that takes a commit through build, test, scan and deploy, defined as code in the repository so it is versioned and reviewed.","Stages, jobs and steps | A pipeline has stages (build, test, deploy); each stage has jobs that can run in parallel; each job runs ordered steps.","Runner or agent | The machine that executes jobs, either hosted by the vendor or self-hosted when you need private network access.","Triggers | Events that start a run: push, pull request, tag, schedule or manual start.","OIDC federation | The pipeline receives a short-lived cloud token based on its identity, so no long-lived cloud keys are stored as secrets.","Fail fast | Run cheap checks such as lint and unit tests first so developers get feedback in minutes."]},{"n":"Trunk-based development and branching strategies","w":"How you branch decides how painful merging is.","b":["Trunk-based: small changes merged to main often, behind feature flags.","Gitflow: long-lived develop and release branches, slower and heavier.","Short-lived branches (under 2 days) reduce conflicts.","Protect main with required reviews and passing checks."],"e":"Developers merge 3 small pull requests a day instead of one big one a week.","d":{"t":"vs","lt":"Trunk-based","l":["Short branches","Feature flags","Fast feedback"],"rt":"Gitflow","r":["Long branches","Release branches","Slower, heavier"]},"h":"In trunk-based development, developers integrate to main at least daily; incomplete work is hidden behind feature flags. Release branches are optional for hotfixes. Gitflow keeps long-lived develop and release branches, which delays integration and creates merge pain. Branch protection requires reviews and passing checks; short-lived feature branches and small PRs keep flow fast.","y":"Branching style directly affects lead time and defects.","m":"Mistake: long-lived branches. Tip: merge small and often; use flags to decouple deploy from release.","k":["Trunk-based development | Everyone merges small changes into main at least daily, which keeps integration continuous and merges simple.","Feature flags | Runtime switches that hide unfinished work, separating deployment from release.","Short-lived branches | Branches that live hours or a day or two; long-lived branches cause painful merges.","Gitflow | A model with long-lived develop and release branches, slower feedback and heavier merging; suited to versioned products.","Branch protection | Rules that require reviews, passing checks and no force pushes on main.","Merge queue | Tests changes in order so main always stays green."]},{"n":"Build caching and reusable pipeline templates","w":"Slow or copy-pasted pipelines waste time and drift apart.","b":["Cache dependencies and Docker layers.","Run independent jobs in parallel.","Shared templates give every team the same secure steps.","Fix a template once and every pipeline benefits."],"e":"A 'build-and-scan' template reused by 40 repos.","d":null,"h":"Templates (reusable workflows, YAML templates, shared libraries) define standard stages once. Teams call them with parameters. Cache package managers, Docker layers and test results. Split pipelines into fast PR validation and slower nightly suites. Pin action and task versions, and review third-party actions for supply-chain risk.","y":"Consistency improves security and reduces maintenance.","m":"Mistake: copy-paste pipelines drifting apart. Tip: central templates with semantic versions.","k":["Reusable workflows and templates | One shared pipeline definition called by many repositories with parameters, so security fixes are made in one place.","Dependenc
