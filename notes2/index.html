 clear and rollback easy."]}]},{"n":"GitHub Copilot","d":"Assistant, agent mode and reviews.","s":[{"n":"Inline completions and chat","w":"Copilot helps in the editor and chat.","b":["Inline suggestions as you type.","Chat explains, refactors and generates.","Include context: files, selection, goal.","Accept suggestions only after reading them."],"e":"Ask chat to write tests for the selected function.","d":null,"h":"Use inline suggestions by writing clear comments and function names; accept with Tab after reading. Chat can explain code (/explain), fix (/fix), write tests (/tests) and answer repository questions with @workspace. Use context variables (#file, #selection). Choose models suited for the task. Iterate by asking follow-up questions.","y":"Everyday productivity for developers.","m":"Mistake: accepting suggestions blindly. Tip: read each suggestion like a code review.","k":["Inline suggestions | Copilot proposes code as you type; read it like code from a stranger before pressing Tab.","Copilot Chat | Ask questions, explain code, fix errors and generate tests without leaving the editor.","Chat commands | /explain, /fix, /tests and /doc trigger common tasks.","Context | #file, #selection and @workspace tell Copilot which code to consider.","Model selection | Pick a model that suits the task, such as a faster one for simple edits."]},{"n":"Agent mode and coding agent","w":"Agent features do multi-step work.","b":["Agent mode edits several files and runs commands in the editor.","Coding agent works in the background from an issue and opens a PR.","Provide clear issues with acceptance criteria.","Always review the PR."],"e":"Assign an issue to Copilot; review its pull request.","d":{"t":"flow","n":["Issue","Copilot agent","Pull request","Human review"]},"h":"Agent mode plans steps, edits files, runs terminal commands and tests, and iterates on errors, with approval prompts for commands. The coding agent runs in GitHub Actions on an assigned issue, creates a branch and pull request and responds to review comments. Good issues state goal, constraints and acceptance criteria. MCP servers can extend tools.","y":"Delegates larger tasks while you review the result.","m":"Mistake: vague issues leading to wrong implementations. Tip: write issues like specs.","k":["Agent mode | Copilot plans multi-step work, edits several files, runs terminal commands and tests, and iterates on errors, asking for approval of commands.","Coding agent | Assign a GitHub issue; the agent works in its own branch and opens a pull request, like a junior contributor.","Issue as specification | Clear goals, constraints and acceptance criteria determine output quality.","Tool approvals | You confirm sensitive actions.","Review obligation | Always review the pull request carefully."]},{"n":"Custom instructions and prompt files","w":"Teach Copilot your standards.","b":["copilot-instructions.md holds repository-wide rules.","Prompt files are reusable templates.","Include build commands, style and architecture rules.","Keep concise."],"e":"'Use our logging wrapper, never console.log'.","d":null,"h":"Repository custom instructions (.github/copilot-instructions.md) apply to all chats; path-specific instructions use applyTo patterns; prompt files (.prompt.md) provide reusable tasks. Include language versions, frameworks, architecture rules, testing approach, build and run commands, and things to avoid. Keep them concise and test their effect.","y":"Aligns suggestions with team standards.","m":"Mistake: contradictory or overly long instructions. Tip: iterate and remove what is ignored.","k":["Repository instructions | .github/copilot-instructions.md gives standing guidance such as coding standards and architecture rules for all chats in the repository.","Path-specific instructions | Rules that apply only to certain files or languages.","Prompt files | Reusable task prompts stored in the repository, such as generate unit tests in our style.","Useful content | Build and test commands, naming rules, patterns to avoid and links to standards.","Verification | Test whether instructions change behavior and prune what is ignored."]},{"n":"Copilot code review","w":"Copilot can review pull requests.","b":["Adds comments and suggestions.","Good for common bugs and style.","Humans decide on design and risk.","Tune with instructions."],"e":"Copilot flags a missing null check.","d":null,"h":"Request Copilot as a reviewer on a PR; it adds line comments and suggested changes, and a summary. Use custom review instructions for team checks. Combine with CodeQL and Dependabot. Reviewers verify suggestions before applying. Review quality varies, so treat it as assistance.","y":"Faster feedback loops on PRs.","m":"Mistake: letting suggestions bypass human approval. Tip: keep required human reviews on protected branches.","k":["Copilot code review | Copilot comments on pull requests with suggested changes and a summary.","Review instructions | Tell it what your team cares about, such as security or performance.","Complementary scanning | CodeQL and Dependabot still check security and dependencies.","Human approval | Required reviewers remain in charge.","Noise management | Adjust instructions if comments are not useful."]},{"n":"Enterprise policy, content exclusions, audit","w":"Admins control Copilot use.","b":["Enable features and models by policy.","Content exclusion hides sensitive files from AI.","Audit logs and usage metrics.","Block suggestions matching public code if required."],"e":"Exclude /secrets and /config from Copilot.","d":null,"h":"Org admins manage seat assignment, enable/disable features and models, set policies for public code matching, content exclusion (paths excluded from context), network settings and audit logs; usage metrics APIs show adoption. Integrates with SSO and enterprise managed users. Review settings for regulated repositories.","y":"Governance for safe enterprise use.","m":"Mistake: enabling all features by default. Tip: roll out in stages with policy review.","k":["Seat management | Assign licenses to users and teams.","Feature and model policy | Enable only the features and models your organization approves.","Content exclusion | Keep sensitive files out of Copilot's context.","Public code filter | Block suggestions that closely match public code.","Audit and metrics | Review settings changes, usage and adoption."]},{"n":"Prompt techniques for quality results","w":"Better prompts give better code.","b":["State goal, constraints and examples.","Break work into steps.","Ask for a plan first.","Iterate with feedback.","Verify with tests."],"e":"'Write a function with these inputs and edge cases, and tests'.","d":null,"h":"Techniques: state the objective and constraints; provide inputs and expected outputs; show an example; ask for a plan before code; request tests first; specify language/framework versions; break problems down; ask for alternatives and trade-offs; and use follow-ups to refine. When output is poor, add context rather than repeating the same prompt.","y":"Prompt skill multiplies benefit.","m":"Mistake: one huge prompt for everything. Tip: iterate in small steps.","k":["State the goal | Say clearly what you want and why.","Constraints and examples | Versions, libraries, style and sample inputs and outputs.","Plan first | Ask for an approach before code on complex tasks.","Small steps | Iterate in short cycles instead of one huge request.","Verify | Run tests and review everything."]}]},{"n":"Amazon Connect","d":"Cloud contact center.","s":[{"n":"Instances, queues, routing profiles","w":"Connect is built from simple parts.","b":["Instance: your contact center.","Queues hold contacts.","Routing profiles define which queues agents serve and priority.","Hours of operation and users/security profiles."],"e":"Billing queue with Tier 1 and Tier 2 routing profiles.","d":{"t":"hub","c":"Connect instance","n":["Queues","Routing profiles","Agents","Hours"]},"h":"Create an instance with identity management (Connect-managed, SAML or directory) and set data storage and telephony options. Define hours of operation, queues (with outbound caller ID and max contacts), routing profiles (channels, queue priority, delay), security profiles (permissions), users and phone numbers. Use tags and CloudFormation or CDK for repeatability.","y":"Foundation of any contact center build.","m":"Mistake: configuring manually across environments. Tip: use IaC and export/import of flows.","k":["Instance | The top-level Amazon Connect contact center, created with an identity option such as Connect-managed or SAML and a storage location for recordings.","Queues | Holding areas for contacts, each with hours, caller ID and capacity limits.","Routing profiles | Define which queues and channels an agent handles and in what priority, so you can create tiers and skills.","Security profiles | Permissions for users in the admin and agent interfaces.","Hours of operation | Schedules that control when queues accept contacts and can drive after-hours flows."]},{"n":"Contact flows and flow design","w":"Flows script the customer experience.","b":["Visual designer with blocks: play prompt, get input, check attribute, transfer.","Types: inbound, queue, whisper, outbound.","Use contact attributes to carry data.","Modular flows and testing."],"e":"Greeting, authenticate, menu, transfer to billing queue.","d":{"t":"flow","n":["Call arrives","Greeting","Authenticate","Menu or bot","Queue and agent"]},"h":"Flow blocks: Play prompt, Get customer input, Check contact attributes, Set working queue, Transfer to queue, Invoke AWS Lambda, Loop, Set recording behavior, Get queue metrics, and error branches for every block. Use contact attributes (system, user-defined, segment) to pass data. Modular flows (modules) can be reused. Test with the test console and logs; use CloudWatch logging for flow debugging.","y":"Flows define the customer journey.","m":"Mistake: unhandled error branches causing dead air. Tip: always add error handling and a fallback to an agent.","k":["Contact flows | Visual scripts for the whole customer journey, from greeting and authentication to routing and transfer.","Blocks | Individual steps such as play prompt, get customer input, check attribute, invoke Lambda or transfer to queue.","Contact attributes | Key-value data attached to a contact that flows read and write, such as intent or customer ID.","Modules | Reusable flow fragments to avoid duplication.","Error handling | Every block should have an error path so customers never meet silence or loops."]},{"n":"Amazon Lex bots and Bedrock integration","w":"Bots handle conversations.","b":["Lex: intents, slots and fulfillment.","Bedrock adds generative answers and knowledge bases.","Fall back to a human when needed.","Voice and chat share designs."],"e":"Bot resolves 'where is my claim' using a Lambda lookup.","d":null,"h":"Lex defines intents, utterances, slots, confirmation and fulfillment. Connect invokes a Lex bot in a flow for voice or chat. Bedrock integration offers generative responses, Q in Connect for agent assistance (real-time recommendations), and knowledge bases. Always provide escape to a human and handle low confidence. Test with real speech data.","y":"Automates common requests and reduces handle time.","m":"Mistake: forcing customers through a bot with no exit. Tip: offer 'agent' option and detect frustration.","k":["Amazon Lex | Builds voice and chat bots with intents (what the caller wants), slots (details to collect) and fulfillment (what to do).","Intent and slot design | Good utterances and clear slot prompts determine bot accuracy.","Bedrock integration | Adds generative answers and knowledge-base lookup for open questions, with guardrails.","Q in Connect | Gives agents real-time suggested answers during contacts.","Escalation to humans | Always provide an easy path and detect frustration."]},{"n":"Lambda integrations and CRM connectors","w":"Integrations bring in business data.","b":["Lambda functions called from flows.","CRM connectors (Salesforce, Zendesk).","Customer Profiles unify records.","Handle timeouts and errors."],"e":"Lambda fetches member and plan details by phone number.","d":null,"h":"Lambda functions invoked from flows get contact data (JSON) and return key-value attributes. Use them to look up customers in CRM or databases, verify identity, check claim status, and create cases. Keep within the 8-second invoke limit, add timeouts and retries, and secure with least-privilege IAM. Prebuilt integrations exist for Salesforce, Zendesk and ServiceNow.","y":"Connects the contact center to business systems.","m":"Mistake: slow back-end calls causing long silence. Tip: cache lookups and play prompts while waiting.","k":["Lambda integration | Flows call Lambda to look up customers, verify identity, check claim status or create cases.","Time limits | A flow waits only a few seconds for a Lambda, so keep calls fast and cache results.","Customer Profiles | Unifies customer data from several systems for agents.","CRM connectors | Ready integrations such as Salesforce and Zendesk.","Screen pops | Show customer context in the agent workspace when a contact arrives."]},{"n":"Contact Lens analytics","w":"Analytics improves quality.","b":["Transcripts and sentiment.","Categorize contacts by topic.","Compliance rules and redaction.","Real-time alerts for supervisors."],"e":"Flag calls with 'cancel' and negative sentiment.","d":null,"h":"Contact Lens provides speech-to-text transcripts, sentiment, categories (rules on phrases), PII redaction, issue detection and summaries, plus real-time alerts for supervisors. Dashboards show service level, abandon rate, average handle time, occupancy. Evaluation forms enable quality management. Export data to data lakes for analytics.","y":"Improves quality, compliance and coaching.","m":"Mistake: collecting data without action. Tip: tie insights to coaching and process fixes.","k":["Contact Lens | Analytics that transcribe conversations and analyze sentiment, topics and compliance.","Categories | Rules that tag contacts, such as phrases indicating a complaint or cancellation.","Redaction | Remove sensitive data from transcripts and recordings.","Real-time alerts | Notify supervisors during problem calls.","Evaluation forms | Structured quality scoring that supports coaching."]},{"n":"Agent workspace and customer profiles","w":"Give agents what they need on one screen.","b":["Agent workspace with softphone, customer profile, guides and cases.","Step-by-step guides for processes.","Customer Profiles show history.","Reduce handle time."],"e":"Pop customer history when the call connects.","d":null,"h":"Agent workspace (Connect agent application) integrates softphone, chat, tasks, customer profile, step-by-step guides and Wisdom/Q in Connect knowledge. Customer Profiles aggregates data from multiple sources with identity resolution. Screen pops show relevant information at call arrival. Reduce clicks and training time.","y":"Better experience for customers and agents.","m":"Mistake: overloaded screens. Tip: show only essentials and use guides for complex flows.","k":["Agent workspace | A single screen with phone, chat, customer information and tools, reducing time spent switching apps.","Step-by-step guides | Wizards that lead agents through complex processes consistently.","Cases | Track customer issues across multiple contacts.","Customer Profiles | Show history and identity.","Average handle time | A common measure these tools aim to reduce without hurting quality."]},{"n":"Security, recording and compliance","w":"Contact centers handle sensitive data.","b":["Encrypt recordings and data.","Redact card and personal data.","Role-based access to recordings.","Follow PCI and HIPAA; retention rules."],"e":"Pause recording while the caller reads the card number.","d":null,"h":"Controls: encryption of recordings and transcripts (KMS), IAM and security profiles for access to recordings, redaction of sensitive data, pause/resume recording for payment capture or PCI DSS use, retention policies in S3, logging with CloudTrail, VPC endpoints, HIPAA eligibility with BAA. Define legal notices for call recording.","y":"Contact centers carry highly sensitive data.","m":"Mistake: leaving recordings broadly accessible. Tip: restrict access by role and monitor usage.","k":["PCI DSS | Payment card standard; do not store card numbers in recordings or transcripts.","HIPAA | Connect is HIPAA eligible with a business associate agreement, requiring encryption and access control.","Encryption | Use KMS keys for recordings and data.","Pause recording | Stop capturing while a caller states card details.","Retention and access | Keep recordings only as long as required and limit who can listen."]}]}]},{"p":"Phase 9 - Enterprise Architecture & Technical Leadership (Weeks 33-38)","why":"Why: what separates Architect from Senior Engineer.","t":[{"n":"Enterprise strategy","d":"Governance and cloud adoption at scale.","s":[{"n":"Cloud Adoption Framework stages","w":"CAF gives a path for cloud adoption.","b":["Strategy: why and outcomes.","Plan: skills, portfolio and plan.","Ready: landing zone.","Adopt: migrate and innovate.","Govern and manage: policy, cost, operations."],"e":"Define business outcomes before choosing a migration method.","d":{"t":"flow","n":["Strategy","Plan","Ready","Adopt","Govern","Manage"]},"h":"Stages: Strategy (business justification and outcomes), Plan (digital estate, skills, cloud adoption plan), Ready (landing zone, operating model), Adopt (migrate, modernize, innovate), Govern (policy, cost, risk), Manage (operations). Provides templates and tools such as the strategy and plan template and Azure Migrate. Align with business owners at each stage.","y":"A shared roadmap for large programs.","m":"Mistake: starting with technology instead of outcomes. Tip: define measurable business results first.","k":["Cloud Adoption Framework | Microsoft's end-to-end guidance for cloud adoption in six stages.","Strategy and plan | Define why you are moving (motivations, outcomes) and plan skills, portfolio and timeline.","Ready | Build the landing zone and operating model before moving workloads.","Adopt | Migrate existing workloads and modernize or build new ones.","Govern and manage | Set policy, cost and risk controls, then operate and optimize continuously."]},{"n":"Enterprise-scale landing zones","w":"Enterprise landing zones scale across many teams.","b":["Platform subscriptions: identity, connectivity, management.","Landing zones for workloads (corp and online).","Policy at management group level.","Subscription vending."],"e":"Corp landing zone for internal apps, online for internet-facing.","d":null,"h":"Enterprise-scale landing zones standardize identity, networking, governance and management across subscriptions with platform and application landing zones. Design areas: billing and tenant, identity, resource organization, network, security, management, governance, automation. Use accelerators and keep deviations documented.","y":"Allows many teams to adopt cloud safely at scale.","m":"Mistake: building custom foundations from scratch. Tip: adopt the reference architecture and adapt.","k":["Platform landing zone | Subscriptions for shared services such as identity, connectivity, management and security.","Application landing zones | Subscriptions where workload teams build, usually split into corp (private) and online (internet-facing).","Management group hierarchy | The structure that assigns policy and access to many subscriptions.","Subscription vending | Automated delivery of new, compliant environments.","Reference accelerators | Prebuilt Bicep or Terraform that implement the architecture."]},{"n":"Hybrid with Azure Arc and Azure Stack","w":"Extend management to where workloads run.","b":["Azure Arc projects servers, Kubernetes and databases into Azure.","Apply policy, monitoring and security centrally.","Azure Stack (HCI/Hub) runs Azure services on your hardware.","Use for latency, sovereignty or edge needs."],"e":"Patch on-premises servers with Azure Update Manager through Arc.","d":{"t":"hub","c":"Azure control plane","n":["Azure","On-premises","Other clouds","Edge"]},"h":"Azure Arc connects non-Azure servers, Kubernetes clusters, SQL servers and data services to Azure for unified governance, policy, monitoring, update management and security. Azure Stack HCI/Hub runs Azure services on-premises or at the edge. Typical drivers: data residency, latency, factory or branch operations, gradual migration. Consider cost and connectivity.","y":"Consistent management across hybrid estates.","m":"Mistake: deploying Arc without a clear management goal. Tip: begin with policy and monitoring use cases.","k":["Azure Arc | Brings servers, Kubernetes clusters and databases running outside Azure under Azure management so policy, monitoring and security work the same everywhere.","Azure Policy and Defender via Arc | Apply the same governance to on-premises and other clouds.","Azure Stack HCI | Run Azure services on your own hardware for latency, sovereignty or edge needs.","Edge locations | Factories, stores and branches that need local processing.","Hybrid identity | Entra ID synchronized with on-premises directories so users have one identity."]},{"n":"Multi-cloud strategy and portability trade-offs","w":"Multi-cloud is a trade-off.","b":["Reasons: client requirements, regulation, resilience, best-of-breed services.","Costs: skills, tooling, networking, inconsistent security.","Use open tools (Kubernetes, Terraform, OpenTelemetry) where portability matters.","Avoid it only for theoretical lock-in avoidance."],"e":"Run Azure as primary and AWS for a specific acquired system.","d":null,"h":"Drivers: acquisitions, customer or regulatory requirements, best-of-breed services, risk diversification. Costs: skill spread, duplicated tooling, data egress fees, inconsistent security controls, complexity. Approaches: choose a primary cloud, standardize on portable layers (Kubernetes, Terraform, OpenTelemetry, Kafka), centralize identity and security visibility, and define per-workload placement rules.","y":"Many large organizations are multi-cloud by circumstance.","m":"Mistake: designing for full portability, giving up cloud-native value. Tip: portability where it pays, native where it helps.","k":["Reasons for multi-cloud | Customer or acquisition requirements, regulation, best-of-breed services or concentration risk.","Costs | Duplicated skills, tooling and security work, plus data egress fees between clouds.","Portability layers | Kubernetes, Terraform and OpenTelemetry reduce lock-in where portability matters.","Per-workload placement | Choose the best cloud for each workload instead of spreading everything.","Unified visibility | Central monitoring, identity and security across clouds."]},{"n":"Governance, risk and compliance models","w":"Governance sets the rules and the proof.","b":["Policies, standards, exceptions process.","Risk register and reviews.","Automated enforcement and evidence.","Clear owners."],"e":"Exception requests expire after 90 days.","d":null,"h":"Governance model: principles, standards, policies, roles (cloud center of excellence), decision rights, exception process, risk register, compliance mapping, KPIs. Implementation via policy as code, automated checks, dashboards and regular reviews. Balance control and agility with guardrails instead of gates.","y":"Keeps cloud use safe and efficient.","m":"Mistake: governance as a ticket queue. Tip: automate controls and offer paved roads.","k":["Policy hierarchy | Policies are mandatory rules, standards are approved choices and guidelines are recommendations.","Exception process | Time-limited approved deviations with owners.","Risk register | Tracked risks with owners and mitigations.","Operating model | Who builds, runs and secures what, often a platform team plus product teams.","Guardrails versus gates | Automated guardrails keep teams fast; manual approval gates create queues."]},{"n":"Architecture review boards","w":"Review boards guide big decisions.","b":["Define scope: which decisions need review.","Short submission template.","Fast turnaround, written decision.","Record as ADR."],"e":"Weekly 30-minute review with decisions in 2 days.","d":null,"h":"Define charter, scope (what must come), cadence, submission template (problem, options, decision requested), reviewers with expertise, decision timelines (for example 3 business days), and documentation as ADRs. Provide office hours and early consultation to avoid late surprises. Review board metrics: time to decision and outcomes.","y":"Improves consistency without slowing teams.","m":"Mistake: board becomes a bottleneck. Tip: delegate low-risk decisions to teams with guidelines.","k":["Architecture review board | A forum that reviews significant designs against standards and risks.","Standard submission | A short template so reviews are quick.","Decision service level | A target such as three business days.","Delegation | Teams decide low-risk matters within published guidelines.","Recorded outcomes | Each decision is captured as an ADR."]},{"n":"Technology radar and standards","w":"Make technology choices visible.","b":["Adopt, trial, assess, hold rings.","Owners and reasons for each entry.","Review periodically.","Helps teams choose and avoid sprawl."],"e":"Hold: old message broker; Adopt: Kafka.","d":null,"h":"Technology radar quadrants: techniques, tools, platforms, languages/frameworks with rings Adopt, Trial, Assess, Hold. Entries have rationale and owners; review each quarter. Publish internally, link to golden paths and approved list. Use it to guide hiring and training.","y":"Aligns the organization on technology direction.","m":"Mistake: radar that is never updated. Tip: assign curators and a regular review.","k":["Technology radar | A map of technologies and where they stand for your organization.","Adopt, trial, assess, hold | Recommended, worth trying on real projects, worth exploring, and avoid for new work.","Curators | The group that keeps it current.","Review cycle | Typically quarterly.","Rationale | Each entry says why, so teams understand the guidance."]}]},{"n":"Roadmaps & business cases","d":"Secure buy-in and funding.","s":[{"n":"Current-state and target-state assessment","w":"Start from facts.","b":["Current state: applications, costs, risks, skills.","Target state: outcomes and capabilities.","Gap analysis shows what must change.","Use data, not opinion."],"e":"Current: 120 apps, 40% unsupported; target: 20 retired, 60 modernized.","d":{"t":"flow","n":["Current state","Target state","Gap","Roadmap"]},"h":"Create inventory of applications, infrastructure, data, costs, skills, risks and compliance gaps. Define target state (capabilities, architecture principles, operating model). Perform gap analysis and identify initiatives with dependencies. Validate with stakeholders and quantify using metrics (percent cloud-hosted, unsupported systems, incident rate).","y":"Clear baseline and destination.","m":"Mistake: vague target like 'modern platform'. Tip: describe measurable outcomes and capabilities.","k":["Current state | A factual baseline: applications, infrastructure, costs, risks, skills and incidents.","Target state | The desired future described through capabilities and measurable goals, not product names.","Gap analysis | A comparison showing what must change, in what order.","Initiatives | The projects that close gaps, each with owner, benefit and cost.","Validation | Confirm the baseline with the people who run the systems so numbers are trusted."]},{"n":"TCO and ROI modeling","w":"Numbers support the decision.","b":["TCO: all costs over 3-5 years (cloud, licenses, people, migration, parallel run).","ROI/benefit: savings, revenue, risk reduction.","State assumptions and sensitivities.","Compare to do-nothing."],"e":"Payback in 22 months, including one-time migration cost.","d":null,"h":"TCO includes compute, storage, licenses, support, networking, people, migration, training, parallel run and decommission savings, over 3-5 years with discounting. Benefits: cost avoidance, revenue growth, productivity, risk reduction. Compute NPV, ROI and payback; include sensitivity analysis (best, expected, worst). Document assumptions with sources.","y":"Funding decisions rely on credible numbers.","m":"Mistake: ignoring migration and run costs or over-optimistic savings. Tip: have finance validate the model.","k":["Total cost of ownership | All costs over three to five years: licenses, cloud, people, migration, training and parallel running.","Net present value and ROI | NPV discounts future benefits to today's value; ROI compares benefit to cost.","Payback period | How long until cumulative benefits cover the investment.","Sensitivity analysis | Show how results change if key assumptions change, such as adoption or cost.","Assumption log | Write down every assumption and its source so leaders can challenge it."]},{"n":"Cost and risk analysis","w":"Leaders fund what they understand.","b":["List options with costs, benefits, risks and mitigation.","Show the cost of doing nothing.","Quantify likelihood and impact.","Recommend one option."],"e":"Table: Option A rehost, B replatform, C refactor.","d":null,"h":"Structure: problem statement, options (do nothing, minimal, recommended, ambitious), evaluation criteria (cost, benefit, risk, time, strategic fit), scoring, risks with mitigations and owners, dependencies and recommendation. Quantify risk exposure (probability x impact). Show the cost of delay and of failure.","y":"Helps leaders choose confidently.","m":"Mistake: presenting only the preferred option. Tip: show alternatives and why they were rejected.","k":["Options | Present a minimal option, the recommended option and an ambitious option.","Do-nothing baseline | The cost and risk of leaving things as they are, often the strongest argument.","Risk exposure | Probability times impact, with mitigations and owners.","Criteria scoring | Rate options on cost, benefit, risk, time and strategic fit with agreed weights.","Recommendation | A clear choice with reasons."]},{"n":"Phased proposals with milestones","w":"Break big programs into value steps.","b":["Each phase has clear scope, outcome, cost and exit criteria.","Early phases prove value and reduce risk.","Gate reviews to continue.","Adjust based on lessons."],"e":"Phase 1: platform and pilot; Phase 2: wave migrations.","d":{"t":"flow","n":["Phase 1 pilot","Gate","Phase 2 waves","Gate","Phase 3 optimize"]},"h":"Break into phases: foundations (platform, governance), pilots, scale-out waves, optimization. Each phase has objectives, deliverables, success metrics, budget, resources and exit gates. Use rolling-wave planning: detailed near-term, outline long-term. Highlight quick wins to build momentum.","y":"Reduces risk and shows value early.","m":"Mistake: one huge big-bang plan. Tip: define go/no-go criteria per phase.","k":["Phases | Stages with their own scope, deliverables and budget.","Milestones | Checkpoints that show progress.","Exit criteria | Conditions to proceed to the next phase.","Rolling-wave planning | Plan the near term in detail and later phases in outline.","Quick wins and pilots | Early, visible results that build trust and test assumptions."]},{"n":"Capability maps and investment prioritization","w":"Prioritize with business capabilities.","b":["Map capabilities (underwriting, claims, billing).","Rate importance and current maturity.","Invest where importance is high and maturity low.","Link each initiative to a capability."],"e":"Claims automation scores highest.","d":null,"h":"Capability map: hierarchical view of what the business does (Underwriting, Claims, Billing, Member Service). Heat map colors importance, performance and technology support. Prioritize initiatives where high importance meets low maturity. Link projects, applications and data to capabilities. Update with business leaders.","y":"Connects technology investment to business value.","m":"Mistake: building the map in isolation. Tip: co-create with business owners.","k":["Capability map | A hierarchical picture of what the business does, such as underwriting, claims and billing.","Heat map | Colors indicating importance, performance or technology support.","Priority rule | Invest where importance is high and maturity is low.","Application mapping | Show which systems support each capability.","Alignment | Every initiative must link to a capability and outcome."]},{"n":"Executive summary writing","w":"Write for executives.","b":["Lead with decision needed and recommendation.","Cost, benefit, timeline in one page.","Risks and asks.","Details in appendix."],"e":"A one-page summary with a three-line recommendation.","d":null,"h":"Executive summary: 1) decision needed, 2) recommendation, 3) why now, 4) cost and benefit, 5) risks, 6) timeline and next steps. Use plain language, one chart max, and consistent numbers. Prepare a backup deck with details. Practice answering likely questions.","y":"Executives decide fast on clear, concise asks.","m":"Mistake: jargon and long descriptions. Tip: write for someone with two minutes.","k":["Executive summary | A one-page brief that decision makers can read in two minutes.","Structure | Decision needed, recommendation, why now, cost and benefit, risks, next steps.","Plain language | Avoid jargon and acronyms.","Appendix | Detailed back-up for those who want it.","Pre-read and rehearsal | Send material early and prepare for questions."]},{"n":"Stakeholder mapping","w":"Know who you must win over.","b":["List stakeholders and their interests.","Rate influence and interest.","Plan engagement for each.","Revisit often."],"e":"Finance cares about cost; security about risk.","d":null,"h":"Create a stakeholder register: name, role, interests, influence, current stance, desired stance, engagement plan and owner. Use power-interest grid: manage closely (high power, high interest), keep satisfied, keep informed, monitor. Meet one-on-one with key sponsors and skeptics, and track commitments.","y":"Programs fail from misalignment more than technology.","m":"Mistake: surprising stakeholders in meetings. Tip: pre-wire important decisions.","k":["Stakeholder register | A list of stakeholders with role, interests and current attitude.","Influence and interest grid | Decides how closely to manage, keep informed or monitor each person.","Sponsors and blockers | Supporters to enlist and resisters whose concerns you must understand.","Engagement plan | Who talks to whom, when and about what.","Pre-wiring | Align key people before formal meetings so decisions are smooth."]}]},{"n":"Platform engineering","d":"Reusable paths for teams.","s":[{"n":"Internal developer platform concepts","w":"An IDP lets developers self-serve.","b":["Provides environments, pipelines, templates, docs.","Reduces dependence on central teams.","Built as a product with users and feedback.","Includes guardrails."],"e":"Create a new service from a template in minutes.","d":null,"h":"Elements: self-service portal or CLI, standardized templates, CI/CD, environment provisioning, secrets, observability, documentation, policy guardrails and support. Focus on reducing cognitive load for developers. Team Topologies describes platform teams serving stream-aligned teams. Maintain with a product backlog and user research.","y":"Improves developer productivity and consistency.","m":"Mistake: building a platform nobody asked for. Tip: start from the most painful developer workflows.","k":["Internal developer platform | A product that gives developers self-service access to environments, pipelines and tools with sensible defaults.","Self-service | Teams get what they need without raising tickets.","Cognitive load | The mental effort developers spend on infrastructure details; reducing it is the goal.","Platform team | Builds and operates the platform as a product with developers as customers.","Guardrails | Automated limits for security and cost that keep self-service safe."]},{"n":"Golden paths and templates","w":"Make the right way the easy way.","b":["Template includes CI/CD, security, observability.","Supported and documented.","Optional but attractive.","Measure adoption."],"e":"New API created from the golden path template.","d":{"t":"flow","n":["Pick template","Generated repo + pipeline","Deployed with monitoring"]},"h":"A golden path template bundles repo structure, build, tests, security scans, Dockerfile, Helm chart, deployment pipeline, dashboards and alerts. Created via scaffolder or CLI. Maintained centrally with automated update PRs to adopters. Provide escape hatches for special cases but make the default easy and supported.","y":"Speeds creation of compliant services.","m":"Mistake: mandatory but poor templates. Tip: treat paths as products with feedback and versions.","k":["Golden path | The recommended, supported way to build and run a type of service, with security, CI/CD and observability built in.","Templates | Starter projects that implement the golden path.","Escape hatch | Teams may deviate when they have special needs, taking on more responsibility.","Automatic updates | Pull requests keep adopters current as the template improves.","Adoption | How many services use the path, the main measure of success."]},{"n":"Backstage or similar portals","w":"A portal unifies catalog and docs.","b":["Service catalog with owners and dependencies.","Software templates (scaffolder).","TechDocs and plugins.","Backstage is the open-source standard."],"e":"Find who owns the payments service.","d":null,"h":"Backstage provides software catalog (entities with owners and dependencies), software templates, TechDocs (docs-as-code), search and plugins (CI status, Kubernetes, cost). Catalog metadata in catalog-info.yaml in each repo. Requires investment to run and customize; managed alternatives exist (Port, Cortex, OpsLevel).","y":"Single pane for engineering knowledge.","m":"Mistake: catalog entries going stale. Tip: automate ingestion and validate in CI.","k":["Backstage | An open-source developer portal framework originally from Spotify.","Software catalog | An inventory of services, owners, dependencies and documentation.","catalog-info.yaml | A metadata file in each repository that feeds the catalog.","Software templates | Create new services and repositories from approved patterns.","TechDocs | Documentation built from Markdown in repositories and shown in the portal."]},{"n":"Self-service infrastructure","w":"Reduce tickets.","b":["Request infrastructure by pull request or form.","Automation provisions with policy checks.","Examples: databases, queues, namespaces.","Track lead time."],"e":"Database provisioned in 10 minutes with approvals automated.","d":null,"h":"Examples: request namespaces, databases, queues, DNS, certificates and cloud accounts through pull requests, Crossplane/Terraform controllers, or portal actions. Workflows verify policy, cost and approvals, then provision and return connection details securely. Track lead time and success rate.","y":"Removes ticket queues and waiting.","m":"Mistake: self-service without guardrails. Tip: embed policy and quotas in the automation.","k":["Self-service provisioning | Request databases, queues or environments through a form or pull request.","Controllers | Crossplane and Terraform controllers create cloud resources from requests.","Policy-based approval | Policies decide when requests are auto-approved.","Quotas | Limits per team to control cost.","Lifecycle | Automatically remove resources that are no longer used."]},{"n":"Platform as a product mindset","w":"Platform is a product.","b":["Know users, gather feedback.","Roadmap and support model.","Measure adoption and satisfaction.","Retire what is not used."],"e":"Quarterly developer survey drives the roadmap.","d":null,"h":"Practices: identify customers (internal developers), conduct interviews and surveys, maintain roadmap and release notes, define SLOs for platform services, offer support channels, measure adoption and satisfaction, and sunset low-value features. Embed platform engineers with product thinking.","y":"Sustains adoption and value.","m":"Mistake: mandating the platform without addressing needs. Tip: earn adoption by solving real problems.","k":["Platform as a product | Treat the platform like a product with users, roadmap and support.","Roadmap and release notes | Communicate plans and changes openly.","Support model | Channels and response times.","Satisfaction measures | NPS or CSAT surveys of developers.","Sunsetting | Retire features nobody uses."]},{"n":"Standards for IaC, CI/CD, observability","w":"Provide defaults teams can reuse.","b":["Terraform modules, pipeline templates, logging/tracing defaults.","Versioned and documented.","Backward-compatible upgrades.","Accept contributions."],"e":"Standard module for secure storage accounts.","d":null,"h":"Standardize reusable building blocks: Terraform modules (network, cluster, database), pipeline templates, base container images, Helm library charts, logging and tracing configuration, security baselines. Version with semantic versioning, document usage and test. Provide upgrade guides and deprecation timelines.","y":"Consistency and security at scale.","m":"Mistake: breaking changes without notice. Tip: maintain changelogs and compatibility policy.","k":["Module registry | A catalog of reusable infrastructure modules and pipeline templates.","Semantic versioning | Version numbers show whether a change is breaking.","Backward compatibility | Minor releases must not break adopters.","Deprecation policy | Give notice and migration guidance before removing things.","Inner source | Allow contributions from other teams."]},{"n":"Shared component libraries","w":"Libraries prevent duplicate work.","b":["Auth, logging, HTTP client, feature flags.","Version carefully.","Keep small and focused.","Own and maintain them."],"e":"A shared auth library used by 20 services.","d":null,"h":"Shared libraries for authentication, HTTP clients, resilience, logging, feature flags, config and telemetry reduce duplication. Keep them small, well-tested and backward compatible; use semantic versioning; maintain an inner-source model with contribution guidelines. Avoid creating a tightly coupled shared 'common' library for business logic.","y":"Efficiency and uniform behavior.","m":"Mistake: monolithic shared library forcing lockstep upgrades. Tip: split by purpose and minimize dependencies.","k":["Shared libraries | Reusable code for authentication, logging, HTTP clients and feature flags.","Lockstep problem | One huge common library forces every service to upgrade at once.","Small focused libraries | Reduce coupling and risk.","Stable interfaces | Predictable APIs so upgrades are painless.","Ownership | Named maintainers and a contribution guide."]}]},{"n":"Programs across org boundaries","d":"Influence without authority.","s":[{"n":"Program and dependency management","w":"Track and manage dependencies explicitly.","b":["Dependency map across teams.","Weekly review of risks and blockers.","Sequence to unblock others first.","Escalate early."],"e":"Team B waits on a new API from team A.","d":null,"h":"Tools: dependency matrix or board, program increment planning (SAFe), weekly cross-team syncs, risk and issue log. For each dependency capture owner, need-by date, status and mitigation. Prioritize critical path items. Make dependencies visible to leadership and escalate on risk of slip.","y":"Most delays come from unmanaged dependencies.","m":"Mistake: discovering dependencies late. Tip: plan together at the beginning of each quarter.","k":["Dependency | One team needs work or output from another to proceed.","Dependency matrix | A visible table of who needs what, from whom and by when.","Critical path | The chain of dependencies that determines the end date.","Joint planning | Quarterly planning sessions with all teams together expose conflicts early.","Escalation | Raise unresolved blockers quickly with options for decision."]},{"n":"Champions per business unit","w":"Local owners make global programs work.","b":["One named person per business unit.","Clear expectations and time commitment.","Regular sync.","Recognize their work."],"e":"Champion coordinates migration for the claims unit.","d":{"t":"hub","c":"Program","n":["BU 1 champion","BU 2 champion","BU 3 champion","BU 4 champion"]},"h":"A champion represents a business unit: aligns local priorities, coordinates engineers, removes local blockers, and communicates status. Define role (about 20-30% time), expectations, and recognition. Create a champions forum for sharing issues and solutions. Replace champions when they leave to avoid gaps.","y":"Provides local ownership in federated organizations.","m":"Mistake: voluntold champions without time allocation. Tip: get management commitment on capacity.","k":["Champion | A person in each business unit who represents the program, coordinates local work and removes local blockers.","Time allocation | Agree effort such as 20 to 30 percent of their time with their manager.","Champions forum | A regular meeting to share problems and solutions.","Recognition | Make the role valued in performance reviews.","Backup | A named successor if the champion leaves."]},{"n":"Executive sponsorship and escalation","w":"Sponsors unblock what you cannot.","b":["Choose a senior sponsor with authority.","Agree what needs escalation and how.","Give brief updates.","Use decisions, not complaints."],"e":"Sponsor resolves a headcount conflict.","d":null,"h":"Sponsor responsibilities: secure funding, unblock priorities, communicate vision, and resolve cross-org conflicts. Agree up front on escalation criteria (blocked more than a week, budget risk). Provide concise updates and clear asks. Use data and options when escalating.","y":"Authority sometimes requires a sponsor.","m":"Mistake: surprising sponsors with bad news late. Tip: share risks early.","k":["Executive sponsor | A senior leader who owns the outcome and can resolve cross-organization conflicts.","Escalation criteria | Agree when to escalate, for example blocked for more than a week.","Concise briefings | Short updates with a clear request.","Funding protection | Keep budget and capacity safe.","Steering committee | A governance forum that reviews progress and risks."]},{"n":"Sequencing and resourcing conflicts","w":"Competing priorities will arise.","b":["Make trade-offs visible with data.","Agree sequencing with leaders.","Secure named capacity.","Review monthly."],"e":"Move wave 2 to next quarter because of a regulatory deadline.","d":null,"h":"Common conflicts: teams with competing roadmaps, shared engineers, migration order dependencies, and environment constraints. Approach: transparent capacity model, agreed prioritization criteria tied to business value or risk, negotiated waves, and written commitments. Revisit monthly and track changes.","y":"Prevents programs stalling quietly.","m":"Mistake: relying on goodwill without commitments. Tip: get named people and dates.","k":["Capacity | The real available effort of each team after other commitments.","Prioritization criteria | Agreed rules, such as risk or business value, for ordering work.","Wave sequencing | The order in which business units migrate, based on dependencies and readiness.","Written commitments | Named people and dates, not goodwill.","Regular review | Revisit the plan monthly."]},{"n":"Decision records and RACI","w":"Clarity of roles reduces friction.","b":["RACI: Responsible, Accountable, Consulted, Informed.","Decision log with date, owner and rationale.","Avoid re-opening decisions without new facts.","Publish."],"e":"Decision: use Istio ambient for new clusters.","d":null,"h":"RACI clarifies roles for deliverables. Decision records capture decision, options considered, owner, date, and status, stored in a shared place. Use consent-based or consultative decision models (advice process). Escalate unresolved decisions with a deadline.","y":"Reduces repeated debates and confusion.","m":"Mistake: decisions made verbally and forgotten. Tip: write down and share after each meeting.","k":["RACI | Defines who is Responsible, Accountable, Consulted and Informed for each activity.","Decision log | Records decisions, options considered, owner and date.","Advice process | The decision maker seeks advice from those affected, then decides.","Reopening rule | A decision is revisited only with new information.","Publication | Share decisions so everyone works from the same facts."]},{"n":"Negotiation and conflict resolution","w":"Influence without authority is a core skill.","b":["Understand others' goals.","Use data and pilots.","Find shared wins.","Disagree and commit; escalate only when needed."],"e":"Offer a pilot to a skeptical team.","d":null,"h":"Influence methods: build credibility through delivery, understand others' incentives, use data, pilot to reduce risk, make adoption easy, share credit, and ask for input early. When disagreeing, state shared goals and propose experiments. Escalate only after trying to resolve directly.","y":"Architects rarely have formal authority over all teams.","m":"Mistake: mandating without explaining. Tip: show benefits in their terms.","k":["Influence without authority | Leading through credibility, data and relationships when people do not report to you.","Understand incentives | Know what each team is measured on and show how the work helps them.","Pilots | Small proofs reduce perceived risk.","Shared wins | Look for outcomes that benefit both sides.","Escalate last | Try direct resolution first."]},{"n":"Status reporting that drives action","w":"Reports exist to drive action.","b":["Progress vs plan, top risks, decisions needed.","Simple RAG status with reasons.","Same format every time.","Short."],"e":"Red: dependency on Team C; need decision by Friday.","d":null,"h":"Status report format: objective, overall status with rationale, progress since last report, next steps, top risks with owners, decisions or help needed, metrics. Use RAG sparingly and explain amber/red. Keep to one page and consistent cadence. Tailor detail for executives vs teams.","y":"Good reporting leads to timely decisions.","m":"Mistake: reports that hide problems. Tip: prefer early, honest signals.","k":["Status report | A regular summary for stakeholders.","RAG status | Red, amber or green with a reason, not just a color.","Risks and help needed | Name threats and the specific support you need.","Metrics | Progress against plan.","Consistency | Use the same format each time so changes stand out."]}]},{"n":"Technical debt & migrations","d":"Large-scale change at scale.","s":[{"n":"Debt inventory and prioritization","w":"You cannot fix what you cannot see.","b":["List debt items with impact and effort.","Rank by risk and developer pain.","Reserve regular capacity (for example 20%).","Track progress."],"e":"Unsupported framework affects 12 services; fix first.","d":null,"h":"Debt inventory: list items (outdated frameworks, missing tests, manual deployments, tangled modules) with impact on risk, cost and velocity, effort estimates, and owners. Use scoring (impact x likelihood / effort). Visualize on a matrix. Reserve capacity such as 15-20% per sprint and attach debt work to feature work where logical.","y":"Debt competes poorly with features unless made visible.","m":"Mistake: vague 'cleanup' tickets. Tip: define outcomes and measure benefit.","k":["Technical debt | Future cost created by shortcuts, outdated technology or missing tests.","Impact and effort | Rank items by how much they hurt versus how hard they are to fix.","Capacity reservation | Reserve a fixed share of each sprint for debt reduction.","Debt backlog | A visible, ranked list with owners.","Interest | The ongoing cost of delay, such as slower delivery or recurring incidents."]},{"n":"CI/CD platform consolidation","w":"Fewer pipeline systems reduce cost and risk.","b":["Define target platform and templates.","Migrate in waves with tooling and support.","Run old and new in parallel briefly.","Retire old system with a date."],"e":"Move 300 repos from Jenkins to GitHub Actions.","d":{"t":"flow","n":["Target platform","Templates","Pilot","Waves","Decommission"]},"h":"Approach: choose target (GitHub Actions, GitLab, Azure DevOps), define standard templates and security gates, build migration tooling (convert pipelines, automated PRs), run pilots, migrate in waves by business unit with named champions, support with docs and office hours, set deadlines for old system shutdown, and track migration dashboard. Plan for secrets and permissions migration.","y":"Reduces cost and risk across hundreds of repos.","m":"Mistake: leaving long-tail repos behind forever. Tip: set a hard retirement date and offer help.","k":["CI/CD consolidation | Moving from many pipeline tools to one standard platform to cut cost and improve security.","Migration tooling | Scripts that convert old pipeline definitions automatically.","Waves and pilots | Move friendly teams first, then batches of repositories.","Champions | A helper in each unit.","Decommission date | A firm date when the old system is switched off."]},{"n":"Artifact registry modernization","w":"Central registries improve security and speed.","b":["Proxy and cache public packages.","Scan and block bad packages.","Access control and retention.","Migrate repository by repository."],"e":"All builds pull through the internal Artifactory.","d":null,"h":"Registry modernization: choose target (Artifactory, Nexus, ACR/ECR, GitHub Packages), set up repositories per format (npm, Maven, PyPI, Docker), configure proxies/caches of upstream, scanning and policies, authentication via SSO and tokens, and migrate artifacts and build configs. Support immutability and retention. Monitor storage and bandwidth.","y":"Reliability, security and speed of builds.","m":"Mistake: migrating without updating all build tools. Tip: use a compatibility period with mirrored repos.","k":["Artifact registry | A central store for packages and container images.","Proxy and cache | Mirrors public registries for speed, resilience and scanning.","Scanning policy | Block vulnerable or malicious packages.","Compatibility period | Run old and new registries side by side while builds are updated.","Retention rules | Remove old artifacts to control cost."]},{"n":"Automated dependency upgrades (Renovate, Dependabot)","w":"Stay current automatically.","b":["Renovate or Dependabot open PRs.","Auto-merge safe updates with passing tests.","Group updates to reduce noise.","Track version freshness."],"e":"Weekly grouped update PRs.","d":null,"h":"Configure Renovate/Dependabot with schedules, grouping, auto-merge for patch updates with passing tests, and labels. Provide a central config preset. Monitor stale PRs and build breakages. Pair with good test coverage and lockfiles. Prioritize security updates with faster SLA.","y":"Keeps libraries current with low effort.","m":"Mistake: flood of PRs ignored. Tip: group updates and limit concurrency.","k":["Renovate and Dependabot | Bots that open pull requests when new dependency versions appear.","Grouping | Combine related updates into one pull request.","Auto-merge | Merge low-risk updates automatically when tests pass.","Lockfiles | Pin versions so updates are explicit.","Security updates | Handle with faster service levels."]},{"n":"Large-scale code changes across many repos","w":"Change many repositories safely.","b":["Scripts or tools (OpenRewrite, Sourcegraph batch changes).","Open PRs automatically.","Roll out in batches.","Track completion on a dashboard."],"e":"Update a base image across 400 repositories.","d":{"t":"flow","n":["Write change","Test on pilot repos","Open PRs in batches","Track merges"]},"h":"Tools: OpenRewrite recipes, codemods, Sourcegraph Batch Changes, scripts with GitHub API. Steps: write and test the change on sample repos, run across repos to produce PRs, notify owners, automate merging when tests pass, track in a dashboard, handle exceptions manually. Version recipes and review samples to prevent mass errors.","y":"Makes cross-repo changes feasible.","m":"Mistake: running unreviewed bulk changes. Tip: pilot, then roll out in batches.","k":["OpenRewrite and codemods | Tools that apply code transformations automatically across codebases.","Batch changes | The same change opened as pull requests in hundreds of repositories.","Pilot repositories | Test the change on a few first.","Owner notification | Tell teams what is coming and why.","Tracking dashboard | Show merged, open and blocked changes."]},{"n":"Rollout discipline and rollback","w":"Disciplined rollout limits damage.","b":["Pilot first, then waves.","Monitor each wave.","Keep rollback tested.","Communicate dates and impacts."],"e":"Rollback is a revert of the config change.","d":null,"h":"Rollout stages: design, pilot with friendly teams, limited release, general rollout in waves, long-tail cleanup. Each stage has entry criteria, monitoring (success rate, errors), communication plan, and rollback steps. Keep a status dashboard and weekly updates. Provide support channels.","y":"Prevents large-scale disruptions.","m":"Mistake: no rollback path. Tip: test rollback before the first wave.","k":["Staged rollout | Expand gradually from pilot to all teams.","Entry and exit criteria | Conditions to begin and complete each stage.","Monitoring | Watch error rates and support requests.","Rollback | A tested way to undo.","Communication plan | Notices, timelines and support channels."]},{"n":"Cost modeling for migrations","w":"Funding needs numbers.","b":["One-time effort and parallel running.","Licenses, support savings, productivity gain.","Payback time.","Cost of delay."],"e":"Savings of 1.2M a year after 8 months.","d":null,"h":"Model: current annual run cost; target cost; one-time costs (engineering effort, tooling, training, parallel run); ongoing savings (licenses, infrastructure, support, productivity); payback period and risks. Include cost of delay and risk reduction value (fewer incidents, compliance). Present scenarios.","y":"Funding requires a convincing financial case.","m":"Mistake: counting only license savings. Tip: include productivity and risk effects.","k":["Run and one-time costs | Ongoing spend versus migration effort.","Parallel running | Paying for old and new during transition.","Savings and productivity gains | Reduced licenses and infrastructure, plus developer time saved.","Payback period | Time to break even.","Scenario analysis | Best, expected and worst cases."]}]},{"n":"Platform metrics","d":"Prove the investment works.","s":[{"n":"Adoption rate","w":"Adoption shows whether the platform is useful.","b":["Percent of teams or services on the golden path.","Trend over time.","Reasons for non-adoption.","Target and review."],"e":"65% of new services use the template.","d":null,"h":"Define adoption: percent of eligible teams using the platform feature, number of services on golden path, active users. Use telemetry from portal, CI and catalog. Segment by business unit. Combine quantitative adoption with qualitative reasons for non-adoption and set targets by quarter.","y":"Adoption is the first sign of platform success.","m":"Mistake: counting registrations rather than active use. Tip: measure actual usage.","k":["Adoption rate | The percentage of eligible teams or services actively using a capability.","Active usage | Real, recurring use instead of one-time sign-up.","Segmentation | Break down by business unit to find where help is needed.","Barriers | Interview non-adopters to learn why.","Targets and trend | Set quarterly goals and watch direction."]},{"n":"Incident trends and MTTR","w":"Reliability shows platform value.","b":["Number and severity of incidents.","MTTR: mean time to restore.","Breakdown by cause.","Compare before and after improvements."],"e":"MTTR dropped from 90 to 35 minutes.","d":null,"h":"Measure number of incidents by severity, repeat incident rate, MTTD/MTTR, change failure rate, SLO attainment, and incidents attributed to platform vs applications. Compare cohorts (on platform vs not). Use post-incident data to prioritize platform improvements.","y":"Shows platform's effect on reliability.","m":"Mistake: counting incidents without severity. Tip: weight by customer impact.","k":["Incident counts and severity | How many incidents occur and how serious they are.","MTTR | Mean time to restore service.","Repeat incidents | The same cause recurring shows weak follow-up.","SLO attainment | How often reliability targets are met.","Attribution | Separate platform causes from application causes fairly."]},{"n":"Cost trajectory and unit economics","w":"Cost must be understood per unit.","b":["Total spend and trend.","Cost per transaction, user or environment.","Savings from optimization.","Forecast."],"e":"Cost per 1,000 claims fell 18%.","d":null,"h":"Track total cloud spend and per-unit costs (per request, member, environment). Show savings from rightsizing, reservations and decommissioning, and costs of the platform itself. Forecast and compare to budget. Allocate costs by team using tags.","y":"Demonstrates efficiency.","m":"Mistake: reporting savings that were not realized. Tip: verify with billing data.","k":["Total spend | All cloud and tooling costs, including the platform itself.","Unit cost | Cost per transaction, member or environment, which shows efficiency as volume changes.","Allocation | Assign cost to teams using tags.","Budget variance | Actual versus plan.","Verified savings | Count only savings seen in billing."]},{"n":"Developer sentiment and surveys","w":"Ask the users.","b":["Short surveys each quarter.","Net satisfaction and friction points.","Act and communicate results.","Combine with usage data."],"e":"Developers rate CI speed 3.2 out of 5; target 4.","d":null,"h":"Run quarterly developer experience surveys (satisfaction, friction, tool ratings), conduct interviews, and monitor support tickets and time-to-first-deploy. Measure onboarding time for new engineers. Share results and actions taken to close the loop.","y":"Reveals friction invisible in system metrics.","m":"Mistake: surveys without follow-up. Tip: publish 'you said, we did' updates.","k":["Developer survey | A short regular questionnaire about tools and processes.","Friction points | Specific pains that slow developers down.","Time to first deploy | How long a new engineer or service takes to ship.","Support tickets | A signal of recurring problems.","You said, we did | Report actions taken so people keep responding."]},{"n":"DORA and SPACE frameworks","w":"Use frameworks to avoid blind spots.","b":["DORA: delivery performance.","SPACE: satisfaction, performance, activity, communication, efficiency.","Pick a few metrics.","Do not use for individual performance."],"e":"Lead time for change and satisfaction together.","d":null,"h":"DORA gives four delivery metrics. SPACE covers satisfaction and well-being, performance, activity, communication and collaboration, efficiency and flow. Use a handful of metrics from several dimensions, avoid individual targets, and interpret with context. Automate collection from tools.","y":"Balanced view prevents optimizing the wrong thing.","m":"Mistake: gamed metrics. Tip: use them for learning, not punishment.","k":["DORA | Deployment frequency, lead time, change failure rate and time to restore.","SPACE | Satisfaction and well-being, performance, activity, communication and efficiency.","Balance | Choose metrics from several dimensions to avoid optimizing one.","Misuse | Do not use them to rank or reward individuals.","Context | Interpret numbers with knowledge of the team."]},{"n":"Dashboards for leadership","w":"Leaders need a clear view.","b":["5-8 indicators with trends and targets.","Explain what actions follow.","Link to business outcomes.","Update regularly."],"e":"One-page scorecard in monthly business review.","d":null,"h":"Design the scorecard: top-line outcomes (reliability, speed, cost, security), trend arrows, targets, annotations for major events, and drill-down. Review monthly with leadership. Link to decisions (invest, stop, change). Keep definitions consistent and documented.","y":"Leaders fund what they can see and understand.","m":"Mistake: too many metrics. Tip: limit to what drives decisions.","k":["Scorecard | A one-page view of key indicators with targets and trends.","Leading and lagging indicators | Adoption predicts outcomes; incidents and cost show results.","Definitions | A clear, consistent meaning for each metric.","Annotations | Mark events that explain changes.","Review cadence | Monthly or quarterly with decisions attached."]},{"n":"Linking metrics to business outcomes","w":"Show business value.","b":["Faster features, fewer outages, lower cost, lower risk.","Translate technical metrics to money and time.","Tell stories with data.","Keep honest about limits."],"e":"Fewer incidents saved an estimated 400 engineer-hours.","d":null,"h":"Translate: faster lead time means features reach customers sooner; lower incident rate means fewer outages and escalations; cost reductions fund new initiatives; security posture improvements reduce risk and audit effort. Quantify with examples (hours saved x loaded cost) and tell short stories with data.","y":"Platform work competes with product work for investment.","m":"Mistake: reporting only technical numbers. Tip: always include the business consequence.","k":["Business outcomes | The results leaders care about, such as speed, cost, risk and customer experience.","Time to market | How quickly features reach customers.","Risk reduction | Fewer incidents and audit findings.","Cost avoidance | Costs prevented, estimated honestly.","Storytelling | Combine numbers with a short, concrete example."]}]},{"n":"Documentation","d":"Decisions and designs that last.","s":[{"n":"Architecture decision records","w":"ADRs capture decisions.","b":["Context, options, decision, consequences, status.","One page.","Immutable once accepted; supersede with new ADR.","Stored with the code."],"e":"ADR-021: Adopt Istio ambient mode.","d":null,"h":"ADR format (Nygard or MADR): Title; Status; Context (forces, constraints); Decision; Consequences (positive and negative); optional Alternatives. Number sequentially, keep concise, and link related ADRs. Write at decision time and review through PR. Mark superseded decisions with pointers.","y":"Preserves the why behind architecture.","m":"Mistake: decisions recorded only in chat. Tip: require ADRs for significant changes.","k":["ADR | A short record of one significant architecture decision.","Context, decision and consequences | The forces, the choice and the trade-offs accepted.","Status | Proposed, accepted, deprecated or superseded.","Immutability | Do not rewrite accepted ADRs; supersede them.","Index | A list so decisions can be found."]},{"n":"Design document template","w":"Use a standard template.","b":["Goals and non-goals.","Context and proposal.","Alternatives considered.","Security, privacy, operations and testing.","Rollout and risks."],"e":"A design review doc posted a week before review.","d":null,"h":"Template sections: summary, background, goals and non-goals, requirements, proposed design (diagrams, APIs, data), alternatives considered, security and privacy, observability, testing, rollout and migration, risks, open questions, and timeline. Use review process with comment resolution and approvers.","y":"Aligns teams before implementation.","m":"Mistake: long documents nobody reads. Tip: keep to the point and use diagrams.","k":["Design document | A proposal that explains a solution before building it.","Goals and non-goals | What the design will and will not achieve.","Alternatives considered | Options rejected and why.","Cross-cutting sections | Security, privacy, observability and testing.","Rollout plan | How and when it will be released."]},{"n":"Implementation plans and runbooks","w":"Plans and runbooks complete the story.","b":["Implementation plan: steps, owners, dates, dependencies.","Runbook: how to operate and troubleshoot.","Written before go-live.","Reviewed by operations."],"e":"Cutover plan with timeline and rollback.","d":null,"h":"Implementation plan: milestones, tasks, owners, dependencies, estimates, risks, test and rollout steps. Runbook: architecture overview, how to deploy, configuration, health checks, common failures with fixes, scaling and backup/restore, contacts. Review with operations before go-live and test with someone unfamiliar.","y":"Reduces risk at launch and in operation.","m":"Mistake: no runbook until the first incident. Tip: write it as part of the definition of done.","k":["Implementation plan | Tasks, owners, dependencies and dates.","Runbook | Instructions to operate and troubleshoot the system.","Risks | Threats to the plan and mitigations.","Go-live checklist | Final readiness checks.","Operations review | The operations team reads and tests the runbook before launch."]},{"n":"Diagrams as code (C4, Mermaid, PlantUML)","w":"Diagrams in text stay current.","b":["C4 with Structurizr, Mermaid, PlantUML.","Versioned with code.","Rendered in docs automatically.","Easy to review in PRs."],"e":"Mermaid sequence diagram inside the README.","d":null,"h":"Diagrams as code (Mermaid, PlantUML, Structurizr DSL, Diagrams library) are text files stored with code, versioned and reviewed. Generate images in CI or let platforms render automatically (GitHub renders Mermaid). Keep each diagram focused and consistently styled. Use the C4 levels for structure.","y":"Easy to update and review.","m":"Mistake: unreadable diagrams with too many boxes. Tip: split by audience and purpose.","k":["Diagram as code | Diagrams defined in text so they live in version control.","Mermaid and PlantUML | Common text diagram languages.","Structurizr DSL | Defines C4 models as code.","Rendering in CI | Images are generated automatically.","Review in pull requests | Diagram changes are reviewed like code."]},{"n":"Documentation review cadence","w":"Documentation needs owners and dates.","b":["Assign owner to each document.","Review quarterly.","Archive old docs.","Link docs from code and alerts."],"e":"Docs older than 12 months flagged for review.","d":null,"h":"Create documentation inventory with owners and review dates (front matter). Run quarterly reviews, flag docs not updated for 12 months, archive or delete obsolete ones, and add feedback links. Track broken links with CI. Make doc health visible.","y":"Outdated docs mislead.","m":"Mistake: no ownership. Tip: assign ownership to teams and automate reminders.","k":["Document owner | The team accountable for accuracy.","Review date | When the document must be checked again.","Stale documents | Documents not updated for a long time are flagged.","Archiving | Move obsolete documents out of the main space.","Link checking | Detect broken links automatically."]},{"n":"Keeping docs next to code","w":"Close to code means close to truth.","b":["Docs in the same repo.","Update in the same PR.","Publish automatically (docs-as-code).","Use templates."],"e":"Merge blocked if API changed without docs update.","d":null,"h":"Docs-as-code: Markdown in repo, same pull request process, static site generator (MkDocs, Docusaurus, TechDocs), CI checks for links and style (Vale), automated publishing. Link docs from README and alerts. Include API docs generated from OpenAPI and code comments.","y":"Keeps docs current and discoverable.","m":"Mistake: docs in a separate wiki not tied to releases. Tip: update docs in the same PR as code.","k":["Docs-as-code | Write documentation in Markdown in the repository and publish automatically.","Static site generator | MkDocs or Docusaurus builds a site from Markdown.","Same pull request | Update docs with code changes.","Prose linting | Tools like Vale enforce style.","README | The entry point for every repository."]}]},{"n":"Mentoring & communication","d":"Grow others and tell the story.","s":[{"n":"Coaching senior engineers and architects","w":"Grow people, not dependency.","b":["Ask questions before answering.","Explain your reasoning.","Give stretch tasks with support.","Specific, timely feedback.","Share credit."],"e":"Let a senior engineer lead the design while you review.","d":null,"h":"Mentoring approach: set goals, ask guiding questions (what options do you see?), share experience and trade-offs, give stretch assignments with safety nets, observe and provide timely feedback (situation, behavior, impact), encourage reflection, and gradually step back. Meet regularly and document growth plans. Create safe space to ask questions.","y":"Scales your impact through others.","m":"Mistake: giving answers too quickly. Tip: ask first, then share your view.","k":["Coaching | Helping someone find answers through questions rather than giving instructions.","SBI feedback | Describe the Situation, the Behavior and its Impact.","Stretch assignments | Tasks slightly beyond current ability, with support.","Growth plan | Written goals and actions agreed with the person.","Psychological safety | People feel safe to ask questions and admit mistakes."]},{"n":"Design review facilitation","w":"Reviews are for improving the design.","b":["Share doc beforehand.","Clear goal and decision needed.","Invite the right people.","Capture decisions and actions."],"e":"A 45-minute review with pre-read.","d":null,"h":"Facilitation: define purpose and decision needed, send materials ahead, set agenda and timebox, invite diverse viewpoints, summarize decisions and action items, and follow up. Use structured feedback (what works, concerns, suggestions). Keep tone respectful and focus on the design.","y":"Better designs and shared ownership.","m":"Mistake: reviews that become presentations with no discussion. Tip: ask for pre-reads and use meeting for decisions.","k":["Pre-read | Material shared in advance so the meeting is for discussion.","Facilitation | Guiding conversation to an outcome and hearing quieter voices.","Decision needed | State clearly what the meeting must decide.","Action items | Tasks with owners and dates.","Follow-up | Send decisions and actions afterward."]},{"n":"Executive briefings and client workshops","w":"Executives want outcomes, risk and cost.","b":["Lead with the point.","Plain language, few slides.","Prepare for hard questions.","Agree next steps."],"e":"Three slides: problem, option, ask.","d":null,"h":"Executive briefing structure: answer first, supporting reasons, risks and options, next steps. Use visuals, avoid jargon, speak to business impact, and prepare for questions about cost, timeline and risk. Workshops: clear objectives, interactive exercises (journey mapping, event storming), capture outputs.","y":"Builds trust and secures decisions.","m":"Mistake: deep technical detail for non-technical audiences. Tip: offer to go deeper if asked.","k":["Answer first | Start with the conclusion or the ask.","Business impact | Explain why it matters in terms of cost, risk and speed.","Visuals | Simple diagrams over dense text.","Question preparation | Anticipate hard questions and rehearse answers.","Plain language | Avoid jargon."]},{"n":"Presales: solution shaping, estimates, proposals","w":"Presales shapes deals and trust.","b":["Understand the client's goals.","Propose a clear solution and approach.","Estimate with assumptions and risks.","Show reference work."],"e":"Workshop to define scope before a proposal.","d":{"t":"flow","n":["Discover","Shape solution","Estimate","Propose","Handover to delivery"]},"h":"Presales activities: discovery calls, requirement analysis, solution architecture, effort estimation, risk and assumptions list, proposal writing, demos and proofs of concept, pricing support, and presentations. Collaborate with sales and delivery to ensure feasibility. Reuse assets from past engagements.","y":"Wins work that can actually be delivered.","m":"Mistake: overpromising to win deals. Tip: state assumptions clearly and involve delivery leads.","k":["Discovery | Learn the client's goals, constraints and context.","Solution shaping | Outline the approach and architecture.","Estimates and assumptions | Give effort and cost with the conditions they depend on.","Proof of concept | A small demonstration of feasibility.","Handover | Transfer knowledge to the delivery team."]},{"n":"Translating technical concepts to business impact","w":"Make technology meaningful.","b":["Replace jargon with impact.","Use analogies and examples.","Quantify.","Check understanding."],"e":"'Service mesh' becomes 'encrypts and controls traffic between our apps without changing them'.","d":null,"h":"Techniques: analogies (service mesh as traffic police), concrete examples, avoid acronyms or define them, tie to business outcomes (cost, risk, speed), use diagrams, check understanding by asking them to restate. Prepare a one-sentence and a one-minute version of each key idea.","y":"Essential for architects working with executives.","m":"Mistake: explaining how it works instead of why it matters. Tip: start with the problem it solves.","k":["Analogy | Explain something new by comparing it to something familiar.","Outcome framing | Present in terms of the problem it solves.","Concrete example | A real case that illustrates the idea.","Quantification | Use numbers to show scale.","Checking understanding | Ask the listener to restate."]},{"n":"Thought leadership: talks, articles, internal assets","w":"Share what you learn.","b":["Talks, articles, internal guilds.","Open-source or reusable assets.","Start from real problems.","Builds credibility."],"e":"Publish a post about your RAG evaluation approach.","d":null,"h":"Channels: internal tech talks, blog posts, conference talks, open-source contributions, community groups, white papers. Start by documenting solutions you built, add lessons learned, and share metrics where allowed. Review for confidentiality. Build a consistent theme (for example AI platforms for regulated industries).","y":"Raises personal and company credibility.","m":"Mistake: waiting until you feel like an expert. Tip: share practical lessons regularly.","k":["Thought leadership | Recognized expertise shared publicly.","Channels | Talks, articles, open source and communities.","Confidentiality review | Make sure no client information is disclosed.","Consistent theme | A focus area people associate with you.","Lessons learned | Practical insights, including failures."]},{"n":"Reusable frameworks and patterns","w":"Reuse multiplies impact.","b":["Reference architectures, templates, checklists.","Document when to use and when not.","Collect feedback and maintain.","Measure reuse."],"e":"A standard 'RAG on Azure' reference architecture.","d":null,"h":"Create reference architectures, solution accelerators, checklists, code templates, and decision guides. Include when to use, prerequisites, trade-offs, examples, and support. Store in an internal catalog, run demos, gather feedback, and maintain ownership. Measure reuse count and time saved.","y":"Increases consistency and speed across programs.","m":"Mistake: assets created once and never maintained. Tip: assign owners and review cycles.","k":["Reference architecture | A proven design for a common problem.","Accelerators | Prebuilt assets that speed delivery.","Checklists and templates | Aids for quality and speed.","Catalog | A place where assets are published and found.","Ownership and measurement | Maintainers keep assets current; measure reuse."]}]}]},{"p":"Phase 10 - Domai
